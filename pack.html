Repetition without leverage.** The same ~20 procedures execute across 41 environments, manually, forever | ~496 tickets/month/MSP; ~25% within the tier-1 repetitive class | [S34], `(assumption)` per `strategy/market_sizing.md` |\n\n**Why they compound rather than add.** F3 resets F1: when the engineer holding an environment leaves, its acquisition cost is paid again, at full price. F2 guarantees F3's damage is unmitigated \u2014 the documentation that should have preserved the knowledge does not describe the current environment. F4 pays a small tax on every ticket that F1's knowledge would have removed. The cycle is:\n\n```\n   acquire (F1) \u2500\u2500\u2192 decays (F2) \u2500\u2500\u2192 lost on attrition (F3) \u2500\u2500\u2192 re-acquire (F1) \u2500\u2500\u2192 \u2026\n                          \u2502\n                          \u2514\u2500\u2500\u2192 every ticket pays the gap (F4)\n```\n\n**An MSP is not paying an onboarding cost. It is servicing a knowledge debt with no principal repayment.**\n\n## \u00a72 Mechanisms and their multipliers\n\nEach mechanism, the evidence for it, and the multiplier with a confidence band. **Bands are targets, not measurements \u2014 no pilot exists** [../research/capability_table.md](../research/capability_table.md) row 5 records that the core mechanism has no benchmark to inherit.\n\n**A note on tags.** The first version marked every multiplier `(target)`, which is not one of the two tags quality-bar property 2 permits. Each is now either sourced or carries `(assumption: <basis>)`. **Standing rule adopted here: no figure below may be used as an input to `financials/` until E1 or E2 returns a measurement.**\n\n### M1 \u00b7 Observation replaces re-derivation \u2192 attacks F1, at environment *n+1*\n\nProcedure shapes learned at one environment transfer to the next on the same stack; only the deviations are new.\n\n**Derived rather than asserted.** `(assumption: ~30% of a median onboarding is environment discovery \u2014 mapping the tenant, finding its deviations, writing them down; the remaining ~70% is mechanical setup \u2014 RMM deployment, monitoring, backup verification \u2014 that observation does not touch)`. Applying that to the 25\u201340-hour median band gives **17.5\u201328 hours, i.e. 18\u201328**, and a multiplier of **25/18 = 1.39 to 40/28 = 1.43 \u2192 ~1.4\u00d7**. The first version quoted \"1.3\u20131.6\u00d7\", a band neither of whose endpoints its own figures reach.\n\n**Not 10\u00d7, and the reason is structural:** most of an onboarding is mechanical setup \u2014 RMM deployment, monitoring, backup verification \u2014 that observation does not touch. Only the *figure out how this client differs* portion compresses. A paper claiming otherwise is claiming to automate work it never sees.\n\n### M2 \u00b7 Documentation that is true, not documentation that is cheaper \u2192 attacks F2\n\nDocumentation decays because keeping it current is a separate act from doing the work. Capture makes them the same act.\n\n**The multiplier claimed here has been withdrawn.** The first version claimed 8\u201312\u00d7 on maintenance hours. But \u00a71's own F2 row says the ~8 hrs/month baseline is *\"largely unperformed \u2014 most MSPs pay this in wrong documentation rather than in hours\"*, and [../strategy/market_sizing.md](../strategy/market_sizing.md) formally rejected pricing against this line because the saving is roughly 12 minutes per environment per month. **A multiplier on hours nobody spends displaces no cost, and the two statements could not both stand.**\n\n**Re-baselined on what the wrongness actually costs**, which is measurable and is not hours of upkeep:\n\n- **Repeat escalations** \u2014 the same problem re-solved at a second client because the first solution reached nobody. Measurable as escalation rate per procedure per environment, from day one of shadow mode.\n- **Rework** \u2014 a technician following stale documentation, doing the wrong thing, and redoing it.\n- **Time-to-competence** \u2014 how long a new engineer takes to work safely in an unfamiliar client.\n\n**M2 is therefore a risk-reduction claim, not a productivity multiplier**, and no figure is quoted for it until the escalation-rate baseline is measured in the first pilot. That is a weaker claim than the one it replaces, and it is the one the evidence supports.\n\n### M3 \u00b7 Capture converts individual knowledge into an owned asset \u2192 attacks F3\n\nWhen an engineer leaves, procedures they authored remain, attributed and endorsed. **Effect: F3's re-acquisition cost approaches zero for captured procedures.** Not a multiplier \u2014 a risk that is removed rather than a cost that shrinks. `(assumption: unmeasured; bounded by capture coverage, below)`\n\n**Honest limit:** only for procedures that were *performed during the capture window*. A procedure exercised once a year at one client is not in the library when the engineer leaves. Coverage, not mechanism, bounds this.\n\n### M4 \u00b7 Supervised execution on the repetitive class \u2192 attacks F4\n\nSkills execute the tier-1 repetitive segment under gates, with verification. **Multiplier: ~25% of ticket volume addressable** `(assumption)`, at supervised \u2014 not unattended \u2014 throughput.\n\n**Bounded by evidence, not ambition** (D1): long-horizon agent completion is 20.6% [S16] and agents at ~85% on OSWorld still fail ~80% of real workflows [S15]. This paper claims the repetitive, short-horizon, verifiable segment and nothing else.\n\n### M5 \u00b7 The global layer \u2192 the only cross-customer mechanism, and it was missing\n\nM1\u2013M4 are all **intra-MSP**: they improve a customer's own book using that customer's own data, which is the customer's asset, not ours. The first version of this paper never gave the global layer a mechanism of its own \u2014 which meant the moat existed in the strategy deck and nowhere in the engineering.\n\n**What it contributes.** A procedure shape that has cleared the **m\u22653 distinct-MSP** threshold tells a *new* customer's first environment which patterns to expect on a given stack \u2014 it pre-solves shape identification, though never the tenant-specific deviation, which by construction is not in the envelope. `(assumption: shape identification is ~30\u201340% of the discovery portion of an onboarding; discovery is ~30% of the total, so the global layer removes ~10\u201312% of a first onboarding)`.\n\n**This reconciles two statements that previously contradicted each other.** [architecture/D01.md](architecture/D01.md) says global shapes make environment *n+1* start warmer; \u00a74.1 says first-environment onboarding is *slower*. Both hold, because they describe different indices: **environment 1 of customer 10 is cheaper than environment 1 of customer 1** \u2014 and both are still worse than doing nothing, because the mechanical setup is unchanged and review work is added. The global layer shortens the penalty; it does not remove it.\n\n**The cold start is long, and an earlier draft of this section got it backwards.** It argued that because the threshold counted distinct *tenants* and one MSP brings ~41, a single customer could populate the global layer alone \u2014 and called that the paper's most encouraging finding. **It was a privacy hole described as a feature.** If three observations of a pattern can all sit inside one design partner's book, the envelope identifies that MSP with certainty, at exactly the moment of its first security review.\n\n**The threshold now counts distinct MSPs** (`m\u22653`, see [deep_dives.md](deep_dives.md) DD4). The consequence is that **the global layer contributes nothing until customer 3, and little until customer 5\u201310** \u2014 so M5 is a year-two mechanism, not a year-one one. Every M1\u2013M4 effect is intra-MSP and available from customer 1; the cross-customer moat arrives later than the strategy layer's compounding story implies, and `strategy/lean_canvas.md`'s time-to-parity estimate should be read against this, not against the earlier version.\n\n**Why the incumbent does not already have this.** Automation Anywhere bought FortressIQ [S5] and therefore owns a capture footprint and years of recorded enterprise work. **They could build this, and nothing here prevents it.** Two things stand in the way and neither is permanent: their executor is RPA, whose failure record is the reason discovery stalled at documents [S10][S11]; and their buyer is the enterprise process team, not IT service delivery, so an MSP-shaped motion is a new market for them rather than an extension. **Publishing our evaluation method \u2014 which \u00a72 of `not_vaporware.md` recommends \u2014 hands them the yardstick too.** That is a deliberate trade: a category with a public benchmark is one where our result is checkable, and we would rather compete on a measured axis than on marketing claims we cannot verify either.\n\n### Conservative \u00d7 conservative\n\nTaking the low end of every band, for an MSP at steady state:\n\n| Line | Before | After | Effect |\n|---|---|---|---|\n| Repeat-environment onboarding (6 new clients/yr) | 150\u2013240 hrs | 108\u2013168 hrs | **~1.4\u00d7** \u2014 the only hours multiplier in the paper |\n| First-environment onboarding | 25\u201340 hrs | 31\u201346 hrs | **0.8\u00d7 \u2014 worse** |\n| Documentation correctness | stale, unquantified | maintained by observation | **risk reduction, unquantified until measured** |\n| Re-acquisition after attrition | full F1 cost, unpredictable | near zero for captured procedures | **structural** |\n| Tier-1 repetitive execution | manual | ~25% supervised | **capacity, not hours** |\n\n**The honest aggregate is one multiplier of ~1.4\u00d7, one negative, and three effects that are not multipliers at all.** Anyone quoting a blended figure from this table is misusing it, and the first version of this paper invited that by claiming a 10\u00d7 on the maintenance line.\n\n## \u00a73 Full-spectrum applicability\n\n**Edge-low (tier-1).** Gains most in *capability*, not hours: a client-specific procedure where previously there was a generic runbook and an escalation. Measured as escalation-rate reduction, not time saved.\n**Beachhead (delivery manager).** Gains the M2 multiplier directly \u2014 the maintenance line is hers.\n**Edge-high (principal).** Gains from F3 and F4 removal: fewer repeat interruptions, and the variance envelope as a cross-environment diagnostic. **Loses nothing**, which is the necessary condition for the capture programme to survive (`P8`, and disuse is the documented failure mode [S36]).\n\nThe gains hold at both edges because they come from different mechanisms at each \u2014 not because one mechanism is claimed to scale across all users.\n\n## \u00a74 What this is not\n\nRead this section before \u00a72 if you are evaluating rather than reading.\n\n1. **It is not faster first-environment onboarding. It is slower.** Environment 1 costs **31\u201346 hours against a 25\u201340 baseline** \u2014 the work is unchanged and review overhead is added [../product/journeys/beachhead.md](../product/journeys/beachhead.md). Compression begins at environment 2. This is stated in every ROI artifact by founder directive (D8).\n2. **It is not unattended automation.** Supervised execution with human escalation, per the binding claim boundary (D1). Not a roadmap position \u2014 an architectural one.\n3. **It is not a 10\u00d7 productivity claim.** The 10\u00d7 is on one line (M2). The headline number moves far less.\n4. **The core mechanism is unevidenced.** Cross-session clustering into reliable skills has no benchmark and no named prior system [../research/capability_table.md](../research/capability_table.md) row 5. Everything above is conditional on it.\n5. **Cross-environment transfer is an assumption**, not a finding (A8). If procedures do not transfer, M1 collapses to zero and M2 survives \u2014 the business would be smaller but not dead.\n6. **Coverage bounds M3.** Rare procedures are not in the library when the engineer holding them leaves.\n7. **The gains are conditional on capture continuing.** If engineers quietly stop cooperating, input stops and every mechanism degrades. This is a social failure with no technical mitigation [../product/journeys/edge_high.md](../product/journeys/edge_high.md).\n\n## \u00a75 The RPA question \u2014 required, and answered as mechanism (D2/D5)\n\nEvery technical evaluation asks it, and the base rate is against us: automation derived from observed work fails in 30\u201350% of projects, with maintenance reaching 60% of total cost [S10][S11].\n\n**State the opposing case accurately first, because a strawman loses the room.** Enterprise RPA does not encode screen coordinates and has not for a decade \u2014 UiPath uses attribute-based selectors over the accessibility tree with anchor and CV fallbacks; Blue Prism uses application-modeller matching. It *does* offer success checks: Verify Application State, Check App State, Wait stages with modelled conditions. Anyone claiming RPA has no verification is falsified in one sentence.\n\n**Two more absolutes have been withdrawn here \u2014 this argument has now been corrected three times, which is itself worth knowing.** The earlier version claimed RPA asserts only about the interface and that a broken selector leaves \"nothing to aim at\". A UiPath practitioner falsifies both in one sentence: bots routinely assert on **world state** (create an AD object, then query AD or an API to confirm it), the REFramework's BusinessRuleException/SystemException split exists precisely to separate *the outcome is wrong* from *the interface broke*, and **Unified Target already recovers from broken selectors** through fuzzy, anchor, image and OCR fallbacks tried in sequence. Our own wave-1 catalogue lists those fallbacks, so the earlier version argued against a technique list we wrote ourselves.\n\n**The narrower claim survives, and it still wins.** The difference is not whether RPA can check a goal or recover from a break \u2014 it can do both. It is that **the goal is not carried in the RPA artifact in a form the runtime can re-plan against.** Recovery is therefore confined to fallbacks a developer enumerated in advance; when the change falls outside that enumeration, the run stops. A skill carries the goal as a **predicate the runtime holds at execution time**, so recovery is a search over a space nobody had to anticipate.\n\nThat is a smaller claim than \"RPA cannot recover\", and it is the one that survives the room.\n\n**It is tested, not asserted \u2014 and the fairness bar has been raised.** `validation/experiment_board.md` E2 executes synthesized skills against a deliberately altered UI \u2014 moved, renamed and re-ordered elements plus a version upgrade that changes selectors \u2014 against an RPA baseline on the identical alteration. **D5 originally required only that the baseline be \"selector-based\", which would permit one with its fallbacks disabled. That is no longer sufficient: the baseline must be a Unified-Target-equivalent implementation with fuzzy, anchor and image fallbacks enabled**, or a practitioner falsifies the result on sight. The experiment is worth running only if it can lose.\n\n**What this does not claim.** Re-grounding is not immunity. Environment drift still degrades skills (`P4`), which is why drift detection pauses a skill before it acts wrongly rather than trusting re-grounding to always succeed. The claim is a difference in *failure mode*, not the elimination of failure.\n\n**Recommended next 3:** (1) run E2 before any customer conversation \u2014 \u00a75 is the section that converts technical evaluators and it is currently an argument, not a result; (2) instrument M2's maintenance line first, since it carries the only genuine 10\u00d7 and does not depend on the executor working; (3) publish \u00a74 unedited in the investor materials \u2014 a paper whose limits section is longer than its claims section is the one that survives diligence.\n"}, "tech/architecture/00_INDEX.md": {"g": "Architecture", "t": "Architecture index", "md": "# Architecture index\n\n> **What this is** \u2014 the ten diagrams that define Understudy's system design, each a Mermaid source document with a caption saying what a reviewer should notice.\n> **Why it exists** \u2014 the pack's central architectural claim (D6: raw recordings never reach the vendor) is only checkable if the boundary is drawn explicitly in every view. These diagrams exist so a security reviewer and an engineer can disagree with the same picture.\n> **How to read it** \u2014 D06 first if you are evaluating the privacy claim; D01 first if you are evaluating the mechanism. A skeptic should attack D04, where the three-layer schema either does or does not keep tenant identity out of the global layer.\n> **Depends on / feeds** \u2014 inherits [../whitepaper.md](../whitepaper.md), [../deep_dives.md](../deep_dives.md), [../../product/PRD.md](../../product/PRD.md) \u00a77 and the settled D6; feeds [../not_vaporware.md](../not_vaporware.md), `visuals/`, `narrative/vc_memo.md`.\n\n| # | Diagram | What it settles |\n|---|---|---|\n| [D01](D01.md) | Capture-to-skill pipeline | How a recording becomes an executable skill, and where each stage runs |\n| [D02](D02.md) | The closed loop | Watch \u2192 Distil \u2192 Rehearse \u2192 Gate \u2192 Act \u2192 Verify \u2192 Learn as a circuit, with what breaks if a link is cut |\n| [D03](D03.md) | Execution orchestration | What actually runs when a skill fires against a ticket |\n| [D04](D04.md) | Three-layer library schema | What each layer holds and what may cross between them |\n| [D05](D05.md) | Inference routing and cost control | Which model runs where, and why the expensive half runs at the edge |\n| [D06](D06.md) | The two-stage boundary | **The privacy architecture. The diagram the security review is about** |\n| [D07](D07.md) | Integration surface | PSA, RMM, IdP and admin-plane touchpoints |\n| [D08](D08.md) | Verification, drift and evaluation | How the system knows it is still right |\n| [D09](D09.md) | Node fleet across MSPs | Multi-tenant scale, and the operational obligation D6 creates |\n| [D10](D10.md) | Human-in-the-loop and escalation | Every path by which a decision reaches a person |\n\n**One convention across all ten:** anything inside a `MSP tenant` boundary never leaves it in raw form. If a diagram shows an arrow crossing that line, the arrow is labelled with exactly what it carries.\n\n**Three trust zones, not two.** The first version of this set drew the client tenant, the MSP tenant and the vendor \u2014 and omitted the **model provider**, which meant the diagram titled \"the diagram the security review is about\" did not answer the question a security review opens with. Action typing now runs on the node; **skill synthesis is the system's only outbound inference call**, on abstracted clusters carrying no frames, values or tenant identifiers. It is drawn in D01, D05 and D06.\n"}, "tech/architecture/D01.md": {"g": "Architecture", "t": "D01 \u00b7 Capture-to-skill pipeline", "md": "# D01 \u00b7 Capture-to-skill pipeline\n\n> **What this is** \u2014 the capture-to-skill pipeline, stage by stage, with the boundary each stage sits inside.\n> **Why it exists** \u2014 the pack's central privacy claim (D6) is only checkable if every stage is placed on one side of a line. Drawn wrong, a reviewer discovers the model-provider hop themselves \u2014 which is exactly what happened to the first version of this set.\n> **How to read it** \u2014 count the arrows crossing a boundary; there are two, and both carry a labelled payload. Attack the dotted inbound arrow, which is the one nobody inspects.\n> **Depends on / feeds** \u2014 inherits [../deep_dives.md](../deep_dives.md) DD1\u2013DD4; feeds [D06.md](D06.md), [../not_vaporware.md](../not_vaporware.md).\n\n```mermaid\nflowchart TD\n  subgraph WS[\"Engineer workstation\"]\n    A[\"Screen + input capture (N1)\"]\n    B[\"Sensitive-value redaction (N4)\"]\n    A --> B\n  end\n\n  subgraph MSP[\"MSP tenant \u2014 stage 1\"]\n    C[\"Session segmentation (N2)\"]\n    D[\"Semantic action typing (DD2)\"]\n    E[\"Cross-session clustering (DD1/N6)\"]\n    F[\"Skill synthesis + success criterion (DD3/N7)<br/>only stage calling a hosted model\"]\n    G[\"Variance envelope (N9)\"]\n    H[(\"Per-environment + per-MSP library\")]\n    C --> D --> E --> F --> H\n    E --> G --> H\n  end\n\n  subgraph CENTRAL[\"Vendor \u2014 stage 2\"]\n    I[\"Envelope abstraction + k-anonymity (DD4)\"]\n    J[(\"Global layer: procedure shapes only\")]\n    I --> J\n  end\n\n  B -->|\"typed events, values classed not captured\"| C\n  G -->|\"envelope entries only, k>=3 tenants\"| I\n  J -.->|\"procedure shapes back to stage 1\"| E\n\n  classDef boundary fill:#f7f7f9,stroke:#4338ca,stroke-width:2px\n  class MSP,CENTRAL boundary\n```\n\n**What a reviewer should notice.** Only two arrows cross a boundary, and both are labelled with their payload. Raw frames never leave the workstation as frames \u2014 redaction (N4) runs *before* transport, so the pipeline is not \"capture then clean\" but \"clean at capture\". The dotted return arrow is the compounding: global procedure shapes flow back *into* stage-1 clustering. **Read the index carefully \u2014 it is customer-indexed, not environment-indexed.** It is how *customer 10's* first environment starts warmer than *customer 1's* first environment (M5 in the whitepaper). It does **not** make any given customer's first environment cheaper than doing nothing; that one is still worse than baseline, because the mechanical setup is unchanged and review work is added (A8, and whitepaper \u00a74.1). If that arrow carried anything tenant-specific, D6's guarantee would be broken in the direction nobody inspects \u2014 inbound.\n"}, "tech/architecture/D02.md": {"g": "Architecture", "t": "D02 \u00b7 The closed loop", "md": "# D02 \u00b7 The closed loop\n\n> **What this is** \u2014 the closed loop as a circuit, with what breaks if any link is cut.\n> **Why it exists** \u2014 the product's differentiation is the circuit, not any component \u2014 every part exists somewhere else. This diagram is where that claim is checkable rather than asserted.\n> **How to read it** \u2014 trace the escalation path back into WATCH; a human resolving what the agent could not is the only source of the failure branches successful runs never contain.\n> **Depends on / feeds** \u2014 inherits [../../product/PRD.md](../../product/PRD.md) \u00a71; feeds [D10.md](D10.md), `visuals/`.\n\n```mermaid\nflowchart LR\n  W[\"WATCH<br/>sessions, incl. failures\"] --> D[\"DISTIL<br/>cluster to skills\"]\n  D --> R[\"REHEARSE<br/>shadow vs human\"]\n  R --> G[\"GATE<br/>action-class policy\"]\n  G --> A[\"ACT<br/>own identity, envelope-bounded\"]\n  A --> V[\"VERIFY<br/>goal-state criterion\"]\n  V --> L[\"LEARN<br/>widen the envelope\"]\n  L --> D\n  V -->|\"criterion fails\"| RG[\"RE-GROUND<br/>search on goal\"]\n  RG --> A\n  RG -->|\"budget exhausted\"| E[\"ESCALATE\"]\n  G -->|\"outside envelope\"| E\n  E --> W\n\n  classDef bet fill:#eeedfb,stroke:#4338ca,stroke-width:2px\n  class D bet\n```\n\n**What a reviewer should notice.** The escalation path feeds back into WATCH \u2014 a human resolving what the agent could not is itself a captured session, and it is the only source of the failure branches that successful runs never contain (`P2`). Cut any link and the system degrades to something that already exists: without VERIFY there is no RE-GROUND and the product is RPA with better parsing; without LEARN the library grows but never hardens. **DISTIL is shaded because it is the unevidenced step** \u2014 everything else is engineering.\n"}, "tech/architecture/D03.md": {"g": "Architecture", "t": "D03 \u00b7 Execution orchestration", "md": "# D03 \u00b7 Execution orchestration\n\n> **What this is** \u2014 what actually runs when a skill fires against a ticket, as a sequence.\n> **Why it exists** \u2014 the 14:20 incident turned on one ordering detail \u2014 whether the undo path is recorded before or after the mutation. A sequence diagram is where that ordering is visible and arguable.\n> **How to read it** \u2014 look for what is absent: there is no path from matcher to executor that bypasses the policy engine.\n> **Depends on / feeds** \u2014 inherits [../techniques/decision_tree.md](../techniques/decision_tree.md); feeds [D10.md](D10.md), `product/journeys/`.\n\n```mermaid\nsequenceDiagram\n  participant T as PSA ticket\n  participant M as Skill matcher\n  participant P as Policy engine\n  participant X as Executor\n  participant I as Client tenant (IdP/admin plane)\n  participant H as Human\n\n  T->>M: ticket context + environment id\n  M->>M: match procedure shape + tenant variants\n  M-->>H: surface skill, deviations, run option\n  H->>P: run (gated)\n  P->>P: classify each step: read / reversible / destructive\n  P->>X: read steps \u2014 no approval\n  X->>I: execute reads (agent principal)\n  I-->>X: state\n  P-->>H: reversible step \u2014 one-line effect, approve?\n  H->>P: approve\n  P->>X: execute, undo path recorded first\n  X->>I: mutate (agent principal)\n  X->>X: verify goal criterion\n  alt criterion passes\n    X-->>T: resolution note + verification result\n  else precondition unmet or criterion fails\n    X-->>H: escalate with full trace\n  end\n```\n\n**What a reviewer should notice.** The undo path is recorded **before** the mutation, not derived after it \u2014 that ordering is what made the 14:20 incident a 40-second recovery. Every action reaches the client tenant under the agent's own principal, never a shared admin account, so the client's audit log attributes it without our help. Note what the diagram does *not* contain: any path from matcher to executor that bypasses the policy engine.\n"}, "tech/architecture/D04.md": {"g": "Architecture", "t": "D04 \u00b7 Three-layer library schema", "md": "# D04 \u00b7 Three-layer library schema\n\n> **What this is** \u2014 the three-layer library schema and what may cross between layers.\n> **Why it exists** \u2014 the moat and the privacy guarantee are the same object, and both live or die on whether the global layer can contain tenant identity. This schema is where that is settled by field list rather than by policy.\n> **How to read it** \u2014 read the global layer's fields as a closed vocabulary \u2014 it cannot express a tenant name because there is no field for one. Attack the m\u22653 threshold.\n> **Depends on / feeds** \u2014 inherits [../deep_dives.md](../deep_dives.md) DD4; feeds [D06.md](D06.md), [D09.md](D09.md).\n\n```mermaid\nerDiagram\n  ENVIRONMENT_LAYER {\n    string tenant_id \"client identity \u2014 NEVER crosses\"\n    string policy_ids \"configuration values\"\n    json   drift_history\n    json   endorsements \"which engineer signed off\"\n  }\n  MSP_LAYER {\n    string msp_id\n    json   procedure_clusters \"across this MSP's 41 environments\"\n    json   variance_distribution \"how tenants differ\"\n    int    observation_counts\n  }\n  GLOBAL_LAYER {\n    string procedure_shape \"closed vocabulary\"\n    string precondition_pattern\n    string deviation_class\n    int    distinct_msp_count \"m>=3 MSPs to be eligible\"\n    int    tenant_count \"within-MSP support\"\n    string schema_version \"only compatible versions are counted\"\n  }\n  ENVIRONMENT_LAYER ||--o{ MSP_LAYER : \"clusters into (stays in MSP tenant)\"\n  MSP_LAYER ||--o{ GLOBAL_LAYER : \"abstracts into (whitelist + k-anonymity)\"\n```\n\n**What a reviewer should notice.** The middle layer is the one the first design omitted, and it is where the customer's own compounding happens \u2014 an MSP's 41 environments clustering together, inside its own tenant, crossing no new trust boundary because it already administers all of them. The global layer's fields are a **closed vocabulary**: it cannot express a tenant name because there is no field for one (DD4's whitelist construction). **The threshold was corrected after critic round 1 and it counts MSPs, not tenants.** The first version required a pattern to be seen in \u22653 *client tenants* \u2014 but one MSP brings ~41 of them, so all three observations could sit inside a single design partner's book and the envelope would identify that MSP with certainty. It now requires **\u22653 distinct MSPs**, which lengthens the cold start considerably and is the correct trade. `schema_version` exists because entries produced by different abstraction implementations are not comparable, and counting across them corrupts the guarantee silently (D09).\n\n**And the guarantee is heuristic, not formal** \u2014 minimum support does not address compositional linkage across entries, and no l-diversity, t-closeness or differential privacy is implemented. See DD4.\n"}, "tech/architecture/D05.md": {"g": "Architecture", "t": "D05 \u00b7 Inference routing and cost control", "md": "# D05 \u00b7 Inference routing and cost control\n\n> **What this is** \u2014 which model runs where, and why the expensive half runs on the customer's hardware.\n> **Why it exists** \u2014 D6 forced action typing on-node, which moved the dominant cost off our P&L and into an MSP's procurement conversation. A cost model that did not show this hop was wrong by 12\u00d7 in the flattering direction.\n> **How to read it** \u2014 note that skill synthesis is the single outbound inference call, and that it operates on abstracted clusters only.\n> **Depends on / feeds** \u2014 inherits [../not_vaporware.md](../not_vaporware.md) \u00a72b\u20133b; feeds `financials/unit_economics.md`.\n\n```mermaid\nflowchart TD\n  subgraph EDGE[\"MSP tenant node \u2014 the compute-heavy half\"]\n    S1[\"Semantic typing (DD2)<br/>ON-NODE quantised multimodal\"]\n    S2[\"Clustering + alignment (DD1)<br/>batch, off-peak\"]\n    S3[\"Skill synthesis (DD3)<br/>calls out \u2014 see below\"]\n  end\n  subgraph MP[\"Model provider\"]\n    FM[\"Frontier model<br/>abstracted clusters only\"]\n  end\n  S3 -->|\"typed shapes, no frames/values/ids\"| FM\n  subgraph HOT[\"Execution path \u2014 latency-sensitive\"]\n    S4[\"Skill matching<br/>embedding lookup, no LLM\"]\n    S5[\"Step execution<br/>mid-tier\"]\n    S6[\"Re-grounding (DD5)<br/>frontier, rare\"]\n  end\n  S1 --> S2 --> S3\n  S4 --> S5\n  S5 -->|\"criterion fails\"| S6\n```\n\n**What a reviewer should notice.** **Semantic typing runs on the node, not against an API** \u2014 this is forced by D6, since frames of a client's admin console reaching a hosted provider would break the guarantee. It costs a GPU in the reference node and some accuracy. **Skill synthesis is the single outbound inference call**, on abstracted clusters only. Distillation is batch and tolerates off-peak scheduling; execution is interactive and cannot. The expensive stages are **batch**, which is what makes edge inference affordable \u2014 distillation can run overnight on the MSP's own hardware rather than competing for interactive capacity. Skill matching deliberately uses no LLM at all: it is an embedding lookup, because it runs on every ticket and is the one path where cost scales with the customer's volume. D6 moved this compute to hardware we do not own, so the per-node hardware floor is a **commercial term in the MSP contract**, not just an engineering parameter \u2014 `financials/unit_economics.md` owes both sides of it.\n"}, "tech/architecture/D06.md": {"g": "Architecture", "t": "D06 \u00b7 The two-stage boundary \u2014 the privacy architecture", "md": "# D06 \u00b7 The two-stage boundary \u2014 the privacy architecture\n\n> **What this is** \u2014 the two-stage trust boundary \u2014 the privacy architecture the security review is actually about.\n> **Why it exists** \u2014 every MSP deal passes through a client-side IT director whose one question is what leaves her environment. If this diagram cannot answer it structurally, the review becomes a data-transfer assessment, which is the kind that stalls for months.\n> **How to read it** \u2014 read the arrow labels, not the boxes. Attack whether an envelope entry could carry tenant identity, and whether the inbound arrow is held to the same standard.\n> **Depends on / feeds** \u2014 inherits [../deep_dives.md](../deep_dives.md) DD4 and decision D6; feeds `strategy/sales_roadmap.md`, `product/ux_spec.md` UX10.\n\n```mermaid\nflowchart TB\n  subgraph CT[\"Client tenant (x41 per MSP)\"]\n    CA[\"Admin plane: Entra, M365, AD, RMM\"]\n  end\n\n  subgraph MT[\"MSP tenant \u2014 the trust boundary that matters\"]\n    WS[\"Engineer workstations<br/>capture + redact at source\"]\n    ND[\"Stage-1 node<br/>type, cluster, synthesize, abstract\"]\n    LIB[(\"Per-environment + per-MSP library<br/>tenant ids, policy values, drift history\")]\n    WS --> ND --> LIB\n  end\n\n  subgraph V[\"Vendor\"]\n    GL[(\"Global layer<br/>procedure shapes only\")]\n    EX[\"Executor control plane\"]\n  end\n\n  subgraph MP[\"Model provider \u2014 third trust zone\"]\n    FM[\"Frontier model<br/>skill synthesis only\"]\n  end\n\n  CA -->|\"engineers administer\"| WS\n  LIB -->|\"ENVELOPE ONLY: {shape, precondition, deviation_class, count}<br/>whitelist-constructed, k>=3 tenants\"| GL\n  GL -.->|\"procedure shapes (no tenant data)\"| ND\n  EX -->|\"skill version + policy\"| ND\n  ND -->|\"actions via agent principal\"| CA\n  ND -->|\"ABSTRACTED CLUSTERS ONLY: typed action shapes,<br/>no frames, no values, no tenant ids.<br/>Zero-retention terms required\"| FM\n  FM -.->|\"synthesized SKILL.md prose\"| ND\n\n  classDef provider fill:#fff9e6,stroke:#8a8a99,stroke-width:2px,stroke-dasharray: 4 4\n  class MP provider\n  classDef vendor fill:#fff4e6,stroke:#b45309,stroke-width:2px\n  classDef msp fill:#eeedfb,stroke:#4338ca,stroke-width:3px\n  class V vendor\n  class MT msp\n```\n\n**What a reviewer should notice \u2014 this is the diagram the security review is about.**\n\n1. **Raw sessions exist in exactly one place:** the MSP tenant. They are redacted at the workstation before transport and never appear in the vendor boundary in any form.\n2. **One arrow crosses into the vendor**, and its label is the entire privacy claim. If an envelope entry could carry a tenant name, a domain, a user, a policy id or a configuration value, that arrow would be a data-transfer path and the review becomes the kind that stalls for months. It cannot, because the global schema has no field for any of them (D04) and because a deviation must be observed in **m\u22653 distinct MSPs** before it is eligible to cross. The threshold originally counted *tenants*, which was a hole: one MSP brings ~41 of them, so three observations could sit inside a single design partner's book and identify that MSP with certainty.\n3. **The client tenant hosts nothing.** No node, no agent, no storage. A 22-person practice on SaaS has no perimeter to host anything in, which is what made the original per-client framing unimplementable.\n4. **The inbound dotted arrow deserves the same scrutiny as the outbound one.** Procedure shapes flow back from global into stage-1 clustering; that is the compounding mechanism (A8). An inbound path is the one nobody inspects, and it is equally capable of carrying tenant data if the schema is sloppy.\n5. **Actions reach the client under the agent's own principal**, originating from the MSP node \u2014 the same administrative relationship the MSP already has, not a new one from the vendor.\n6. **The model provider is a third trust zone, and the first version of this diagram omitted it entirely** \u2014 which meant the diagram titled \"the diagram the security review is about\" did not answer the first question a security review asks, the sub-processor list. Two stages could have called a hosted model. **Action typing now runs on the node** (`not_vaporware.md` \u00a72b), because frames of a client's admin console reaching a third party would break claim 1 outright. **Skill synthesis remains hosted and is the system's only outbound inference call**, and it operates on already-abstracted clusters \u2014 typed action shapes with no frames, no values and no tenant identifiers \u2014 so it carries no client data by construction. Zero-retention and no-training terms are an architecture requirement here, not a procurement preference.\n"}, "tech/architecture/D07.md": {"g": "Architecture", "t": "D07 \u00b7 Integration surface", "md": "# D07 \u00b7 Integration surface\n\n> **What this is** \u2014 the integration surface \u2014 what is read, what is written, and what is acted upon.\n> **Why it exists** \u2014 browser-only competitors stop at the first two columns. This diagram is where the claim that IT work spans terminals and native admin tools becomes specific enough to disagree with.\n> **How to read it** \u2014 note the documentation platform is a dotted seed-only input \u2014 treating stale runbooks as authoritative would import the decay the product exists to break.\n> **Depends on / feeds** \u2014 inherits [../../product/PRD.md](../../product/PRD.md) \u00a76; feeds `strategy/market_sizing.md` row 8.\n\n```mermaid\nflowchart LR\n  subgraph IN[\"Read\"]\n    P1[\"PSA / ITSM<br/>ticket context, client id\"]\n    R1[\"RMM<br/>alerts, asset inventory\"]\n    D1[\"Documentation platform<br/>existing runbooks as cold-start seed\"]\n  end\n  subgraph CORE[\"Understudy\"]\n    M[\"Skill matcher\"]\n    E[\"Executor\"]\n  end\n  subgraph OUT[\"Write\"]\n    P2[\"PSA / ITSM<br/>resolution note, verification result, billable flag\"]\n    A1[\"Client audit log<br/>via agent principal\"]\n  end\n  subgraph ACT[\"Act against\"]\n    I1[\"Entra / Okta\"]\n    I2[\"M365 / Exchange\"]\n    I3[\"Active Directory\"]\n    I4[\"MDM / endpoint\"]\n    I5[\"Terminal / native admin tools\"]\n  end\n\n  P1 --> M\n  R1 --> M\n  D1 -.->|\"seed only, never authoritative\"| M\n  M --> E\n  E --> I1 & I2 & I3 & I4 & I5\n  E --> P2\n  E --> A1\n```\n\n**What a reviewer should notice.** The documentation platform is a **dotted, seed-only** input: existing runbooks help a cold start but are never authoritative, because they are the stale artifact this product exists to replace \u2014 treating them as truth would import the decay it is meant to break. The RMM alert path matters commercially, not just technically: alert-triggered tickets have deterministic triggers and documented remediation, which `strategy/market_sizing.md` row 8 flags as possibly the most mechanisable segment of an MSP queue and therefore the place the 25% automatable assumption may be conservative. Note I5 \u2014 terminals and native tools are where browser-only competitors stop [S25], and where DD2's accessibility-tree approach degrades to vision.\n"}, "tech/architecture/D08.md": {"g": "Architecture", "t": "D08 \u00b7 Verification, drift and evaluation", "md": "# D08 \u00b7 Verification, drift and evaluation\n\n> **What this is** \u2014 how the system knows it is still right \u2014 verification, drift, and the offline harness.\n> **Why it exists** \u2014 a system with no external benchmark can grade its own homework. Drawing the harness as a separate offline box is the commitment that makes a negative result reportable.\n> **How to read it** \u2014 note that re-grounding demotes a run to gated regardless of rung; that is the mitigation for the worst failure in DD5.\n> **Depends on / feeds** \u2014 inherits [../deep_dives.md](../deep_dives.md) DD5\u2013DD6; feeds `validation/experiment_board.md` E1/E2.\n\n```mermaid\nflowchart TD\n  A[\"Action executed\"] --> V{\"Goal criterion<br/>satisfied?\"}\n  V -->|yes| PASS[\"Record pass<br/>+ billable flag if not reversed\"]\n  V -->|no| RG[\"Re-ground (DD5)<br/>read-only search\"]\n  RG -->|found| A2[\"Re-execute<br/>DEMOTED to gated\"]\n  RG -->|budget exhausted| ESC[\"Escalate with trace\"]\n  A2 --> V\n\n  PASS --> M[\"Per-skill metrics<br/>pass rate, re-ground frequency\"]\n  ESC --> M\n  M --> CU{\"CUSUM change<br/>detector (DD6)\"}\n  CU -->|drift| PAUSE[\"Pause skill<br/>notify, do not act\"]\n  CU -->|stable| OK[\"Continue\"]\n\n  subgraph OFF[\"Offline \u2014 the harness (N8)\"]\n    H1[\"Hand-labelled procedure set\"]\n    H2[\"Held-out environment\"]\n    H3[\"E2: altered-UI vs selector-based RPA baseline\"]\n    H1 --> H2 --> H3\n  end\n```\n\n**What a reviewer should notice.** Re-grounding **demotes the run to gated** regardless of the skill's promotion rung, so a human sees the first execution after any interface change \u2014 this is the mitigation for DD5's worst failure, re-grounding onto a similar-but-wrong control. The offline harness is drawn separately and deliberately: it must exist *before* DD1 is tuned, or the system grades its own homework against metrics chosen by the person optimising them. E2 is inside the harness rather than bolted on, because the RPA argument (\u00a75 of the whitepaper) is a claim this system makes about itself and therefore has to be measured by the same apparatus.\n"}, "tech/architecture/D09.md": {"g": "Architecture", "t": "D09 \u00b7 Node fleet across MSPs", "md": "# D09 \u00b7 Node fleet across MSPs\n\n> **What this is** \u2014 the node fleet across MSP tenants, and the operational obligation D6 creates.\n> **Why it exists** \u2014 the corrected boundary is the difference between three nodes for three design partners and roughly 123. At one node per client the fleet would exceed what a solo founder can operate before the first paid pilot.\n> **How to read it** \u2014 look at what HALT leads to; a terminal HALT with no responder was the first version's error, and version skew silently corrupts the m\u22653 count without a schema rule.\n> **Depends on / feeds** \u2014 inherits decision D6, [D04.md](D04.md); feeds `product/features_prioritized.md` N15, `product/ux_spec.md` UX13.\n\n```mermaid\nflowchart TB\n  subgraph VENDOR[\"Vendor control plane\"]\n    FH[\"Fleet health (UX13)<br/>version, queue depth, egress-filter state\"]\n    RL[\"Staged rollout + rollback\"]\n  end\n  subgraph M1[\"MSP A tenant\"]\n    N1[\"Stage-1 node<br/>41 environments\"]\n  end\n  subgraph M2[\"MSP B tenant\"]\n    N2[\"Stage-1 node<br/>18 environments\"]\n  end\n  subgraph M3[\"MSP C tenant\"]\n    N3[\"Stage-1 node<br/>63 environments\"]\n  end\n\n  RL -->|\"version, respecting MSP patch windows\"| N1 & N2 & N3\n  N1 & N2 & N3 -->|\"health, no payload\"| FH\n  FH -->|\"egress filter degraded\"| HALT[\"HALT distillation<br/>on that node\"]\n  HALT --> BUF[\"Capture buffers locally<br/>(bounded by disk)\"]\n  BUF -->|\"buffer >70% or stale >72h\"| PAGE[\"Page the on-call human<br/>+ notify the MSP\"]\n  PAGE --> RES[\"Resolve, resume, backfill\"]\n  RES --> N1\n```\n\n**What a reviewer should notice.** **One node per MSP, not one per client** \u2014 this is the operational consequence of the corrected D6 boundary, and it is the difference between three nodes for three design partners and roughly 123. At one-per-client the fleet would have exceeded what a solo founder can operate before the first paid pilot.\n\n**Version skew is a correctness problem, not an inventory field.** With MSP A on v3 and MSP C on v1, D04's `tenant_observation_count` would be counting envelope entries produced by two different abstraction implementations. **Every envelope entry therefore carries a schema version, and the m\u22653 threshold counts only entries produced by compatible versions** \u2014 a rule that did not exist in the first version of this diagram and that quietly corrupts the privacy guarantee without it.\n\n**HALT is not a terminal state.** The first version drew it as one, with no responder and no answer to what happens to capture in the meantime. Capture buffers locally against node disk; a buffer above 70% or a skill stale beyond 72 hours pages a human and notifies the MSP. `(assumption: thresholds owed to the first pilot)`. **For a solo founder this is the on-call obligation the company acquires on its first deployment**, and `not_vaporware.md` previously filed node lifecycle under \"low uncertainty, tedious rather than uncertain\" while the product layer called N15 \"the item most likely to be underestimated\" \u2014 the product layer was right.\n\nTwo further things the diagram makes explicit that the feature list would not: nodes report **health only, never payload**, so the control plane cannot become a back door around the boundary; and a degraded egress filter **halts distillation** rather than continuing and reconciling later \u2014 a filter that is not verifiably working turns D6's guarantee into a claim, and the correct behaviour is to stop. Note also that rollout respects the MSP's own patch windows: this is a component inside someone else's infrastructure, and treating it otherwise is how a vendor becomes an operational liability to its customer.\n"}, "tech/architecture/D10.md": {"g": "Architecture", "t": "D10 \u00b7 Human-in-the-loop and escalation", "md": "# D10 \u00b7 Human-in-the-loop and escalation\n\n> **What this is** \u2014 every path by which a decision reaches a person.\n> **Why it exists** \u2014 three of the four paths are conventional. The fourth \u2014 an action that verified correctly and was reversed anyway \u2014 is the one most systems omit, and it carries both a disclosure obligation and a billing consequence.\n> **How to read it** \u2014 count the paths to a human; there are four, and the fourth is the 14:20 class. Attack whether the escalation loop genuinely feeds capture.\n> **Depends on / feeds** \u2014 inherits [../techniques/decision_tree.md](../techniques/decision_tree.md); feeds `validation/decision_making_unit.md`, `financials/pricing.md`.\n\n```mermaid\nflowchart TD\n  T[\"Ticket\"] --> M[\"Skill matched\"]\n  M --> C{\"Action class\"}\n  C -->|read| AUTO[\"Execute \u2014 no approval\"]\n  C -->|reversible write| APP[\"Approval prompt<br/>one-line effect + undo path\"]\n  C -->|destructive| APPD[\"Approval \u2014 ALWAYS<br/>never batchable, never defaulted\"]\n  APP --> H1[\"Technician\"]\n  APPD --> H1\n  H1 -->|approve| EX[\"Execute\"]\n  H1 -->|decline| STOP[\"Stop, log reason\"]\n\n  M --> ENV{\"Within skill<br/>envelope?\"}\n  ENV -->|no| ESC1[\"Escalate to principal<br/>with full trace\"]\n  EX --> V{\"Verified?\"}\n  V -->|no, re-ground failed| ESC1\n  ESC1 --> HUM[\"Human resolves\"]\n  HUM --> CAP[\"Session captured (N5)<br/>failure branch learned\"]\n  CAP --> LIB[(\"Library\")]\n\n  EX --> INC{\"Reversed by a<br/>human later?\"}\n  INC -->|yes| DISC[\"Incident disclosure (X24)<br/>Dana calls the client, same day\"]\n  INC -->|yes| BILL[\"Not billable (X23)\"]\n```\n\n**What a reviewer should notice.** There are **four** distinct paths to a human, and they are not the same path: approval (before a mutating action), envelope escalation (the situation is outside what the skill has seen), verification escalation (the action ran and could not be confirmed), and **post-hoc reversal** \u2014 the 14:20 case, where everything passed and the decision was still wrong.\n\nThat fourth path is the one most systems omit, and it carries two obligations the product must own: a **same-day disclosure to the client's IT owner**, because a veto-holder who hears it secondhand reopens a six-week review, and a **billing consequence** \u2014 a resolution that a human reversed within the ticket's life is not billable, which is the clause that keeps outcome pricing alive past month three.\n\nNote the loop at the bottom left: escalations become captured sessions. The human resolving what the agent could not is the system's only source of failure branches (`P2`), so escalation is an input, not just an exit.\n"}, "tech/techniques/decision_tree.md": {"g": "Techniques", "t": "Technique decision tree \u2014 what fires, when, in what order", "md": "# Technique decision tree \u2014 what fires, when, in what order\n\n> **What this is** \u2014 the runtime logic: which techniques fire on which signals, in what priority, and how the system continuously re-evaluates rather than deciding once.\n> **Why it exists** \u2014 a technique catalogue is inert. This file is what turns 73 listed methods into a system, and it is where the safety ordering is made explicit: **classification before capability**, always. A system that decides what it *can* do before deciding what it is *allowed* to do has the ordering backwards, and that is how automation causes incidents.\n> **How to read it** \u2014 the flowchart is the control flow; the logic table is the contract. A skeptic should attack the triage ordering in \u00a72 \u2014 specifically whether \"destructive\" can ever be downgraded by confidence (it cannot).\n> **Depends on / feeds** \u2014 inherits [wave1.md](wave1.md), [wave2.md](wave2.md), [../deep_dives.md](../deep_dives.md); feeds [technique_feature_matrix.md](technique_feature_matrix.md), [../architecture/D10.md](../architecture/D10.md), `visuals/`.\n\n## 1 \u00b7 The runtime tree\n\n```mermaid\nflowchart TD\n  START[\"Ticket arrives\"] --> SENSE[\"Continuous sensing:<br/>ticket text, environment id,<br/>RMM alert state, recent drift signals\"]\n  SENSE --> MATCH{\"Procedure shape<br/>matched?\"}\n  MATCH -->|no| CAP[\"Capture only (1.1-1.4)<br/>human works, system watches\"]\n  MATCH -->|yes| VAR[\"Load tenant variants<br/>from variance envelope (2.7)\"]\n\n  VAR --> PRE{\"Preconditions<br/>satisfied? (4.6)\"}\n  PRE -->|no| ESC1[\"Escalate \u2014 outside envelope\"]\n  PRE -->|yes| CLASS{\"Classify blast radius<br/>PER STEP (5.2)\"}\n\n  CLASS -->|destructive| GATE1[\"ALWAYS gate \u2014 no exceptions,<br/>no confidence override\"]\n  CLASS -->|reversible| UNDO[\"Record compensating path (4.5)\"]\n  CLASS -->|read| RUN[\"Execute\"]\n\n  UNDO --> GATE2{\"Skill rung<br/>permits?\"}\n  GATE2 -->|shadow| SHAD[\"Propose only, compare to human\"]\n  GATE2 -->|gated| GATE1\n  GATE2 -->|supervised| RUN\n  GATE1 --> HUM[\"Human approves\"] --> RUN\n\n  RUN --> VER{\"Goal criterion<br/>satisfied? (3.1)\"}\n  VER -->|yes| DONE[\"Record pass, billable if not reversed\"]\n  VER -->|no| REG[\"Bounded read-only<br/>re-grounding (3.3, 3.4, 3.5)\"]\n  REG -->|found| DEMOTE[\"Re-execute, DEMOTED to gated\"]\n  REG -->|budget spent| ESC1\n  DEMOTE --> VER\n\n  ESC1 --> HUMR[\"Human resolves\"]\n  HUMR --> CAP2[\"Capture as failure branch (3.5 wave1)\"]\n  CAP2 --> LEARN[\"Widen envelope (2.7)\"]\n  DONE --> MON[\"Drift monitoring (6.1)\"]\n  MON -->|change detected| PAUSE[\"Pause skill (6.2)\"]\n  LEARN --> SENSE\n```\n\n## 2 \u00b7 Priority triage \u2014 the ordering that matters\n\nEvaluated top to bottom. **A lower rule never overrides a higher one.**\n\n| Priority | Condition | Action | Why it outranks what follows |\n|---|---|---|---|\n| **1** | Step is destructive **or unmapped (DD7)** | Gate. Always. | Irreversibility beats every other consideration, including a perfect track record. **Confidence never downgrades this class** \u2014 a system that is right 200 times is not thereby permitted to delete a mailbox unattended |\n| **2** | Preconditions unmet | Escalate | The situation is outside what the skill has seen; improvising here is exactly the over-merge failure DD1 warns about |\n| **3** | Skill is paused by drift | Do not execute | A skill whose verification is degrading is a wrong action waiting for a trigger |\n| **4** | Re-grounding occurred this run | Demote to gated | The interface changed; the first execution after a change is seen by a human |\n| **5** | Skill rung is shadow | Propose, never act | Trust is earned on evidence, not asserted |\n| **6** | Step is reversible | Record undo path, then gate per rung | Compensation before mutation, never after |\n| **7a** | Step is a **bounded read** \u2014 single-object state inspection (is this account enabled? is MFA registered?) | Execute freely | Genuinely no blast radius |\n| **7b** | Step is a **bulk read** \u2014 directory enumeration, mailbox export, MFA-state dump, licence inventory across a tenant | **Gate as reversible-write** | A read that produces a copy of client data is an exfiltration surface regardless of its verb. **The first version said reads have \"no blast radius\" and execute freely \u2014 that is the line a founder widens the week before a demo** |\n| **7c** | Operation is **unmapped by DD7's catalogue** | **Treat as destructive; block skill promotion** | Default-destructive on the unknown. Friction lands proportional to coverage gaps, which is where it belongs |\n\n**The ordering is the safety argument.** Classification (rule 1) precedes capability (rules 5\u20137), so no amount of demonstrated competence unlocks a destructive action. Automation bias makes this ordering more important over time, not less: the approver who has cleared 200 correct proposals reads the 201st less carefully [S35][S36], so the system must not rely on approval quality that it is itself eroding.\n\n## 3 \u00b7 Continuous re-evaluation\n\nThree signals re-open a decision the system already made:\n\n| Signal | Technique | Consequence |\n|---|---|---|\n| Verification pass rate falls | 6.1 CUSUM | Skill paused before it acts wrongly |\n| Re-grounding frequency rises | DD5 telemetry | Interface drift suspected; canary the skill (6.2) |\n| A human reverses a verified action | X23 ledger | **The 14:20 class.** Not billable; envelope widened; disclosure to the client owner (X24) |\n\nThe third has no automated detector \u2014 it is discovered when a human acts. That is a genuine gap, and the mitigation is organisational rather than technical: the reversal path is instrumented so that when it happens, the consequences are automatic even though the detection is not.\n\n## 4 \u00b7 What the tree deliberately cannot do\n\n- **Downgrade a destructive classification on confidence.** No path exists.\n- **Act on a paused skill.** No override, including by a human in a hurry \u2014 un-pausing is an explicit review action.\n- **Mutate during re-grounding.** Read-only, enforced at the executor.\n- **Promote itself.** Rung changes require declared evidence and a human decision (X10); the system does not lobby for its own autonomy.\n\n**Recommended next 3:** (1) implement rules 1\u20133 before any execution feature ships, since they are the entire safety argument and are cheap while the executor is still a stub; (2) instrument rule 4's demotion, because DD5's worst failure \u2014 re-grounding onto a similar-but-wrong control \u2014 is invisible without it; (3) build the X23 reversal ledger early: it is both the billing rule and the only detector for the failure class no verification catches.\n"}, "tech/techniques/technique_feature_matrix.md": {"g": "Techniques", "t": "Technique \u00d7 feature matrix", "md": "# Technique \u00d7 feature matrix\n\n> **What this is** \u2014 which techniques power which flagship features, with orphan techniques and unsupported features flagged as findings rather than tidied away.\n> **Why it exists** \u2014 a catalogue and a feature list can both look complete while being disconnected. This matrix is the reconciliation, and its two failure columns are the point: a technique powering nothing is either research indulgence or a missing feature, and a feature resting on no technique is a promise with no mechanism behind it.\n> **How to read it** \u2014 skip to \u00a73 and \u00a74; the matrix itself is bookkeeping. A skeptic should check that no flagship feature appears in \u00a74.\n> **Depends on / feeds** \u2014 inherits [wave1.md](wave1.md), [wave2.md](wave2.md), [wave3.md](wave3.md), [../../product/features_flagship.md](../../product/features_flagship.md); feeds `visuals/` (heat table), `startup-audit`.\n\n**73 techniques across three waves \u00b7 20 flagship features.** Wave 3 is excluded from the support analysis \u2014 it is a research pipeline, not a build plan, so every wave-3 row is expected to be an orphan.\n\n## 1 \u00b7 The matrix (waves 1\u20132 vs flagship features)\n\n| Feature | Primary techniques | Supporting |\n|---|---|---|\n| **F1** Multi-surface capture | 1.1 UIA, 1.2 DOM, 1.3 input hooking | 1.4 change-detected sampling |\n| **F2** Decision-point narration | 1.6 push-to-talk, 3.3 intent elicitation | 5.4 attribution (w2) |\n| **F3** Failure/abort retention | 3.5 negative demonstration | 1.3 |\n| **F4** Capture controls | 1.5 field-level redaction | 5.4 (w2) |\n| **F5** Cross-session clustering | 2.1 alignment, 2.2 profile HMM, 1.1\u20131.6 structure learning (w2) | 2.5 trace clustering, 1.4/1.5 stability + MDL (w2) |\n| **F6** Skill synthesis w/ criterion | 3.4 demonstration-to-workflow, 3.1 goal-state predicates (w2) | 3.1 version-space, 3.2 generalisation |\n| **F7** Variance envelope | 2.7 edit-distance variance, 2.2 structural anonymisation (w2) | 2.6 LCS |\n| **F8** Authorship attribution | 5.4 attribution (w2) | 3.5 legal versioning (w3, aspirational) |\n| **F9** Shadow mode | 4.1 held-out evaluation (w2) | 6.2 canary |\n| **F10** Deviation report | 4.4 inter-rater agreement (w2) | 2.7 |\n| **F11** Promotion ladder | 5.2 action-class policy, 5.1 trust calibration (w2) | 6.2 |\n| **F12** Action-class policy | 5.2, 5.3 JIT elevation | 4.4 idempotence |\n| **F13** Agent identity | 5.1 non-human principals, 5.4 immutable audit | 5.3 |\n| **F14** Envelope enforcement | 4.6 preflight checks, 2.5 uncertainty abstention (w3, aspirational) | 3.1 (w2) |\n| **F15** Test-account exploration | 3.4 read-only probing (w2) | 4.6 |\n| **F16** Success-criterion verification | 3.1 goal-state predicates (w2), 4.3 app-state assertion | 4.4 |\n| **F17** Re-grounding | 3.2 HTN, 3.3 bounded search, 3.5 semantic matching (all w2) | 4.2 anchors |\n| **F18** Drift detection | 6.1 CUSUM | 6.3 golden-path regression |\n| **F19** Envelope widening | 2.7, 1.4 stability criterion (w2) | 3.2 |\n| **F20** Onboarding meter | \u2014 | \u2014 |\n\n## 2 \u00b7 Density read\n\n| Feature | Technique support | Read |\n|---|---|---|\n| F5, F17 | 5\u20136 techniques each | Correct: these are the two hardest problems |\n| F1, F6, F12, F13, F16 | 3\u20134 each | Healthy |\n| F3, F8, F10, F15 | 1\u20132 each | Thin, and honestly so \u2014 these are straightforward once the substrate exists |\n| **F20** | **0** | See \u00a74 |\n\n**A matrix where every technique powered every feature would be a sign nobody checked.** The concentration on F5 and F17 is the correct shape: those are DD1 and DD5, the two places where the system is doing something that has not been done in this domain.\n\n## 3 \u00b7 Orphan techniques \u2014 powering nothing\n\n| Technique | Wave | Verdict |\n|---|---|---|\n| **2.3 process mining (alpha/heuristic miners)** | 1 | **No longer an orphan \u2014 the earlier verdict is withdrawn.** DD1 needs to tolerate two engineers taking different routes through the same UI, which is transposition, which order-preserving alignment cannot represent. **Partial-order discovery is the family that can**, so this powers F5 and is on the build path |\n| **2.4 task mining** | 1 | Retained for the same reason: its conformance-alignment machinery is what handles reordering in F5 |\n| **2.5 re-identification testing** | 2 | **Orphan that should not be \u2014 this is a missing feature.** Nothing in the flagship list attacks our own envelope to see whether a tenant can be fingerprinted, and D6's whole guarantee rests on the answer. See \u00a74 |\n| **2.4 federated aggregation** | 2 | Premature: relevant only once the global layer spans many MSPs (L1) |\n| **5.3 automation-bias countermeasures** | 2 | **Orphan that should not be.** `P9` says approval habituates and UX7 (the approval prompt) specifies a static prompt. Nothing varies presentation or surfaces the unusual |\n| Wave-3 rows **other than 2.5 and 3.5** | 3 | Expected \u2014 research pipeline, not build plan |\n\n## 4 \u00b7 Unsupported features \u2014 promises with no mechanism\n\n| Feature | Gap | Resolution |\n|---|---|---|\n| **F20 Onboarding meter** | No technique. It is instrumentation \u2014 counting engineer-hours and time-to-first-verified-skill | **Acceptable, and declared.** It is a measurement surface, not a mechanism, which is also why it carries the sole `\u2014` in the PRD's principle mapping. It does not require a technique; it requires a definition, which [../../product/PRD.md](../../product/PRD.md) \u00a79 now supplies |\n\n**Two flagship features lean partly on aspirational rows, which \u00a73 previously called \"expected orphans\" while \u00a71 cited them as support.** F14 (envelope enforcement) lists wave-3 2.5 uncertainty-aware abstention, and F8 (authorship attribution) lists wave-3 3.5 legal versioning. Both are marked *aspirational* in \u00a71 and neither is load-bearing \u2014 F14 works on preflight checks and goal predicates alone, F8 on attribution alone \u2014 but a flagship feature partly supported by a speculative row should say so where the support is listed, not only in a footnote. Both now do.\n\n**One genuine finding, in the other direction.** Two techniques (2.5 re-identification testing, 5.3 automation-bias countermeasures) power nothing **because two features are missing**, and both are safety-adjacent:\n\n1. **An envelope adversarial-testing capability.** D6's promise is that an envelope entry cannot identify a tenant. Nobody has tried to break it. A founder who has attacked their own boundary has an answer no competitor's policy statement matches \u2014 and if the attack succeeds, the k-anonymity threshold (`k=3`) is wrong and needs raising before the first security review, not after.\n2. **Approval-surface countermeasures.** `P9` states that approval habituates and that automation bias makes a reliable system more dangerous at the margin. The product's response is a static prompt that looks identical the 201st time. The 14:20 incident is exactly this failure.\n\n**Both are added to `features_prioritized.md` as X25 and X26 rather than left as a matrix observation** \u2014 an orphan technique that identifies a missing feature is the most useful thing this matrix produces, and leaving it as a note would waste it.\n\n**Recommended next 3:** (1) build X25 (envelope adversarial testing) before the first security review; (2) build X26 (approval-surface countermeasures) before the first supervised promotion, since that is when habituation starts; (3) **the earlier recommendation to delete 2.3 and 2.4 is withdrawn** \u2014 DD1's reordering requirement needs partial-order methods, and those are the rows that supply them.\n"}, "tech/techniques/wave1.md": {"g": "Techniques", "t": "Technique wave 1 \u2014 established practice", "md": "# Technique wave 1 \u2014 established practice\n\n> **What this is** \u2014 the first wave of the technique arsenal: methods that are established, documented and in production use somewhere today. Per technique: name, one-line mechanism, evidence anchor.\n> **Why it exists** \u2014 a deep-tech pack that lists only frontier methods is claiming novelty it does not have. Most of what this system does is well-understood engineering; naming that honestly is what makes the two genuinely uncertain steps (DD1 clustering, A8 transfer) legible as the actual bet rather than lost in a list.\n> **How to read it** \u2014 the cluster counts are the argument: 31 techniques, of which 23 are borrowed and 8 are adapted. A skeptic should check that nothing here is claimed as novel.\n> **Depends on / feeds** \u2014 inherits [../deep_dives.md](../deep_dives.md), [../../research/survey.md](../../research/survey.md); feeds [wave2.md](wave2.md), [decision_tree.md](decision_tree.md), [technique_feature_matrix.md](technique_feature_matrix.md).\n\n**31 techniques across 6 clusters.** Status: `borrowed` (used as documented) \u00b7 `adapted` (modified for this domain).\n\n## 1 \u00b7 Capture and instrumentation (6)\n\n| # | Technique | Mechanism | Anchor |\n|---|---|---|---|\n| 1.1 | UI Automation / accessibility-tree extraction | Read control roles and states from the OS accessibility layer rather than pixels | Windows UIA, standard in RPA tooling \u00b7 `borrowed` |\n| 1.2 | DOM-level event capture | Structured action capture in browser-based admin consoles | Standard web instrumentation \u00b7 `borrowed` |\n| 1.3 | Input-event hooking | Timestamped keyboard and pointer events correlated with window focus | OS-level, standard \u00b7 `borrowed` |\n| 1.4 | Screen-frame sampling with change detection | Capture frames on state change rather than at fixed rate, cutting volume by an order of magnitude | Standard video encoding practice \u00b7 `borrowed` |\n| 1.5 | Field-level redaction at capture | Drop credential and secret fields before they reach storage | [S29] makes this a legal requirement, not a nicety \u00b7 `adapted` |\n| 1.6 | Push-to-talk narration capture | Short voice segments bound to a UI event rather than continuous audio | Commodity ASR \u00b7 `adapted` \u2014 the binding to a *branch point* is the adaptation |\n\n## 2 \u00b7 Sequence and process analysis (7)\n\n| # | Technique | Mechanism | Anchor |\n|---|---|---|---|\n| 2.1 | Sequence alignment (Needleman\u2013Wunsch) | Align two action sequences tolerating insertions and deletions | Bioinformatics, 1970 \u00b7 `borrowed` |\n| 2.2 | Profile HMMs | Model a family of sequences as a probabilistic consensus with per-position variation | Standard in sequence families \u00b7 `adapted` \u2014 positions are UI actions |\n| 2.3 | Process mining (alpha / heuristic miners) | Reconstruct a process model from event logs | Celonis-class tooling [S8] \u00b7 `borrowed` |\n| 2.4 | Task mining | Desktop-level capture to task-flow diagrams | UiPath Task Mining, FortressIQ [S7][S8] \u00b7 `borrowed` \u2014 this is the category we are extending |\n| 2.5 | Trace clustering | Group process traces by structural similarity | Process-mining literature \u00b7 `borrowed` |\n| 2.6 | Longest-common-subsequence extraction | Find the invariant spine across many runs | Classic \u00b7 `borrowed` |\n| 2.7 | Edit-distance variance measurement | Quantify how far a run deviates from the consensus \u2014 **the numeric basis of the variance envelope** | Classic, applied to a new object \u00b7 `adapted` |\n\n## 3 \u00b7 Programming by demonstration (5)\n\n| # | Technique | Mechanism | Anchor |\n|---|---|---|---|\n| 3.1 | Version-space algebra for PbD | Maintain the set of programs consistent with the demonstrations seen | PbD literature, survey \u00a71 \u00b7 `borrowed` |\n| 3.2 | Generalisation from multiple traces | Use disagreement between demonstrations to locate what is incidental | survey \u00a71 \u2014 the core PbD insight \u00b7 `borrowed` |\n| 3.3 | Intent elicitation at branch points | Ask the demonstrator *why* rather than inferring it | survey \u00a71's unsolved problem; ALLOY [S22] \u00b7 `adapted` |\n| 3.4 | Demonstration-to-workflow synthesis | Emit a reusable workflow from computer-use demonstrations | ALLOY [S22] \u2014 validated at user-study scale \u00b7 `borrowed` |\n| 3.5 | Negative demonstration | Learn from what the operator *did not* do, or abandoned | survey \u00a77; F3 retains abort sessions \u00b7 `adapted` |\n\n## 4 \u00b7 Execution and verification (6)\n\n| # | Technique | Mechanism | Anchor |\n|---|---|---|---|\n| 4.1 | Attribute-based UI selectors | Address controls by role and attributes rather than position | UiPath, Blue Prism \u00b7 `borrowed` \u2014 **the baseline E2 measures against** |\n| 4.2 | Anchor-based element location | Locate a control relative to a stable neighbour | RPA standard \u00b7 `borrowed` |\n| 4.3 | Application-state assertion | Check the interface is in an expected state before proceeding | UiPath Verify/Check App State \u00b7 `borrowed` \u2014 and the thing \u00a75 distinguishes a *goal* criterion from |\n| 4.4 | Idempotent operation design | Structure actions so repetition is harmless | Distributed-systems practice \u00b7 `borrowed` |\n| 4.5 | Compensating transactions | Record an explicit undo path before mutating | Saga pattern \u00b7 `adapted` \u2014 recorded *before* execution, which is what made 14:20 recoverable |\n| 4.6 | Preflight precondition checks | Verify assumptions before acting rather than discovering them mid-run | Standard ops practice \u00b7 `borrowed` |\n\n## 5 \u00b7 Safety, identity and governance (4)\n\n| # | Technique | Mechanism | Anchor |\n|---|---|---|---|\n| 5.1 | Non-human principals / workload identity | The agent holds its own directory identity | Entra workload identities, Okta service apps \u00b7 `borrowed` |\n| 5.2 | Action-class policy enforcement | Classify by blast radius, gate accordingly | Standard privileged-access practice \u00b7 `borrowed` |\n| 5.3 | Just-in-time elevation | Grant the minimum privilege for the minimum window | PIM/PAM practice \u00b7 `borrowed` |\n| 5.4 | Immutable audit logging | Attributable, tamper-evident action records | Compliance standard \u00b7 `borrowed` |\n\n## 6 \u00b7 Monitoring and drift (3)\n\n| # | Technique | Mechanism | Anchor |\n|---|---|---|---|\n| 6.1 | CUSUM / change-point detection | Detect a shift in a metric before it becomes a failure | Classical SPC \u00b7 `borrowed` |\n| 6.2 | Canary execution | Run a changed skill on a small slice first | Deployment standard \u00b7 `borrowed` |\n| 6.3 | Golden-path regression testing | Re-run known-good procedures against a reference environment | Test practice \u00b7 `adapted` |\n\n## What wave 1 concedes\n\n**23 of 31 are borrowed outright.** This system is mostly an assembly of well-understood parts, and saying so is the point: it means the schedule risk is low everywhere except the two places it is not. **Nothing in wave 1 is a differentiator.** The differentiation is the *circuit* [../../product/features_flagship.md](../../product/features_flagship.md), and specifically the 8 `adapted` rows, which are where an ordinary technique is pointed at an unusual object. *(The first version said \"27 borrowed and 4 adapted\" against its own table \u2014 corrected by counting.)*\n\n**Recommended next:** implement 2.1, 2.2 and 2.7 first. They are the numeric core of DD1, they are decades old and well-characterised, and if the variance envelope cannot be extracted with methods this mature the problem is the representation (DD2) rather than the algorithm.\n"}, "tech/techniques/wave2.md": {"g": "Techniques", "t": "Technique wave 2 \u2014 advanced and theory-grounded", "md": "# Technique wave 2 \u2014 advanced and theory-grounded\n\n> **What this is** \u2014 the second wave: methods that are established in their home fields but not yet standard practice in IT automation, and that this system depends on more heavily than wave 1.\n> **Why it exists** \u2014 wave 1 shows the system is mostly assembly. This wave shows where the assembly requires judgement: which theoretical apparatus to point at the clustering problem, and how to keep an abstraction honest enough to cross a trust boundary.\n> **How to read it** \u2014 cluster 2 (privacy-preserving abstraction) is the one carrying commercial weight, because D6's entire guarantee rests on it. A skeptic should attack 2.3's k-anonymity threshold.\n> **Depends on / feeds** \u2014 inherits [wave1.md](wave1.md), [../deep_dives.md](../deep_dives.md); feeds [wave3.md](wave3.md), [decision_tree.md](decision_tree.md), [technique_feature_matrix.md](technique_feature_matrix.md).\n\n**24 techniques across 5 clusters.** Fewer than wave 1 because the field is genuinely thinner here \u2014 this is stated rather than padded.\n\n## 1 \u00b7 Structure learning and consensus (6)\n\n| # | Technique | Mechanism | Anchor |\n|---|---|---|---|\n| 1.1 | Multiple sequence alignment | Align *n* sequences simultaneously rather than pairwise, yielding a true consensus | Bioinformatics standard |\n| 1.2 | Grammar induction from traces | Infer a grammar whose language is the set of valid runs of a procedure | Formal-languages literature |\n| 1.3 | Automaton learning (L*/passive) | Learn a state machine from observed traces | Angluin-style active learning; passive variants suit recorded data |\n| 1.4 | Hierarchical clustering with a stability criterion | Choose the cut by cluster stability rather than a fixed *k* \u2014 **the guard against DD1 over-merging** | Consensus-clustering literature |\n| 1.5 | Minimum description length as a merge criterion | Merge two clusters only when it shortens the total description | MDL principle |\n| 1.6 | Silhouette / stability validation | Quantify whether a clustering is real or an artefact of the metric | Standard cluster validation |\n\n## 2 \u00b7 Privacy-preserving abstraction (5) \u2014 the commercially load-bearing cluster\n\n| # | Technique | Mechanism | Anchor |\n|---|---|---|---|\n| 2.1 | Whitelist-constructed serialisation | Emit only fields from a closed vocabulary, rather than removing identifiers from free text | Fails closed rather than open \u2014 DD4 |\n| 2.2 | Structural anonymisation | Preserve the *shape* of a pattern while discarding every value | Standard in telemetry design |\n| 2.3 | k-anonymity thresholding | A pattern crosses only once observed in \u2265k distinct tenants `(assumption: k=3)` | Sweeney's k-anonymity \u2014 **the actual guarantee behind D6** |\n| 2.4 | Federated aggregation | Compute cross-tenant statistics without centralising the underlying records | Federated-analytics practice |\n| 2.5 | Re-identification testing | Actively attempt to fingerprint a tenant from its published envelope entries | Adversarial privacy evaluation \u2014 **owed to the security pack, and currently unbuilt** |\n\n## 3 \u00b7 Goal-directed recovery (5)\n\n| # | Technique | Mechanism | Anchor |\n|---|---|---|---|\n| 3.1 | Goal-state predicates | Express success as a checkable property of the world, not of the steps | Planning literature \u2014 the basis of `P3` |\n| 3.2 | Hierarchical task networks | Decompose a goal into methods, allowing an alternative method when one fails | HTN planning |\n| 3.3 | Bounded search under a budget | Cap exploration so recovery cannot become an incident | Standard anytime-algorithm practice |\n| 3.4 | Read-only probing | Interrogate state without mutating during recovery | Safety constraint, DD5 |\n| 3.5 | Semantic control matching | Locate a control by inferred function when its identifier has changed | The re-grounding mechanism; adapted from retrieval |\n\n## 4 \u00b7 Evaluation under scarcity (4)\n\n| # | Technique | Mechanism | Anchor |\n|---|---|---|---|\n| 4.1 | Held-out environment evaluation | Score a skill in an environment it was never recorded in \u2014 **the A8 measurement** | Standard generalisation testing |\n| 4.2 | Adversarial perturbation testing | Deliberately alter the UI and measure degradation \u2014 **this is E2** | Robustness literature; D5 |\n| 4.3 | Paired-baseline comparison | Measure against a selector-based RPA implementation of the same procedure on the identical perturbation | Controlled comparison; the non-rigged baseline D5 requires |\n| 4.4 | Inter-rater agreement on labels | Establish that the hand-labelled procedure set is itself reliable before scoring against it | Standard; the harness's own validity |\n\n## 5 \u00b7 Human\u2013automation interaction (4)\n\n| # | Technique | Mechanism | Anchor |\n|---|---|---|---|\n| 5.1 | Trust calibration through transparency | Expose capability *and* limits so reliance matches reality | Lee & See [S35] |\n| 5.2 | Disuse mitigation | Design against expert rejection, the documented failure mode for this product | Parasuraman & Riley [S36] |\n| 5.3 | Automation-bias countermeasures | Structure approvals so habituation does not erode scrutiny \u2014 vary presentation, surface the unusual | Automation-bias literature, survey \u00a76b |\n| 5.4 | Attribution and credit | Name the contributing human, converting capture from surveillance into authorship | `P8`; no formal literature anchor \u2014 an assertion this pack makes |\n\n## What wave 2 concedes\n\n**The field is thinner than wave 1 and this wave stops at 24 rather than padding to 50.** Two entries are honest gaps rather than capabilities: **2.5 re-identification testing is unbuilt**, and it is the test that would actually validate D6 rather than assert it; **5.4 has no literature anchor** and rests on a claim about human motivation that the pack has not evidenced.\n\n**Recommended next 3:** (1) build 2.5 before the first security review, because a founder who has attacked their own envelope has an answer no competitor's policy statement can match; (2) settle 1.4's stability criterion early \u2014 it is the guard against DD1's dangerous failure mode; (3) implement 4.3's paired baseline before E2 runs, since an unfair baseline makes the whole \u00a75 argument worthless.\n"}, "tech/techniques/wave3.md": {"g": "Techniques", "t": "Technique wave 3 \u2014 frontier and cross-domain imports", "md": "# Technique wave 3 \u2014 frontier and cross-domain imports\n\n> **What this is** \u2014 the third wave: methods drawn from current AI research and from fields outside IT operations, applicable to this system but not yet proven in it.\n> **Why it exists** \u2014 waves 1 and 2 describe what gets built. This wave is the research pipeline: what becomes possible if the core bet lands, and where the ceiling moves. It is explicitly speculative, and each row says so.\n> **How to read it** \u2014 treat every row as a hypothesis. A skeptic should note that nothing here is on the Now or Next tier of [../../product/features_prioritized.md](../../product/features_prioritized.md) and none of it rescues the pack if DD1 fails.\n> **Depends on / feeds** \u2014 inherits [wave2.md](wave2.md), [../../research/capability_table.md](../../research/capability_table.md); feeds [technique_feature_matrix.md](technique_feature_matrix.md), `financials/use_of_funds.md` (what research money would buy).\n\n**18 techniques across 4 clusters. The wave stops early and the field is not exhausted** \u2014 it is that most frontier work in this space is aimed at *executing* better, and this system's binding constraint is *learning* better. That asymmetry is itself a finding.\n\n## 1 \u00b7 Learning from unlabelled interaction (5)\n\n| # | Technique | Mechanism | Status |\n|---|---|---|---|\n| 1.1 | Screen-video pretraining | Use unlabelled screen recordings as a training signal without manual annotation | VideoAgentTrek [S23] \u2014 published, unreplicated here |\n| 1.2 | Self-supervised action representation | Learn the action embedding from interaction rather than hand-designing the schema | Speculative; would replace DD2's typed schema |\n| 1.3 | Contrastive procedure embedding | Learn a metric where two runs of the same procedure are near and different procedures are far \u2014 **would directly attack DD1** | Speculative, and the highest-value row here |\n| 1.4 | Curriculum from escalation data | Order learning by difficulty using which tickets humans escalated | Speculative |\n| 1.5 | Counterfactual trace generation | Synthesise plausible failure branches rather than waiting to observe them \u2014 attacks `P2` directly | Speculative, and dangerous if wrong: a synthesised branch that never occurs is a confident fiction |\n\n## 2 \u00b7 Agentic execution frontier (5)\n\n| # | Technique | Mechanism | Status |\n|---|---|---|---|\n| 2.1 | Long-horizon planning with subgoal decomposition | Extend beyond the short-horizon segment this pack claims | Best long-horizon completion is 20.6% [S16] \u2014 **why D1 exists** |\n| 2.2 | Compositional generalist-specialist agents | A generalist plans, specialists execute domain steps | Agent S2 architecture, research-stage |\n| 2.3 | Tool-use over API rather than UI | Bypass the interface where an API exists \u2014 faster and far more stable | Available today; **the honest note is that this reduces the value of UI capture wherever it applies** |\n| 2.4 | Self-verification via independent re-derivation | Confirm an outcome by a second, unrelated route | Speculative; would st
