el's core motion |\n| **Ticket volume growth** | The MSP's own client growth | Medium \u2014 depends on the customer, and petal 2 says we help |\n| **Band mix shift** | More complex clients as trust grows | Low, and small |\n| **Global-layer premium** | Price rises as the envelope thickens | **Lowest \u2014 this is A8, and it is a year-two mechanism at best** [../tech/whitepaper.md](../tech/whitepaper.md) M5 |\n\n## 4 \u00b7 The revenue-quality problem, restated because it survives both scenarios\n\n**~73% of three-year revenue per MSP is one-time backfill onboarding.** It bills once per existing client and never again.\n\n**The earlier version called this an NRR decline, and that was wrong.** Every diligence definition of net revenue retention excludes one-time implementation revenue from both numerator and denominator. On the recurring line alone the ramp runs **$1,090 \u2192 $8,900**, so NRR is well above 100% throughout \u2014 **the \"45% step down\" is the exhaustion of a one-time backfill balance, not churn.** A reader taking the old sentence literally would conclude the subscription contracts, which this pack's own ramp says it does not.\n\n**Reported correctly, there are three lines and they should never be summed into one \"recurring\" figure:**\n\n| Line | Annual, steady state | Character |\n|---|---|---|\n| **Ticket revenue** | **~$8,900** | genuinely recurring \u2014 the subscription line a valuation should rest on |\n| Turnover-driven onboarding fees | ~$6,030 | recurs only as a function of **the customer's own client churn**, not ours. Not recurring by any standard definition |\n| Backfill onboarding | declining to zero by ~year 4 | a one-time implementation backlog, and it should be carried as one |\n\n**So the durable subscription line is ~$8,900 per MSP per year \u2014 roughly 60% of the ~$14,930 figure the rest of this pack quotes**, and `comps_exits.md` values on the smaller number with the turnover line argued separately. During the land phase this is implementation-shaped revenue earning a services multiple, the same quality this pack criticises ServiceNow for [S20]; the difference is that ours decays by design.\n\n**Recommended next 3:** (1) run E3 before this build is shown to anyone \u2014 the fee is priced above displaced value at every band and E3 is the only thing that establishes whether it has a basis; (2) do not model past $10M without naming the market that carries it; (3) re-run this file the day E1 returns a number, because every row above is void if it comes back low.\n"}, "financials/risk_matrix.md": {"g": "Financials", "t": "Risk matrix", "md": "# Risk matrix\n\n> **What this is** \u2014 the top risks as a table: likelihood, impact, leading indicator, mitigation, and **residual** level after mitigation.\n> **Why it exists** \u2014 a matrix where everything mitigates to \"low\" is fiction, and it is the most common failure of this artifact. Four rows below stay **high** after mitigation, and one has no mitigation at all.\n> **How to read it** \u2014 the Residual column. A skeptic should check that no residual has been talked down by a mitigation that is itself unbuilt.\n> **Depends on / feeds** \u2014 inherits [../validation/riskiest_assumptions.md](../validation/riskiest_assumptions.md), [../research/](../research/), [../tech/](../tech/); feeds `narrative/vc_memo.md` \u00a76, `startup-audit`.\n\n| # | Risk | Likelihood | Impact | Leading indicator | Mitigation | **Residual** |\n|---|---|---|---|---|---|---|\n| **1** | **Core mechanism fails** \u2014 skills do not transfer across environments | Medium | **Fatal** | E1 interim scores below 60% after two approaches | Harness before clusterer; 3 iterations; kill criterion declared; publish either way | **High.** No mitigation makes an unevidenced mechanism work. The mitigation buys an *honest, early* answer, not a better one |\n| **2** | **Disuse** \u2014 engineers quietly stop cooperating with capture | Medium-high | **Severe, and invisible** | Pause rate >25%, narration <30% (E6); endorsement rate falling | Attribution, correction rights, rejection without justification; E6 instruments it | **High.** It is a social failure with no technical fix, and every other metric looks fine while it happens [S36] |\n| **3** | **Market too small** at achievable pricing | Medium-high | Severe | E3 acceptance below 5/10; banded schedule forced down | Two-part tariff; wedge-to-expansion story | **High.** SAM is ~$179M after two successive fee corrections, and the justification has failed arithmetic twice. This is a ceiling, not a bug |\n| **4** | **Channel closed** \u2014 vendor founder not admissible to peer/buying groups | Medium | Severe | E4 | Open sources first; marketplace as fallback | **Medium.** The fallback exists but is 18\u201324 months out and changes the raise |\n| **5** | **Envelope re-identification succeeds** | Medium | Severe | E5/X25 | m\u22653 MSPs, whitelist construction, schema versioning | **Medium-high.** The guarantee is heuristic \u2014 minimum support does not address compositional linkage, and no l-diversity, t-closeness or DP is implemented. **X25 is unbuilt** |\n| **6** | **A confident wrong action at a client** (the 14:20 class) | **High \u2014 it will happen** | Moderate per incident, severe if mishandled | Reversal rate (X23) | Reversibility, agent identity, same-day disclosure (X24), destructive gating | **Medium.** Not eliminable, only survivable \u2014 and the pack says so rather than promising prevention |\n| **7** | **Incumbent adds discovery** \u2014 Ravenna, Atomicwork, or Automation Anywhere on FortressIQ's footprint | Medium | Severe | A competitor shipping recording-based onboarding | Variance envelope; MSP-specific motion; 41 environments per customer | **Medium-high.** They can build it; the constraint is environment coverage, and a funded incumbent is ahead on raw count today |\n| **8** | **API displacement** \u2014 vendors ship good APIs and the UI surface shrinks | **High, and continuous** | Moderate now, severe over 5 years | Share of target procedures with a usable API | Prefer APIs where they exist; concentrate on surfaces that lack them | **Medium-high.** This is structural erosion, not an event, and D10 requires it stated publicly |\n| **9** | **Schedule** \u2014 40-week floor, month 12 only at optimistic bounds | **High** | Moderate | Any Now-tier item exceeding its band | Reserve block; DD1 time-boxed | **High.** Solo founder, sequential critical path, no slack |\n| **10** | **Node fleet operations** \u2014 version skew, silent node failure | Medium | Moderate | Stale-skill age, buffer depth | S13 fleet health, HALT-and-page, schema versioning | **Medium.** One node per MSP is tractable; the on-call obligation arrives with deployment one |\n| **11** | **Key person** \u2014 solo founder | Medium | **Fatal** | Founder unreachable >72h; no second person able to deploy or roll back a node | **Partly buyable for under $5k, and the earlier version said \"none\":** founder vesting with a cliff, IP assignment, key-man cover, credential and code escrow, and a written recovery runbook. None of it replaces a co-founder | **High** \u2014 but high *because unmitigable in substance*, not because the cheap instruments were skipped |\n| **11b** | **Node capital exposure** \u2014 hardware credit unrecovered on churn | Medium | Moderate | Customer stalls at environment 2 (gtm \u00a75's own falsification test) | **The blanket credit is withdrawn** (`unit_economics.md` \u00a73): hosted node at MSP cost is the default; where a credit is used it carries title, a 24-month term and pro-rata clawback | **Low** \u2014 after withdrawal. It was **unrecorded entirely** before, in a matrix whose contract names cost as a required category |\n| **12** | Regulatory \u2014 EU capture constraints | Low (US-first) | Moderate | EU expansion attempt | US-first (D3) | **Low.** Deferred, not solved [S29] |\n\n## What the residual column says\n\n**Four risks stay High.** Row 11 no longer claims *no* mitigation \u2014 the cheap instruments exist and are named \u2014 but its residual is unchanged, because none of them replaces a second person. That is the correct shape for a pre-build company with one unmeasured mechanism, a solo founder and a ceiling on its market \u2014 and a matrix that showed anything else would be describing a different company.\n\n**Risk 2 deserves more attention than it will get.** It is the only severe risk whose realisation is *invisible in every dashboard*: capture volume keeps rising, the library keeps growing, and what degrades is the quality of what is captured. E6 exists solely to see it, and it runs for free inside E1.\n\n**Risk 8 is the one that gets worse with time regardless of execution.** Every other risk is retired by evidence or by building; API displacement is a structural trend we can position against but not affect.\n\n**Recommended next 3:** (1) build X25 before the first security review so risk 5's residual is measured rather than asserted; (2) instrument E6's three metrics from the first captured session, because risk 2 is otherwise undetectable; (3) do not present this matrix with anything talked down \u2014 the four High residuals are the reason the pre-seed is sized to fund a question rather than a company.\n"}, "financials/unit_economics.md": {"g": "Financials", "t": "Unit economics \u2014 per MSP, both node cases", "md": "# Unit economics \u2014 per MSP, both node cases\n\n> **What this is** \u2014 the per-unit P&L: CAC by channel with its basis, gross margin including inference at current prices, payback, LTV under stated retention, and the cost-curve argument.\n> **Why it exists** \u2014 D6 moved the compute-heavy half of the system onto hardware we do not own. That either removes the dominant cost from our P&L or it does not, depending on a commercial term nobody has negotiated \u2014 and the margin conclusion is completely different in the two cases. `not_vaporware.md` promised this file would model both. It does.\n> **How to read it** \u2014 \u00a73 records why the hardware credit was withdrawn (D14) and \u00a73b bridges the two margins that were previously unreconciled. A skeptic should attack the year-1 margin in \u00a74, which is ~56% against a 76% steady state, and the retention assumption behind LTV.\n> **Depends on / feeds** \u2014 inherits [pricing.md](pricing.md), [revenue_build.md](revenue_build.md), [../tech/not_vaporware.md](../tech/not_vaporware.md) \u00a73b, [../strategy/channel_plan.md](../strategy/channel_plan.md); feeds [use_of_funds.md](use_of_funds.md), `narrative/vc_memo.md`.\n\n**Conditional on E1, E3 and E8.** All figures are the banded schedule (D11); the superseded flat basis is a footnote in `revenue_build.md` \u00a71, not a parallel column here.\n\n## 1 \u00b7 Revenue per MSP\n\n| | Year 1 | Steady state |\n|---|---|---|\n| Ticket revenue (124 resolved/mo \u00d7 $6 \u00d7 12) | ~$1,090 | ~$8,900 |\n| Onboarding fees | ~$4,020 | ~$6,030 |\n| **Total** | **~$5,110** | **~$14,930** |\n\n## 2 \u00b7 Marginal cost per MSP per month\n\n| Line | Basis | Monthly |\n|---|---|---|\n| Action typing | **On-node** (D6) \u2014 no API cost | $0 |\n| Clustering / alignment | Classical, CPU, on-node | $0 |\n| Skill synthesis | ~20\u201340 skills/mo, frontier, on abstracted clusters \u2014 the only outbound call | `(assumption: $10\u201330)` |\n| Execution | mostly deterministic; model only on re-grounding | `(assumption: $5\u201315)` |\n| **Total marginal API** | | **`(assumption: $15\u201345)`** |\n\nAgainst ~$1,244/month of revenue, **marginal API is 1\u20133% of revenue.** Falling inference prices [S30] make this line progressively irrelevant. **It is not the number that decides this business.**\n\n## 3 \u00b7 The node, and why the credit is being withdrawn\n\nThe reference node is 1\u00d724GB GPU, 8 vCPU / 32GB, ~2TB `(assumption)` [../tech/not_vaporware.md](../tech/not_vaporware.md) \u00a73b.\n\n**D13 approved a hardware credit against onboarding fees. Modelled properly, it does not survive, and the recommendation is to drop it.**\n\n**It is contra-revenue, not a cash-plan line.** A credit denominated as a reduction of the customer's own fees is consideration payable to a customer. The earlier version placed it \"in the cash plan, not in gross margin\" \u2014 it appeared in neither, and the payback table below was computed as though it did not exist.\n\n**Netted correctly.** D9 waives environment 1, so year 1 has **four** chargeable environments at the ~$1,005 blend = **$4,020 of fee revenue**. A $2,000\u20134,000 credit consumes **50\u2013100% of it**:\n\n| Credit | Year-1 net revenue | 3-year revenue | Gross profit @76% | CAC ceiling |\n|---|---|---|---|---|\n| **$0** | $5,110 | $39,985 | $30,625 | **$10,208** |\n| $2,000 | $3,110 | $37,985 | $28,869 | $9,623 |\n| $3,000 (mid) | **$2,110** | $36,985 | $28,314 | **$9,438** |\n| $4,000 | $1,110 | $35,985 | $27,349 | $9,116 |\n\n**And it breaks payback**, which is the test that settles it:\n\n| CAC | Credit | Cash out | Year-1 cash in | Payback |\n|---|---|---|---|---|\n| $6,500 (primary, mid) | $0 | $6,500 | $5,110 | **1.3 yrs** |\n| $6,500 | $3,000 | $9,500 | $2,110 | **4.5 yrs** |\n| $9,000 (primary, top) | $3,000 | $12,000 | $2,110 | **5.7 yrs** |\n\n**Recommendation: drop the blanket credit.** A 4.5-year payback on a company whose retention is unmeasured, whose customer may stall at environment 2 \u2014 which is `strategy/gtm.md` \u00a75's own falsification test \u2014 and which has $900k\u20131.2M of runway, is not a pricing instrument. It is vendor-financed capex with the risk on the wrong side.\n\n**What replaces it, in order of preference:**\n\n1. **A hosted node the vendor operates inside a tenant the MSP owns** \u2014 `(assumption: $150\u2013250/month)` billed to the MSP as opex. Preserves the D6 boundary exactly, removes the procurement conversation, and costs us no capital. **This is the recommended default.**\n2. **The MSP provides the node.** Best margin, loses deals at the small end.\n3. **The credit, reserved for design partners only** \u2014 where it is an acquisition cost knowingly spent on evidence, not a term offered at scale.\n\n**If the credit is used at all, it needs the three terms it did not have:** **title** remains with us until recovered; a **24-month term**; and **pro-rata clawback on churn**. Without them an owner takes a free GPU box and keeps it \u2014 and `risk_matrix.md` now carries that exposure as its own row, which it previously did not.\n\n## 3b \u00b7 Margin bridge \u2014 reconciling 96% marginal with the 70% the strategy assumes\n\nThe layer carried two unreconciled margins, and every channel verdict turns on which is operative. Neither was derived. Here is the bridge:\n\n**Built by driver, not as a steady-state stack applied to a ramp.** The earlier version applied one annual cost line across a three-year window in which no driver is at steady state \u2014 delivery scales with environments *onboarded* (30 over three years, not the 18 a flat line implies), support with environments *live* (5\u219215\u219230 against a steady-state 41, so a flat line overstates it), and inference with tickets. The errors ran opposite ways and did not cancel.\n\n| Driver | 3-year cost | Scales with |\n|---|---|---|\n| Onboarding delivery | **$4,950** | 30 environments onboarded \u00d7 ~3 hrs \u00d7 $55 |\n| Support / customer success | **$1,829** | environments live (5\u219215\u219230 against a 41 steady state) |\n| Node fleet ops + on-call | **$2,400** | **fixed from deployment one** \u2014 not per-customer |\n| Inference API | **$181** | tickets, ramping |\n| **3-year COGS** | **$9,360** | |\n| 3-year revenue | $39,985 | |\n| **3-year gross profit** | **$30,625 (~77%)** | range **68\u201380%** on the assumption spread |\n| **CAC ceiling at 3:1** | **~$10,200** | range **$9,100\u201310,700** |\n\n**The range matters more than the point.** At the low end the primary channel's $9,000 top gives **3.0:1 \u2014 exactly the floor**, not comfortably inside it. D15's claim that the bridge \"keeps the primary channel inside the floor\" survives only in the favourable half of the range, and that is stated rather than rounded away.\n\n**96% was marginal-on-API-only; 76% is the operating number**, and it is the one the CAC ceiling should be derived from. The 70% the strategy layer assumed was close enough to be harmless, and is now replaced by a figure with its cost stack shown. **The human lines \u2014 onboarding delivery, support, node ops \u2014 are where channel products actually lose margin, and the earlier version costed the compute meticulously and omitted them entirely.**\n\n## 4 \u00b7 CAC, payback and LTV\n\n| Channel | CAC | Basis | **Payback vs year-1 gross profit** |\n|---|---|---|---|\n| Peer communities *(primary)* | $4,000\u20139,000 | Entry cost + participation amortised + 15\u201325 hrs/close | **1.4\u20133.1 years** on year-1 gross profit |\n| Buying groups | $500\u20132,000 + 10\u201320% referral | Best available | 0.2\u20130.7 years |\n| Newsletters / podcasts | $4,000\u20138,000 | Placement cost \u00f7 1\u20132 customers | 1.4\u20132.8 years |\n| Marketplace | $1,000\u20133,000 + 15\u201325% share | 18\u201324 months away | 0.2\u20130.6 years |\n| Outbound / field | $15,000\u201340,000 | Excluded | **Never** |\n\n**Year-1 margin is materially below steady state, and the earlier version computed payback against revenue rather than gross profit.** Two costs land in year 1 that the 6-environment steady-state bridge never sees: **node fleet ops (~$800) is fixed from deployment one**, and **onboarding delivery is incurred on all five environments including the one D9 waives** \u2014 which carries cost and zero revenue.\n\n| Year-1 line | Amount |\n|---|---|\n| Revenue | ~$5,110 |\n| Onboarding delivery, 5 environments incl. the waived one | ~$825 |\n| Node ops (fixed from deployment one) | ~$800 |\n| Support + inference | ~$620 |\n| **Year-1 gross profit** | **~$2,865 (\u224856% margin)** |\n\n**So the honest primary-channel payback is ~2.3 years at the midpoint and ~3.1 at the top**, not the 0.8\u20131.8 the earlier table published. **That tightens this file's own conclusion rather than loosening it: E4 \u2014 whether the founder can enter the channel at all \u2014 is the round's real gate, because only a bottom-of-range CAC works.**\n\n**LTV.** 3-year gross profit **~$30,400** at the 76% steady-state loaded margin, no credit. LTV:CAC at the primary channel:\n\n| CAC | LTV:CAC | Read |\n|---|---|---|\n| $4,000 (bottom) | **7.6:1** | healthy |\n| $6,500 (mid) | **4.7:1** | workable |\n| **$9,000 (top)** | **3.4:1** | **at the floor the ceiling was defined by** |\n\n**Stated plainly, because `channel_plan.md` says it and this file previously softened it to \"healthy on paper\":** a business whose best channel's top end sits at its 3:1 floor is fundable **only if CAC lands at the bottom of its range** \u2014 which makes **E4, the two-week channel-admissibility test, the round's real gate, not E1.**\n\n**Retention.** The earlier version said \"NRR falls below 100% after backfill completes\" \u2014 **`revenue_build.md` \u00a74 now establishes that was wrong.** NRR excludes one-time implementation revenue by every diligence definition; on the recurring line the ramp runs $1,090 \u2192 $8,900, so NRR is well above 100% throughout and the step-down is **backlog exhaustion, not churn**.\n\n**What does qualify the LTV: ~73% of the 3-year gross profit this ratio rests on is one-time.** The durable subscription line is ~$8,900/yr, not $14,930 \u2014 see `revenue_build.md` \u00a74's three-line split, which should never be re-summed into a single \"recurring\" figure. No churn figure exists because no customer does.\n\n## 5 \u00b7 The cost curve\n\nInference for fixed capability falls ~10\u00d7/yr [S30], so \u00a72's marginal line trends toward zero and **\u00a73's hardware fork is the durable cost question, not the API line.** Two consequences: the on-node constraint (D6) gets cheaper to honour every year as quantised models improve, which is a tailwind for the privacy architecture rather than a tax on it; and **margin improvement will come from operating leverage on the human lines \u2014 support, onboarding delivery, node ops \u2014 not from the model.** The node itself is now the customer's opex (D14), so it is a pricing question rather than a margin lever.\n\n**Recommended next 3:** (1) settle whether the hosted node is bundled into the fee or passed through, and put the **all-in** number in both E3 arms \u2014 `pricing.md` \u00a74b shows the buyer sees ~$6,900\u20138,100 in year 1, not $5,110; (2) quote the margin as the **68\u201380% range with its cost stack**, not a point \u2014 the top-end channel verdict flips inside it; (3) model a 5-year LTV alongside the 3-year one before any raise, since the 3-year window sits entirely inside the backfill period.\n"}, "financials/use_of_funds.md": {"g": "Financials", "t": "Use of funds", "md": "# Use of funds\n\n> **What this is** \u2014 the raise: amount, an 18\u201324 month milestone-linked spend plan where each block buys a named de-risking result, hires in order, the capital-efficiency metric to report, and what the next round's story requires this one to prove.\n> **Why it exists** \u2014 this company has one question and a long build. A use-of-funds that spreads money evenly across a roadmap would fund the wrong thing first; this one is ordered by what each dollar retires, and the cheapest experiments come before the expensive one.\n> **How to read it** \u2014 the sequencing in \u00a72 is the argument. A skeptic should check that no block funds work that a cheaper experiment could have made unnecessary.\n> **Depends on / feeds** \u2014 inherits [../validation/experiment_board.md](../validation/experiment_board.md), [../product/features_prioritized.md](../product/features_prioritized.md) Build math, [unit_economics.md](unit_economics.md); feeds `narrative/pitch_deck.md` slide 14, [comps_exits.md](comps_exits.md).\n\n## 1 \u00b7 The raise\n\n**Pre-seed, $900k\u20131.2M.** The earlier version said $750k\u20131.2M and its own blocks summed to $820k \u2014 **$70k underwater at the floor before anything slipped**, with the reserve then covering under a month of burn. The floor is raised and the plan below now totals to a stated figure.\n\n**Two structural holes the earlier version also had, both fixed:** there was **no founder compensation for months 11\u201324** in an 18\u201324 month plan (B2 ended at month 10), and the reserve was a round number rather than sized against the slip it insures \u2014 `product/features_prioritized.md` puts midpoints \"past 55 weeks\", a ~3.5-month overrun costing ~$165k at B2's rate.\n\n**Why not more.** A larger round funds hiring and channel spend before E1 returns a number, and E1 can return a negative. **A company that has raised $3M against an unmeasured core mechanism has to keep going; one that has raised $1M can publish the negative and stop.**\n\n**Why not less.** The build floor to the harness plus the transfer test is ~40 weeks solo, and month 12 for a first paid pilot holds only at every item's optimistic bound. A round ending at month 12 ends exactly when the evidence arrives.\n\n## 2 \u00b7 Milestone-linked spend\n\nOrdered by cost, not importance. **Three company-killing assumptions cost under $2,000 to test and none needs code.**\n\n| # | Block | Spend | Months | What it retires |\n|---|---|---|---|---|\n| **B1** | Discovery + cheap experiments | **$5k** | 1\u20132 | **E3** (does the fee have any basis), **E4** (is the channel open at all), **E5/X25** (envelope re-identification), **E8** (ticket mix and the automatable subset's real cost) |\n| **B2** | Founder comp + Now-tier build | **$420k** | 2\u201310 | The pipeline, harness first. `(assumption: $150k founder comp + ~$270k contract engineering and infra = $420k. **The contract line is deliberate and it qualifies the solo framing**: it buys specialist help on DD2 typing and the harness without a hire, and it does NOT compress the ~40-week floor, which is why B7 is unchanged)` |\n| **B2b** | **Founder comp, months 11\u201324** | **$175k** | 11\u201324 | Nothing \u2014 it is the cost of existing while the evidence arrives. **The earlier version simply omitted it** |\n| **B3** | E1 + E2 | $15k | 10\u201312 | **The core mechanism, measured** |\n| **B4** | Security groundwork | **$60k**, of which ~$15k at month 6 | 6\u201318 | Policy and platform first; the **Type II audit spend waits for X16 (tenant isolation) to ship** \u2014 a Type II requires controls operating over a real production system, and at month 6 there is none |\n| **B5** | First pilots + node + **contracted on-call backstop** | **$70k** | 12\u201318 | E7 review cycle time; the hosted-node option; and **six months of 24/7 cover on customer infrastructure before the month-18 systems hire** \u2014 asserted in \u00a73 and previously unfunded. The $800/yr node-ops line in `unit_economics.md` is per-MSP COGS at scale, not the fixed cost of first cover |\n| **B6** | First hire \u2014 **MSP-side operator** | $180k | **on E1 \u226570%, not before month 14** | Closes the A6 gap. **Milestone-gated, not date-gated** \u2014 the earlier version fired the largest discretionary commitment before E1 returned, breaking this file's own rule |\n| **B7** | Reserve | **$165k** | \u2014 | Sized to the 55-week midpoint slip, not to a round number |\n| | **Plan case total** | **$1,090k** | | |\n| | **Reduced-scope case** (B6 deferred) | **$910k** | | Reaches E1 and a first pilot; defers the hire to a seed |\n\n**B1 is 0.5% of the plan-case round and can invalidate the other 99.5%.** *(E5's ~$8k adversarial testing is funded from B3 rather than B1, which covers the four conversation-based experiments.)*\n\n## 3 \u00b7 Hires, in order\n\n1. **MSP-side operator / founding GTM** (month ~14). The founder story names this gap explicitly; it does not close by reading.\n2. **Systems engineer** (month ~18), for the node fleet \u2014 the on-call obligation (D6/N15, drawn in `tech/architecture/D09.md`) arrives with the **first deployment**, not with this hire, so months 12\u201318 need a contracted on-call backstop priced into B5 rather than one person's phone.\n3. **Nobody before E1 returns a number.** Hiring against an unmeasured mechanism converts optionality into obligation.\n\n## 4 \u00b7 Capital-efficiency metric to report\n\n**Dollars per assumption retired**, not burn multiple or ARR per dollar \u2014 neither of which means anything pre-revenue.\n\n| Assumption | Cost to retire |\n|---|---|\n| R3 pricing basis | ~$0 |\n| R4 channel admissibility | ~$0 |\n| R5 envelope re-identification | ~$8k |\n| R8 ticket mix | ~$0 |\n| **R1 core mechanism** | **~$435k** (the build is the cost) |\n\n**This table is the fundraising argument.** Four of five company-killing assumptions retire for under $10k; the fifth is the company. A round that funds them in that order is efficient regardless of what it discovers.\n\n## 5 \u00b7 What the next round needs this one to prove\n\nA seed requires **three** things, and only one is a number:\n\n1. **E1 \u226570%** \u2014 cross-environment transfer measured, published, and honest either way.\n2. **A repeatable acquisition motion** \u2014 3 paying MSPs through the same channel, with CAC inside the ceiling `unit_economics.md` computes.\n3. **Expansion without a sales conversation** \u2014 environment 2 onward at \u22646 weeks review cycle, because that is what makes the revenue model work and it is gated by throughput rather than selling.\n\n**What it explicitly does not require: autonomy, a large logo, or a blended 10\u00d7 claim.** All three are excluded by decisions this pack has already made, and a seed story that reintroduced them would contradict the pre-seed story that raised on their absence.\n\n**Recommended next 3:** (1) run B1 in month one \u2014 it is 0.5% of the round and it gates the rest; (2) start B4's **policy and platform work** at month six \u2014 the Type II audit spend itself waits for X16 to ship, per the split above, so the clock that cannot be compressed is the controls-operating window, not the whole programme; (3) report dollars-per-assumption-retired to investors monthly \u2014 it is the only efficiency metric that is meaningful before revenue.\n"}, "visuals/image_prompts.md": {"g": "Visuals", "t": "Image prompts", "md": "# Image prompts\n\n> **What this is** \u2014 one production-grade text-to-image prompt per image-form manifest row, each fully self-contained: subject, every label to embed verbatim, composition zones, orientation, and the pack's shared style block.\n> **Why it exists** \u2014 no text-to-image tool is available in this run, so these rows are `pending-image`. The prompts are written to be usable unchanged by a human with an image tool or by a later session with one, which is the difference between a gap and a deferral.\n> **How to read it** \u2014 the label lists are verbatim and closed. A skeptic should check that no prompt asks a diffusion model to render a sentence, which is the failure mode that garbles.\n> **Depends on / feeds** \u2014 inherits [visual_manifest.md](visual_manifest.md); feeds `visuals/images/` when a renderer exists.\n\n## Rules every prompt below obeys\n\nImage models garble dense text. Each prompt therefore: uses **short labels only** (a code plus two or three words), **states element counts as numbers** (\"exactly THREE bars\"), **binds every label inside the shape it describes** rather than floating beside it, and **forbids additions**. Anything needing a paragraph is an HTML infographic instead, and is already rendered.\n\n**Shared style block \u2014 prepend to every prompt:**\n> *Extremely information-dense professional infographic, white background, elite systems-architect quality, clean modern typography with clear hierarchy, one bold headline takeaway, 3\u20135 labeled information zones, consistent accent palette (indigo #4338CA accent, teal #0D7A70 for positive signal, amber #B45309 for caveats, near-black #0B0B12 ink, #E4E4EB hairlines), refined iconography, print-grade, no watermark, no lorem ipsum. Render ONLY the labels quoted in the prompt \u2014 add no other text.*\n\n---\n\n### P01 \u00b7 The knowledge cycle\n**Orientation:** 16:9. **Subject:** a closed four-node cycle with a leak arrow.\n**Exactly FOUR nodes in a ring**, each label inside its node: `ACQUIRE`, `DECAY`, `LOSE`, `RE-ACQUIRE`. **One arrow leaving the ring downward**, labelled inside a small tag: `EVERY TICKET PAYS THE GAP`. Headline across the top: `A knowledge debt with no principal repayment`. One figure in a corner tag: `25\u201340 HRS PER CLIENT`.\n**Forbid:** any additional text, any human figures.\n\n### P03 \u00b7 Right input, wrong decade\n**Orientation:** 16:9. **Subject:** two horizontal timelines stacked, sharing one time axis.\n**Upper track, exactly TWO markers**, labels inside the markers: `FORTRESSIQ 2017`, `ACQUIRED 2021`. **Lower track, exactly THREE markers**: `12% 2024`, `85% 2026`, `SKILL.MD STANDARD`. A vertical dashed band spanning both tracks labelled inside a tag: `THE GAP`. Headline: `Recording worked. There was nothing to send it to.`\n**Forbid:** curves on the upper track, any prose.\n\n### P04 \u00b7 The capability curve and its ceiling\n**Orientation:** 16:9. **Subject:** one rising curve with a hard annotation.\n**Exactly ONE curve** rising left to right. **Exactly THREE point labels bound to the curve**: `12%`, `85%`, `86.1%`. **One horizontal dashed line below the curve's right end**, labelled inside its own tag: `20.6% LONG-HORIZON`. Headline: `Good enough to be interesting. Not good enough to trust.`\n**Forbid:** a second curve, gridline numbers, any sentence.\n\n### P05 \u00b7 The closed loop\n**Orientation:** square. **Subject:** a seven-stage ring.\n**Exactly SEVEN nodes**, labels inside: `WATCH`, `DISTIL`, `REHEARSE`, `GATE`, `ACT`, `VERIFY`, `LEARN`. One node (`DISTIL`) filled in the indigo accent; the rest outlined. **One inward arrow from `LEARN` to `DISTIL`.** Headline above the ring: `Break any link and it becomes something that already exists.`\n**Forbid:** icons inside nodes, extra arrows, any caption text.\n\n### P06 \u00b7 The ticket-side panel\n**Orientation:** 16:9. **Subject:** a clean product UI mock, three stacked zones in a single panel.\n**Exactly THREE zones**, each with its label bound inside: top `MATCHED SKILL`, middle `2 DEVIATIONS AT THIS TENANT` (rendered as exactly TWO short rows), bottom `RUN WITH ME`. A small monospace tag in the panel header: `GATED`.\n**Forbid:** realistic body text, browser chrome, any additional UI element.\n\n### P07 \u00b7 Contract vs goal\n**Orientation:** 16:9. **Subject:** a two-column before/after ledger showing the same procedure under a UI change.\n**Exactly TWO columns.** Left column header inside its band: `RPA \u00b7 ASSERTS THE INTERFACE`; below it exactly THREE step blocks, the third filled amber and labelled inside: `HALTS OR PROCEEDS WRONGLY`. Right column header: `SKILL \u00b7 ASSERTS THE GOAL`; exactly THREE step blocks, the third filled teal and labelled inside: `RE-GROUNDS`. Headline: `The difference is what the check is about.`\n**Forbid:** any explanatory sentence, arrows between columns.\n\n### P08 \u00b7 The variance envelope\n**Orientation:** 16:9. **Subject:** one modal path with a distribution around it.\n**One central bold path left to right** labelled inside a tag: `MODAL PROCEDURE`. **Exactly SIX faint parallel paths** around it, three above and three below, one of which is labelled inside: `OBSERVED IN 14 TENANTS`. A corner tag: `3 VARIANTS \u00b7 2 DEVIATIONS`. Headline: `The distribution is the asset. The procedure is in the vendor's docs.`\n**Forbid:** more than six variant paths, any legend.\n\n### P12 \u00b7 The admin surface map\n**Orientation:** 16:9. **Subject  | 2/2 | present |\n| A02\u2013A06 research | 5/5 | present |\n| A07\u2013A13, A58\u2013A61 strategy | 11/11 | present |\n| A14\u2013A21 product | 8/8 | present |\n| A22\u2013A26, A28\u2013A30 tech | 8/8 | present |\n| A24 architecture (11 files individually) | 11/11 | present |\n| A27 wave 3 | opt | present |\n| A31\u2013A35, A64 narrative | 6/6 | present |\n| A36\u2013A42, A62\u2013A63 validation | 9/9 | present |\n| A43\u2013A48 financials | 6/6 | present |\n| A49 visual manifest | 1/1 | present \u2014 69 rows |\n| A50 HTML infographics | req | present \u2014 20 rendered, reconciled to the glob |\n| A51 image prompts | 1/1 | present \u2014 46 prompts |\n| A52 rendered images | opt | **0** \u2014 no text-to-image tool in this run |\n| **A52b docimages coverage** | req | **OPEN \u2014 see \u00a73** |\n| A53 ingest | opt | n/a \u2014 no sources ingested |\n| **A54 this file** | req | present |\n| A55 run README | req | present, refreshed from the glob |\n| A56\u2013A57 site | opt | not run |\n\n**No stub rows.** Every required artifact exceeds 400 words and carries its owning contract's named sections. The lowest-word required artifacts were re-checked individually rather than trusted to a line count: `research/capability_table.md` and `strategy/lean_canvas.md` are dense tables whose substance is in cells, not lines.\n\n## 2 \u00b7 Quality-bar spot checks\n\n| Property | Method | Result |\n|---|---|---|\n| **0 \u00b7 orientation block** | **Checked on all 68 artifacts, not sampled** | **0 failures \u2014 after this audit fixed 10.** All ten architecture diagrams (D01\u2013D10) were missing it. That is exactly the failure this check exists to catch, and it was invisible to every other review |\n| 1 \u00b7 mechanism over adjective | grep for load-bearing banned adjectives | 0 occurrences |\n| 2 \u00b7 every number sourced or flagged | count of `[Sn]` and `(assumption)` tags | 296 source tags \u00b7 66 assumption tags across the run |\n| 5 \u00b7 decision-forcing endings | grep for \"Recommended next\" | 50/68. **18 judged exemptions, listed below \u2014 not silent passes** |\n| 7 \u00b7 dense, not long | inspection | no artifact padded to length; three files (wave 2, wave 3, technique matrix) explicitly stop short and say the field is thinner rather than padding to a round number |\n\n**The 18 property-5 exemptions, with the reason each was judged rather than fixed:**\n- **11 architecture files** (`00_INDEX` + D01\u2013D10) \u2014 diagram captions. Their job is \"what a reviewer should notice\", and appending a recommendation would be padding.\n- **5 narrative artifacts** (`one_pager`, `vc_memo`, `founder_story`, `mission_vision`, `future_press`) \u2014 persuasion artifacts whose ending *is* the decision. The one-pager ends with the ask; the memo ends with the traction admission.\n- **`BRIEF.md`, `ASSUMPTIONS.md`** \u2014 source-of-truth files that other artifacts read, not artifacts that force a decision themselves.\n\n**Five research artifacts were fixed rather than exempted** during this audit \u2014 `landscape`, `competitors`, `capability_table`, `survey` and `sources` now end with what to research next, which is a genuine improvement rather than a compliance gesture.\n\n## 2b \u00b7 Cross-artifact numeric consistency sweep\n\nRun 2026-09-06, mechanically: every figure superseded by a decision (D9, D11) or by a critic correction was searched across all 68 artifacts, and each occurrence classified as *live* or *historical*.\n\n**31 live occurrences flagged \u00b7 26 correct on inspection \u00b7 5 genuinely stale and fixed.**\n\nThe 26 correct ones are the deliberate two-scenario tables in `revenue_build.md` and `unit_economics.md` (flat basis alongside the chosen banded one), the D9 decision record, and coincidental matches \u2014 a $9,000 CAC range and a 35% reseller margin are not the $9,000 fee revenue or the 35% automatable share.\n\n**The five fixed:**\n\n| File | Was | Now |\n|---|---|---|\n| `strategy/market_sizing.md` | D9's consequences read as current | marked superseded by D11 the same day, with current values stated |\n| `product/PRD.md` | ~$7,100 year-1 model | ~$5,110 (D9, D11) |\n| `tech/not_vaporware.md` | ~$1,494/month, ~$17,900/yr | ~$1,247/month, ~$14,930/yr at the banded fee |\n| `validation/get_keep_grow.md` | steady state ~$17,900 | ~$14,930 |\n| `tech/whitepaper.md`, `architecture/D06.md` | k\u22653 distinct **tenants** | m\u22653 distinct **MSPs**, with the hole the old threshold left explained |\n\n**This check belongs in every future audit of this run.** Four cascades have passed through this pack (the penetration fix, D9, D11, the k-threshold correction), and each one left stale figures in files nobody thought to re-read. It is mechanical, it takes a minute, and it has found something every time.\n\n## 2c \u00b7 Integrity checks \u2014 link, citation, discoverability\n\nRun 2026-09-06, mechanically across all 70 artifacts.\n\n| Check | Method | Result |\n|---|---|---|\n| **Relative links** | every relative markdown link resolved against its containing file | **0 broken** of ~430 |\n| **Citation integrity** | every `[Sn]` tag matched against `research/sources.md`; every defined source matched against usage | **0 undefined tags.** One source (S4) was defined and never cited \u2014 **fixed**, it now carries the Ravenna round date and founder backgrounds it was gathered for |\n| **Discoverability** | artifacts no other artifact links to | **3 orphans found and fixed**: `financials/risk_matrix.md`, `narrative/future_press.md`, `validation/discovery_guide.md` |\n| **Infographic integrity** | tag balance, doctype, unfilled placeholders, source line | **20/20 sound**, all citing a source artifact or `[Sn]` tag |\n\n**The orphan check matters more than it looks.** Quality-bar property 8 is that work nobody can find is work nobody did \u2014 and three substantive artifacts were reachable only by browsing a directory. The risk matrix in particular is the artifact a VC memo's risks section should point at, and it did not.\n\n## 3 \u00b7 Open rows \u2014 deliberately not closed\n\n### A52b \u00b7 Dossier illustration coverage \u2014 **OPEN**\n\n**58 substantive artifacts (>400 words). 21 covered by a rendered HTML infographic or a live Mermaid source. 37 uncovered.**\n\nThe manifest carries a row and a production-ready prompt for every one of the 37, and `visuals/image_prompts.md` \u00a7Dossier holds them. **They are not rendered because no text-to-image tool exists in this run.**\n\nTwo things worth recording precisely:\n\n1. **The shipped `build_docimages.js` reports 0 documents and 66 unillustrated**, because it indexes rendered PNGs only. That is correct behaviour for the tool and it understates actual coverage \u2014 a separate `visuals/dochtml.json` records the 21 artifacts covered by HTML and Mermaid, which the builder cannot see.\n2. **This row stays open on the founder's explicit instruction.** A pack that closes a coverage row by redefining what coverage means has learned nothing from the five claims its own critics killed.\n\n**To close it:** a session with an image tool renders the 46 prompts, verifies each in two stages (the file exists \u00b7 the file is *this* visual), and re-runs both builders.\n\n### A56\u2013A57 \u00b7 Site \u2014 **not run**\n\nThe website phase has not been attempted. It is gated behind the audit by design, and behind four owed critic rounds.\n\n## 4 \u00b7 Critic coverage \u2014 updated 2026-09-07\n\n| Phase | Rounds run | State |\n|---|---|---|\n| 2 \u00b7 strategy | **3 \u2014 all three PASS** | **GATE PASSED** |\n| 3 \u00b7 product | 2 | revised; no fatals remain; round 3 owed |\n| 4 \u00b7 tech | 1 | revised (2 fatals fixed); **round 2 killed twice by rate limits** |\n| 5 \u00b7 narrative | 1 | revised \u2014 **7 fatals**, the most of any layer |\n| 6 \u00b7 validation | 1 | revised \u2014 3 fatals |\n| 7 \u00b7 financials | **2** | round 1: 5 fatals. Round 2: **all originals confirmed closed**, one new fatal (the downside case unmodelled) fixed. Round 3 owed |\n| 8 \u00b7 visuals | **0** | **never critiqued** |\n\n**One phase has passed its gate. Six have not.** The loop remains where this pack finds its real errors: **twelve claims have now survived authorship and failed scrutiny**, recorded as K7\u2013K12 in `validation/pivot_log.md` plus the round-2 findings.\n\n**The pattern worth recording for any future run of this pack.** In every layer, round 1 found errors of *substance* and round 2 found errors of *propagation* \u2014 corrections that reached the file where an argument is made and not the files where it is restated. Three separate cascades (D9, D11, D14) each left stale figures in files nobody thought to re-read. **A round 2 is not optional polish; it is where half the defects live.**\n\n## 5 \u00b7 Remaining work \u2014 priority order, updated\n\n| # | Task | Status | Blocker |\n|---|---|---|---|\n| 1 | **Narrative round 2** | owed | \u2014 |\n| 2 | **Validation round 2** | owed | \u2014 |\n| 3 | **Tech round 2** | owed | killed twice by rate limits |\n| 4 | **Financials round 3** | owed | \u2014 |\n| 5 | **Visuals critic round 1** | **never run** | \u2014 |\n| 6 | Product round 3 | owed | lowest value \u2014 round 2 was clean |\n| 7 | Render 46 image prompts \u2192 closes **A52b** | **cannot do here** | no text-to-image tool |\n| 8 | `startup-website` \u2014 5 pages + `pack.html` | not started | gated on the narrative rounds |\n| 9 | Publish to GitHub Pages | not started | **needs explicit founder go-ahead** \u2014 makes the repo public, and `origin` is not the founder's |\n| 10 | Re-run this audit | \u2014 | follows everything |\n\n**Two rows stay open by decision, not by omission:** A52b (37 substantive artifacts with prompts but no rendered image) and A56\u2013A57 (the site). Neither is closed by redefining what closure means.\n\n**Recommended next 3:** (1) run the four owed round-2s before the site, since a site built from an uncritiqued layer propagates whatever is wrong in it; (2) critique the visuals layer at least once \u2014 it is the only phase with zero rounds and it carries 20 rendered artifacts making numeric claims; (3) do not mark A52b closed by any route other than rendered, verified images.\n"}};
const GROUPS = ["Brief", "Research", "Strategy", "Product", "Journeys", "Tech", "Architecture", "Techniques", "Narrative", "Validation", "Financials", "Visuals", "Audit"];
mermaid.initialize({startOnLoad:false, theme:'neutral', securityLevel:'loose'});

function buildNav(filter){
  const f = (filter||'').toLowerCase(); let h='';
  for(const g of GROUPS){
    const items = Object.entries(DOCS).filter(([p,d]) => d.g===g &&
      (!f || p.toLowerCase().includes(f) || d.t.toLowerCase().includes(f)));
    if(!items.length) continue;
    h += '<div class="grp">'+g+'</div>';
    for(const [p,d] of items){
      const n = (d.md.match(/```mermaid/g)||[]).length;
      h += '<a class="doc" data-p="'+p+'" href="#'+p+'">'+d.t+(n?'<span class="im">◆'+n+'</span>':'')+'</a>';
    }
  }
  document.getElementById('nav').innerHTML = h;
}
function render(path){
  const d = DOCS[path]; if(!d) return;
  let md = d.md;
  const m = md.match(/^#\s+(.+)$/m); const title = m ? m[1] : d.t;
  md = md.replace(/^#\s+.+$/m,'');
  let html = marked.parse(md);
  // relative links resolve against pack.html, not the document — .md loads in-reader, others open normally
  html = html.replace(/href="([^"#][^"]*?)"/g, (full,href) => {
    if(/^(https?:|mailto:|#)/.test(href)) return full;
    const base = path.includes('/') ? path.slice(0, path.lastIndexOf('/')+1) : '';
    let t = href.startsWith('../') || href.startsWith('./') || !base ? href : base+href;
    const parts=[]; for(const s of t.split('/')){ if(s==='..') parts.pop(); else if(s!=='.'&&s!=='') parts.push(s); }
    t = parts.join('/');
    return t.endsWith('.md') && DOCS[t] ? 'href="#'+t+'"' : 'href="'+t+'"';
  });
  let n=0;
  html = html.replace(/<h2>/g, () => '<h2><span class="num">'+String(++n).padStart(2,'0')+'</span>');
  // bold-label paragraphs become callouts
  html = html.replace(/<p><strong>([^<]{2,42}?)[:—]<\/strong>\s*/g, (fu,lab) => {
    const w = /caveat|warn|risk|scope|limit|honest|fatal|open|gap|fail/i.test(lab);
    return '<div class="callout'+(w?' warn':'')+'"><span class="lab">'+lab+'</span><p>';
  });
  html = html.replace(/```mermaid/g,'');
  html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g,
    (fu,src) => '<div class="mermaid">'+src.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"')+'</div>');
  document.getElementById('art').innerHTML =
    '<span class="eyebrow">'+d.g+'</span><div class="path">'+path+'</div><h1>'+title+'</h1>'+html+
    '<p class="hint">Rendered from <code>'+path+'</code> — one of 70 documents in this pack.</p>';
  // section rail
  const hs = [...document.querySelectorAll('#art h2')];
  document.getElementById('rail').innerHTML = hs.length>1
    ? '<div class="rt">On this page</div>'+hs.map((h,i)=>{h.id='s'+i;return '<a href="#s'+i+'">'+h.textContent.replace(/^\d+\s*/,'')+'</a>';}).join('')
    : '';
  document.querySelectorAll('a.doc').forEach(a=>a.classList.toggle('on', a.dataset.p===path));
  try{ mermaid.run({querySelector:'.mermaid'}); }catch(e){}
  window.scrollTo(0,0);
}
function route(){ const p = decodeURIComponent(location.hash.slice(1)) || 'README.md'; render(DOCS[p]?p:'README.md'); }
document.getElementById('q').addEventListener('input', e => buildNav(e.target.value));
window.addEventListener('hashchange', route);
buildNav(''); route();
</script>
