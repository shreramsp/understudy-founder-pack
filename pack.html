rengthen DD3 |\n| 2.5 | Uncertainty-aware abstention | Decline to act when the model's own uncertainty is high | Calibration research; complements envelope enforcement |\n\n## 3 \u00b7 Cross-domain imports (5)\n\n| # | Technique | Mechanism | Source field |\n|---|---|---|---|\n| 3.1 | Clinical-pathway variance analysis | Model how a standard protocol is actually deviated from across institutions | Healthcare ops \u2014 **the closest structural analogue to the variance envelope in any field** |\n| 3.2 | Aviation checklist design | Design procedures for reliable execution under distraction and fatigue | Human factors |\n| 3.3 | Manufacturing SPC | Control-chart methods for detecting process drift | Industrial engineering \u2014 generalises DD6 |\n| 3.4 | Apprenticeship / cognitive task analysis | Elicit expert knowledge that experts cannot articulate unprompted | Knowledge engineering \u2014 the formal version of F2 narration |\n| 3.5 | Legal document versioning and provenance | Track authorship, amendment and derivation of a living text | Records management \u2014 applies directly to skill governance |\n\n## 4 \u00b7 Economics and scale (3)\n\n| # | Technique | Mechanism | Status |\n|---|---|---|---|\n| 4.1 | Model cascade routing | Route each step to the cheapest model that can do it | Standard practice; matters because inference runs on MSP hardware (D05) |\n| 4.2 | Distillation to small local models | Move high-volume typing to a small model at the edge | Feasible; directly reduces the per-node hardware floor |\n| 4.3 | Speculative execution of likely next steps | Pre-compute probable next actions to cut latency | Speculative, and dangerous on mutating paths |\n\n## What wave 3 concedes\n\n**Nothing here rescues the company if DD1 fails.** Row 1.3 (contrastive procedure embedding) is the only entry that would materially attack the core bet, and it is speculative.\n\n**Row 2.3 is the uncomfortable one.** Where a real API exists, using it is faster, cheaper and more stable than driving a UI \u2014 so the long-run value of UI capture is concentrated in the surfaces that *lack* good APIs: native admin tools, terminals, legacy consoles. That is a real limit on the mechanism, it argues the product should prefer APIs wherever they exist rather than defend UI automation on principle, and it is better stated here than discovered by an investor.\n\n**Recommended next:** none of this is fundable yet. Wave 3 exists so that `financials/use_of_funds.md` can name what research money would buy *after* DD1 returns a positive result \u2014 and so the pack does not pretend a research pipeline is a product roadmap.\n"}, "narrative/founder_story.md": {"g": "Narrative", "t": "Founder story", "md": "# Founder story\n\n> **What this is** \u2014 the founder-market-fit narrative in first person, usable verbatim in applications, warm intros and the site's about page.\n> **Why it exists** \u2014 the pack's honest position is that the founder has deep AI/agents engineering background and **no managed-services operating history** (A6). A founder story that obscured that would be discovered in the first reference call; one that states it and shows what is being done about it is a stronger artifact than a manufactured origin.\n> **How to read it** \u2014 the third section is the one an investor is actually testing. A skeptic should ask whether the gap named there is genuinely being closed or merely acknowledged.\n> **Depends on / feeds** \u2014 inherits [../BRIEF.md](../BRIEF.md) \u00a7Founder edge and assumption A6; feeds [one_pager.md](one_pager.md), [pitch_deck.md](pitch_deck.md) slide 13, `startup-website`.\n\n---\n\n## Why this problem\n\nI kept meeting the same failure from the other side of it.\n\nAgents got genuinely good at doing multi-step work in real interfaces over the last eighteen months \u2014 not perfect, but past a threshold that did not exist in 2023. And every time I looked at where that capability was being pointed, it was pointed at *execution*: better resolution, better deflection, better throughput. Meanwhile the thing actually stopping deployment was that somebody still had to sit down and tell the system what the environment was.\n\nThat is a strange place for the industry's attention to be. The hard part was never the doing. It was the knowing.\n\n## What I know that most people working on this do not\n\n**The clustering problem is the company, and it is not an LLM problem.**\n\n*What is checkable about that claim, since a reference call needs something concrete: the evaluation harness design in `validation/experiment_board.md` E1 \u2014 unit of analysis, \u226530 scored pairs, a pre-registered dissimilarity metric, Wilson intervals, a held-out environment reserved from method selection \u2014 is the artifact I would point a technical reference at. It is the part of this I have actually built before, and it is deliberately the first thing this company builds.*\n\nThe instinct \u2014 mine included, at first \u2014 is to hand a pile of recordings to a frontier model and ask it to produce a procedure. That works well enough to demo and badly enough to be unfalsifiable: when it fails you cannot tell whether the representation was wrong, the alignment was wrong, or the model simply had a bad day.\n\nSo the design does the opposite. Actions are typed into a semantic representation; clustering runs on classical sequence alignment and profile HMMs \u2014 methods that are decades old, deterministic and debuggable. The model is used where it is genuinely better than an algorithm: understanding what a click *meant*, and synthesising readable prose. **That choice makes the core bet falsifiable, which is worth more to me than making it look impressive.**\n\nThe second thing: what accumulates is not the procedure. Any competent engineer can write the Entra MFA re-enrolment procedure from Microsoft's own documentation. What nobody has written down is how that procedure *differs* across forty real tenants \u2014 which conditional access policy blocks it where, what the failure looks like, how an engineer confirms it actually worked. That distribution is the asset, and it exists only where someone watched.\n\n## The gap, and what I am doing about it\n\n**I have not run a managed services business.** I have not felt the specific pain of onboarding a client at 2am because the contract starts Monday, and I am not going to pretend otherwise in a room with someone who has.\n\nThat gap is real and it is the reason the plan starts with ten conversations and no product pitch, why the first hire is an MSP-side operator rather than an engineer, and why design partners **will be asked** for their timesheets rather than their enthusiasm. None is signed yet, and the memo says so. The mechanism is my ground. The market is not yet, and the fastest way to make it so is to be corrected early and often by people who live in it.\n\nI would rather present a pack whose weakest assumption is labelled than one whose weakest assumption is load-bearing and hidden.\n\n## Why I will still be here in ten years\n\nBecause the honest version of this problem is a long one. The literature has been circling *learning a procedure by watching someone perform it* for forty years and has not closed it; task mining industrialised the watching and stopped at a document; RPA industrialised the doing and stopped at a script that breaks. The piece that was missing arrived recently enough that almost nobody has built on it yet.\n\nIf the transfer result comes back negative, I will publish that too. It is the most useful thing I could contribute to a field that has been assuming this works for four decades without measuring it.\n"}, "narrative/future_press.md": {"g": "Narrative", "t": "Working-backwards press release \u2014 dated March 2032", "md": "# Working-backwards press release \u2014 dated March 2032\n\n> **What this is** \u2014 the Amazon-style press release written as if the company had succeeded, dated roughly six years out, plus the timeline that would have to have happened.\n> **Why it exists** \u2014 it forces the vision to be specific enough to be wrong. A vision that cannot be falsified in retrospect is decoration; this one names the metric, the year, and the things that did *not* happen.\n> **How to read it** \u2014 read the \"what did not happen\" section against the rest of the pack. A skeptic should check that nothing here contradicts the claim boundary (D1) or the honest limits in `tech/whitepaper.md` \u00a74.\n> **Depends on / feeds** \u2014 arranges [mission_vision.md](mission_vision.md), [../strategy/market_sizing.md](../strategy/market_sizing.md), [../tech/whitepaper.md](../tech/whitepaper.md); feeds `startup-website`.\n\n---\n\n**FOR IMMEDIATE RELEASE \u2014 14 March 2032**\n\n## Understudy passes 100,000 client environments onboarded by observation, and publishes six years of transfer data\n\n**Chicago \u2014** Understudy today announced that its skill libraries now cover more than 100,000 managed client environments across 2,400 MSPs, and released the full six-year record of its cross-environment transfer measurements \u2014 including the two years the numbers were bad.\n\n**Time-to-first-verified-skill** \u2014 the metric Understudy proposed in 2026 when no benchmark for autonomous IT resolution existed \u2014 is now reported by four vendors in the category and cited in MSP procurement templates. The company's own median is **9 engineer-hours per environment** \u2014 against the 18\u201328 it projected for environment 2 in 2026, and the 25\u201340 that onboarding a median client cost before any of this existed. **Time-to-first-verified-skill**, the metric the industry actually adopted, runs at a median of **3 days**, against 8 in the first pilot. *(The two are different metrics in different units, and the 2026 pack was careful about that; an earlier draft of this release conflated them.)*\n\n\"The number that changed our business wasn't the resolution rate,\" said **Marcus Whelan**, who runs a 34-person MSP in Ohio and was Understudy's fourth paying customer. \"It was that client forty-one onboarded faster than client twelve. I stopped hiring ahead of growth. I take clients now that I'd have turned down in 2027, and I turned down two that year.\"\n\nFor engineers, the change was less about volume than about what stopped being asked of them. \"I spent nineteen years being the person who remembered how each client's directory was wired,\" said **Ray Kowalczyk**, a principal engineer at the same firm. \"The part I actually resented was being interrupted for things I'd explained before. That mostly stopped. What reaches me now is genuinely new, which is the job I wanted.\"\n\n**The threshold bound, which is the point of having one.** In 2027 the first result came in below it, and the company did what it said it would: narrowed the claim, repriced, and did not reinstate the stronger version until a second measurement in fresh environments. **A threshold that is missed and then method-shopped to a pass in two quarters is not a threshold**, and the earlier draft of this release showed exactly that \u2014 which would have told any reader that the pre-commitment in the 2026 deck was decoration.\n\n**What we got wrong that we did not predict.** The 2026 materials named a long list of limits and every one of them held \u2014 which, read back, is its own kind of warning: a forecast whose only errors were pre-announced is an advertisement for the pre-announcement. **The thing we did not see coming was the node.** Putting distillation inside each MSP's tenant was the right call for the privacy guarantee and it cost roughly eighteen months of operational drag nobody modelled: version skew across customer-controlled infrastructure, patch windows we did not control, and an on-call obligation that landed on one person from the first deployment. Two design partners left in 2028 over node reliability, not over the product. The 2026 pack rated that risk \"medium\" and it was the second-most expensive thing about the decade.\n\n**What did not happen, and the company says so.** Understudy does not run unattended. Every mutating action is still gated or supervised, six years and 100,000 environments later \u2014 the same claim boundary the company published in its first investor materials in 2026, when long-horizon agent completion was 20.6%. It has improved considerably since; it has not improved enough to change the position.\n\nThe company also confirmed that a **material share of the ticket volume it once expected to address is now handled through vendor APIs rather than by observing a UI** `(no figure is given: the 2026 pack had no basis for one, and inventing a precise number for a press release is exactly what its own quality bar forbids)` \u2014 a limit it named publicly in 2026 and has watched grow. \"We said at the start that where a real API exists, we're the wrong tool,\" a spokesperson said. \"That surface has shrunk every year, exactly as we predicted, and it's why we build for the places APIs don't reach.\"\n\n---\n\n## How we got here\n\n| | |\n|---|---|\n| **2026** | Pre-seed. One question: do skills synthesized in one environment execute correctly in another? The falsifying threshold \u2014 70% on a held-out set \u2014 is declared before the harness is built. |\n| **2027 Q1** | First transfer result: **64%.** Below the 70% threshold. Published anyway \u2014 and **the pre-declared rule fired rather than being overridden**: P2 required the claim to narrow to *assisted* onboarding rather than automated, and the fee to be repriced against the runbook rather than the hours. Both happened, and both cost revenue. |\n| **2027 Q2\u2013Q4** | Three quarters on the narrowed claim, at the lower price. Partial-order alignment eventually reaches 78%, but **the automated claim is not reinstated until Q1 2028**, on a second measurement in six fresh environments. The recovery cost a year. |\n| **2027 Q4** | First paid MSP. Environment 1 costs more than baseline, as promised. Environment 2 is where the customer sees it. |\n| **2028** | Third MSP customer clears the m\u22653 threshold; the global layer starts contributing for the first time. Cold start took two years, which is what the corrected threshold implied it would. |\n| **2029** | An agent action at a client is reverted by a human and disclosed the same day. The incident-disclosure practice \u2014 built in 2026 before there was anything to disclose \u2014 is the reason the account is retained. |\n| **2030** | RMM/PSA marketplace listing, four years after the first partner conversation. SOC 2 Type II two years earlier. |\n| **2031** | First MSP-side co-founder hire becomes COO. The gap named in the 2026 founder story closes six years after it was named. |\n| **2032** | 100,000 environments. Transfer data published in full, including 2027. |\n\n---\n\n## What this vision is deliberately not\n\n- **Not autonomy.** Six years on, still supervised. If that changes it will be because the evidence changed, not because the marketing did.\n- **Not a category-defining exit, and not an adjacent market either.** The 2026 pack put SAM at ~$179M for the MSP wedge. **This release stays inside that wedge** \u2014 100,000 environments across 2,400 MSPs is ~41.7 environments each, exactly the model's own figure, and ~20% of the serviceable band. An earlier draft claimed the company had grown into an adjacent market; nothing in the release depicts one, and the claim is withdrawn rather than illustrated.\n- **Not a story where the founder was right about everything.** The first transfer result was below threshold. The clustering method had to change. The privacy threshold had to be recounted. Those are in the timeline because a vision that omits them is not a forecast, it is an advertisement.\n"}, "narrative/mission_vision.md": {"g": "Narrative", "t": "Mission, vision, values", "md": "# Mission, vision, values\n\n> **What this is** \u2014 what the company does and for whom (true today), the world if it succeeds, the trade-offs it will actually make, and why it exists at all.\n> **Why it exists** \u2014 positioning is defined against competitors and changes when they do; mission is independent of them and survives their disappearance. This file is what remains if Ravenna, Atomicwork and ServiceNow all vanished tomorrow.\n> **How to read it** \u2014 the values are the operative section, because each is stated as a trade-off with a cost rather than as a virtue. A skeptic should test whether each one would ever actually bind.\n> **Depends on / feeds** \u2014 independent of [../strategy/positioning.md](../strategy/positioning.md) by design; feeds [founder_story.md](founder_story.md), `startup-website` (about page).\n\n## Mission \u2014 true today\n\n**Make the knowledge of how to run an IT environment something a business owns, rather than something three people happen to remember.**\n\n## Vision \u2014 ten years out\n\nEnvironment knowledge stops being tacit. An MSP takes on a client and the desk already knows how that client's stack behaves, because it watched someone competent do the work once and kept the parts that mattered. **MSPs run many more clients per engineer**, not because engineers were replaced but because nobody re-derives what a colleague already worked out.\n\nThe broader shift, if it holds: software that learns its environment by observation becomes the default expectation rather than a differentiating feature \u2014 the way that \"it integrates with your identity provider\" stopped being a selling point and became table stakes.\n\n## Values \u2014 each stated as a trade-off we will actually make\n\n**1. The person being recorded gets the credit.**\n*The trade-off:* attribution, correction rights and rejection-without-justification are engineering cost, and they slow the library down \u2014 an engineer can veto a skill we believe is correct, and we will lose that argument. We pay it because a capture programme that feels like surveillance degrades quietly, and no dashboard shows it happening.\n\n**2. State the limit before someone finds it.**\n*The trade-off:* our own deck says the first environment costs more than doing nothing, that where a real API exists we are the wrong tool, and that we have no traction. Each of those costs us a percentage of readers. We pay it because the alternative is a design partner's timesheet contradicting our invoice, which costs us the reference.\n\n**3. Build the measurement before the thing being measured.**\n*The trade-off:* the evaluation harness ships before the clusterer, which looks like a quarter spent on something undemoable. We pay it because a system with no benchmark grades its own homework, and this one has no benchmark to inherit.\n\n**4. Refuse the action rather than guess it.**\n*The trade-off:* escalating when a situation leaves the envelope means a lower automation rate and a worse-looking number. We pay it because IT actions are frequently irreversible, and a confident wrong action costs more trust than ten honest refusals.\n\n**5. Do not claim the autonomy we cannot evidence.**\n*The trade-off:* the category's excitement is about unattended resolution, and declining to promise it means being less exciting than competitors on the axis buyers currently ask about. We pay it because long-horizon completion is 20.6% and the gap between demo and production is where this category will lose its credibility.\n\n## Why we exist\n\nBecause the most valuable thing in a managed-services business walks out of the building every evening, and occasionally does not come back. Everything else \u2014 the tooling, the tickets, the documentation nobody keeps current \u2014 is an attempt to write that down, and it fails for a structural reason: **writing it down is a separate act from doing it, so it competes with billable work and loses.**\n\nUnderstudy exists because the two acts can now be the same act.\n\n**The vision written as if it had happened** \u2014 dated 2032, with a \"what did not happen\" section and a timeline whose 2027 entry is the transfer result coming back *below* threshold \u2014 is in [future_press.md](future_press.md).\n"}, "narrative/one_pager.md": {"g": "Narrative", "t": "Understudy \u2014 one page", "md": "# Understudy \u2014 one page\n\n> **What this is** \u2014 the single page an investor or design partner reads first: problem, mechanism, why now, evidence, market, team, ask.\n> **Why it exists** \u2014 every longer artifact in this pack assumes a reader who already wants to know more. This is the page that decides whether they do. It also carries the pack's two binding honesty constraints (D8, D10) rather than deferring them to a memo nobody reaches.\n> **How to read it** \u2014 every sentence is load-bearing; nothing here is unsupported by an artifact elsewhere in the pack. A skeptic should attack \"Evidence\", which is the shortest section because the company is pre-build.\n> **Depends on / feeds** \u2014 arranges [../strategy/positioning.md](../strategy/positioning.md), [../research/](../research/), [../tech/whitepaper.md](../tech/whitepaper.md), [../strategy/market_sizing.md](../strategy/market_sizing.md); feeds [pitch_deck.md](pitch_deck.md), `startup-website`.\n\n**Understudy is the AI service desk that learns each client environment by watching engineers work.** For MSPs, where onboarding a new client is recurring cost of goods rather than a one-time project.\n\n---\n\n**The problem.** Every AI service desk can resolve a ticket. None can learn an unfamiliar environment without being configured by hand. For an MSP that configuration is not a setup cost \u2014 it is cost of goods, paid again for every client. Onboarding a median client runs **25\u201340 engineer-hours** before a ticket is billed `(assumption \u2014 [S21] records 40\u201380 for the typical-to-complex band; the median figure is ours and unsourced)`, and **26% of MSPs say they cannot staff the clients they could otherwise win** [S33]. The knowledge that would make automation work is performed daily and captured nowhere.\n\n**Why nobody has closed this.** The market split the problem in half. Discovery tools \u2014 task mining, FortressIQ, UiPath \u2014 **record work and emit a diagram a human must implement**. Resolution tools \u2014 Ravenna, Atomicwork, Moveworks \u2014 **execute, but must be told how**. Both halves are mature. The handoff between them is manual, and that is where the hours go. It stayed open for a structural reason: until agents could act on a real UI, a recording had nowhere to go but someone's to-do list. FortressIQ was recording employees with computer vision in 2017 and was acquired into an RPA vendor in December 2021 \u2014 right input, wrong decade.\n\n**The mechanism.** Record engineers working (screen, actions, spoken reasoning at decision points). Cluster the recordings into a readable `SKILL.md` library, each skill carrying a **goal-state success criterion**. Rehearse in shadow against live tickets. Execute under approval gates, verifying every action against its criterion. **Supervised throughout \u2014 never unattended.**\n\n**Why now.** Computer-use agents moved from 12% to ~86% on OSWorld between April 2024 and September 2026 [S14][S15], and `SKILL.md` became an open cross-vendor standard adopted by 26+ platforms [S24]. A recorded procedure now has both an executor and a portable place to live. Neither existed in 2019.\n\n**Why it is not RPA \u2014 stated narrowly, because the broad version is falsifiable.** RPA can assert on **world state** \u2014 create an AD object, then query AD to confirm it \u2014 and **Unified Target already recovers** from broken selectors through fuzzy, anchor, image and OCR fallbacks. The difference is narrower and it survives: **the goal is not carried in the RPA artifact in a form the runtime can re-plan against**, so recovery is confined to fallbacks a developer enumerated in advance. A skill carries the goal as a predicate the runtime holds at execution time, so it can search a space nobody anticipated. Tested in `validation/experiment_board.md` E2 against a **Unified-Target-equivalent baseline with fuzzy, anchor and image fallbacks enabled**, built by a contracted certified practitioner and published for replication \u2014 because a baseline with its fallbacks off would prove nothing.\n\n**Evidence.** Pre-build, and the pack says so. What exists: the mechanism is validated at user-study scale in the literature (ALLOY, arXiv 2510.10049), the enabling capability is measured [S14][S16], and the market pain is sourced [S21][S33]. **What does not exist: any pilot, any customer, any measured result.** Every operating figure in this pack is a declared target, not a measurement.\n\n**What we are actually selling on the ticket half \u2014 and it is not savings.** The tickets we automate are the cheapest quartile of an MSP's queue by construction: password and MFA resets, mailbox permissions, provisioning, printer queues, RMM-alert remediation with documented fixes. A junior technician clears those at `(assumption: $2\u20136 each)`. **At $6 per resolved ticket we are at or above their marginal cost.** What we sell is not a cheaper ticket \u2014 it is **throughput at a capacity ceiling**: 26% of MSPs say they cannot staff the clients they could otherwise win [S33], and the alternative to us is a hire they have already failed to make. We would rather state that than have a buyer work it out from their own numbers.\n\n**What we deliberately do not claim.**\n- **Not unattended autonomy.** Long-horizon agent completion is 20.6% [S16]; supervision is architecture, not a phase we remove.\n- **Not faster first onboarding \u2014 it is slower.** Environment 1 costs 31\u201346 hours against a 25\u201340 baseline, because the work is unchanged and review is added. Compression begins at environment 2 (18\u201328 hours). **We waive the fee on environment 1** rather than charge for a loss.\n- **Not a universal mechanism.** Where a real API exists, using it beats driving a UI on speed, cost and stability. The durable value of capture concentrates in surfaces that *lack* good APIs \u2014 native admin consoles, terminals, legacy tooling \u2014 and we would rather name that than have a reviewer find it.\n\n**Market.** ~45,000 US MSPs [S31]; **~12,000 in the serviceable 10\u2013100-employee band `(assumption derived from S31's 70%-under-50-employees figure; S31 defines no such band)`**. **SAM \u2248 $179M/yr** at a two-part tariff (~$6/resolved ticket plus a banded per-environment fee of $400/$1,500/$1,500), against a US managed-services market of $120\u2013140B [S31]. Steady-state ~$14,930/yr per MSP. **This is a wedge, not the whole market** \u2014 internal IT is roughly $288M more and this pack does not claim it, because entering it means competing on resolution quality, the axis we have chosen to avoid.\n\n**Team.** Solo founder, AI/agents engineering background. Founder-market fit is argued on the mechanism \u2014 the clustering-and-synthesis core is the hard bet and it is the founder's ground \u2014 not on managed-services operating history, which is a stated gap (A6).\n\n**The ask. $900k\u20131.2M pre-seed, 18\u201324 months** ($1,060k plan case; $880k reduced-scope defers the first hire and still reaches the measurement).\n\n**What makes the sequencing efficient regardless of what it finds: four of five company-killing assumptions retire for under $10,000 \u2014 pricing basis, channel admissibility, envelope re-identification, ticket mix. None needs code. The fifth is the core mechanism, and it is the company.**\n\n**Three gates before a seed, not one:** E1 cross-environment transfer \u2014 **pass bar ~70% adjudicated-correct across \u226530 scored (skill, environment) pairs; kill line below 50% with the Wilson CI excluding 50%; 50\u201370% is a method problem, not a failure.** And the honest limit: **\u226530 pairs can exclude 50% but cannot separate 70% from 60%**, which is stated here rather than left in the experiment design. Measured and published either way; three paying MSPs through the same channel at a CAC inside the ceiling; and expansion without a sales conversation. The evaluation harness is built before the clusterer, so the answer arrives as evidence rather than as the opinion of the person who built it.\n"}, "narrative/pitch_deck.md": {"g": "Narrative", "t": "Pitch deck \u2014 17 slides", "md": "# Pitch deck \u2014 17 slides\n\n> **What this is** \u2014 the deck as markdown: one section per slide, each title stating the takeaway as a full sentence, a 3\u20135 bullet payload, and a `visual:` line naming the supporting visual.\n> **Why it exists** \u2014 a deck is the pack compressed to fourteen claims. This file is also what seeds `visuals/visual_manifest.md`: every `visual:` line below becomes a manifest row, so the visual layer is derived from what the story needs rather than from what is easy to draw.\n> **How to read it** \u2014 the titles alone should carry the argument; if they do not, the deck has failed. A skeptic should attack the traction slide, where the pack admits it has none, and the two limit slides that give away what most decks hide.\n> **Depends on / feeds** \u2014 arranges [one_pager.md](one_pager.md), [vc_memo.md](vc_memo.md) and the layers beneath them; feeds `visuals/visual_manifest.md`, `startup-website`.\n\n---\n\n### 1 \u00b7 Every AI service desk can resolve a ticket. None can learn where it is.\n- Deployment friction, not resolution capability, is the category's real bottleneck.\n- For an MSP this is not setup cost \u2014 it is cost of goods, paid again for every client.\n- 25\u201340 engineer-hours to onboard a median client, before a ticket is billed [S21].\n- 26% of MSPs say they cannot staff clients they could otherwise win [S33].\n`visual: V01 \u2014 the knowledge cycle: acquire \u2192 decay \u2192 lose \u2192 re-acquire, with hours attached`\n\n### 2 \u00b7 The market split the problem in half and left the join manual.\n- **Discovery tools record work and emit a diagram** a human must implement (UiPath, Celonis, FortressIQ).\n- **Resolution tools execute but must be told how** (Ravenna, Atomicwork, Moveworks).\n- Both halves are mature. The handoff between them is where the hours go.\n`visual: V02 \u2014 the two-axis map: knowledge acquired by configuration vs observation \u00d7 produces artifact vs executes`\n\n### 3 \u00b7 FortressIQ had the right input in 2017 and no executor to send it to.\n- Computer vision over employee work; claimed ~90% reduction in discovery time [S7].\n- Acquired into an RPA vendor, December 2021 [S5].\n- The automation discovery fed was RPA: 30\u201350% of projects fail, maintenance reaches 60% of cost [S10][S11].\n- **Discovery was never the weak link. The executor was.**\n`visual: V03 \u2014 timeline: FortressIQ 2017\u20132021 against the computer-use capability curve 2024\u20132026`\n\n### 4 \u00b7 A recording can now become an executable skill \u2014 and the same benchmark says why we don't claim autonomy.\n- Computer-use agents: 12% (Apr 2024) \u2192 ~86% on OSWorld-Verified (Sep 2026) [S14][S15].\n- **The counterweight, on the same slide: those agents still fail ~80% of real workflows, and long-horizon completion is 20.6%** [S15][S16]. That is the binding constraint on the whole product.\n- `SKILL.md` became an open cross-vendor standard, 26+ platforms [S24].\n- A recorded procedure finally has both an executor and a portable place to live.\n`visual: V04 \u2014 OSWorld capability curve with the SKILL.md standard marked, and the honest ceiling annotated`\n\n### 5 \u00b7 Understudy learns each client environment by watching engineers work.\n- Record: screen, actions, and 10 seconds of spoken reasoning at decision points.\n- Distil: cluster recordings into a readable `SKILL.md` library, inside the MSP's own tenant.\n- Execute: under approval gates, verifying every action against a goal-state criterion.\n- **Supervised throughout. Never unattended.**\n`visual: V05 \u2014 the closed loop: Watch \u2192 Distil \u2192 Rehearse \u2192 Gate \u2192 Act \u2192 Verify \u2192 Learn`\n\n### 6 \u00b7 The demo is a technician resolving a ticket at a client she has never touched.\n- The desk surfaces the procedure *and the two ways this tenant differs*.\n- The difference came from two engineers who hit it months apart. Nobody wrote it down.\n- When the situation leaves the skill's envelope, the agent stops and escalates rather than improvising.\n`visual: V06 \u2014 the ticket-side panel: matched skill, tenant deviations, one gated approval`\n\n### 7 \u00b7 RPA can recover. It just can't re-plan \u2014 the goal isn't in the artifact.\n- RPA asserts on world state, and Unified Target recovers from broken selectors via fuzzy, anchor, image and OCR fallbacks. **Anyone who says otherwise gets corrected in the room.**\n- The narrower difference: **recovery is confined to fallbacks a developer enumerated in advance.**\n- A skill carries the goal as a predicate the runtime holds at execution time \u2014 so it searches a space nobody anticipated.\n- Tested against a **Unified-Target-equivalent baseline with fallbacks enabled**, built by a contracted certified practitioner and published: `validation/` E2.\n`visual: V07 \u2014 contract-vs-goal: the same procedure under a UI change, side by side`\n\n### 8 \u00b7 Each environment makes the next one cheaper \u2014 and one MSP customer brings forty-one.\n- The happy-path procedure is in vendor docs. **That half is copyable and we say so.**\n- What compounds: how procedures *differ* across real tenants, how they fail, how engineers verify them.\n- One MSP customer contributes ~41 environments; one internal-IT customer contributes one.\n- Only abstracted patterns cross the boundary \u2014 raw recordings never leave the MSP's control.\n`visual: V08 \u2014 the variance envelope: one procedure, many tenants, the distribution as the asset`\n\n### 9 \u00b7 ~12,000 US MSPs in the serviceable band, a $179M SAM, and it is a wedge rather than a category.\n- ~45,000 US MSPs [S31]; **~12,000 in the 10\u2013100-employee band `(assumption: derived from S31's \"70% have fewer than 50 employees\" \u2014 S31 defines no such band)`**.\n- Two-part tariff: ~$6/resolved ticket plus a banded per-environment fee ($400/$1,500/$1,500), first environment free. ~$14,930/yr per MSP at steady state.\n- **SAM \u2248 $179M.** Internal IT is ~$288M more and this deck does not claim it.\n- Roughly 73% of three-year revenue is one-time onboarding \u2014 a services shape during land, and we price it as such.\n`visual: V09 \u2014 bottom-up SAM build, arithmetic shown, with the sensitivity band`\n\n### 10 \u00b7 We have no traction, and every number in this deck is a declared target.\n- No pilot, no customer, no measured result, no code.\n- The mechanism is validated at user-study scale in the literature; nothing is validated across environments.\n- Every operating figure carries its source or an `(assumption)` tag.\n- **The one number that matters: do skills from environment A work in environment B?** Pass bar ~70% across \u226530 scored pairs; **kill line below 50%** with the CI excluding it. **\u226530 pairs cannot separate 70% from 60%, and we say so on this slide rather than in a footnote.**\n`visual: V10 \u2014 the evidence ledger: what is sourced, what is assumed, what is unknown`\n\n### 11 \u00b7 The first environment costs more, not less \u2014 and we do not charge for it.\n- Environment 1: 31\u201346 hours against a 25\u201340 baseline. The work is unchanged; review is added.\n- Environment 2: 18\u201328 hours. **Compression begins at the second client, not the first.**\n- So environment 1 is waived. Charging for it would be charging for a loss.\n- **And on the ticket half we are not cheaper either** \u2014 the automatable subset costs an MSP roughly $2\u20136 and we charge $6. What we sell there is **throughput at a capacity ceiling**: 26% cannot staff the clients they could win [S33].\n- A design partner's timesheet should confirm our numbers, not falsify them.\n`visual: V11 \u2014 hours per environment, 1 through 5, against baseline, with the waiver marked`\n\n### 12 \u00b7 The channel is the constraint, not the product \u2014 and its margin is thin.\n- Best economics: MSP buying groups. Primary: peer communities, **$4,000\u20139,000 CAC against a $10,100 ceiling \u2014 3.4:1 at the top end.**\n- **No channel has a comfortable margin.** The plan is viable only if CAC lands at the bottom of its range.\n- **E4 \u2014 two weeks, three phone calls \u2014 establishes whether a vendor founder can join these groups at all.** It is the round's real gate.\n- Marketplace is the only route to 100 customers and it is 18\u201324 months out behind SOC 2.\n`visual: V34 \u2014 six channels against one ceiling, with the primary channel's top end marked`\n\n### 13 \u00b7 Ravenna can add recording. What they can't add is forty-one environments per customer.\n- Adding discovery is a product decision for them, not a business-model conflict. **We say that rather than claim a moat we don't have.**\n- The happy-path skill for Entra or M365 is authorable from vendor docs. **That half is copyable in a quarter.**\n- What compounds is the **variance envelope** \u2014 how procedures differ across real tenants, how they fail, how engineers verify them.\n- **One MSP customer contributes ~41 environments; one internal-IT customer contributes one.** We overtake on density, not speed \u2014 roughly quarters 8\u201310.\n- ServiceNow is structurally inhibited: implementation is 3\u20135\u00d7 its licence revenue [S20].\n`visual: V35 \u2014 environment accumulation: MSP customers vs internal-IT customers over time`\n\n### 14 \u00b7 Where a real API exists, we are the wrong tool \u2014 and that bounds the mechanism.\n- Driving an API beats driving a UI on speed, cost and stability.\n- Capture's durable value concentrates where APIs are poor: native admin consoles, terminals, legacy tooling.\n- As vendors ship better APIs, that surface shrinks.\n- **We prefer APIs wherever they exist rather than defend UI automation on principle.**\n`visual: V12 \u2014 the admin surface map: API-covered vs UI-only, with the addressable slice highlighted`\n\n### 15 \u00b7 The founder's edge is the clustering problem, and the market gap is stated rather than papered over.\n- Solo founder, AI/agents engineering background. The synthesis core is the hard bet and it is the founder's ground.\n- **No managed-services operating history** \u2014 a named gap (A6), to be closed with design partners rather than claimed.\n- First hire is an MSP-side operator, not an engineer.\n`visual: V13 \u2014 founder-market fit: what is covered, what is missing, and how it gets closed`\n\n### 16 \u00b7 $900k\u20131.2M to retire four company-killing assumptions, three of them for under $10k.\n- **Ask: $900k\u20131.2M. Plan case $1,060k. 18\u201324 months.**\n- **Four of five company-killing assumptions retire for under $10,000. The fifth is the company.** That is the whole sequencing argument.\n- B1 discovery + cheap experiments **$5k** \u00b7 B2 build to the harness **$420k** \u00b7 B2b founder comp to month 24 **$175k** \u00b7 B3 E1+E2 **$15k** \u00b7 B4 security **$60k** \u00b7 B5 pilots **$40k** \u00b7 B6 MSP-side hire **$180k**, gated on E1 \u226570% \u00b7 B7 reserve **$165k**, sized to the 55-week midpoint slip.\n- **Reduced-scope case $880k** defers the hire and still reaches the measurement.\n`visual: V14 \u2014 use of funds against dollars-per-assumption-retired`\n\n### 17 \u00b7 What this round has to prove before the next one, stated as three gates not one.\n- **E1 \u226570%** \u2014 cross-environment transfer measured, published, honest either way.\n- **3 paying MSPs through the same channel motion**, at a CAC inside the ~$10,100 ceiling.\n- **Expansion without a sales conversation** \u2014 environment 2 onward at \u22646 weeks review cycle.\n- The earlier version of this deck promised only the first. **A round that reaches one of three gates does not reach a seed**, and saying so is cheaper than discovering it at month 18.\n`visual: V15 \u2014 the three seed gates, with what each costs to reach`\n\n---\n\n## What this deck deliberately does not do\n\n- **No autonomy slide.** Excluded by the claim boundary (D1), not withheld for modesty.\n- **No logo wall, no testimonials, no invented metrics.** There are no customers.\n- **No cost-savings claim on the ticket half.** We are at or above the buyer's marginal cost there, and the hours slide says so (D18).\n- **No blended 10\u00d7 claim, and no maintenance multiplier either.** The whitepaper locates the leverage precisely: **~1.4\u00d7 on repeat-environment onboarding, 0.8\u00d7 \u2014 worse \u2014 on the first, and three effects that are not multipliers at all.** The maintenance-line multiplier was withdrawn when its baseline turned out to be hours nobody actually spends.\n- **No slide titled \"Market\" or \"Team\".** Titles are claims; a label is a wasted slide.\n\n**Recommended next 3:** (1) build V07 first \u2014 the contract-vs-goal visual carries the argument that converts technical evaluators; (2) treat the traction, hours and API-limit slides as non-negotiable \u2014 but note the limits are now **three slides, not four**, with the fourth replaced by the channel and incumbent-response beats the contract's arc requires and the earlier version omitted; (3) seed `visuals/visual_manifest.md` directly from the 14 `visual:` lines above.\n"}, "narrative/vc_memo.md": {"g": "Narrative", "t": "Investor memo \u2014 Understudy", "md": "# Investor memo \u2014 Understudy\n\n> **What this is** \u2014 the technical investor memo: thesis, why existing approaches are structurally insufficient, the architecture, concrete operating examples, why this can win, and honest risks.\n> **Why it exists** \u2014 a deck compresses; this is where a technical investor checks whether the compression hid anything. It is written to be read adversarially, which is why the risks section is the longest and the traction section is one paragraph admitting there is none.\n> **How to read it** \u2014 \u00a76 first if you are deciding; \u00a72 first if you are curious. A skeptic should attack \u00a75, the recombination argument, which is where a pack of this kind usually overreaches.\n> **Depends on / feeds** \u2014 arranges [../research/](../research/), [../strategy/](../strategy/), [../product/](../product/), [../tech/](../tech/); no number here originates in this file. Feeds [pitch_deck.md](pitch_deck.md), `financials/comps_exits.md`.\n\n## 1 \u00b7 Thesis\n\nEveryone building AI service desks is competing on resolution quality. That is the wrong axis: resolution is nearly commoditised, and the binding constraint on deployment is that the system must be **told** what the environment is. For an MSP with 41 client environments, that telling costs 25\u201340 engineer-hours per client [S21] and recurs forever.\n\nUnderstudy acquires environment knowledge by **observation** rather than configuration. The claim is not that it resolves tickets better. It is that it **arrives already knowing**, and that each environment it learns makes the next one cheaper \u2014 which turns a per-client cost into a compounding asset.\n\nThe bet is one research problem: whether recorded sessions cluster into skills that transfer between environments. Everything else is engineering.\n\n## 2 \u00b7 Why existing approaches are structurally insufficient\n\n**Task mining and process discovery** \u2014 UiPath, Celonis, and FortressIQ before its acquisition. These record employee work at enterprise scale and it works: FortressIQ claimed ~90% reduction in discovery time [S7]. **Their output is a document.** A human then builds the automation, and the automation they built was RPA, whose measured record is 30\u201350% of projects failing to meet expectations with maintenance reaching **60% of total implementation cost** [S10][S11]. Discovery was never the weak link; the executor was.\n\n**AI-native service desks** \u2014 Ravenna ($15M, Apr 2025), Atomicwork ($25M Series A, Jan 2025), Aisera ($164.5M), Espressive ($53M) [S2][S12][S13]. Genuinely agentic execution, and the right instinct about the mid-market. **But the environment is still described to them** \u2014 a visual workflow builder is configuration with a better surface, and it requires the knowledge to already be explicit in someone's head. Their resolution claims (35\u201360% deflection, \u221270% ticket volume) are vendor-published and independently unverified; no third-party benchmark of autonomous IT resolution exists.\n\n**ServiceNow** \u2014 ~$160B, and it bought Moveworks for **$2.85B** in the category's defining transaction [S26]. It cannot attack this problem without attacking itself: implementation runs **3\u20135\u00d7 the annual licence** [S20]. Self-onboarding cannibalises the services revenue that is the larger half of the deal. Its own lead investor in this space describes the platform as \"completely inappropriate\" below enterprise [S3].\n\n**Agentic browsers** \u2014 Strawberry ($6M, Oct 2025) [S25] learns workflows by use and executes directly. Browser-only, and most IT administration is not in a browser.\n\n**The structural reading:** three of four quadrants of the market are crowded. The fourth \u2014 *knowledge acquired by observation, executed directly* \u2014 was empty because acting on an observed procedure required an executor that could work a real UI. That arrived within the last eighteen months.\n\n## 3 \u00b7 Architecture\n\nSix components, in the order they run. Full diagrams in [../tech/architecture/](../tech/architecture/).\n\n1. **Capture** \u2014 screen, input and application context across RMM consoles, AD, terminals and MDM, with credentials dropped at capture before storage, and 10-second narration prompts at detected branch points. Narration is the direct attack on the problem that sank fifty years of programming-by-demonstration: a demonstration underdetermines intent.\n2. **Stage-1 distillation, inside the MSP's own tenant** \u2014 clustering across that MSP's 41 environments using sequence alignment over typed actions, not an LLM. Deterministic and inspectable, so the core bet is falsifiable.\n3. **Skill synthesis** \u2014 emits `SKILL.md` with a **goal-state success criterion**. A skill for which no independently checkable criterion can be derived is rejected rather than shipped.\n4. **Envelope abstraction** \u2014 the only artifact that reaches us: `{procedure_shape, precondition_pattern, deviation_class, observation_count}`, whitelist-constructed, released only once a pattern is observed in **\u22653 distinct MSPs \u2014 not tenants.** A tenant threshold is re-identifiable inside one customer's book: an MSP brings ~41 tenants, so three observations could sit entirely within one design partner and identify them with certainty. Raw recordings never leave the MSP's control.\n5. **Governed execution** \u2014 action classified by blast radius; destructive always gated, non-negotiably; every action under the agent's own directory principal so the client's audit log attributes it without our help.\n6. **Verify and re-ground** \u2014 every action checked against its criterion; a changed interface triggers a bounded, read-only search against the intact goal, and any re-grounded run is demoted to gated so a human sees it.\n\n## 4 \u00b7 Concrete operating examples\n\n**A ticket at a client the technician has never touched.** MFA re-enrolment at a 22-person client. The desk surfaces the procedure *and the two ways this tenant differs* \u2014 including that a Conditional Access policy requiring **multifactor authentication for the \"Register security information\" user action** blocks a user who has lost their only factor \u2014 the MFA-bootstrap deadlock \u2014 which two engineers previously resolved with a **Temporary Access Pass** rather than by weakening the policy. Nobody told her that. Two engineers hit it months apart and the system kept what they did. When the situation then leaves the skill's envelope, the agent stops and escalates rather than improvising.\n\n**An incident, because they happen.** A gated skill correctly removes a mailbox forwarding rule that turns out to be a deliberate executive exception documented nowhere. Verification passed \u2014 **the system was not wrong about what it did, only about whether to do it, and no success criterion catches that.** It was reverted in 40 seconds because the undo path was recorded before the mutation; the client's IT owner was told the same day; the ticket was not billed, because a resolution a human reverses within the ticket's life does not bill. **This class of error is not eliminable, only survivable**, and a memo claiming otherwise would be lying.\n\n## 5 \u00b7 Why this can win\n\n**The recombination.** Capture that keeps failures, feeding clustering that keeps variance, producing skills that declare success, which makes verification possible, which makes re-grounding possible, which makes deviations widen the envelope. Every component exists somewhere. **No one has the circuit**, and breaking any link degrades it to something that already exists.\n\n**The moat, stated narrowly enough to survive.** The happy-path procedure for Entra or M365 is authorable from vendor documentation \u2014 **that half of the library is copyable in a quarter, and we say so.** What is not copyable is the observed distribution of how those procedures differ across dozens of real tenants, how they fail, and how engineers verify them. Vendors document the intended path, not the forty ways a real tenant deviates from it. That accrues only from deployments \u2014 and one MSP customer contributes 41 environments where an internal-IT customer contributes one. **It remains an assumption (A8), not a finding.**\n\n**Why not Ravenna in a quarter.** They can add recording; it is a product decision, not a business-model conflict. What they cannot compress is environment coverage, and their customer shape yields one environment each. On our own corrected schedule a funded incumbent is **ahead on raw environment count today** \u2014 we overtake on density, not on speed, at roughly quarters 8\u201310.\n\n## 6 \u00b7 Honest risks\n\n*The full twelve-row matrix with likelihoods, leading indicators and residual levels is in [../financials/risk_matrix.md](../financials/risk_matrix.md). Five below; four residuals there stay **high** and one has no mitigation at all.*\n\n1. **The core mechanism is unevidenced.** Cross-session clustering into reliable skills has no benchmark and no named prior system. ALLOY demonstrates the adjacent claim at user-study scale; nothing demonstrates it across environments. **A negative result is possible and there is no partial credit.** *Mitigation: the evaluation harness is built before the clusterer, and the decision rule is declared in advance \u2014 **pass bar ~70% adjudicated-correct across \u226530 scored (skill, environment) pairs; kill line below 50% with the Wilson CI excluding 50%; 50\u201370% is a method problem, not a failure.** And the honest limit: **\u226530 pairs can exclude 50% but cannot separate 70% from 60%**, which is stated here rather than left in the experiment design.*\n2. **Where a real API exists, we are the wrong tool.** Driving an API beats driving a UI on speed, cost and stability. The durable value of capture concentrates in surfaces that lack good APIs \u2014 native admin consoles, terminals, legacy tooling \u2014 and as vendors ship better APIs that surface shrinks. *Mitigation: prefer APIs wherever they exist rather than defend UI automation on principle. This is a real limit on the mechanism and we would rather state it than have it found.*\n3. **The market is a wedge, not a category.** SAM is ~$179M at current pricing, after a banding correction that cut it from $215M.\n\n   **And the obvious escape route is weaker than it looks.** An earlier version of this memo argued we could capture more of the labour value we displace, anchored on $6 being \"about a quarter of the $22.50 blended cost per ticket\". **That anchor is retired** \u2014 $22.50 is an internal-IT figure blended across the whole queue including the escalations we do not touch, and the automatable subset plausibly costs an MSP `(assumption: $2\u20136)`. **There is little headroom to capture**, which is the same finding \u00a76b states from the other direction.\n\n   That leaves the internal-IT expansion, which is a fight on an axis we have chosen to avoid. *Mitigation: none yet. This is the honest ceiling.*\n4. **Adoption fails from inside, quietly.** The expert whose cooperation capture requires is the one best equipped to reject it \u2014 **disuse**, in the human-factors taxonomy [S36], is a documented failure mode. It looks like slow adoption and no dashboard shows it. *Mitigation: attribution, correction rights and rejection without justification, designed in rather than messaged.*\n5. **Schedule.** ~40-week build floor for a solo founder; first paid pilot at month 12 **only if every item lands at its optimistic bound**. *Mitigation: none. It is the single point of failure and it is named.*\n\n## 6b \u00b7 What the ticket half actually sells\n\n**This is stated here rather than left for a buyer to derive, because it is derivable in one conversation.**\n\nOur per-ticket price is $6. The tickets we address are the cheapest quartile of an MSP queue by construction, and a junior technician clears them at `(assumption: $2\u20136 each)` \u2014 a figure `validation/experiment_board.md` E8 exists to establish. **So on the ticket half we are plausibly at or above the customer's own marginal cost, and the savings argument is not available.**\n\nThe argument that *is* available is capacity. An MSP at its staffing ceiling cannot convert marginal cost into marginal output \u2014 **26% of them report being unable to staff clients they could otherwise win** [S33], and the alternative to us is a hire they have already failed to make. What we sell on that half is throughput and coverage at the ceiling, not a cheaper unit.\n\n**Three consequences we accept rather than argue around:**\n1. The per-ticket line will not survive a buyer who has spare capacity. Those are not our customers.\n2. It caps price capture: `financials/comps_exits.md`'s \"capture more of the labour value\" path is weaker than it first appears, because the labour value on this subset is small.\n3. **The onboarding half carries the economics**, and its own basis is unresolved \u2014 the fee is priced above the hours it displaces at every band, and E3 is reframed to test whether the library has value independent of hours at all (D17).\n\n## 7 \u00b7 Traction\n\n**There is none.** No pilot, no customer, no measured result, no code. Design partners are not yet signed. Every operating figure in this pack is a declared target with its source or `(assumption)` tag attached, and the artifacts state where the numbers would be falsified. **A memo that manufactured traction here would be the strongest evidence against everything else in it.**\n"}, "validation/decision_making_unit.md": {"g": "Validation", "t": "Decision-making unit \u2014 who can say no", "md": "# Decision-making unit \u2014 who can say no\n\n> **What this is** \u2014 the buying unit: user, payer, champion, saboteur, and everyone holding a veto, with what each wants, fears, is moved by, and kills deals with.\n> **Why it exists** \u2014 [../strategy/personas.md](../strategy/personas.md) covers who *benefits*. This covers who can *stop it*, which is what actually stalls deals \u2014 and for this product two of the vetoes are unusual: they sit below the buyer and outside the company.\n> **How to read it** \u2014 the two non-obvious rows are Ray and Sonia. A skeptic should check that each veto has a named artifact that addresses it, not just an acknowledgement.\n> **Depends on / feeds** \u2014 inherits [../strategy/sales_roadmap.md](../strategy/sales_roadmap.md), personas; feeds [get_keep_grow.md](get_keep_grow.md), `narrative/one_pager.md`.\n\n| Role | Who | Wants | Fears | Moved by | Kills the deal with | Artifact that addresses them |\n|---|---|---|---|---|---|---|\n| **Payer** | Marcus \u2014 MSP owner/COO | Take clients he can't staff; protect margin on new logos | Buying a science project; his engineers' knowledge becoming someone else's asset | His own hours arithmetic, in his own numbers | \"Not this quarter\" | The engineer-hours ROI calculator (low-fi MVP) |\n| **Champion** | Dana \u2014 service delivery manager | A runbook that stays true; fewer escalations | Her team not using it, and it becoming her problem | Deviation review that takes 40 minutes a month, not eight hours | \"My team won't use it\" | The environment dashboard (UX1) and the deviation queue (UX8) |\n| **User** | Priya \u2014 tier-1 | To not be the newest person in the room at every client | Being trained out of a job | Client-specific procedure where there was a generic runbook | Nothing directly \u2014 but her non-use is invisible | Attribution, and the escalation path staying hers |\n| **Saboteur / veto from below** | Ray \u2014 principal engineer | Fewer repeat interruptions; not to clean up after a third failed automation | A black box acting wrongly in production with his name on it | Reading a skill built from his own session and finding it right; **E2 against a fair baseline** | One credible \"this is RPA again\" in the team channel \u2014 and quiet non-cooperation with capture, which no dashboard shows | Readable `SKILL.md`, rejection without justification (UX6), the E2 result |\n| **External veto** | Sonia \u2014 client-side IT director, **one per client environment** | To know what leaves her environment | Recordings of her admins somewhere she can't see | The two-stage boundary stated precisely: her recordings stay in her MSP's control, nothing identifying her tenant reaches the vendor | A security review that never ends | The tenant-isolation document, the boundary attestation (UX10), and \u2014 when it exists \u2014 **X25's adversarial result** |\n| **Silent veto** | The MSP's own insurer / compliance advisor | Defensible risk posture | An AI principal with write access to client tenants | Destructive-action gating that is not configurable off; agent identity in the client's own audit log | An exclusion or a premium loading | Action-class policy (X5), audit export (X21) |\n\n## The three things this table says that the persona cards do not\n\n**1. Two vetoes sit outside the reporting line, and both concern the recording rather than the product.** Ray is below the buyer; Sonia is outside the company entirely and there are ~41 of her per customer. **A deal signed by Marcus can fail three times over**, and the failures look nothing alike: Ray's is silent, Sonia's is a stalled review, the insurer's is a clause.\n\n**2. Ray's veto has no detector.** Every other row fails loudly. Ray's failure mode is *disuse* [S36] \u2014 he stops narrating, pauses capture more, and the library quietly learns only the easy procedures. It presents as slow adoption. **E6 exists solely to instrument this**, and it is the only reason a capture-rate metric is worth collecting.\n\n**3. Sonia recurs, which makes her a throughput constraint rather than a gate.** One review per environment at ~6 weeks means expansion velocity is set by review capacity, not sales capacity \u2014 which is why `strategy/market_sizing.md`'s ramp is paced the way it is, and why `business_model_canvas.md`'s customer-relationship hypothesis tests review cycle time rather than sales touches.\n\n**Recommended next 3:** (1) write the tenant-isolation document before the first pilot conversation \u2014 it addresses the veto with the longest cycle time; (2) put E2's result in front of a Ray-profile engineer before any deal, since the persona who converts hardest also converts most durably; (3) ask Q19 of the discovery guide in every owner conversation \u2014 the external veto is invisible until someone asks the buyer what their client would say.\n"}, "validation/discovery_guide.md": {"g": "Validation", "t": "Customer discovery guide", "md": "# Customer discovery guide\n\n> **What this is** \u2014 the interview kit: screening criteria per persona, non-leading problem-interview questions, a solution-interview script, and the synthesis template.\n> **Why it exists** \u2014 the pack's single most valuable unknown (MSP ticket mix, onboarding hours by client size) is answerable in ten conversations and by nothing else. This file exists so those conversations produce data rather than encouragement.\n> **How to read it** \u2014 the question set is Mom-Test disciplined: every question asks about the **past**, never about a hypothetical future. A skeptic should check that no question below could be answered \"yes, that sounds useful\".\n> **Depends on / feeds** \u2014 inherits [../strategy/personas.md](../strategy/personas.md), [experiment_board.md](experiment_board.md) E3/E8; feeds [pivot_log.md](pivot_log.md), `strategy/market_sizing.md` (rows 6, 8, 13).\n\n## Screening\n\n| Persona | Include if | Exclude if |\n|---|---|---|\n| **Marcus** \u2014 MSP owner/COO | 10\u2013100 staff \u00b7 \u22658 client environments \u00b7 US \u00b7 owner is reachable | Single-client MSP; pure staff-aug; >200 staff (different buying process) |\n| **Dana** \u2014 service delivery manager | Owns the queue and the onboarding checklist | Title only, no queue ownership |\n| **Ray** \u2014 principal/escalation engineer | \u226510 years \u00b7 holds environment knowledge for named clients | Generalist without deep client-specific knowledge |\n| **Sonia** \u2014 client-side IT director | Approves what their MSP deploys in their environment | No approval authority |\n\n## Unaided elicitation \u2014 asked FIRST, before anything below\n\n**Added after critic review found gate criterion 1 was primed by its own instrument.** Questions 1\u20135 sit under a heading reading \"Onboarding\" and open *\"walk me through the last client you onboarded\"* \u2014 so \"ranks onboarding in their top three pains, unprompted\" was only ever unprompted **by the product description**, not by the topic. `metrics_by_stage.md` nonetheless calls it \"the only unbiased read\".\n\n> **Q0. What were the three biggest constraints on your delivery capacity last quarter?**\n\n**Gate criterion 1 is scored from Q0's answer alone**, before onboarding has been mentioned by either party. Everything below is diagnostic.\n\n## Problem interview \u2014 questions about the past\n\n**Never describe the product before question 12. And never ask Q0 twice \u2014 its value is that it is the first thing said.**\n\n**Onboarding**\n1. Walk me through the last client you onboarded. What happened in week one?\n2. How many engineer-hours did it take? Who tracked that?\n3. Was that typical? What made it more or less than usual?\n4. What did you have at the end that you didn't have at the start? *(listening for: documentation, or knowledge in someone's head)*\n5. When did that client's documentation last get updated? By whom?\n\n**The knowledge problem**\n6. Tell me about the last time someone on your team escalated something a colleague had already solved elsewhere.\n7. Who on your team knows the most about your hardest client? What happens when they're on holiday?\n8. Has anyone left in the last two years who took environment knowledge with them? What did that cost?\n\n**Volume and mix**\n9. Roughly how many tickets a month across the book? *(E8)*\n10. If you sorted last month's tickets by category, what would the top five be, and roughly what share? *(E8 \u2014 the pack's single highest-value unknown)*\n11. What share arrive from RMM alerts rather than from a person?\n\n**Constraint**\n12. Have you turned down a client in the last year? Why?\n13. Tell me about the last time you turned down a client, or nearly did. What was the binding constraint that day?\n14. What have you already tried to fix this? What happened?\n\n## Solution interview \u2014 only after the problem is confirmed unprompted\n\n15. *(Show the positioning statement, once.)* What do you think this does?\n16. Tell me about the last tool you brought in that changed how delivery works. What convinced you, and who else had to agree?\n17. **Follow E3's split-sample protocol exactly \u2014 this is the field instrument, and the earlier version ran the superseded price test.**\n   - **Arm A:** show the banded schedule **and the hours gap** \u2014 \"this displaces about $241 of your time and we charge about $1,005; here's why we think it's worth it\". Then ask for a countersigned design-partner LOI.\n   - **Arm B:** show the ~$241 schedule **only**. Then ask for the same LOI.\n   - **Never show an owner both.** That measures discount preference, not basis.\n18. Who else would have to agree before you could sign?\n19. Tell me about the last time a client's IT director blocked or slowed something you wanted to deploy in their environment. What did they ask for? *(E7a \u2014 past behaviour, not a forecast of an absent third party)*\n20. Tell me about a tool you stopped using within a year of buying it. What went wrong?\n\n## Questions we deliberately do not ask\n\n- *\"Would you use a system that learns your environment by watching engineers?\"* \u2014 hypothetical, and everyone says yes.\n- **Anything phrased \"what would have to be true\u2026\"** \u2014 the earlier version of this guide broke its own past-tense rule four times, including inside the section that claimed all-past discipline. Every one is now a \"tell me about the last time\" form.\n- *\"How much would you pay for this?\"* \u2014 invites an invented number. Ask what they pay for the thing today (Q2) and put a price in front of them (Q17) instead.\n- *\"Does documentation going stale bother you?\"* \u2014 leading. Q5 gets the same information from behaviour.\n- Anything that pitches. **If the interviewer is talking for more than a quarter of the call, the data is contaminated.**\n\n## Synthesis template \u2014 filled after each interview, within the hour\n\n```\nInterview #  \u00b7 Persona \u00b7 Firm size \u00b7 Environments \u00b7 Date\nTop 3 pains, in their words (verbatim quotes, not paraphrase):\nCurrent workaround:\nTrigger that would make them act:\nOnboarding hours quoted:            (Q2)  \u2192 feeds market_sizing row 13\nTicket volume + top 5 categories:   (Q10) \u2192 feeds market_sizing rows 6, 8\nPrice reaction:                     (Q17) \u2192 feeds E3\nObjection that must be overcome:\nMust-have language \u2014 their words for what the solution must do (contract-required field, previously missing):\nSurprise finding (anything that contradicted the pack):\nDid onboarding cost appear in the **Q0** answer, before the topic was raised?   Y / N   \u2190 this is what scores gate criterion 1\n```\n\n**That last line is the pack's exit criterion.** [../strategy/gtm.md](../strategy/gtm.md) requires \u22656 of 10 to rank onboarding in their top three pains *unprompted*. Recording it per interview is what keeps that from being decided retrospectively by whoever wants the answer to be yes.\n\n**Recommended next 3:** (1) run all ten before writing a line of marketing copy; (2) treat Q10 as the priority question \u2014 it is worth more to the model than any other single answer; (3) log every surprise finding in [pivot_log.md](pivot_log.md) the same day, because contradictory evidence decays fastest.\n"}, "validation/experiment_board.md": {"g": "Validation", "t": "Experiment board", "md": "# Experiment board\n\n> **What this is** \u2014 the Blank-style learning log for the top assumptions: falsifiable hypothesis with a number, experiment design, **pass/fail threshold declared in advance**, result, learning, decision.\n> **Why it exists** \u2014 thresholds declared after results are not thresholds. This board exists so that a negative result is a finding rather than an occasion for reinterpretation, and every row here is `planned` because nothing has been run.\n> **How to read it** \u2014 the Threshold column is the discipline; if a row's threshold could be satisfied by any plausible outcome, the row is decoration. A skeptic should attack E2's fairness bar, which has been raised twice.\n> **Depends on / feeds** \u2014 inherits [riskiest_assumptions.md](riskiest_assumptions.md), [../tech/not_vaporware.md](../tech/not_vaporware.md) \u00a72; feeds [stage_gate.md](stage_gate.md), [pivot_log.md](pivot_log.md), `financials/use_of_funds.md`.\n\n---\n\n## E0 \u00b7 The recruiting funnel \u2014 the constraint every other experiment sits on\n\n**Added after critic round 1, which found the layer's fatal flaw: four of six Discovery exit criteria consume MSP owner attention, and nothing modelled how a founder with no MSP relationships (A6) obtains it.** \"Costs nothing\" was true of the transcript and false of the founder-weeks, and it was the only unsourced cost in a file whose contract requires a Cost column.\n\n**The chain, tagged rather than assumed away:**\n\n| Stage | Rate `(assumption)` | To get 10 completed E3 conversations |\n|---|---|---|\n| Cold touches (r/msp, MSP Discord/Slack, LinkedIn owner outreach, podcast audiences) | \u2014 | **200\u2013400 touches** |\n| \u2192 reply | 8\u201315% | 20\u201345 replies |\n| \u2192 booked call | 40\u201350% of replies | 10\u201320 booked |\n| \u2192 **completed 45\u201360 min substantive call** (owner produces hours by client size, ticket mix, price reaction) | 60\u201375% | **7\u201314 completed** |\n\n**Anchored on the pack's own floor:** `strategy/gtm.md` \u00a72.4 prices cold outbound at *\"below 5% to a call\"* as its disqualifying test. That 5% is to a *call*, not to a substantive one \u2014 so the pessimistic case is ~400 touches for 10 completed conversations.\n\n**Founder-hours: `(assumption: 60\u2013100 hours across 6\u201310 weeks)`** \u2014 outreach, follow-up, scheduling, the calls, and same-hour synthesis. **That is the real cost of E3, E7 and E8, and it was previously recorded as \"~$0 \u00b7 2 weeks\".**\n\n**This is also the layer's first instrumented metric**, and `get_keep_grow.md` now carries the stage it previously omitted: touches \u2192 reply \u2192 booked \u2192 completed. A pre-revenue company can instrument nothing else.\n**Result.** \u2014 \u00b7 **Learning.** \u2014 \u00b7 **Decision.** \u2014 \u00b7 **Status: planned.**\n\n## E1 \u00b7 Cross-environment skill transfer \u2014 the company's one question\n\n**Redesigned after critic review established the original could not produce the estimate it named.** Three defects, all fatal to the inference:\n\n- **The unit of analysis and the sample size were never stated.** At 5 skills scored once, observing 4/5 gives a Wilson 95% CI of **[38%, 96%]**; at 15, observing 11/15 gives **[48%, 89%]**. Neither separates 70% from 60%, and **neither excludes the 50% kill line.** Distinguishing 70 from 60 at 80% power needs ~142 independent trials; 70 from 50 needs ~37.\n- **Two environments have zero degrees of freedom on between-environment variance \u2014 which is literally what R1 is asking about.** Two lab tenants on the same stack is a near-best case, and a 70% result there licenses nothing about the ~41 drifted client environments per MSP the ramp is built on.\n- **Three iterations against B destroys B's held-out status.** After approach 3, B is a training set.\n\n### Design\n\n**Unit of analysis: the *(skill, held-out environment)* pair.** Repeated runs of one skill in one fixed tenant are near-deterministic and do not add information.\n\n| | |\n|---|---|\n| Procedures | 5 |\n| Environments | **\u22656 held-out**, plus A for synthesis and **C reserved untouched for the final scored run** |\n| **Scored pairs** | **\u226530** \u2014 enough to exclude the 50% kill line, not enough to separate 70 from 60, and that limit is stated rather than hidden |\n| Environment sampling | Pre-registered **dissimilarity metric** (tenant policy count, non-default configuration ratio, stack version spread), with environments chosen to span it |\n| Primary endpoint | Transfer rate **as a function of dissimilarity**, not one scalar |\n| Every rate reported | with a **Wilson 95% CI** beside it |\n\n**Method selection freezes on A.** All three clustering approaches are chosen and tuned against environment A. **C is opened once, for the final scored run**, and never iterated against.\n\n**The harness's own false-positive mode is measured, not assumed away.** DD3 generates the success criterion the harness then scores against, and `tech/deep_dives.md` names *\"criteria that pass while the outcome is wrong\"* as a failure verification design cannot eliminate. **A human adjudicates a random 20% sample of harness \"passes\"**, and the adjudicated rate is what the threshold applies to.\n\n**Threshold, re-derived \u2014 the earlier 70% did not follow from its own justification.** The old reasoning was *\"below 70% a technician must check every action\"*, which argues for ~100%: at 70% a technician still checks every action, because you cannot know which 3 in 10 failed without looking. And **DD7's default-destructive gating requires human review of destructive steps at any success rate**, so 70% is not the point where checking stops.\n\n**The decision-relevant variable is review time against do-it-yourself time.** A skill is worth running when *(review time + failure-fix time) < (time to do it by hand)*. For a tier-1 procedure at ~8 minutes by hand and ~2 minutes to review `(assumption, to be measured in the first pilot)`, the crossover sits near a **25\u201330% failure rate**.\n\n**Threshold: \u226570% adjudicated-correct across \u226530 scored pairs, with the Wilson CI reported.** 50\u201370% = method problem, one iteration. **<50% with the CI excluding 50% = R1 is false.**\n**Result.** \u2014 \u00b7 **Learning.** \u2014 \u00b7 **Decision.** \u2014 \u00b7 **Status: planned.**\n\n## E2 \u00b7 Graceful degradation vs a fair RPA baseline\n\n**Hypothesis.** Under a deliberate interface change, synthesized skills retain **\u22652\u00d7 the success rate** of an equivalently-capable RPA automation of the same procedures.\n**Design.** Same 5 procedures. Perturbations: elements moved, renamed, re-ordered, plus a version upgrade that changes selectors. Baseline is a **Unified-Target-equivalent implementation with fuzzy, anchor, image and OCR fallbacks ENABLED**.\n**Threshold \u2014 a ratio alone can pass on two failures.** 20% vs 8% is 2.5\u00d7 and clears any ratio bar while neither arm is deployable. So the threshold is **both**: skills retain **\u22652\u00d7 the baseline's post-change success rate AND \u226550% in absolute terms.** Below either, the differentiation claim is not supportable and `tech/whitepaper.md` \u00a75 must be rewritten or withdrawn.\n\n**Two design defects the earlier version had, both about who controls the comparator:**\n\n- **Nobody was named as the baseline's builder**, and A6 records the founder's edge as AI/agents engineering with **no declared RPA competence**. A sponsor building the active comparator arm is not a control. **A certified UiPath or Blue Prism practitioner is contracted to build it, and the implementation is published for replication.**\n- **Perturbation selection was the experiment's largest undeclared degree of freedom.** \"Moved, renamed, re-ordered\" are precisely the classes where selector fallbacks are weakest and goal re-grounding strongest. **The perturbation set is now pre-registered and sealed before either arm is built**, and drawn from the failure classes `tech/whitepaper.md` \u00a75 already sources: upgrade-broken selector contracts, unstable dynamic identifiers, timing and synchronisation, configuration drift.\n**The fairness bar has been raised twice and that is the point.** The original design compared against a coordinate-clicking script \u2014 a strawman. The second required only \"selector-based\", which permits fallbacks disabled. **An experiment worth running is one that can lose**, and this one now can.\n**Result.** \u2014 \u00b7 **Learning.** \u2014 \u00b7 **Decision.** \u2014 \u00b7 **Status: planned.**\n\n## E3 \u00b7 Basis test \u2014 do they pay for the library, or only for the hours? (D17)\n\n**Reframed after the financials critique, then redesigned after the validation critique.** The first reframe put both schedules in front of the *same* owner and asked which they preferred. **That measures discount preference, not basis** \u2014 no owner prefers to pay 4\u00d7 more, so it was structurally biased toward the answer that the value is hours-shaped, which is the very thing under test.\n\n**Hypothesis.** An MSP owner will commit to a per-environment fee **materially above the engineer-hours it displaces**, because what they are buying is the maintained runbook, the tier-1 floor at unfamiliar clients, and knowledge that survives attrition \u2014 none of which is hours-denominated.\n\n**Design \u2014 split sample, not a menu.** 10 owners from E0's funnel, **randomly assigned**, and neither arm sees the other's price:\n\n| Arm | n | Sees | Asked for |\n|---|---|---|---|\n| **A** | 5 | The banded schedule **with the hours gap disclosed** \u2014 we charge $1,005 blended against ~$246 of displaced hours \u2014 **and the all-in year-1 cost including the hosted node: ~$6,900\u20138,100** | A countersigned design-partner LOI at the banded price |\n| **B** | 5 | The ~$246 hours-defensible schedule **only**, with the same all-in disclosure | The same LOI at that price. **Note for arm B: at this schedule the node opex exceeds the fee**, so B also tests whether an MSP will supply its own hardware |\n\n**Acceptance has to cost the owner something.** A verbal reaction to a product twelve months from existing is not evidence. **The instrument is a countersigned design-partner LOI** \u2014 non-binding on delivery, binding on price and intent \u2014 because that is the cheapest signal that separates politeness from willingness.\n\n**Both arms see the all-in number, not just the fee.** Asking for a signature on a fee while withholding a mandatory hosting line produces a signature that means nothing. **Both arms are asked their onboarding hours by client size before any price is shown**, which also feeds `strategy/market_sizing.md` row 13 and E8.\n\n**Thresholds, with precedence stated so two branches cannot both fire:**\n\n1. **Arm A \u22653 of 5 sign** \u2192 the library has value independent of hours. The schedule stands; the ROI calculator is re-based on library value. *(This branch is checked first.)*\n2. **Arm A \u22641 signs and Arm B \u22653 sign** \u2192 the value is hours-shaped. Revenue per MSP falls to ~$10,376, SAM to ~$124M, and the model is rebuilt on the lower schedule.\n3. **Neither arm reaches 3** \u2192 the per-environment fee has no basis at any price, and the **D12 per-MSP platform fee** becomes the model.\n4. *Ambiguous (Arm A = 2)* \u2192 inconclusive, and it is reported as inconclusive rather than resolved in whichever direction is convenient. Re-run with 10 more.\n\n**What n=10 cannot do, stated rather than glossed.** Five of ten carries a 95% CI of roughly [24%, 76%]. **This experiment can distinguish \"clearly yes\" from \"clearly no\"; it cannot resolve anything in between**, which is why branch 4 exists and why an ambiguous result is reported as ambiguous rather than resolved in whichever direction is convenient. Presentation order within each arm is counterbalanced so the split is not a property of the script.\n\n**Why this is the highest-value ten conversations in the pack.** It needs no product, and it is the only instrument that can di
