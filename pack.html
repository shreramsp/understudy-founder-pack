const DOCS = {"ASSUMPTIONS.md": {"g": "Brief", "t": "Understudy \u2014 Assumptions Log", "md": "# Understudy \u2014 Assumptions Log\n\n> **What this is** \u2014 every choice made without founder confirmation during the grill, with its basis and whether the pack collapses if it is wrong.\n> **Why it exists** \u2014 a brief reads as settled fact, and six weeks later nobody remembers which lines the founder said and which the agent decided. This file keeps that boundary visible, so a skeptic attacks the assumption rather than the artifact built on it.\n> **How to read it** \u2014 scan the `kills-pack-if-wrong: yes` rows first; those are the ones that propagate. A1 is cosmetic, A2\u2013A4 are structural.\n> **Depends on / feeds** \u2014 derived from [BRIEF.md](BRIEF.md); feeds `validation/riskiest_assumptions.md`, which ranks these alongside the lean-canvas \u26a0 cells and tests them.\n\nConfirmed by the founder in the grill (**not** assumptions): MSP beachhead \u00b7 hybrid global+tenant skill library \u00b7 per-resolved-ticket pricing \u00b7 riskiest assumption is skill-clustering reliability \u00b7 why-now is the computer-use threshold \u00b7 founder edge is AI/agents engineering \u00b7 MSP owner/COO signs \u00b7 10-year vision is 10x clients per engineer.\n\n| # | Assumption | Basis | Kills pack if wrong |\n|---|---|---|---|\n| A1 | Working name **\"Understudy\"** | The idea had no name. An understudy watches the performer, rehearses, goes on under supervision, then takes the role \u2014 which is the four-phase ladder exactly. Cosmetic; overrule in one word. | no |\n| A2 | Edge-low is the tier-1 helpdesk technician; edge-high is the senior escalation engineer | Quality-bar property 4 requires all three spectrum edges; the founder named only the beachhead. Derived from standard MSP service-delivery tiering. | no |\n| A3 | The three why-now factors are ranked with computer-use as primary and the other two as supporting | Founder selected computer-use; the skill format and inference-cost points follow from the material's \"no model training\" and clustering design. | no |\n| A4 | ~~Competitor failure modes are founder-asserted and unverified~~ **RESOLVED by research, and it reframed the wedge** | Discovery-by-recording is **not** unattempted: task mining is a mature category (UiPath, Celonis) and FortressIQ built and sold a company on it [S5][S7]. But no one closes recording \u2192 execution; the handoff is manual. See [research/landscape.md](research/landscape.md). | resolved \u2014 the sharper claim (\"nobody closes the loop\") replaces the false one (\"nobody does discovery\") |\n| A5 | The MSP market is large enough to carry a venture-scale outcome at per-ticket pricing | Not yet sized. Bottom-up build owed in `strategy/market_sizing.md`; MSPs are numerous but individually small, and this is the likeliest place the story breaks. | **yes** |\n| A6 | Founder-market fit is argued on the mechanism, with no MSP operating history | Founder selected \"AI/agents engineering depth\" over MSP experience. The pack must compensate with design-partner evidence rather than claimed domain authority. | no |\n| A7 | Engineer consent to recording is tractable at MSPs | MSPs already record sessions for QA and training, and engineers are employees rather than customers. Weaker at in-house IT, which is a reason the beachhead is what it is. | no |\n| A8 | Global-layer skills transfer between client environments without carrying client-specific data | The moat depends on it and the privacy story depends on it. Untested; second only to the clustering assumption in load-bearing weight. | **yes** |\n| A9 | ~~Per-ticket pricing is acceptable to MSP buyers~~ **RESOLVED, conditionally** | Discharged in `financials/pricing.md` \u00a71b. The axis is acceptable \u2014 white-label NOC and helpdesk outsourcing is already bought per incident and priced into the MSP's per-user rate against a utilisation assumption \u2014 **but only with a per-client monthly cap or an included-ticket allowance.** Uncapped, it asks an owner to take a variable cost against a fixed price he has already quoted. | resolved with a condition |\n| A10 | \"Generic across IT stacks\" means broad coverage of the common stack, not literally any stack | Founder wrote \"not ServiceNow-specific\". Scoped to Okta / M365 / Active Directory / Jira as the global layer's first targets. | no |\n\n## Resolved during the run\n\n- **A4** closed by phase 1 (see row above). The correction strengthens the pitch: the gap is narrower, better evidenced, and explains *why* it persisted.\n- **A5** (MSP market size) now has inputs: managed services \u2248 $424\u2013437B in 2026 [S17], 88% of SMBs use an MSP, average MSP manages 1,247 endpoints [S18]. Still owed a bottom-up build in `strategy/market_sizing.md`.\n- **New, promoted to pack-killing \u2014 A11:** the brief's phase-4 autonomy is not supportable by current long-horizon agent performance (20.6% on OSWorld 2.0 [S16]). The pack will claim discovery + governed execution and treat full autonomy as direction, not deliverable.\n- **New \u2014 A12:** EU deployments face a real constraint on the capture step: continuous screen recording is generally treated as disproportionate, consent is a weak legal basis, and works councils hold co-determination rights in DE/NL/AT/SE [S29]. US-first is now an implicit assumption.\n\n## Founder decisions taken during the run\n\n| # | Decision | Date | Consequence |\n|---|---|---|---|\n| D1 | **A11 accepted.** Scope is discovery + governed supervised execution; autonomy is direction, not deliverable | 2026-09-04 | Binding claim boundary in [BRIEF.md](BRIEF.md). No artifact may imply unattended autonomy; the revenue build may not price it |\n| D2 | **RPA differentiation is a required argument**, not an optional one \u2014 narrated skills degrade gracefully under UI change where scripted bots break | 2026-09-04 | Mandatory explicit section in `tech/whitepaper.md` and `narrative/vc_memo.md`; tested as **E2** in `validation/experiment_board.md` against a deliberately altered UI, with an RPA-style scripted baseline |\n| D3 | **A12 stands. US-first** | 2026-09-04 | EU is a later-market question with a named legal constraint, not a launch geography. `strategy/market_sizing.md` sizes US SAM |\n| D4 | **Two-part tariff confirmed** \u2014 per resolved ticket (~$6) **plus $1,500 per environment onboarded** | 2026-09-04 | Supersedes the round-1 per-ticket-only answer. Per-ticket alone yields ~$107M SAM and a year-1 customer worth ~$1,100, at which no channel in `strategy/channel_plan.md` is viable. The onboarding fee is ~87% of year-1 revenue and prices against the 40\u201380 engineer-hours it displaces [S21]. Binding on `financials/pricing.md` and `financials/revenue_build.md` |\n| D5 | **D2's mechanism restated: contract vs. goal, not coordinates** | 2026-09-04 | Enterprise RPA uses attribute-based selectors, not screen coordinates; the original framing would have been falsified by any practitioner. The claim is that an RPA step is a contract against a specific application build with no success criterion, while a narrated skill carries a goal state and verification step. **E2's baseline must be selector-based** or the experiment is rigged. Binding on `tech/whitepaper.md`, `narrative/vc_memo.md`, `validation/experiment_board.md` |\n\n| D6 | **In-boundary distillation is an architecture constraint, not a preference.** Raw recordings never reach the vendor; only the abstracted variance envelope crosses | 2026-09-04 | Binding on `tech/architecture/`. **Corrected the same day after critic review:** the boundary is the **MSP's tenant**, not each client's. Stage 1 (cluster + abstract) runs on one node per MSP across that MSP's environments; stage 2 (global clustering) runs centrally on abstracted envelopes only. The original \"inside the client boundary\" wording was not implementable \u2014 capture originates on MSP workstations, cross-environment clustering needs environments co-located, and SaaS-only clients have no perimeter. **The founder's intent is preserved and the fleet drops from ~41 nodes per customer to 1.** Relocation confirmed by the founder 2026-09-04 \u2014 **D6 is settled.** The envelope schema is binding and auditable: `{procedure_shape, precondition_pattern, deviation_class, observation_count}`, carrying no tenant name, domain, user, policy id or configuration value |\n| D7 | **Banded onboarding fee, scaled to client size** | 2026-09-04 | Supersedes the flat $1,500 in D4's first form. `financials/pricing.md` owes the schedule; bands follow the client-size distribution in `strategy/market_sizing.md` (small \u226410 users / typical 10\u201330 / complex 30+). The blended revenue figure is unchanged; the structure is not |\n\n| D8 | **The environment-1-costs-more finding stays visible** \u2014 in [journeys/beachhead.md](product/journeys/beachhead.md), in the onboarding meter (F20/S9), and in every ROI artifact | 2026-09-04 | Founder directive: *\"we'd rather a design partner's timesheet confirm our number than falsify it.\"* Binding on `strategy/gtm.md`'s engineer-hours ROI calculator, on `narrative/` (no artifact may quote a first-environment saving), and on `startup-website` \u2014 the quantified proof block must lead with compression at environment 2, never with environment 1 |\n\n| D9 | **Environment 1 is waived; the onboarding fee is charged from environment 2 onward** | 2026-09-04 | Resolves the pricing-basis failure found in critic round 2. The first environment displaces *negative* hours, so charging for it is charging for a loss; environments 2+ displace 0\u201322 hours and carry the fee. Matches the compounding story (first environment is the customer's investment, the rest are the harvest), preserves the engineer-hours ROI calculator that `strategy/petal_diagram.md` identifies as the instrument creating the budget line, and is the version a design partner's timesheet confirms. **Cost: year-1 revenue per MSP falls ~$8,600 \u2192 ~$7,100.** Steady-state SAM is unaffected \u2014 the waiver is one-time per customer, not recurring |\n| D10 | **The API-over-UI limit is stated explicitly in the narrative layer** | 2026-09-04 | Founder directive. Where a real API exists, using it is faster, cheaper and more stable than driving a UI, so the durable value of UI capture concentrates in surfaces that *lack* good APIs \u2014 native admin tools, terminals, legacy consoles [tech/techniques/wave3.md](tech/techniques/wave3.md) row 2.3. Binding on `narrative/vc_memo.md` (honest-risks section) and `narrative/one_pager.md`. Rationale: *\"we'd rather state where the mechanism doesn't apply than have a technical reviewer find it\"* |\n\n| D11 | **Complex band priced down to $1,500**, matching typical. Cascade accepted | 2026-09-04 | The $3,000 complex fee was priced at 167\u2013333% of the hours it displaces \u2014 the fee's justification failing arithmetic a second time. Blended fee $1,500 \u2192 **~$1,005**; steady-state revenue/MSP \u2192 **~$14,930**; SAM \u2192 **~$179M**; **CAC ceiling \u2192 ~$9,300**, at which the primary channel touches the ceiling at its top end and no channel retains slack. Both scenarios stay in `financials/revenue_build.md` |\n| D12 | **Per-MSP platform fee kept alive as a named contingency, not folded in** | 2026-09-04 | If E3 shows owners will not pay per environment, the revenue model moves to a per-MSP platform fee with per-ticket as the only usage metric \u2014 D9's rejected alternative 2. **Decided on evidence, not now.** Recorded as pivot criterion P3 in `validation/pivot_log.md` |\n| D13 | ~~**Hardware credit against onboarding fees** is the node commercial model~~ **SUPERSEDED by D14** | 2026-09-04 | Resolves `financials/unit_economics.md` \u00a73's fork: the MSP owns the node (Case A's ~96% margin) but we fund it out of revenue we would otherwise book (Case B's sales motion). Self-liquidating across the first 3\u20134 environments; removes a procurement conversation before value is proven |\n\n| D14 | **The hardware credit (D13) is withdrawn as a blanket term.** A vendor-operated hosted node inside a tenant the MSP owns is the default; the credit survives for design partners only, and carries title, a 24-month term and pro-rata clawback where used | 2026-09-07 | Modelled as contra-revenue it consumes 50\u2013100% of year-1 fee revenue and pushes primary-channel payback from 1.3 to 4.5 years. Supersedes D13's blanket form. New risk row 11b in `financials/risk_matrix.md`. **Confirmed by the founder 2026-09-07.** |\n| D15 | **Fully loaded gross margin is 76%**, derived with its cost stack, replacing the unreconciled 70%/96% pair | 2026-09-07 | 96% was marginal-on-API-only and omitted the human lines \u2014 onboarding delivery, support, node ops \u2014 which is where channel products actually lose margin. CAC ceiling moves $9,300 \u2192 **$10,100**, which keeps the primary channel inside the floor at 3.4:1 rather than at it |\n\n| D16 | **The hours-defensible calibration (~$241 blended) stays visible beside the schedule we charge** | 2026-09-07 | Founder directive: *\"a reader should be able to see the gap between what we charge and what hours justify, and that E3 is the test that resolves it.\"* Binding on `financials/pricing.md`, `financials/revenue_build.md` and the V18 infographic |\n| D17 | **E3 is reframed as a basis test: library vs hours** | 2026-09-07 | Not \"will they pay $1,500\" but \"do they pay for the library at all, or only for the hours it saves\". Founder's reading: *\"library vs hours is the right question and it's better than the one we started with.\"* Binding on `validation/experiment_board.md` E3 and `validation/riskiest_assumptions.md` R3 |\n| D18 | **Capacity, not cost reduction, is the pitch on the ticket half** | 2026-09-07 | If the automatable subset costs an MSP `(assumption: $2\u20136)` and we charge $6, we are at or above their marginal cost \u2014 so what we sell is throughput and coverage at a capacity ceiling [S33], not savings. Binding on `narrative/one_pager.md`, `narrative/vc_memo.md`, `narrative/pitch_deck.md`. Founder: *\"the deck should say so rather than have a buyer discover it.\"* |\n\n## Open questions for the founder\n\n1. Is there any existing recording corpus, design partner MSP, or prior pilot \u2014 or is this genuinely zero-evidence today?\n2. Team: solo, or co-founders with the MSP-side experience A6 says is missing?\n3. Is a raise being planned, and roughly at what size? `financials/use_of_funds.md` needs a number to build against, and will otherwise assume a pre-seed.\n"}, "BRIEF.md": {"g": "Brief", "t": "Understudy \u2014 Founder Brief", "md": "# Understudy \u2014 Founder Brief\n\n> **What this is** \u2014 the single source of truth every other artifact in this pack reads: who bleeds, the mechanism, the beachhead, and the one assumption that can kill the company.\n> **Why it exists** \u2014 every downstream artifact inherits its beachhead (MSPs), its per-resolved-ticket pricing, and its riskiest assumption from this page. If recorded engineer sessions do not cluster into skills an agent can execute reliably, the rest of this pack argues for a screen recorder with extra steps \u2014 and the two-week test at the bottom is the cheapest way to find that out.\n> **How to read it** \u2014 start at \"Riskiest assumption\" and \"Mechanism & moat\"; a skeptic should attack the clustering step and the claim that a global stack library transfers between clients.\n> **Depends on / feeds** \u2014 pairs with [ASSUMPTIONS.md](ASSUMPTIONS.md); feeds `research/`, `strategy/positioning.md`, `validation/riskiest_assumptions.md`, `financials/pricing.md`.\n\none-line: **Understudy is the AI service desk that onboards itself \u2014 it records IT engineers doing real work, clusters those recordings into an executable skill library, and takes over tickets stack by stack, deploying in days instead of months of manual configuration.**\ndomain: ITSM \u00b7 AI agents \u00b7 managed services\nstage: design (nothing implemented; no code, no pilot)\n\n## Problem\n\nEvery AI service desk on the market can resolve a ticket. None can learn an unfamiliar IT environment without months of manual configuration \u2014 mapping the stack, writing runbooks, wiring integrations, encoding the local conventions that live in three engineers' heads. **Deployment friction, not resolution capability, is the bottleneck.**\n\nFor an MSP this is not an inconvenience, it is cost of goods. Every new client is a fresh configuration project priced in engineer-weeks, paid before a single ticket is deflected. The knowledge that would make automation work is being performed daily and captured nowhere.\n\n## Users & spectrum\n\n- **Edge-low:** tier-1 helpdesk technician \u2014 runs the same twenty procedures all day, is the first whose queue the agent absorbs, and gains escalation-grade backup on the twenty-first.\n- **Beachhead:** MSP service delivery engineers across a book of client environments. They are the *source* of the skill library (their recorded sessions) and its first consumers. User \u2260 payer.\n- **Edge-high:** senior/principal escalation engineer \u2014 never automated, but freed from repetition and served the agent's simulation traces on the hard cases.\n- **Payer:** MSP owner/COO (carries the P&L, buys margin per client). **Champion:** service delivery manager. **Veto:** whoever owns client security review.\n\n## Why now\n\n1. **Agents crossed the computer-use threshold in roughly the last 18 months** \u2014 models can watch a screen, execute a multi-step UI workflow and recover from a wrong click. This is the capability that converts a recording into an executable skill, and it did not exist in 2023. *(primary)*\n2. Portable skill formats (`SKILL.md` / agent-skills) gave procedural knowledge somewhere to land that is not fine-tuning \u2014 the reason \"no model training\" is a design choice rather than a limitation.\n3. Long-context and falling inference cost made hours of screen, click and narration tractable to deduplicate for dollars rather than thousands.\n\n## Wedge & 10-year vision\n\n**Wedge:** onboarding, done 10x better. Not \"resolves more tickets\" \u2014 *arrives already knowing this environment.* One MSP, one client stack, from recording to first autonomously resolved ticket in days.\n**Vision (10 yr):** MSPs run 10x the clients per engineer. The economics of managed services are permanently restructured, and software that learns its environment by watching is the default expectation rather than a feature.\n\n## Mechanism & moat\n\n**Core loop:** record (screen \u00b7 clicks \u00b7 spoken reasoning) \u2192 cluster \u2192 deduplicate \u2192 synthesize `SKILL.md` \u2192 simulate in parallel with a human \u2192 govern with approval gates on destructive actions \u2192 execute under supervision, escalating anything outside the skill's envelope. No model training anywhere in the loop; skills are text, readable and auditable by the engineer they came from.\n\n**Supporting design:** the agent holds its own identity for attribution, and self-explores with a test account to learn the environment beyond what was recorded.\n\n**Architecture constraint (D6, binding \u2014 corrected 2026-09-04).** Distillation is **two-stage**: clustering and abstraction run **inside the MSP's own tenant**, on that MSP's sessions across all its client environments; only **abstracted variance envelopes** \u2014 procedure shapes and deviation patterns carrying no tenant identity \u2014 cross to the central global layer. Raw session recordings never leave the MSP's control and never reach us.\n\n*The first framing said \"inside the client boundary\"; that is not implementable, because capture originates on MSP engineer workstations covering 41 clients, cross-environment clustering needs more than one environment co-located, and a 22-person client on SaaS has no perimeter to host a node in. The corrected design preserves the intent, makes cross-environment compounding possible, and reduces the fleet from one node per client to one per MSP. See `product/PRD.md` \u00a77.*\n\n**Moat \u2014 hybrid library.** Global skills for the stacks every client shares (Okta, M365, Active Directory, Jira) compound across every deployment, so each new environment starts warmer than the last; environment-specific skills stay in a private tenant layer that never crosses the boundary. The compounding half never touches customer data \u2014 which is what makes the flywheel survive security review. Secondary moat: workflow lock-in once the library is the runbook of record.\n\n## Competition & failed alternatives (as stated by founder \u2014 to be verified in `research/`)\n\n| Alternative | Why it falls short |\n|---|---|\n| Ravenna | AI-native ITSM, Slack-first, but no discovery \u2014 the environment is still configured by hand |\n| Strawberry | Records workflows, browser-only \u2014 most IT work is not in a browser |\n| ServiceNow (+ Moveworks) | Platform of record; configuration is the product's premise, not its problem |\n| Do nothing | Tribal knowledge stays in three engineers' heads and leaves with them |\n\n## Business model\n\n**Two-part tariff** (founder-confirmed, D4; banded per D7): **~$6 per resolved ticket** \u2014 outcome pricing, comparable to the $5\u201313/ticket figures the category publishes and well under the buyer's own $22.50 blended cost [S27] \u2014 **plus a banded per-environment onboarding fee** ($400 small / $1,500 typical / $1,500 complex, blended ~$1,005 \u2014 D11), **charged from environment 2 onward \u2014 the first environment is waived (D9)**, because it displaces negative hours and charging for it would be charging for a loss. Environments 2+ displace 0\u201322 hours against a 25\u201340 baseline [S21]. Flat pricing does not survive the small-client end of the book, so the schedule is banded by client size (D7).\n\nThe onboarding fee is not a second-order add-on: it is roughly 79% of year-1 revenue, it arrives at the moment of the work the buyer already resents paying for, and without it no acquisition channel is economically viable [strategy/channel_plan.md](strategy/channel_plan.md). Signed by the MSP owner/COO.\n\n## Founder edge\n\nAI/agents engineering depth. The clustering-and-skill-synthesis core is the hard technical bet in this company, and it is the founder's ground \u2014 founder-market fit argued on the mechanism rather than on years in managed services. *(The market-side gap is named honestly in ASSUMPTIONS.md A6 rather than papered over.)*\n\n## Claim boundary \u2014 binding on every artifact in this pack\n\nFounder decision, 2026-09-04, taken against the capability evidence in [research/capability_table.md](research/capability_table.md).\n\n**What this pack claims:** environment discovery, and **governed, supervised execution with human escalation.**\n**What it does not claim:** unattended autonomous resolution. Phase 4 of the original ladder is stated as *direction*, never as a deliverable, a roadmap date, or a number in the revenue build.\n\n*Basis:* the best frontier system completes 20.6% of long-horizon OSWorld 2.0 tasks, where the median task takes a human 1.6 hours \u2014 the shape of a real ticket [S16]; agents scoring ~85% on standard OSWorld still fail ~80% of real workflows [S15]. A pack promising autonomy against that evidence fails its first technical diligence call. **Any artifact implying unattended autonomy is a defect, not a stretch goal.**\n\n**Geography:** US-first. EU capture is constrained by data-protection practice treating continuous screen recording as disproportionate, and by works-council co-determination in DE/NL/AT/SE [S29] (A12).\n\n## The RPA differentiation argument \u2014 required, not optional\n\nFounder directive, 2026-09-04. **`tech/whitepaper.md` and `narrative/vc_memo.md` must each carry this argument explicitly**, because it is the single objection this company will be asked in every technical diligence conversation, and the base rate is against us: automation derived from observed work has failed in 30\u201350% of projects, with maintenance reaching 60% of total cost [S10][S11].\n\n**The claim to make and defend:** a narrated procedural skill **degrades gracefully under UI change, where an RPA automation breaks.**\n\n*Stated correctly \u2014 the first framing was technically wrong and would have lost the argument.* Enterprise RPA has not primarily encoded screen **coordinates** for over a decade: UiPath uses attribute-based selectors over the accessibility tree with anchor and CV fallbacks, Blue Prism uses application-modeller attribute matching. Saying \"not coordinates\" to a practitioner falsifies the pitch in one sentence. RPA brittleness actually comes from **selector contracts breaking on application upgrades, unstable dynamic identifiers, timing and synchronisation, configuration drift, and unhandled unhappy paths** [research/survey.md \u00a76].\n\n**The real mechanical difference is contract vs. goal.** An RPA step is a *contract* \u2014 perform this action, on this element, in this application build \u2014 carrying **no statement of what success looks like**, so a break either halts the run or proceeds wrongly. A narrated skill carries the **goal state and a verification step**, so a broken assumption becomes a re-grounding search against an intact success criterion. That is arguable as a mechanism and testable as an experiment. \"We use an LLM\" is not the argument.\n\n**It must be tested against a fair baseline.** E2's RPA comparison must be a **selector-based** automation of the same procedure \u2014 not a coordinate-clicking toy, which would rig the result and prove nothing to the one persona (Ray) the argument exists to convince.\n\n**The experiment:** `validation/experiment_board.md` carries E2 \u2014 synthesized skills executed against a **deliberately altered UI** (moved, renamed and re-ordered elements, plus a version upgrade that changes selectors), measuring skill success rate against the selector-based baseline on the identical alteration. Falsifiable, threshold declared in advance.\n\n## Riskiest assumption\n\n**That recorded sessions cluster into reliable, reusable skills** \u2014 rather than brittle transcripts of one engineer's happy path on one good day. If clustering yields procedures that break on the second client, there is no product; every environment becomes a cold start and the manual-configuration problem returns with extra steps.\n\n*Cheapest decisive test:* record 3 engineers doing the same 5 procedures across 2 client environments; synthesize skills from environment A only; measure unattended success rate in environment B. Threshold declared in advance in `validation/experiment_board.md`.\n\n## Vocabulary\n\n- **core loop:** record \u2192 cluster \u2192 synthesize \u2192 simulate \u2192 govern \u2192 execute\n- **skill:** one `SKILL.md` procedure, human-readable and auditable\n- **skill library:** the per-role set of skills; global layer + private tenant layer\n- **environment:** one client's IT stack\n- **discovery:** the onboarding phase that produces the initial library\n- **session:** one recorded engineer work period\n- **unit of value:** a resolved ticket\n- **outcome metrics:** autonomous resolution rate per environment \u00b7 time-to-first-autonomous-skill \u00b7 engineer-hours per client onboarded\n"}, "README.md": {"g": "Brief", "t": "Understudy \u2014 founder artifact pack", "md": "# Understudy \u2014 founder artifact pack\n\n**Understudy is the AI service desk that learns each client environment by watching engineers work.** It records IT engineers doing real work, clusters those recordings into a readable, executable skill library, and takes over tier-1 tickets under supervision \u2014 for MSPs, where onboarding a new client environment is recurring cost of goods rather than a one-time project. Every AI service desk can resolve a ticket; none can learn where it is.\n\n**Status:** `PARTIAL` \u00b7 generated 2026-09-04 \u00b7 run slug `self-onboarding-desk` \u00b7 **59/61 required artifacts \u00b7 20 HTML infographics \u00b7 0 rendered images** \u00b7 96 files. Two manifest rows are open and **four of eight generated layers have never been through the critic loop** \u2014 see [Completeness](#completeness).\n\n---\n\n## Start here \u2014 60 seconds\n\n1. **[narrative/one_pager.md](narrative/one_pager.md)** \u2014 the whole company on one page, including the three things it deliberately does not claim.\n2. **[narrative/pitch_deck.md](narrative/pitch_deck.md)** \u2014 fourteen slides. Slides 10, 11 and 12 are the limits, and they are not optional.\n3. **[tech/whitepaper.md](tech/whitepaper.md)** \u2014 where the leverage actually is, and why there is no 10\u00d7.\n\n## Reading paths by audience\n\n**Investor** \u2014 [one_pager](narrative/one_pager.md) \u2192 [vc_memo](narrative/vc_memo.md) (the risks section is the longest, deliberately) \u2192 [market_sizing](strategy/market_sizing.md) (the arithmetic, corrected three times, with the corrections kept visible) \u2192 [revenue_build](financials/revenue_build.md) (73% of three-year revenue is one-time) \u2192 [comps_exits](financials/comps_exits.md) (this is not a generational company on the wedge alone, and the file says so).\n\n**Engineer** \u2014 [whitepaper](tech/whitepaper.md) \u00a75 (the RPA argument, corrected three times) \u2192 [deep_dives](tech/deep_dives.md) (DD1 is the only research bet) \u2192 [architecture/D06](tech/architecture/D06.md) (the privacy boundary the security review is about) \u2192 [not_vaporware](tech/not_vaporware.md) (what ships this quarter and what does not).\n\n**Operator** \u2014 [PRD](product/PRD.md) \u2192 [features_prioritized](product/features_prioritized.md) (the build math that does not close, stated) \u2192 [journeys/day_in_life](product/journeys/day_in_life.md) (an incident at 14:20 that verification cannot catch) \u2192 [ux_spec](product/ux_spec.md).\n\n**Practitioner / MSP** \u2014 [journeys/edge_low](product/journeys/edge_low.md) (a technician at a client she has never touched) \u2192 [journeys/beachhead](product/journeys/beachhead.md) (week 1 produces nothing, honestly) \u2192 [pricing](financials/pricing.md) (the first environment is free because it costs you more).\n\n**Skeptic** \u2014 [audit/COVERAGE.md](audit/COVERAGE.md) \u2192 [validation/pivot_log.md](validation/pivot_log.md) (five load-bearing claims that survived authorship and did not survive review) \u2192 [validation/riskiest_assumptions.md](validation/riskiest_assumptions.md) (every row untested).\n\n## Artifact map\n\n| Path | What it holds | Files | Owning skill |\n|---|---|---|---|\n| [BRIEF.md](BRIEF.md) \u00b7 [ASSUMPTIONS.md](ASSUMPTIONS.md) | Founder brief \u00b7 13 decisions and 12 assumptions | 2 | grill-me |\n| [research/](research/) | Landscape, competitor teardown, capability table, dated survey, 36 sources | 5 | startup-research |\n| [strategy/](strategy/) | Market type, positioning, bottom-up sizing, personas, canvases, GTM, petal, channel economics, sales roadmap | 11 | startup-strategy |\n| [product/](product/) | PRD with nine first-principles, 20 flagship features, 61 prioritized, four journeys, thirteen-screen UX spec | 8 | startup-product |\n| [tech/](tech/) | Whitepaper, seven deep dives, 11 Mermaid architecture diagrams, 73 techniques, decision tree, technique\u00d7feature matrix, not-vaporware | 19 | startup-tech |\n| [narrative/](narrative/) | One-pager, technical VC memo, 14-slide deck, working-backwards press release, founder story, mission/vision | 6 | startup-narrative |\n| [validation/](validation/) | Riskiest assumptions, 8-experiment board, discovery guide, get/keep/grow, stage gate, metrics by stage, pivot log, dual MVP, decision-making unit | 9 | startup-validation |\n| [financials/](financials/) | Banded pricing, revenue build, unit economics (both node cases), use of funds, 12-row risk matrix, comps and exits | 6 | startup-financials |\n| [visuals/](visuals/) | 69-row manifest, 20 rendered HTML infographics, 46 image prompts | 2 md + 26 | startup-visuals |\n| [audit/](audit/) | Coverage audit against the manifest | 1 | startup-audit |\n\n## Visual index\n\n**No raster images are rendered** \u2014 no text-to-image tool existed in this run, so the 46 prompts in [visuals/image_prompts.md](visuals/image_prompts.md) are pending. The pack's visual layer is 20 self-contained HTML infographics, each carrying real figures from the artifact it cites:\n\n| | Takeaway |\n|---|---|\n| [V02 \u00b7 Positioning map](visuals/infographics/V02_positioning-map.html) | Three quadrants are crowded; the fourth was empty for a reason that expired in 2024 |\n| [V09 \u00b7 Bottom-up SAM](visuals/infographics/V09_sam-build.html) | A defended $179M SAM, with its two softest assumptions named |\n| [V10 \u00b7 Evidence ledger](visuals/infographics/V10_evidence-ledger.html) | Every company-killing assumption untested; three of four cost under $2,000 |\n| [V11 \u00b7 Hours per environment](visuals/infographics/V11_hours-per-environment.html) | The first environment costs more, not less. We do not charge for it |\n| [V14 \u00b7 Use of funds](visuals/infographics/V14_use-of-funds.html) | 0.5% of the round can invalidate the other 99.5% |\n| [V15 \u00b7 Risk matrix](visuals/infographics/V15_risk-matrix.html) | Four residuals stay high; one has no mitigation at all |\n| [V16 \u00b7 Revenue quality](visuals/infographics/V16_revenue-quality.html) | 73% of three-year revenue is one-time |\n| [V18 \u00b7 Banded pricing](visuals/infographics/V18_banded-pricing.html) | The fee's justification has failed arithmetic twice |\n| [V19 \u00b7 Decision-making unit](visuals/infographics/V19_decision-unit.html) | A deal signed by the owner can still fail three times over |\n| [V20](visuals/infographics/V20_journey-edge-low.html) \u00b7 [V21](visuals/infographics/V21_journey-beachhead.html) \u00b7 [V22](visuals/infographics/V22_journey-edge-high.html) \u00b7 [V23](visuals/infographics/V23_day-in-life.html) | The four journeys, component by component |\n| [V24 \u00b7 Thirteen screens](visuals/infographics/V24_thirteen-screens.html) | Two screens decide adoption, and neither is a dashboard |\n| [V25 \u00b7 Feature tiers](visuals/infographics/V25_feature-tiers.html) | The Now tier is the whole bet, and its floor is ~40 weeks |\n| [V26 \u00b7 Technique matrix](visuals/infographics/V26_technique-matrix.html) | Two orphan techniques turned out to be missing safety features |\n| [V28](visuals/infographics/V28_experiment-board.html) \u00b7 [V29](visuals/infographics/V29_stage-gate.html) \u00b7 [V30](visuals/infographics/V30_metrics-by-stage.html) \u00b7 [V31](visuals/infographics/V31_pivot-log.html) | Experiments, gate, metrics, and what has already been killed |\n\nThree further rows render live from their source: [D01](tech/architecture/D01.md), [D06](tech/architecture/D06.md) and the [decision tree](tech/techniques/decision_tree.md) ship Mermaid.\n\n## Top 5 sharpest claims\n\n1. **The market split the problem in half and left the join manual.** Discovery tools record work and emit a diagram a human must implement; resolution tools execute but must be configured. Both halves are mature. [S5] [S8] [S10] \u2014 [research/landscape.md](research/landscape.md)\n2. **Deployment friction is the incumbent's revenue, not its defect.** ServiceNow implementation runs 3\u20135\u00d7 the annual licence, so self-onboarding cannibalises the larger half of its own deal. [S20] \u2014 [research/competitors.md](research/competitors.md)\n3. **The first environment costs more than doing nothing** \u2014 31\u201346 hours against a 25\u201340 baseline \u2014 so we waive it. Compression begins at environment 2. [S21] \u2014 [product/journeys/beachhead.md](product/journeys/beachhead.md)\n4. **There is no 10\u00d7.** The claim was withdrawn when its baseline turned out to be hours nobody spends. What survives is one ~1.4\u00d7 multiplier, one negative, and three effects that are not multipliers. \u2014 [tech/whitepaper.md](tech/whitepaper.md)\n5. **The core mechanism has no benchmark and no named prior system**, and the falsifying number is declared in advance: below ~70% cross-environment transfer, the company is materially smaller and says so. \u2014 [research/capability_table.md](research/capability_table.md) row 5\n\n## Completeness\n\n`PARTIAL`. 59 of 61 required artifacts are present with no stubs, and property 0 passes on all 68 \u2014 after this audit found and fixed eleven failures. **Two manifest rows are open: dossier illustration coverage (37 of 58 artifacts have prompts but no rendered image) and the website phase, which has not been run.** More importantly, **only one of eight generated layers has passed its critic gate**; narrative, validation, financials and visuals have never been reviewed at all. The critic loop is where this pack found its real errors \u2014 five load-bearing claims survived authorship and did not survive scrutiny \u2014 so the unreviewed layers should be read as drafts. Row-by-row status, the property-0 result and the priority draw order are in [audit/COVERAGE.md](audit/COVERAGE.md).\n"}, "research/capability_table.md": {"g": "Research", "t": "Enabling-technology capability table \u2014 as of 2026-09-04", "md": "# Enabling-technology capability table \u2014 as of 2026-09-04\n\n> **What this is** \u2014 the state of the art in each capability Understudy's core loop depends on, with measured performance, cost direction, and the gap between what is published and what the product needs.\n> **Why it exists** \u2014 \"why now\" is the claim investors check hardest, and it is only defensible if each link in the loop is independently at or above threshold today. This table is also where the product's honest ceiling is set: two links are not yet strong enough for the autonomy the brief's phase 4 describes.\n> **How to read it** \u2014 the Gap column is the important one. A skeptic should go straight to rows 2 and 3, where the benchmark headline and the real-workflow number diverge sharply.\n> **Depends on / feeds** \u2014 cites [sources.md](sources.md); feeds `tech/whitepaper.md`, `tech/not_vaporware.md`, `strategy/market_type.md`, `validation/riskiest_assumptions.md`.\n\n| # | Capability | Best current system | Measured performance | Cost trend | Fit to the loop | **Gap** |\n|---|---|---|---|---|---|---|\n| 1 | **UI understanding from screen capture** | Frontier multimodal models; VideoAgentTrek shows unlabeled screen video as a usable training signal [S23] | Sufficient to parse app state and actions from recordings; no standard benchmark for IT-admin surfaces specifically | Falling with general inference (~10\u00d7/yr for fixed capability) [S30] | Feeds `record` | No published accuracy figures on RMM/AD/MDM consoles \u2014 every number here is from general-purpose benchmarks, not IT tooling |\n| 2 | **Multi-step UI execution** | Qwen3.8 Max 86.1%; Claude Fable 5 / Mythos 5 at 85% on OSWorld-Verified (2026-09-02) [S14] | 12% (Apr 2024) \u2192 85% (Jun 2026) [S15] | Falling | Feeds `execute` | **The headline is not the operating number.** The same analysis reports these agents still **fail ~80% of real workflows** [S15] |\n| 3 | **Long-horizon task completion** | Best frontier system on OSWorld 2.0: **20.6%**, median task = 1.6 human-hours [S16] | Four-fifths of long tasks incomplete | Improving, rate unclear | Governs how much of a ticket runs unattended | **This is the binding constraint on the whole product.** Phase-4 autonomy is not supportable at 20.6%; the ladder must stop at governed execution for now |\n| 4 | **Demonstration \u2192 reusable workflow** | ALLOY [S22] | Beat prompt-based agents and manual workflows on intent capture, cognitive load and generalization in a user study | n/a (research) | **The core mechanism** | Validated at user-study scale only. No published evidence of cross-*environment* transfer \u2014 which is assumption A8, the moat |\n| 5 | **Procedure clustering / deduplication** | No named system or benchmark found | \u2014 | \u2014 | `cluster` step | **Unevidenced.** The riskiest assumption sits precisely where the literature is thinnest; this is the founder's to prove, not to cite |\n| 6 | **Portable skill representation** | `SKILL.md` / Agent Skills, Apache 2.0, 26+ platforms [S24] | Progressive disclosure: discovery \u2192 activation \u2192 execution | Free, open | Where a clustered procedure lands | Solved, and genuinely new \u2014 it did not exist for FortressIQ in 2019. Also means no lock-in from the format itself |\n| 7 | **Spoken-reasoning capture** | Commodity ASR | High accuracy, cents per hour | Falling | Captures the *why* a screen recording misses | Mature; not a differentiator, and the weakest-value part of the capture stack |\n| 8 | **Agent identity & governed action** | Enterprise IdP support for non-human principals; approval-gate patterns | No benchmark; a compliance surface rather than a capability | \u2014 | Attribution, destructive-action gates | Table stakes for the security review that gates every MSP deal; not a moat |\n| 9 | **Inference economics** | \u2014 | GPT-4-class $30/M (2023) \u2192 <$1/M (2026); ~10\u00d7/yr for fixed capability, median 50\u00d7 per Epoch [S30] | Falling hard | Makes hours of recording tractable to process | Favourable, and it favours competitors equally |\n\n## What the table actually says\n\n**Three of nine links are new since 2023, and they are the right three.** Execution (2), demonstration-to-workflow (4) and a portable skill format (6) are what FortressIQ lacked in 2019 \u2014 it could record, and had nowhere to send the result but a human. The why-now is real and it is specific.\n\n**But the loop is gated by row 3, not row 2.** The brief's four-phase ladder ends in autonomous resolution; long-horizon completion at 20.6% [S16] does not support that within a credible roadmap window. The pack should claim what rows 2\u20133 support \u2014 **discovery and governed, supervised execution with human escalation** \u2014 and treat full autonomy as a direction, not a deliverable. Claiming otherwise is the fastest way to fail the critic panel and, later, a technical diligence call.\n\n**Row 5 is the company.** The clustering step \u2014 turning many messy recordings of the same procedure into one reliable, reusable skill \u2014 has no benchmark, no named system, and no published evidence. That is simultaneously the risk (nothing to cite) and the opportunity (nothing to copy). It is correctly identified in the brief as the assumption that kills the company if wrong.\n\n**Recommended next 3:** (1) benchmark on-node quantised typing against a frontier model on real admin surfaces \u2014 row 1 has no published accuracy for RMM/AD/MDM consoles and D6 now depends on it; (2) track OSWorld 2.0 rather than OSWorld-Verified, since row 3 is the binding constraint and the headline benchmark is not; (3) re-check row 5 before each raise \u2014 the day someone publishes a procedure-clustering benchmark, this company's core bet becomes checkable by outsiders.\n"}, "research/competitors.md": {"g": "Research", "t": "Competitor teardown", "md": "# Competitor teardown\n\n> **What this is** \u2014 a teardown of every system competing for the budget Understudy wants, including the two that are not products: doing nothing, and the dominant manual workaround.\n> **Why it exists** \u2014 positioning is chosen against a map, and the founder's map had three names on it. This file replaces it with a sourced one, and locates the axes that actually divide the space so `strategy/positioning.md` picks a quadrant rather than a slogan.\n> **How to read it** \u2014 the table is the evidence; the positioning read below it is the argument. A skeptic should attack the claim that the two axes named here are the ones buyers actually decide on.\n> **Depends on / feeds** \u2014 cites [sources.md](sources.md) and [landscape.md](landscape.md); feeds `strategy/positioning.md`, `strategy/petal_diagram.md`, `narrative/vc_memo.md`, `financials/comps_exits.md`.\n\n## The teardown\n\n| Competitor | Segment | Mechanism | Pricing | Funding / stage | Traction signal | Where it wins | Where it fails *mechanistically* |\n|---|---|---|---|---|---|---|---|\n| **Ravenna** [S1][S2][S3][S4] | Mid-market internal IT, Slack-first | Agentic ITSM; customer-authored visual workflows executing across connected tools | Not public (quote) | $15M pre-seed+seed, seed closed ~2025-04-24 (Madrona, Khosla); founders ex-Zapier AI eng. and ex-AWS GTM [S4] | Design partners Futureverse, Homebase, Zapier | Genuinely agentic execution; adoption where work already lives | **The environment is still described to it.** A workflow builder is configuration with a nicer surface \u2014 the knowledge must already be explicit in someone's head |\n| **Atomicwork** [S12] | Enterprise + mid-market IT | \"No ticket\" agentic resolution in Slack/Teams | Not public | $25M Series A Jan 2025; $40.3M total | Khosla-backed, enterprise logos | Funding depth, enterprise motion | Same: configured, not taught |\n| **Moveworks / ServiceNow** [S26] | Enterprise (5k+) | AI assistant + enterprise search, now inside the platform of record | Enterprise contract | Acquired **$2.85B**, closed Dec 2025 | ~5M employee users; ~250 mutual customers | Distribution through the incumbent; the category's exit proof | Enterprise-shaped; **consolidation vacated the independent mid-market**, and ServiceNow's economics depend on configuration revenue |\n| **Aisera / Espressive** [S13] | Enterprise ITSM/ESM | Conversational deflection + workflow automation | Not public | $164.5M / $53M raised | Long customer lists | Incumbency in the prior generation | Deflection-era architecture; heavy services to deploy |\n| **ServiceNow (direct)** [S3][S20] | Enterprise | Platform of record; configuration is the product | $150\u2013300+/fulfiller/mo; implementation **3\u20135\u00d7 license** | ~$160B public co. | Category default | **Deployment friction is its revenue, not its defect.** Structurally cannot attack its own services economics \u2014 and per its own lead investor, \"completely inappropriate\" below enterprise [S3] |\n| **UiPath Task Mining / Celonis** [S8][S9] | Enterprise process teams | Record desktop or mine logs \u2192 process maps \u2192 automation candidates | Enterprise | Public / late-stage | Enterprise-proven discovery | **Output is a diagram.** The executor it feeds is RPA, which fails 30\u201350% of projects with maintenance at up to 60% of cost [S10][S11] |\n| **FortressIQ** [S5][S6][S7] | \u2014 (absorbed) | Computer vision over employee work \u2192 process intelligence | \u2014 | Acquired Dec 2021 | \u2014 | Proved recording knowledge work is feasible at enterprise scale | **The historical warning.** Same input, no executor available in 2021; the output was analysis, and it ended as a feature inside an RPA vendor |\n| **Strawberry** [S25] | Prosumer / SMB knowledge work | Agentic browser companions that learn workflows by use | Not public | $6M, Oct 2025 (General Catalyst, EQT) | Launched product | Learns from the user, executes directly | **Browser-only** \u2014 most IT work is RMM consoles, AD, terminals, MDM, native admin UIs |\n| **\"Do nothing\"** [S21] | \u2014 | Engineers absorb onboarding as billable project work | 40\u201380 engineer-hours/client | \u2014 | Universal | Zero adoption risk; already budgeted | Cost recurs per client forever; knowledge stays in heads and leaves with them |\n| **Documentation + scripts (IT Glue/Hudu + RMM)** | The real workaround | Humans write the environment down; engineers script the top tasks | Bundled in MSP stack | \u2014 | Near-universal at MSPs | Cheap, familiar, no procurement | **Passive artifacts.** Documentation does not execute, and is stale the week after it is written |\n\n## Positioning read\n\n**The two axes that actually divide this space are not price and quality.** From the teardown, every system takes a position on:\n\n1. **How the system acquires environment knowledge** \u2014 *configured by a human* (Ravenna, Atomicwork, Aisera, ServiceNow) vs. *observed from work being done* (FortressIQ, UiPath Task Mining, Strawberry, Understudy).\n2. **What the system does with that knowledge** \u2014 *produces an artifact for a human* (task mining, documentation platforms) vs. *executes it directly* (AI service desks, agentic browsers).\n\nPlacing everything on those axes:\n\n```\n                      EXECUTES DIRECTLY\n                              |\n   Ravenna \u00b7 Atomicwork       |        [ open quadrant ]\n   Aisera \u00b7 ServiceNow        |         Understudy\n   Moveworks                  |         (Strawberry, browser-only,\n                              |          sits at the boundary)\n  CONFIGURED \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500-+\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 OBSERVED\n   BY A HUMAN                 |                 FROM WORK\n                              |\n   IT Glue \u00b7 Hudu             |        FortressIQ\n   runbooks                   |        UiPath Task Mining \u00b7 Celonis\n                              |\n                    PRODUCES AN ARTIFACT\n```\n\n**The white space is the observed \u00d7 executes quadrant, and it is empty for a reason that has expired.** Three of the four quadrants are crowded. The fourth required an executor reliable enough to act on an observed procedure, which did not exist until computer-use agents crossed their threshold [S14][S15] and skills got a portable format [S24]. Strawberry is the only company approaching it, from the browser, at $6M.\n\n**Positioning statement (draft, for `strategy/positioning.md` to sharpen):** *For MSPs onboarding client environments, Understudy is the only service desk that learns the environment by watching engineers work \u2014 because a recorded session becomes an executable skill, not a diagram someone still has to implement.*\n\n## What the incumbents do about it\n\n- **ServiceNow** buys rather than builds in this category and has just spent $2.85B doing so [S26]. It could add discovery \u2014 but its services economics run on configuration [S20], and a serious self-onboarding capability cannibalizes the implementation revenue that is 3\u20135\u00d7 its license line. That is a real structural inhibition, not wishful thinking, though it is not permanent.\n- **Ravenna and Atomicwork** are the genuine threat: same buyer instinct, real funding, and adding recording-based discovery is a product decision rather than a business-model conflict. **Understudy's defensibility cannot be the idea; it has to be the skill library that compounds** (A8) and the MSP-specific motion the internal-IT-focused players are not running.\n- **UiPath** owns discovery and has every reason to point it at a modern executor. Its constraint is that its executor is RPA and its buyer is the enterprise process team, not IT service delivery.\n\n**Recommended next 3:** (1) get real pricing from an MSP who has quoted Ravenna or Atomicwork \u2014 no vendor publishes, and the anchor is currently the buyer's own cost structure; (2) watch for any competitor shipping recording-based discovery, which is the single announcement that reframes this teardown; (3) re-run the positioning read after the first ten discovery interviews, since the axes were derived from public material rather than from buyers.\n"}, "research/landscape.md": {"g": "Research", "t": "Landscape \u2014 every approach to learning an IT environment", "md": "# Landscape \u2014 every approach to learning an IT environment\n\n> **What this is** \u2014 a survey of every existing way a system comes to know how work is done in an unfamiliar IT environment, ordered from nearest to Understudy's mechanism (record \u2192 cluster \u2192 execute) to farthest.\n> **Why it exists** \u2014 the brief claims deployment friction is an unsolved bottleneck. That claim is only worth building on if nobody has solved it, and *\"nobody does discovery\"* turns out to be wrong: an entire category has recorded employees since 2017. This file establishes what the real, narrower gap is, so the wedge is defended rather than assumed.\n> **How to read it** \u2014 read tier 1 first; it is the uncomfortable one. A skeptic should attack the claim that the record\u2192execute handoff is genuinely open rather than merely unbranded.\n> **Depends on / feeds** \u2014 cites [sources.md](sources.md); feeds [competitors.md](competitors.md), `strategy/positioning.md`, `tech/whitepaper.md`, `narrative/vc_memo.md`.\n\n## The finding that reframes the wedge\n\nThe founder brief states that no AI service desk can learn an environment without months of configuration, implying discovery is unattempted. **It is not.** Recording employees at work to discover their processes is a mature category \u2014 *task mining* / *process discovery* \u2014 with a decade of products and at least one acquisition of a company built on exactly this premise.\n\nWhat no one has done is **close the loop.** The market has cleanly split Understudy's mechanism in half:\n\n- **Discovery tools record work and hand a diagram to a human**, who then builds the automation by hand. The output is a document.\n- **Resolution tools execute work but must be told how**, by a human configuring them. The input is a document.\n\nBoth halves exist. The handoff between them is manual, and it is where the months go. That \u2014 not \"nobody does discovery\" \u2014 is the defensible gap, and it is a stronger claim because it explains *why* the gap persisted: until agents could execute a UI workflow directly, a recording had nowhere to go but a human's to-do list.\n\n## Tier 1 \u2014 Process discovery by recording (nearest mechanism, different output)\n\n| System | Mechanism | Strengths | Measured limits | Gap it leaves |\n|---|---|---|---|---|\n| **FortressIQ** (2017; acquired by Automation Anywhere Dec 2021 [S5][S6]) | Computer vision over employee screen activity \u2192 \"Virtual Process Analyst\" process maps | The original proof that recording knowledge work at scale is technically and organizationally possible; claimed ~90% reduction in discovery time [S7] | Output was *analysis*, not execution \u2014 a map for humans to act on. Absorbed into an RPA platform and no longer independently visible [S5] | The recording was never converted into something that could run |\n| **UiPath Task Mining** [S8][S9] | Desktop capture of clicks and keystrokes \u2192 task-flow diagrams \u2192 candidates for RPA | Native path from discovery into UiPath Studio; enterprise-proven | Produces automation *candidates*; a human still builds each bot. Scoped as time-boxed projects, not continuous | Same handoff \u2014 diagram to human to bot |\n| **Celonis** [S8] | Process mining from system transaction logs rather than the desktop | Sees the whole cross-system process; strong where ERP logs are rich | Blind to work that happens *between* system transactions \u2014 which is where IT support lives | Log-shaped, not screen-shaped; IT ticket work leaves thin logs |\n\n**Why this tier's output could not become execution.** The automation these tools fed was RPA, and RPA's record is poor on exactly this axis: **30\u201350% of projects fail to meet expectations** [S10], bots are brittle against UI change, and **maintenance runs up to 60% of total implementation cost** [S11]. Discovery worked; the executor it fed was the weak link. That is the specific thing that changed.\n\n## Tier 2 \u2014 AI-native service desks (same buyer, opposite half of the loop)\n\n| System | Mechanism | Strengths | Measured limits | Gap it leaves |\n|---|---|---|---|---|\n| **Ravenna** ($15M seed, Apr 2025) [S1][S2][S3] | Slack-native agentic ITSM; visual workflow builder; agents execute across connected tools | Genuinely agentic execution (e.g. Okta password reset end to end); fast to adopt where Slack is the workplace | Workflows are **authored by the customer** in a builder. Resolution claims (35\u201360%, \u221270% tickets) are vendor-published and unverified [S1][S2] | Someone still has to know and encode the environment |\n| **Atomicwork** ($25M Series A, Jan 2025; $40.3M total) [S12] | \"No ticket\" agentic model \u2014 resolve in Slack/Teams, create a record only on escalation | Well-funded, enterprise-credible, same anti-ServiceNow thesis | Same premise: the agent is configured, not taught | Same |\n| **Moveworks** (acquired by ServiceNow $2.85B, closed Dec 2025) [S26] | Enterprise AI assistant over IT/HR, now inside the incumbent | ~5M employee users; the category's proof of value and its exit comp | Enterprise-scale deployment; now bound to ServiceNow's motion | Consolidation removes the independent mid-market option |\n| **Aisera** ($164.5M), **Espressive** ($53M) [S13] | AI service management across IT/HR/support | Deep funding, long customer lists | Prior-generation conversational deflection; heavy configuration | Same |\n| **ServiceNow** [S3][S20] | Platform of record; configuration *is* the product | Owns the enterprise; ~$160B company | Implementation costs **3\u20135\u00d7 annual license**, 6\u201312 months for enterprise rollout, $150k\u2013450k services even for SMB ITSM [S20] | Deployment friction is not a bug here \u2014 it is the business model |\n\n## Tier 3 \u2014 Agentic executors that learn from the user\n\n| System | Mechanism | Limits | Gap |\n|---|---|---|---|\n| **Strawberry** ($6M, Oct 2025, General Catalyst + EQT) [S25] | Agentic browser; \"companions\" perform multi-step tasks by clicking and typing, learning user workflows over time | **Browser-only.** IT work spans RMM consoles, AD, terminals, MDM, native admin tools | Confirms the founder's read; the surface is the constraint |\n| Generic computer-use agents (frontier models) | Execute UI workflows from natural-language instruction | No persistence of what was learned; no library; no attribution | Execution without accumulation |\n\n## Tier 4 \u2014 Research systems (the mechanism, unproductized)\n\n- **ALLOY** (arXiv 2510.10049) [S22] \u2014 generates **reusable agent workflows from demonstrations of computer use**, letting users externalize procedural knowledge by doing it once and generalizing it via natural language. In a user study it beat prompt-based agents and manual workflows on intent capture and generalization. This is Understudy's core loop, demonstrated in a lab.\n- **VideoAgentTrek** (arXiv 2510.19488) [S23] \u2014 treats unlabeled screen video as a training signal for computer-use agents, removing the manual-annotation bottleneck in turning recordings into capability.\n\n**Read:** the mechanism is academically live and validated at study scale, and not yet owned by a product. That is the most encouraging finding in this layer \u2014 and also a warning that the idea is visible to everyone reading the same papers.\n\n## Tier 5 \u2014 Classical and manual (what MSPs actually do today)\n\n| Approach | Why it persists | Where it fails |\n|---|---|---|\n| Documentation platforms (IT Glue, Hudu-class) | Structured home for client environment knowledge | Written by hand, stale on arrival, and **passive** \u2014 nothing executes them |\n| RMM/PSA scripting | Real automation for known, repetitive tasks | Written per client per task; the long tail is never worth the engineer-hours |\n| Runbooks and tribal knowledge | Free, immediate, matches reality | Lives in 3 engineers' heads; leaves when they do; **the direct competitor for this company's budget** |\n| Onboarding as a services project | Billable, understood | **4\u20136 weeks and 40\u201380 engineer-hours per client** [S21], paid before a ticket is deflected |\n\n## Tier 6 \u2014 Emerging hybrid (the opening)\n\nTwo things landed within roughly 18 months of each other: computer-use agents crossed from 12% to ~85% on OSWorld [S14][S15], and `SKILL.md` became a **cross-vendor open standard** adopted by 26+ platforms [S24]. Together they mean a recorded procedure now has both an executor and a portable, auditable place to live. Neither existed when FortressIQ was recording employees in 2019.\n\n**The honest counterweight, stated here rather than buried:** the same source reporting 85% on OSWorld also reports that these agents **fail roughly 80% of real workflows** [S15], and on the long-horizon OSWorld 2.0 the best frontier system completes **20.6%** [S16]. The executor is newly good enough to be interesting and not yet good enough to be trusted unattended \u2014 which is precisely why the brief's four-phase ladder (simulate \u2192 govern \u2192 autonomous) is the right shape and why phase 4 cannot be promised on a near-term roadmap.\n\n**Recommended next 3:** (1) verify the \"no one closes the loop\" claim quarterly \u2014 it is the wedge, and it is one competitor announcement away from being false; (2) find out what happened to FortressIQ's product and customers after January 2022, since it is the closest analogue and its post-acquisition fate is a marked gap; (3) re-check tier 4 for new demonstration-to-workflow papers before each fundraise \u2014 the mechanism is academically live and visible to everyone reading the same literature.\n"}, "research/sources.md": {"g": "Research", "t": "Sources", "md": "# Sources\n\n> **What this is** \u2014 the numbered citation index for every fact in the research layer. Each entry carries what it supports and the date it was accessed.\n> **Why it exists** \u2014 the pack's central discipline is that a number either traces to a source here or is tagged `(assumption)`. Without this file the discipline is unenforceable and the pack becomes assertion; with it, a skeptic can check any claim in one hop.\n> **How to read it** \u2014 follow the `[Sn]` tag from wherever you met the claim. Note the authority column: vendor marketing and analyst benchmarks are not equal evidence, and several key numbers here are the former.\n> **Depends on / feeds** \u2014 produced by `startup-research`; every artifact in this pack cites it.\n\nAll accessed **2026-09-04** unless noted. S35\u2013S36 are cited from the standing human-factors literature rather than from a 2026 web search. Authority: **P** primary (company/press release/paper) \u00b7 **A** analyst/benchmark \u00b7 **V** vendor marketing \u00b7 **J** journalism.\n\n| ID | Source | Auth | Supports |\n|---|---|---|---|\n| S1 | [Ravenna](https://ravenna.ai/) \u2014 product & platform pages | V | Slack-native agentic ITSM positioning; workflow builder; claimed 35\u201360% autonomous resolution, $13\u2192$5\u20138 per ticket |\n| S2 | [Ravenna, \"Raises $15M to Build the Future of Internal Support\"](https://ravenna.ai/blog/ravenna-raises-15m-to-build-the-future-of-internal-support) | P | $15M pre-seed+seed; Madrona, Khosla, Founders' Co-op; design partners Futureverse, Homebase, Zapier; claimed ticket volume \u221270% |\n| S3 | [Madrona, \"Why We Invested in Ravenna\"](https://www.madrona.com/ravenna-ai-native-service-management/) \u2014 2025-04-23 | P | \"ServiceNow is completely inappropriate for growth, mid-market, and startup companies\"; ServiceNow ~$160B; mid-market gap thesis |\n| S4 | [GeekWire, \"Khosla and Madrona back a Seattle startup reimagining internal help desk\"](https://www.geekwire.com/2025/khosla-and-madrona-back-a-seattle-startup-reimagining-internal-help-desk-support/) \u2014 2025 | J | Round date (seed closed ~2025-04-24); founders Taylor Halliday (ex-Zapier AI eng.), Kevin Coleman (ex-AWS GTM) |\n| S5 | [Automation Anywhere press room \u2014 acquisition of FortressIQ](https://www.automationanywhere.com/company/press-room/automation-anywhere-to-acquire-fortressiq-to-reimagine-intelligent-automation) \u2014 2021-12-23 | P | FortressIQ acquired; process discovery folded into an RPA platform |\n| S6 | [TechCrunch, \"Automation Anywhere expands into process discovery with FortressIQ\"](https://techcrunch.com/2021/12/23/automation-anywhere-expands-into-process-discovery-with-fortressiq-acquisition/) \u2014 2021-12-23 | J | Deal framing; FortressIQ's computer-vision recording of employee work |\n| S7 | [VentureBeat, \"Automation Anywhere acquires FortressIQ to boost process mining\"](https://venturebeat.com/ai/automation-anywhere-acquires-fortressiq-to-boost-process-mining) \u2014 2021-12 | J | FortressIQ \"Virtual Process Analyst\"; claimed ~90% reduction in discovery time; weeks-not-months claim |\n| S8 | [Flobotics, task mining tools: UiPath vs Celonis vs KYP.ai](https://www.flobotics.io/blog/task-mining-tools) | V | UiPath Task Mining records desktop clicks/keystrokes \u2192 task-flow diagrams; Celonis reconstructs from system logs |\n| S9 | [KYP.ai, \"Best Task Mining Tools Compared (2026)\"](https://kyp.ai/task-mining-tools-compared/) | V | Task-mining category maturity, limitations, deployment time |\n| S10 | [vSoft, \"Why 40% of RPA Implementations Fail\"](https://blog.vsoftconsulting.com/blog/why-40-of-rpa-implementations-fail-6-ways-to-succeed) (citing EY) | A | 30\u201350% of RPA projects fail to meet expectations; EY cites up to 50% |\n| S11 | [XenonStack, \"Preventing RPA Failures\"](https://www.xenonstack.com/blog/rpa-failures-agentic-process-automation) (citing Forrester) | A | Maintenance up to **60% of total RPA implementation cost**; UI-change brittleness; \"deploy and forget\" |\n| S12 | [Business Standard \u2014 Atomicwork raises $25M](https://www.business-standard.com/companies/start-ups/atomicwork-raises-25-mn-to-transform-enterprise-it-with-agentic-ai-125012801282_1.html) \u2014 2025-01-28 | J | Atomicwork Series A $25M (Khosla, Z47); $40.3M total; \"no ticket\" model |\n| S13 | [eesel AI, \"AI-powered ITSM in 2026: vendor lineup and pricing\"](https://www.eesel.ai/blog/ai-powered-itsm) | V | Category map; Aisera $164.5M raised; Espressive $53M raised |\n| S14 | [BenchLM, OSWorld-Verified leaderboard](https://benchlm.ai/benchmarks/osworld-verified) \u2014 2026-09-02 | A | Top score 86.1% (Qwen3.8 Max); Claude Fable 5 / Mythos 5 at 85% |\n| S15 | [Masood, \"The Hardest Easy Problem in AI: The State of Computer Use Agents\"](https://medium.com/@adnanmasood/the-hardest-easy-problem-in-ai-the-state-of-computer-use-agents-a7e3aea7fa3a) \u2014 2026-07 | J | 12% (Apr 2024) \u2192 85% (Jun 2026) on OSWorld; **agents at 85% on OSWorld still fail ~80% of real workflows** |\n| S16 | OSWorld 2.0 long-horizon results, reported in S15 | A | Best frontier system completes **20.6%**; median task takes a human 1.6h |\n| S17 | [Market.us / Mordor via managed-services market reports](https://market.us/report/managed-services-market/) | A | Global managed services market \u2248 **$424\u2013437B in 2026**; CAGR 9.7\u20139.9% |\n| S18 | [MedhaCloud, \"55 Managed Services Market Statistics for 2026\"](https://medhacloud.com/blog/managed-services-market-statistics-2026) | A | 88% of SMBs use \u22651 MSP; average MSP manages **1,247 endpoints**; average MSP gross margin **52%** (2025), up from 48% (2022) |\n| S19 | [Scopable, MSP pricing per user vs per device](https://scopable.io/blog/msp-pricing-per-user-vs-per-device) \u00b7 [Growth Generators MSP pricing benchmarks 2026](https://www.growth-generators.com/post/the-complete-msp-pricing-guide-2026-benchmarks-models-and-tiers) | A | $100\u2013250/user/month full-stack; SMB-only MSPs average **$185/user/mo**, mid-market/enterprise **$310**; healthy GM 50\u201360% |\n| S20 | [Xurrent, ServiceNow pricing 2026](https://www.xurrent.com/blog/servicenow-pricing) \u00b7 [Apty, ServiceNow implementation cost](https://apty.ai/blog/servicenow-implementation-cost/) | A | Implementation **3\u20135\u00d7 annual license**; 6\u201312 months for enterprise rollout; SMB ITSM builds $150k\u2013450k services; fulfiller seats $150\u2013300+/mo |\n| S21 | [NinjaOne, MSP client onboarding checklist](https://www.ninjaone.com/blog/it-client-onboarding-checklist-for-msps/) \u00b7 [MSP onboarding timeline](https://mspcompanies.us/blog/what-happens-during-msp-onboarding) | V | MSP client onboarding **4\u20136 weeks** typical (2\u20133 small, 8\u201312 complex); **40\u201380 engineer-hours**; automation claimed to cut 30\u201340% |\n| S22 | [ALLOY: Generating Reusable Agent Workflows from User Demonstration](https://arxiv.org/pdf/2510.10049) \u2014 arXiv 2510.10049 | P | Demonstration \u2192 reusable agent workflow; outperformed prompt-based agents on intent capture and generalization in user study |\n| S23 | [VideoAgentTrek: Computer Use Pretraining from Unlabeled Videos](https://arxiv.org/pdf/2510.19488) \u2014 arXiv 2510.19488 | P | Screen video as a training signal for computer-use agents without manual annotation |\n| S24 | [Agent Skills specification](https://github.com/agentskills/agentskills) / agentskills.io | P | `SKILL.md` open standard, Apache 2.0; adopted by 26+ platforms; progressive disclosure (discovery \u2192 activation \u2192 execution) |\n| S25 | [Tech.eu \u2014 Strawberry raises $6M](https://tech.eu/2025/10/14/strawberry-raises-6m-to-make-advanced-ai-automation-intuitive/) \u2014 2025-10-14 | J | Stockholm; $6M led by General Catalyst + EQT Ventures; agentic **browser**; companions learn user workflows over time |\n| S26 | [ServiceNow newsroom \u2014 acquisition of Moveworks](https://newsroom.servicenow.com/press-releases/details/2025/ServiceNow-to-extend-leading-agentic-AI-to-every-employee-for-every-corner-of-the-business-with-acquisition-of-Moveworks-03-10-2025-traffic/default.aspx) \u2014 announced 2025-03-10, closed 2025-12-15 | P | **$2.85B**, ServiceNow's largest acquisition; Moveworks ~5M employee users; ~250 mutual customers |\n| S27 | [Fixify 2026 IT Help Desk Benchmark Report](https://www.fixify.com/it-help-desk-benchmark-report-2026) | A | Average **$22.50 per resolved incident** (2026) |\n| S28 | [ScreenMeet, IT help desk cost-per-ticket benchmarks](https://www.screenmeet.com/blog/it-help-desk-cost-per-ticket-benchmarks) (citing HDI/MetricNet) | A | Blended CPT **$6\u201340+**; **$15 self-service vs $45 agent-handled**; enterprise $10\u201325; **agent labour = 70\u201380% of cost per ticket** |\n| S29 | [WorkTime EU employee monitoring law 2026](https://www.worktime.com/blog/legal-aspects/12-most-asked-questions-on-eu-employee-monitoring-laws) \u00b7 [QZT GDPR monitoring guide 2026](https://qztsecurity.com/how-to-legally-monitor-employees-in-the-eu-a-complete-gdpr-guide-for-2026/) | A | Consent is a **weak basis** (power imbalance); legitimate interests + Art. 35 DPIA required; works-council co-determination in DE/NL/AT/SE; **continuous screen recording generally treated as disproportionate** |\n| S30 | [a16z, \"LLMflation\"](https://a16z.com/llmflation-llm-inference-cost/) \u00b7 [Epoch AI, LLM inference price trends](https://epoch.ai/data-insights/llm-inference-price-trends) | A | Cost for fixed capability falling ~10\u00d7/yr (Epoch: 9\u00d7\u2013900\u00d7, median ~50\u00d7); GPT-4-class $30/M (2023) \u2192 <$1/M (2026) |\n| S31 | [MSP Launchpad, US MSP market statistics](https://www.msplaunchpad.com/blog-posts/msp-market-statistics) \u00b7 [manageditsvc, \"How many MSPs are there in the US?\"](https://manageditsvc.com/how-many-msp-are-there-in-the-us.html) | A | **~40,000\u201350,000 MSPs in the US**; **70% have fewer than 50 employees**; US share \u2248 $120\u2013140B of the managed-services market. No universal registry exists \u2014 estimates vary by counting criteria |\n| S32 | [LTVplus, MSP revenue per technician](https://www.ltvplus.com/msp/msp-revenue-per-technician/) \u00b7 [Pharallax, MSP revenue benchmarks 2026](https://pharallax.ai/guides/msp-revenue-benchmarks-2026/) | A | Revenue per technician **$150\u2013200k**; revenue per employee **$142k** average, $200k+ top quartile; healthy 5\u201310 person MSP = $800k\u20131.5M revenue |\n| S33 | ScalePad 2026 MSP Trends Report, reported in [S32](https://www.ltvplus.com/msp/msp-revenue-per-technician/) | A | **26% of MSPs lack enough staff to service more clients; 22% cannot find skilled technical talent to expand** |\n| S34 | [ScreenMeet IT help desk metrics 2026](https://www.screenmeet.com/blog/it-help-desk-metrics-you-should-be-tracking) \u00b7 [MetricNet, tickets per user per month](https://www.metricnet.com/tickets-per-user-per-month/) | A | IT support teams handle **~492 tickets/month** on average; agent utilization ~48%; tickets-per-user-per-month is the standard volume normaliser |\n| S35 | Lee, J.D. & See, K.A. (2004), \"Trust in Automation: Designing for Appropriate Reliance\", *Human Factors* 46(1) | P | Calibrated trust rather than maximal trust; transparency about capability *and limits* as the calibration mechanism; over- and under-trust both as failures |\n| S36 | Parasuraman, R. & Riley, V. (1997), \"Humans and Automation: Use, Misuse, Disuse, Abuse\", *Human Factors* 39(2) | P | The taxonomy of automation failure modes \u2014 misuse (over-reliance), disuse (rejection of useful automation), abuse (deployment ignoring the human's resulting role) |\n\n## Marked gaps \u2014 searched, not found\n\n- **No public count of MSPs globally.** Directories list curated subsets (one lists 2,102 vetted providers [S18]); no authoritative census exists. `strategy/market_sizing.md` must build bottom-up from endpoint and spend data, not from a provider count.\n- **No independent verification of any AI-ITSM vendor's deflection rate.** Every resolution-rate figure in this layer (Ravenna 35\u201360%, \u221270% ticket volume) is vendor-published [S1][S2]. No third-party benchmark of autonomous IT resolution was found.\n- **No public pricing for Ravenna, Atomicwork, or Moveworks.** All are quote-based; the per-ticket comparison in `financials/pricing.md` must anchor on the HDI/MetricNet cost-per-ticket data [S27][S28] instead.\n- **No authoritative tickets-per-user-per-month figure.** MetricNet defines the metric [S34] but no free, dated benchmark value was found; `strategy/market_sizing.md` carries 0.9/endpoint/month as an explicit `(assumption)` and shows the sensitivity band.\n- **FortressIQ post-acquisition fate is undocumented.** No public teardown of what happened to the product or its customers after January 2022 \u2014 a gap that matters, because it is the closest historical analogue to this company.\n\n**Recommended next 3:** (1) close the four marked gaps in the order they affect the model \u2014 MSP ticket mix first, since it moves SAM \u00b140%; (2) re-access every dated source before any investor conversation, because a 2026 figure quoted in 2027 without re-checking is the cheapest possible own-goal; (3) downgrade any claim whose only support is a vendor-marketing (V) row before it reaches a customer-facing artifact.\n"}, "research/survey.md": {"g": "Research", "t": "Survey: learning executable procedures from observed work \u2014 2026-09-04", "md": "# Survey: learning executable procedures from observed work \u2014 2026-09-04\n\n> **What this is** \u2014 a dated mini survey of the science and engineering behind turning observed human work into machine-executable procedure, from 1980s programming-by-demonstration to 2026 computer-use agents.\n> **Why it exists** \u2014 the whitepaper, the PRD and the VC memo all rest on one scientific claim: that watching work is a sufficient basis for doing it. This is the file those artifacts cite, and it is where the evidence *against* that claim is recorded so the pack argues with the objection rather than around it.\n> **How to read it** \u2014 \u00a75 (evidence for) and \u00a76 (evidence against) are the load-bearing sections; read them as a pair. A skeptic should attack \u00a75's reliance on a single user study.\n> **Depends on / feeds** \u2014 cites [sources.md](sources.md); feeds `tech/whitepaper.md`, `tech/deep_dives.md`, `product/PRD.md`, `narrative/vc_memo.md`.\n\n## Abstract\n\nConverting observed human work into executable automation is a forty-year-old research programme with a poor industrial record. Programming by demonstration produced compelling laboratory systems that generalized badly; process and task mining industrialized the *observation* half at enterprise scale but terminated in documents; robotic process automation industrialized the *execution* half but on brittle, hand-authored scripts that fail in 30\u201350% of projects and consume up to 60% of their cost in maintenance [S10][S11]. Since 2024 three capabilities have arrived together \u2014 multimodal agents that operate real UIs, methods that synthesize reusable workflows from demonstrations, and an open portable format for procedural knowledge \u2014 which for the first time permit an observation-to-execution loop with no human transcription step. The evidence that this loop works is real but thin: one peer-reviewed system (ALLOY) validated at user-study scale [S22], against a benchmark record showing that the same agents scoring 85% on standard tasks fail approximately 80% of real workflows [S15] and complete 20.6% of long-horizon ones [S16]. The open question is not whether a procedure can be learned from a demonstration, but whether procedures learned in one environment transfer to another \u2014 which is unaddressed in the literature and is the commercial crux.\n\n## 1. Classical foundations\n\n**Programming by demonstration (PbD).** The founding idea: a user performs a task once and the system infers a general program. The persistent failure is generalization \u2014 inferring which parts of the demonstration are essential and which are incidental to that run. Systems worked in constrained domains and degraded sharply outside them. Understudy inherits this problem exactly, with one modern advantage: a language model can be asked *why* a step was taken, and the brief's spoken-reasoning capture is a direct attack on the incidental-vs-essential problem that sank classical PbD.\n\n**Process mining.** Reconstructs the real process from system event logs rather than from what anyone believes happens. Mature, enterprise-standard, and structurally limited: it sees what systems record. IT support work is thinly logged and happens largely *between* transactions [S8].\n\n**Task mining.** The desktop-level answer to that limit \u2014 capture clicks, keystrokes and screens directly [S8][S9]. FortressIQ built a company on it with computer vision from 2017 and was acquired into an RPA vendor in December 2021 [S5][S6][S7]. This is the closest historical analogue to Understudy and its most instructive one.\n\n**RPA.** The executor that discovery fed for a decade. Its measured record is the strongest available evidence about what happens to automation derived from observed work: **30\u201350% of projects fail to meet expectations** [S10]; bots break on UI change; **maintenance reaches 60% of total implementation cost** [S11]. Any claim that Understudy's skills will be durable must explain why they are not RPA scripts with a language model in front.\n\n## 2. Taxonomy of approaches\n\n| Class | Acquires knowledge by | Produces | Representative |\n|---|---|---|---|\n| Log-based mining | System event logs | Process model | Celonis |\n| Desktop task mining | Screen/click capture | Task diagram, automation candidates | UiPath Task Mining, FortressIQ |\n| Hand-authored automation | Human encoding | Executable script/bot | RPA, RMM scripts |\n| Configured agentic | Human encoding in a builder | Executing agent | Ravenna, Atomicwork, Moveworks |\n| **Demonstration-to-workflow** | **Observed work** | **Executable, reusable workflow** | **ALLOY [S22]; Understudy** |\n| Instructed agentic | Natural-language instruction at run time | Ephemeral execution | Frontier computer-use agents |\n\nThe last-but-one row is the only one that closes observation to execution without a human transcription step, and until 2024 it had no viable
