tters enormously (see below) |\n| **3. Service desk / ITSM software** | ConnectWise, Ravenna, Atomicwork | `(assumption: $50\u2013100/tech/mo \u2192 ~$20\u201340k/yr per MSP; ~$240\u2013480M across the 12,000-MSP band)` | Only if we replace the desk, which we do not initially. Early on we sit beside it | Medium \u2014 displacement, not addition, is a later fight |\n| **4. Documentation & knowledge management** | IT Glue, Hudu | `(assumption: $30\u201350/tech/mo \u2192 ~$12\u201320k/yr per MSP; ~$144\u2013240M across the band)` | Our library makes their documentation partly redundant \u2014 but the budgets are small and the switch is emotional (years of accumulated content) | Medium |\n| **5. Process discovery / task mining** | UiPath, Celonis, FortressIQ's heirs | **$0 at MSPs** \u2014 enterprise licences, not an MSP line item at all | We do their job for a segment they do not serve, at a price the segment can pay | **Not a petal.** A pool you cannot draw a budget from is a competitor, not a source market \u2014 retained here only to record that it was considered and rejected |\n| **6. Automation tooling** | RPA vendors, RMM scripting | Bundled in the RMM stack \u2014 **no discrete budget**; the real spend is engineer time writing scripts `(assumption: 2\u20135 hrs/week/MSP)` | We displace the scripting effort, not the RMM licence | Medium |\n\n## Honest labelling\n\nPetals 1 and 2 have **no incumbent vendor** \u2014 they are displaced internal cost pools, not markets with a defender. Petal 5 has **no MSP budget at all** and is retained only as a considered-and-rejected row. Blank's petal asks which adjacent markets supply customers; for this company the honest answer is that the two largest pools are internal costs, which is unusual and worth stating plainly rather than dressing as markets.\n\n**Sized total of the genuinely addressable pools:** petals 1 + 3 + 4 \u2248 **$520M\u2013$935M/yr** across the 12,000-MSP serviceable band `(assumption-heavy \u2014 every figure above except the engineer-hours [S21] and the revenue/tech benchmark [S32] is an assumption)`. That is the ceiling on what could ever be redirected to us in this segment, and it brackets the $179M SAM in [market_sizing.md](market_sizing.md) sensibly: we are claiming roughly a fifth to a third of the displaceable pool, not all of it.\n\n## What the petal says that the 2\u00d72 did not\n\n**The primary budget is petal 1, and it is not a software budget at all** \u2014 it is unbilled engineer time. That is unusually good news: no incumbent vendor loses a renewal when we win, so there is no defender, and the buyer feels the cost monthly without having chosen to spend it. It is also a warning: **a leak is not a line item.** Marcus has no \"onboarding software\" budget code, so the first sale is a *creation* of budget, justified against hours, which is exactly why the ROI arithmetic must be on the first slide and denominated in engineer-hours rather than in tickets.\n\n**Petal 2 is the most dangerous to name out loud.** \"Cheaper than a technician\" is true, converts well with owners, and poisons the well with Dana, Priya and Ray \u2014 the three people whose cooperation the recording programme requires ([value_prop_canvas.md](value_prop_canvas.md)). **Positioning must draw from petal 2's budget while telling petal 1's story.** That is not spin: the honest claim is that we let an MSP take the client they could not staff, which is additive, not substitutive.\n\n**Recommended next 3 moves:** (1) build the ROI calculator in engineer-hours, not tickets, and lead with it; (2) never write \"replaces a technician\" in customer-facing copy, while modelling petal 2 internally in `financials/`; (3) treat petals 3 and 4 as year-two displacement, not year-one positioning.\n"}, "strategy/positioning.md": {"g": "Strategy", "t": "Positioning", "md": "# Positioning\n\n> **What this is** \u2014 the two axes that actually divide this market, where every competitor sits on them, the open quadrant, and the one-sentence positioning statement everything customer-facing inherits.\n> **Why it exists** \u2014 positioning chosen badly sends a pre-seed company to fight $164.5M-funded incumbents on resolution quality, an axis it cannot win. This file commits to the axis where the competition is empty and explains why it stayed empty.\n> **How to read it** \u2014 the axes are the argument; the statement is the output. A skeptic should attack whether buyers actually decide on these axes rather than on price, brand or integration breadth.\n> **Depends on / feeds** \u2014 cites [research/competitors.md](../research/competitors.md), [market_type.md](market_type.md); feeds [value_prop_canvas.md](value_prop_canvas.md), [gtm.md](gtm.md), `narrative/one_pager.md`, `startup-website`.\n\n## The axes \u2014 discovered, not defaulted\n\nPrice \u00d7 quality is not the map here. Every system in the teardown differs on two structural questions:\n\n**Axis 1 \u2014 How does the system acquire knowledge of the environment?** *Configured by a human* \u27f7 *Observed from work being done.*\n**Axis 2 \u2014 What does it do with that knowledge?** *Produces an artifact a human must act on* \u27f7 *Executes it directly.*\n\nThese are the axes because they predict the buyer's actual cost. Axis 1 sets what onboarding costs \u2014 25\u201340 engineer-hours for a median client and 40\u201380 for a complex one [S21], 3\u20135\u00d7 licence at enterprise scale [S20]. Axis 2 sets whether that cost ever converts into resolved work or stops at a document.\n\n## The map\n\n| | **Produces an artifact** | **Executes directly** |\n|---|---|---|\n| **Configured by a human** | IT Glue / Hudu, runbooks, RMM scripts | Ravenna, Atomicwork, Aisera, Espressive, Moveworks/ServiceNow |\n| **Observed from work** | FortressIQ, UiPath Task Mining, Celonis | **\u2190 empty. Understudy.** (Strawberry at the boundary, browser-only) |\n\n**Three quadrants are crowded; the fourth is empty for a reason that expired in 2024.** Acting on an observed procedure required an executor that could work a real UI reliably. Computer-use agents went from 12% to ~85% on OSWorld between April 2024 and June 2026 [S14][S15], and `SKILL.md` became a portable cross-vendor format for the result [S24]. FortressIQ recorded employees from 2017 with no executor to send the output to, and ended as a feature inside an RPA vendor [S5][S6]. Same input, wrong decade.\n\n## Positioning statement\n\n> **For MSPs onboarding client environments, Understudy is the only service desk that learns the environment by watching engineers work \u2014 because a recorded session becomes an executable skill, not a diagram someone still has to implement.**\n\nDecomposed, so every downstream artifact uses the same load-bearing parts:\n\n- **For MSPs onboarding client environments** \u2014 the segment and the moment. Not \"IT teams\"; not \"companies with tickets\".\n- **the only service desk that learns the environment by watching** \u2014 the category we join, and the claim that separates us within it.\n- **because a recorded session becomes an executable skill** \u2014 the mechanism. This clause is why the claim is credible; it must never be dropped for brevity.\n- **not a diagram someone still has to implement** \u2014 the teardown of the adjacent category, in six words.\n\n## What we deliberately do not claim\n\n- **Not \"resolves more tickets than X\".** Resolution quality must be sufficient, not superior (see [market_type.md](market_type.md)). Competing on that axis is competing with Moveworks' distribution and Aisera's balance sheet.\n- **Not autonomy.** Per the binding claim boundary in BRIEF.md (D1): discovery plus governed, supervised execution. Any copy implying unattended resolution is a defect.\n- **Not \"AI-powered\".** Every competitor is. The differentiator is the acquisition axis, not the model.\n\n## The wedge sentence for a 30-second conversation\n\n*\"What does it cost you in engineer-hours to onboard a new client? We watch your engineers do the work once and turn it into skills the desk can run \u2014 so client three onboards faster than client one.\"*\n\nThat question is the positioning working: no incumbent's messaging invites it, and 26% of MSPs are already staff-constrained on exactly this [S33].\n\n## Decision\n\n**Commit to the observed \u00d7 executes quadrant and defend it with the variance envelope, not the skill list.** The idea is visible to anyone reading ALLOY [S22], and the happy-path skills for Okta, M365, AD and Jira are authorable from vendor documentation \u2014 that half of the library is copyable in a quarter and claiming otherwise invites the obvious rebuttal. What is not copyable is the observed distribution of how those procedures actually differ across dozens of real environments, how they fail, and how engineers verify them; that accrues only from deployments. See [lean_canvas.md](lean_canvas.md) \u26a0. **It remains an assumption (A8), not a finding.**\n\n**Recommended next 3 moves:** (1) put the wedge sentence in front of 10 MSP owners and measure whether the onboarding-hours question lands cold; (2) do not publish a resolution-rate number until an independent one exists; (3) name and instrument time-to-first-skill as the category yardstick before a competitor names their own.\n"}, "strategy/sales_roadmap.md": {"g": "Strategy", "t": "Sales roadmap \u2014 organisation, influence, access", "md": "# Sales roadmap \u2014 organisation, influence, access\n\n> **What this is** \u2014 Blank's Customer Validation Phase 1 set: the organisation map of the buyer, the influence map of who actually sways the decision, the access map of how a stranger reaches them, and the sales process with the artifact required at each step.\n> **Why it exists** \u2014 \"we'll sell to MSPs\" hides the fact that nobody has established who signs, who can quietly kill it, and how a founder with no relationship reaches either. For this product the veto sits in two places most maps miss: the engineers being recorded, and the MSP's own client.\n> **How to read it** \u2014 the influence map is the important one; the organisation map is conventional and the access map is tactics. A skeptic should attack whether the client-side veto (Sonia) can be handled without lengthening every deal.\n> **Depends on / feeds** \u2014 cites [personas.md](personas.md), [gtm.md](gtm.md); feeds `validation/decision_making_unit.md`, `validation/discovery_guide.md`, `narrative/one_pager.md`.\n\n## 1. Organisation map \u2014 a 34-person MSP\n\n```\n   Owner / COO  (Marcus)  \u2500\u2500 signs, owns P&L\n        \u2502\n   Service delivery mgr (Dana) \u2500\u2500 owns queue, SLAs, onboarding runbook\n        \u2502\n   \u251c\u2500\u2500 Tier 1 techs (Priya \u00d75)      \u2500\u2500 highest ticket volume\n   \u251c\u2500\u2500 Tier 2 techs (\u00d74)\n   \u2514\u2500\u2500 Principal engineer (Ray)     \u2500\u2500 escalation, deepest env. knowledge\n   \n   [outside the org]  Client IT director (Sonia) \u2500\u2500 approves what runs in their environment\n```\n\n70% of US MSPs have fewer than 50 employees [S31], so this chain is short and the owner is reachable \u2014 the structural advantage of this segment over enterprise ITSM.\n\n## 2. Influence map \u2014 who actually decides\n\n| Role | Formal power | Real influence | What moves them | What they kill it with |\n|---|---|---|---|---|\n| **Marcus** (owner) | **Signs** | High | Engineer-hours saved per client, in dollars | \"Not this quarter\" |\n| **Dana** (delivery mgr) | Recommends | **Highest** \u2014 Marcus asks her before signing | Fewer escalations; a runbook that stays true | \"My team won't use it\" |\n| **Ray** (principal) | None | **Veto from below** | Reading a skill derived from his own session and finding it correct | Quiet non-cooperation; one credible \"this is RPA again\" in the team channel |\n| **Priya** (tier 1) | None | Low individually, decisive in aggregate | Client-specific procedures when she is stuck | Not narrating; working around the capture |\n| **Sonia** (client IT) | **Veto** | Absolute, **and there is one of her per client environment** | A tenant-isolation architecture she can read, plus a clear answer to where raw capture is processed | Security review that never ends |\n\n**The two non-obvious vetoes are both about the recording.** Ray and Priya are the data source; Sonia owns the environment being recorded. **A deal can be signed by Marcus and still fail three times over.** This is why `validation/decision_making_unit.md` treats the engineers as a buying-unit role rather than as users.\n\n### Sonia recurs, and that is the expansion constraint\n\nThe first version treated the client-side security review as a one-time gate cleared by a one-pager. Both halves were wrong, and the second is expensive:\n\n- **A one-pager does not end a review; it opens one.** What actually arrives is a CAIQ or SIG-lite, a SOC 2 Type II report, a pen-test summary, a sub-processor list, a cyber-insurance certificate and a DPA. A design-stage company has none of these, and no artifact in this pack has budgeted for them. **SOC 2 is a 6\u201312 month prerequisite, and it gates the marketplace channel as well** [channel_plan.md](channel_plan.md).\n- **There is one Sonia per client environment, and this business expands per environment.** Removing the *sales* conversation from expansion (step 7) does not remove the *security review*, which is the longer pole at ~6 weeks per environment [personas.md](personas.md) \u00a75. Environment velocity is therefore gated by review throughput, not by selling capacity \u2014 which is what makes the ramp in [market_sizing.md](market_sizing.md) \u00a73 conservative rather than pessimistic.\n- **The question was not the skill library, it was the raw capture \u2014 and it is now answered (D6).** Sonia's actual question is *what leaves my environment?* **Distillation is two-stage (D6, corrected): clustering and abstraction run inside the *MSP's own* tenant \u2014 the boundary where capture actually originates \u2014 and only abstracted variance envelopes carrying no tenant identity reach the vendor. Her recordings never leave her MSP's control, and nothing identifying her tenant reaches us.** That converts her review from a data-transfer assessment \u2014 the kind that stalls for months \u2014 into a boundary-and-egress assessment, which is the kind that closes. It does not remove the review, and the ~6-week figure should be held until measured, but it removes the objection most likely to end it in refusal. **This is an architecture constraint on `tech/architecture/`, not a preference.**\n\n## 3. Access map \u2014 how a stranger reaches them\n\n| Target | Best route | Second route | Does not work |\n|---|---|---|---|\n| Marcus | Peer group / mastermind introduction from another owner | MSP-focused podcast appearance | Cold email (test the floor once, expect <5% [gtm.md](gtm.md)) |\n| Dana | Through Marcus, or MSP delivery-operations communities | Conference session on onboarding cost | Vendor webinars |\n| Ray | **Never sold to \u2014 convinced.** Through a technical write-up of the graceful-degradation mechanism and the E2 experiment (D2) | Open evaluation harness he can run himself | Any pitch framed as automation replacing expertise |\n| Sonia | Through Marcus, with the architecture document attached before her review opens | \u2014 | Reaching her directly; it is the MSP's relationship |\n\n## 4. Sales process and the artifact each step requires\n\n| # | Step | Artifact required | Exit criterion |\n|---|---|---|---|\n| 1 | Peer-group introduction | \u2014 | Booked 30-min call |\n| 2 | Pain conversation (no pitch) | Discovery script `validation/discovery_guide.md` | Onboarding cost named unprompted, in hours |\n| 3 | ROI framing | **Engineer-hours ROI calculator** (their numbers, not ours) | Marcus states a dollar figure back |\n| 4 | Technical credibility | **RPA differentiation write-up + E2 results** (D2) | Ray does not object in the room |\n| 5 | Security clearance *(recurs per environment, ~6 weeks)* | **Tenant-isolation architecture document** + a stated answer on where raw capture is processed. Full evidence pack (SOC 2, pen test, DPA) is a 6\u201312 month prerequisite, not a document | Sonia's review opens with a document rather than a questionnaire, and closes in weeks rather than months |\n| 6 | Design-partner pilot, one environment | **Pilot agreement** \u2014 a named artifact that does not yet exist. Three clauses: (a) *anonymised* publication rights (\"a 34-person Midwest MSP\", never a named client, since the sessions sit under the MSP's own client-confidentiality terms and the number is not purely theirs to give); (b) a **definition of \"resolved ticket\" with an arbitration rule** \u2014 outcome pricing dies in month three on who adjudicates a ticket the agent touched and a human finished; (c) capture scope and retention | One environment onboarded, hours measured |\n| 7 | Convert + expand | Measured time-to-first-skill | Environment #2 without a sales conversation |\n\n**Steps 4, 5 and 6 are the ones a conventional SaaS process omits**, and they are the three most likely to lose the deal. Two are documents that can be written before the first call and do not exist yet; one (the SOC 2 evidence pack) is a 6\u201312 month programme that has to start long before it is asked for.\n\n**Recommended next 3 moves:** (1) write the tenant-isolation document, the RPA differentiation write-up and the pilot agreement before the first pilot conversation \u2014 all three gate early steps and none requires product; (2) specify the envelope schema precisely enough for a security reviewer to audit \u2014 D6's promise is only as strong as the guarantee that an envelope entry carries no tenant identity, and that guarantee is what shortens every review; (3) start the SOC 2 clock early \u2014 it gates both the enterprise-adjacent clients and the marketplace channel, and it cannot be compressed later.\n"}, "strategy/value_prop_canvas.md": {"g": "Strategy", "t": "Value proposition canvas", "md": "# Value proposition canvas\n\n> **What this is** \u2014 Osterwalder's customer-profile (jobs, pains, gains) mapped against the value map (pain relievers, gain creators, products) for the three personas who decide: the payer, the champion, and the veto.\n> **Why it exists** \u2014 it is the artifact that catches a product solving a problem nobody ranks highly. Mapping per persona also exposes where a single feature relieves one persona's pain while creating another's \u2014 which, for a product built on recording people, is the central design tension.\n> **How to read it** \u2014 read Ray's column last and treat it as the adoption gate. A skeptic should check whether every gain creator traces to a real product capability rather than an aspiration.\n> **Depends on / feeds** \u2014 cites [personas.md](personas.md), [positioning.md](positioning.md); feeds `product/PRD.md`, `narrative/one_pager.md`, `startup-website`.\n\n## Marcus (MSP owner \u2014 payer)\n\n| Customer profile | Value map |\n|---|---|\n| **Jobs** \u2014 win clients he can staff; keep revenue/technician above $150k [S32]; protect margin on new logos | **Products** \u2014 discovery run on a new client environment, priced at **$1,500 against the ~25\u201340 engineer-hours it displaces** (D4); plus ~$6 per resolved ticket thereafter |\n| **Pains** \u2014 25\u201340 unbilled engineer-hours per median onboarding, 40\u201380 for complex ones [S21]; turning away business (26% of MSPs [S33]); knowledge loss on attrition | **Pain relievers** \u2014 onboarding cost falls per client *and* falls further with each client as the global layer compounds (A8); knowledge captured as an asset the business owns rather than a person does |\n| **Gains** \u2014 take the next client without hiring; a diligence-friendly asset if he ever sells | **Gain creators** \u2014 the skill library is transferable business value; time-to-first-skill becomes a number he can quote to prospects |\n\n**Top mapping (ranked):** 1. unbilled onboarding hours \u2192 discovery, priced directly against those hours. 2. staffing ceiling \u2192 per-client leverage. 3. attrition risk \u2192 library as owned asset.\n\n**Note the pricing tension:** at $1,500 flat the fee captures 57\u201380% of the median client's displaced cost and approaches 100% for the smallest, where Marcus would rationally decline. The value proposition holds at the median and needs banding at the edges [market_sizing.md](market_sizing.md).\n\n## Dana (service delivery manager \u2014 champion)\n\n| Customer profile | Value map |\n|---|---|\n| **Jobs** \u2014 hold SLAs across 41 clients; keep the runbook true; get tier-1 self-sufficient | **Products** \u2014 the skill library as the runbook of record; client-specific procedures surfaced in the queue |\n| **Pains** \u2014 documentation stale on arrival; the same problem re-solved at three clients; escalations that should not have been | **Pain relievers** \u2014 documentation maintained by observation instead of by nagging; a procedure solved once at any client becomes available at all of them (within the global layer) |\n| **Gains** \u2014 fewer escalations; onboarding a new engineer takes days | **Gain creators** \u2014 reuse rate visible as a metric she can show Marcus |\n\n**Top mapping:** 1. stale documentation \u2192 observed capture. 2. repeated escalations \u2192 library reuse.\n\n## Ray (principal engineer \u2014 edge-high, the veto from below)\n\n| Customer profile | Value map |\n|---|---|\n| **Jobs** \u2014 solve what nobody else can; not be interrupted 14\u00d7/day; not clean up after another failed automation | **Products** \u2014 readable `SKILL.md` text he can inspect and correct; governed execution with approval gates; escalation routing |\n| **Pains** \u2014 constant interruption; two RPA cleanups behind him; **fear that a black box will act wrongly in production with his name on it** | **Pain relievers** \u2014 a skill states the **goal and its success test**, where an RPA step sequence states a **contract against a specific application build**; agent identity gives attribution [BRIEF]; approval gates on destructive actions; **the E2 experiment is the evidence, not a promise** (D2) |\n| **Gains** \u2014 his expertise scales without him repeating it; he works on the genuinely hard 10% | **Gain creators** \u2014 his sessions become the highest-value skills in the library; he becomes the reviewer, which is a role, not a redundancy |\n\n**Top mapping:** 1. black-box fear \u2192 readable skills + gates. 2. RPA scepticism \u2192 the contract-vs-goal mechanism + E2. 3. interruption load \u2192 library absorbs the repeat questions.\n\n**Get the RPA argument technically right, or Ray ends the meeting.** Enterprise RPA has not primarily encoded screen coordinates for over a decade \u2014 UiPath uses attribute-based selectors over the accessibility tree with anchor and CV fallbacks; Blue Prism uses application-modeller attribute matching. Brittleness comes from **selector contracts breaking on application upgrades, unstable dynamic identifiers, timing and synchronisation, configuration drift, and unhandled unhappy paths** \u2014 which is what `research/survey.md` \u00a76 actually says. Saying \"not coordinates\" to a practitioner falsifies the whole pitch in one sentence.\n\n**The defensible claim:** an RPA step is a *contract* \u2014 do this, to this element, in this build \u2014 with no statement of what success looks like, so a break halts the run or, worse, proceeds wrongly. A narrated skill carries the **goal state and a verification step**, so a break becomes a re-grounding search against an intact success criterion. That is a real mechanical difference and it is testable. **It also constrains E2: the baseline must be a selector-based RPA script, not a coordinate-clicking toy, or the experiment is rigged and proves nothing.**\n\n## The tension this canvas exposes\n\n**The same capability that creates Marcus's gain creates Priya's and Ray's pain.** Capturing engineer work is an asset to the business and a threat to the person being captured. No amount of copy resolves that; only product decisions do \u2014 passive capture with visible controls, skills attributed to the engineer who authored them, and the absorbed work being the repetitive tier-1 layer rather than the interesting work. **If the pack ever pitches \"replace your engineers\", the champion and the edge-high persona both become blockers, and they are the ones the data comes from.**\n\n**Recommended next:** design the engineer-facing side of the product \u2014 attribution, review, correction \u2014 as a first-class surface in `product/ux_spec.md`, not an admin afterthought. It is the difference between a data source that cooperates and one that quietly doesn't.\n"}, "product/features_flagship.md": {"g": "Product", "t": "Flagship features \u2014 the 20 that carry the product", "md": "# Flagship features \u2014 the 20 that carry the product\n\n> **What this is** \u2014 the twenty highest-leverage features, each stated as name \u2192 mechanism \u2192 the principle it obeys \u2192 **the visible product moment**, meaning what a user literally sees.\n> **Why it exists** \u2014 feature lists drift into adjectives, and adjectives cannot be built or falsified. The \"visible moment\" column is the discipline: if a feature has no moment, it is infrastructure, and if it maps to no principle in [PRD.md](PRD.md) \u00a75 it should not exist.\n> **How to read it** \u2014 F1\u2013F4 are the company; F13\u2013F16 are the trust surface that decides adoption. A skeptic should attack F2, which has no benchmark in the literature to inherit.\n> **Depends on / feeds** \u2014 inherits [PRD.md](PRD.md); feeds [features_prioritized.md](features_prioritized.md), [journeys/](journeys/), [ux_spec.md](ux_spec.md), `tech/deep_dives.md`, `visuals/`.\n\n## Watch \u2014 capture what is actually happening\n\n**F1 \u00b7 Multi-surface session capture** \u00b7 *Mechanism:* OS-level capture of screen, input events and application/window context across RMM consoles, AD, terminals, MDM and native admin tools. \u00b7 `P1` \u00b7 **Moment:** Priya starts her shift, sees a small capture indicator in the tray, and works normally. Nothing else changes about her day.\n\n**F2 \u00b7 Decision-point narration** \u00b7 *Mechanism:* detects branch points \u2014 a choice between two paths, an unusual value entered, a step skipped \u2014 and prompts for ten seconds of voice at that moment rather than asking for continuous commentary. \u00b7 `P1 P8` \u00b7 **Moment:** Ray picks the second of two AD groups; a quiet prompt asks \"why that one?\"; he says nine words and keeps going.\n\n**F3 \u00b7 Failure and abort retention** \u00b7 *Mechanism:* sessions that ended in escalation or rollback are retained and labelled, because recovery behaviour appears nowhere in successful runs. \u00b7 `P2` \u00b7 **Moment:** a ticket Priya escalates is marked \"kept \u2014 this is the useful kind\", which is also the first time failing has felt productive.\n\n**F4 \u00b7 Engineer capture controls** \u00b7 *Mechanism:* visible indicator, one-click pause, and a post-session review screen before anything is distilled. \u00b7 `P8` \u00b7 **Moment:** Ray pauses capture to open his password manager, and the timeline shows a gap he does not have to explain.\n\n## Distil \u2014 turn sessions into skills\n\n**F5 \u00b7 Cross-session clustering** \u00b7 *Mechanism:* groups recordings of the same procedure across engineers and environments, separating the invariant procedure from environment-specific detail. \u00b7 `P1 P7` \u00b7 **Moment:** twelve recordings of MFA re-enrolment collapse into one skill with three named variants. **This is the company's core bet and has no benchmark in the literature to inherit [capability_table row 5].**\n\n**F6 \u00b7 Skill synthesis with a declared success criterion** \u00b7 *Mechanism:* emits `SKILL.md` carrying goal, preconditions, steps, **a test for \"done correctly\"**, and an escalation envelope. \u00b7 `P3 P6` \u00b7 **Moment:** the skill opens with \"Succeeds when: the user can complete an MFA challenge from a new device\" \u2014 a statement about the goal, where an RPA assertion would state something about the interface.\n\n**F7 \u00b7 Variance envelope extraction** \u00b7 *Mechanism:* records how the same procedure differed across environments and keeps the distribution, not just the modal path. \u00b7 `P7` \u00b7 **Moment:** a skill shows \"observed in 14 environments \u00b7 3 variants \u00b7 2 known deviations\" \u2014 the asset made visible.\n\n**F8 \u00b7 Authorship attribution** \u00b7 *Mechanism:* every skill names the engineers whose sessions produced it, and shows them their contribution. \u00b7 `P8` \u00b7 **Moment:** Ray's name is on the escalation skill the whole team now uses, which is the difference between being mined and being credited.\n\n## Rehearse \u2014 earn trust before acting\n\n**F9 \u00b7 Shadow mode** \u00b7 *Mechanism:* the skill runs against live tickets without acting; its intended actions are compared with what the human actually did. \u00b7 `P5 P9` \u00b7 **Moment:** a weekly digest: \"would have matched you on 34 of 40 tickets\" \u2014 with the six disagreements listed first.\n\n**F10 \u00b7 Deviation report** \u00b7 *Mechanism:* every divergence is routed to the authoring engineer as a specific question, not a metric. \u00b7 `P2 P6` \u00b7 **Moment:** \"On ticket 8812 I would have reset the token; you rebuilt the profile. Which is right?\" \u2014 and the answer becomes part of the skill.\n\n**F11 \u00b7 Promotion ladder** \u00b7 *Mechanism:* a skill moves shadow \u2192 gated \u2192 **supervised** only on evidence thresholds declared in advance, per action class. Naming matters: there is no autonomous rung, per the binding claim boundary (D1). \u00b7 `P5 P9` \u00b7 **Moment:** Dana sees a skill at \"gated \u2014 2 more clean weeks to promote\", and can hold it there indefinitely.\n\n## Gate and Act \u2014 do the work, safely\n\n**F12 \u00b7 Action-class policy** \u00b7 *Mechanism:* read / reversible-write / destructive, with destructive gated regardless of confidence and **not configurable to off**. \u00b7 `P9` \u00b7 **Moment:** a mailbox deletion stops with \"needs your approval\" and a one-line summary of exactly what will happen.\n\n**F13 \u00b7 Agent identity** \u00b7 *Mechanism:* the agent holds its own principal in the client's IdP, so every action is attributable in the client's own audit log. \u00b7 `P8 P9` \u00b7 **Moment:** Sonia opens her audit log and sees a named non-human principal, not a shared admin account.\n\n**F14 \u00b7 Envelope enforcement** \u00b7 *Mechanism:* an action outside the skill's declared preconditions escalates instead of improvising. \u00b7 `P5` \u00b7 **Moment:** \"This tenant has conditional access I haven't seen before \u2014 routing to Ray.\"\n\n**F15 \u00b7 Test-account self-exploration** \u00b7 *Mechanism:* bounded, read-only-by-default discovery of the environment beyond what was recorded. \u00b7 `P1 P4` \u00b7 **Moment:** the agent maps a tenant's group structure overnight and reports what differs from the twelve it already knows.\n\n## Verify and Learn \u2014 checking the goal, not the interface\n\n**F16 \u00b7 Success-criterion verification** \u00b7 *Mechanism:* every action ends by testing its declared criterion; a passing action is one that was *checked*, not one that did not error. \u00b7 `P3 P9` \u00b7 **Moment:** \"Reset complete \u2014 verified by signing in as the test principal.\"\n\n**F17 \u00b7 Re-grounding on change** \u00b7 *Mechanism:* when the interface moves, the agent searches against the intact goal rather than halting on a broken step. \u00b7 `P3 P4` \u00b7 **Moment:** an Okta redesign ships overnight; the skill logs \"control moved, re-grounded, verified\" instead of a queue of failures. **This is the D5 claim made visible, and E2 is its test.**\n\n**F18 \u00b7 Drift detection** \u00b7 *Mechanism:* a skill whose verification rate degrades flags before it acts wrongly. \u00b7 `P4 P9` \u00b7 **Moment:** \"This skill's checks have failed twice this week \u2014 paused pending review.\"\n\n**F19 \u00b7 Envelope widening** \u00b7 *Mechanism:* every deviation, escalation and correction updates the variance envelope, so the library gets more robust rather than merely larger. \u00b7 `P4 P7` \u00b7 **Moment:** a skill's variant count goes from 3 to 4 after an unusual tenant, and the fourth is credited to the engineer who handled it.\n\n**F20 \u00b7 Onboarding meter** \u00b7 *Mechanism:* measures engineer-hours consumed and time-to-first-verified-skill per environment, compared against **that client's own size band** (15\u201325 / 25\u201340 / 40\u201380 hours, D7) rather than a book average. \u00b7 `P4` \u2014 the metric exists because a library's value decays and has to be re-evidenced \u00b7 **Moment:** Marcus opens one screen: *\"Client 42 (median band, baseline 25\u201340): 14 hours to a maintained runbook.\"* `(illustrative: target, not measured \u2014 no pilot exists)` **The number the entire go-to-market is built on** [strategy/gtm.md](../strategy/gtm.md).\n\n## Why the power is the loop, not any feature\n\nEvery one of these exists elsewhere in some form. Task mining has F1 [S8]. Agentic desks have F12 and F13 [S1]. RPA has a weak F17. **What no one has is the circuit:** capture that keeps failures (F3) feeding clustering that keeps variance (F5, F7), producing skills that declare success (F6) so that verification (F16) is possible, so that re-grounding (F17) is possible, so that deviations (F10) widen the envelope (F19) and the next environment starts warmer.\n\nBreak any link and it degrades to something that already exists. Without F6's success criterion, F16 cannot verify and F17 cannot re-ground \u2014 and the product is RPA with better parsing, which is the exact objection Ray raises and D5 answers. Without F3 and F10, the library learns only happy paths and P2 kills it in month three. Without F8's attribution, P8 fails, capture quietly degrades, and there is no input at all.\n\n**The integration is the product. The features are how it is built.**\n\n**Recommended next 3:** (1) F1, F3, F5, F6 \u2014 capture with failures, clustering, skills that declare success. Nothing else matters until F5 works; (2) F9 shadow mode before any Act feature, because it is how trust is bought and it cannot hurt anything; (3) F20 early, because the metric it produces is the go-to-market.\n"}, "product/features_prioritized.md": {"g": "Product", "t": "Prioritized feature list \u2014 61 features, Now / Next / Later", "md": "# Prioritized feature list \u2014 61 features, Now / Next / Later\n\n> **What this is** \u2014 61 features in strict priority order across three tiers (10 Now \u00b7 32 Next \u00b7 19 Later), each with its mechanism, the user value it produces, its dependencies, and a size.\n> **Why it exists** \u2014 [features_flagship.md](features_flagship.md) argues what matters; this file decides what gets built first and what is deliberately deferred. Priority here is **risk-ordered, not chronological**: the earliest items are the ones that retire the assumption that kills the company, not the ones a user sees first.\n> **How to read it** \u2014 the Now tier is the whole bet: N1\u2013N4, N6, N7, N11, N0, N8 and N15. If it fails, nothing below it matters and the Next tier should never be started. A skeptic should check that no Later item is secretly a dependency of a Now item.\n> **Depends on / feeds** \u2014 inherits [PRD.md](PRD.md) \u00a75\u2013\u00a76, [features_flagship.md](features_flagship.md); feeds `tech/`, [journeys/](journeys/), `validation/experiment_board.md`.\n\nEffort: **S** \u22642 weeks \u00b7 **M** 2\u20136 weeks \u00b7 **L** >6 weeks, solo-founder baseline. Principle tags refer to [PRD.md](PRD.md) \u00a75.\n\n## NOW \u2014 retire the core assumption (F5 clustering) or stop\n\nNothing in this tier is user-facing polish. It exists to answer whether recorded sessions become reliable skills.\n\n**D6 binds this tier.** Stage-1 distillation inside the MSP's own tenant was previously an L-tier item; it is now an architecture constraint on **N6 and N15**, because retrofitting a boundary into a pipeline built without one is far more expensive than assuming it. The N-tier is designed **MSP-tenant-first** from the start. (N9, the envelope egress filter, sits in Next \u2014 the boundary must exist before there is anything to filter across it.)\n\n| # | Feature | Mechanism | User value | Depends on | Effort | Principle |\n|---|---|---|---|---|---|---|\n| N1 | Screen + input capture agent | OS-level capture of screen, input events, window/app context | Nothing yet \u2014 the substrate | \u2014 | M | `P1` |\n| N2 | Session segmentation | Split a shift into task episodes by idle gaps, app focus and ticket context | Recordings become comparable units | N1 | M | `P1` |\n| N3 | Action extraction | Convert raw capture into a typed action stream (clicked X in app Y, entered value class Z) | The representation clustering operates on | N2 | L | `P1` |\n| N4 | Sensitive-value redaction | Detect and drop credentials, tokens, PII at capture time, before storage | Precondition for any security conversation; D6's boundary is worthless if the capture holds secrets | N1 | M | `P8 P9` |\n| N6 | **Stage-1 clustering, in the MSP tenant** | Group episodes of the same procedure across engineers and environments, executing **inside the MSP's own tenant across that MSP's environments** (D6) | **The core bet** | N3 | L | `P1 P7` |\n| N7 | Skill synthesis to `SKILL.md` | Emit goal, preconditions, steps, **success criterion**, escalation envelope | A readable, executable artifact | N6 | L | `P3 P6` |\n| N0 | **Stub executor** | Minimal step execution against a lab tenant \u2014 read plus reversible write, no gating, no identity, no tenant isolation | **Without it N8 cannot score anything.** Pulled up from X1, deliberately crippled: this is a test fixture, not the product's executor | N7 | M | `P3` |\n| N11 | Engineer capture controls | Indicator, pause, post-session review before distillation | **Consent is structural, not promised.** Pulled back into Now: the transfer test at months 10\u201311 records real engineers, and the first humans this company ever records must not be the ones with no indicator and no pause. `P8` is not a later-tier concern | N1 | S | `P8` |\n| N15 | **In-boundary node lifecycle** | Provision, patch, upgrade, roll back and health-monitor the stage-1 distillation node inside an MSP's tenant | **D6 has no delivery vehicle without this.** One node per MSP (not per client, per the corrected boundary), but it is a distributed component inside someone else's infrastructure, operated by whoever runs this company | N6 | L | `P4` |\n| N8 | Evaluation harness | Run a synthesized skill against a held-out environment and score it | **The only way to know whether N6 works**; the E2 and A8 instrument | N7 N0 | M | `P3 P7` |\n\n### Build math \u2014 stated because the first version's arithmetic did not close\n\nAt the file's own effort key (**S** \u22642wk \u00b7 **M** 2\u20136wk \u00b7 **L** >6wk, solo founder), this chain is strictly sequential and its **floor is 36 weeks** \u2014 2+2+6+2+6+6+2+2+6+2, now including N11 \u2014 and that floor is unreachable by construction, because the key defines **L** as *\">6 weeks\"* while the sum values all four L items at exactly 6. A realistic floor is **~40 weeks; midpoints run past 55**.  The original Now tier held 14 items including three L's and was implicitly promised inside [gtm.md](../strategy/gtm.md) \u00a74's 89-day slot \u2014 **that was not achievable and the file now says so.**\n\nTwo consequences, both propagated rather than absorbed:\n\n1. **gtm.md \u00a74 has been re-baselined** to a build window ending around **month 10**, the transfer test at **months 10\u201311**, and the first paid pilot at **month 12 \u2014 which holds only if every item lands at its optimistic bound.** That is the schedule's single point of failure and it is named rather than buried: at midpoints the build alone runs into month 13, and the pilot moves with it \u2014 which finally agrees with `strategy/market_type.md`'s \"~12 months runway to first revenue\" instead of contradicting it.\n2. **Seven features moved out of Now into Next** (N5, N9, N10, N11, N12, N13, N14). They keep their identifiers so every reference elsewhere in the pack still resolves; only their tier changed. **N0 moved *in*, because the original tier had a circular dependency**: N8 scores a skill by running it, X1 was the only executor, and X1 sat in a tier gated on N8 completing.\n\n**On N15's cost, since it is the item most likely to be underestimated.** A distributed node inside customer infrastructure is a support burden before it is a feature: version skew, an MSP's own patching windows, resource contention, and a failure mode where the node is down and nobody notices until skills go stale. The corrected D6 boundary is what makes this survivable \u2014 **three design partners means three nodes, not ~123** \u2014 but it is still the first operational obligation this company takes on, and it lands on one person.\n\n**What Now buys:** an answer to whether recorded sessions cluster into skills that execute correctly in an environment they were not recorded in. Nothing else. No gating, no identity, no tenant isolation, no UI beyond what the harness needs \u2014 those are Next, and they are only worth building if this answer is yes.\n\n## NEXT \u2014 earn the right to act\n\nOnly after N6\u2013N8 show cross-environment transfer. Shadow before gate, gate before act \u2014 no exceptions.\n\nThe seven N-rows at the top of this tier were demoted from Now (see Build math above). They keep their identifiers, so references from [PRD.md](PRD.md), [features_flagship.md](features_flagship.md), [journeys/](journeys/) and [ux_spec.md](ux_spec.md) still resolve.\n\n| # | Feature | Mechanism | User value | Depends on | Effort |\n|---|---|---|---|---|---|\n| N5 | Failure/abort labelling | Retain and mark sessions ending in escalation or rollback | Recovery behaviour becomes learnable | N2 | S | `P2` |\n| N9 | Variance envelope extraction **+ boundary egress filter** | Keep the distribution of how a procedure differed; the envelope is the **only** artifact permitted to leave the MSP tenant (D6) | The moat as data, and the security answer as structure | N6 | M | `P7` |\n| N10 | Decision-point narration | Prompt for ~10s of voice at detected branch points | Attacks demonstration underdetermination | N2 | M | `P1 P8` |\n| N12 | Skill viewer | Read a skill as text, with its sessions and authors | Ray's \"show me what it learned\" \u2014 the demo that converts | N7 | S | `P6 P8` |\n| N13 | Authorship attribution | Name contributing engineers on every skill | The capture programme survives | N6 | S | `P8` |\n| N14 | Onboarding meter | Engineer-hours and time-to-first-verified-skill per environment | **The GTM number** [strategy/gtm.md](../strategy/gtm.md) | N8 | S | \u2014 *(a measurement surface, not a mechanism \u2014 the one row with no principle, deliberately)* |\n| X1 | Read-only executor | Execute non-mutating steps against a real environment | The first live action, with nothing at risk | N7 | L |\n| X2 | Shadow mode | Skill runs against live tickets without acting; outcomes compared to the human's | Trust bought before risk taken (`P5`) | X1 | M |\n| X3 | Deviation report | Route each divergence to the authoring engineer as a question | Corrections flow back (`P2 P6`) | X2 | M |\n| X4 | Success-criterion verification | Test the declared criterion after every action | What RPA asserts about the interface rather than about the goal (`P3`) | X1 | M |\n| X5 | Action-class policy | read / reversible-write / destructive, destructive always gated | `P9`; the security conversation becomes concrete | X1 | S |\n| X6 | Approval queue | Human approves gated actions with a one-line summary of effect | Dana and Ray stay in control | X5 | M |\n| X7 | Agent identity integration | Own principal in the client IdP; every action attributable | Sonia's audit answer (`P8 P9`) | X1 | M |\n| X8 | Reversible-write execution | Mutating actions that can be undone, with the undo path recorded | Real work, bounded risk | X4 X5 | L |\n| X9 | Envelope enforcement | Preconditions unmet \u2192 escalate rather than improvise | `P5`; no silent overreach | X4 | M |\n| X10 | Promotion ladder | shadow \u2192 gated \u2192 supervised, on thresholds declared in advance | Adoption at the customer's pace | X2 X6 | M |\n| X11 | Re-grounding on UI change | Search against the intact goal when a step breaks | **The D5 claim, shipped** (`P3 P4`) | X4 | L |\n| X12 | Drift detection | Falling verification rates pause a skill before it acts wrongly | `P4 P9` | X4 | M |\n| X13 | Envelope widening | Deviations and corrections update the variance envelope | The library hardens rather than just grows (`P7`) | X3 N9 | M |\n| X14 | Ticket-system integration (read) | Pull ticket context from the PSA/ITSM | Skills fire against real work, not synthetic prompts | X1 | M |\n| X15 | Ticket-system integration (write) | Write resolution notes and status back | Closes the loop the MSP is measured on | X14 X8 | M |\n| X16 | Tenant isolation architecture | Private per-client layer; global layer provably carries no client data | **Gates every deal** [strategy/sales_roadmap.md](../strategy/sales_roadmap.md) | N7 | L |\n| X17 | Global stack layer | Shared procedure shapes for Okta/M365/AD/Jira | New environments start warm (A8) | X16 N9 | L |\n| X18 | Test-account self-exploration | Bounded read-only discovery beyond what was recorded | Coverage without more recording (`P1 P4`) | X1 | M |\n| X19 | Skill correction UI | Engineer edits a skill; the edit is versioned and credited | `P6 P8`; the library stays theirs | N12 | M |\n| X20 | Environment dashboard | Per-client view: skills live, coverage, hours saved | What Dana opens each morning | N14 | S |\n| X23 | **Billable-resolution ledger** | Record, per ticket: skill version, verification result, and whether a human reversed the action within the ticket's life. A resolution bills only when the criterion passed **and** nothing was reversed | **Outcome pricing dies in month three without this** \u2014 the 14:20 case in [journeys/day_in_life.md](journeys/day_in_life.md) is an action that verified correctly and was undone. `strategy/sales_roadmap.md` step 6b names it as the clause to settle before the first invoice | X4 X8 | M | `P3 P9` |\n| X24 | **Incident disclosure pack** | One-click same-day export of what an agent did in a client environment, under which principal, with the revert state and the skill change that followed | A veto-holder who hears about an agent's mistake secondhand reopens a six-week review. The product cannot make the call; it can make the disclosure complete in four minutes | X21 | S | `P8 P9` |\n| X25 | **Envelope adversarial testing** | Actively attempt to fingerprint a tenant from its published envelope entries; raise the k-anonymity threshold if it succeeds | **D6's guarantee is currently asserted, not tested.** A founder who has attacked their own boundary has an answer no competitor's policy statement matches \u2014 identified by [tech/techniques/technique_feature_matrix.md](../tech/techniques/technique_feature_matrix.md) \u00a74 as a missing feature | N9 | M | `P8 P9` |\n| X26 | **Approval-surface countermeasures** | Vary presentation and surface the unusual, so the 201st approval is not read like the 200th | `P9` states approval habituates and automation bias makes a reliable system more dangerous at the margin [S35][S36]. The static prompt in S7 is exactly the 14:20 failure | X6 | M | `P9` |\n| X21 | Audit export | Action log with skill version and verification result | Sonia's recurring review, answered with a file | X7 X4 | S |\n| X22 | Retention policy engine | Raw sessions expire on schedule; skills persist | The highest-sensitivity artifact has the shortest life | N4 | S |\n\n## LATER \u2014 scale, expand, and the things that look urgent but are not\n\n| # | Feature | Mechanism | User value | Depends on | Effort |\n|---|---|---|---|---|---|\n| L1 | Multi-MSP global layer | Variance patterns pooled across customers, no client data | The flywheel at scale (A8) | X17 | L |\n| L2 | Skill marketplace | MSPs publish and consume skill packs | Network effect on top of the library | L1 | L |\n| L3 | RMM/PSA marketplace listing | Distribution through where MSPs already shop | The only path to 100 customers \u2014 18\u201324 months [strategy/channel_plan.md](../strategy/channel_plan.md) | X15 | L |\n| L4 | SOC 2 Type II evidence | Controls, monitoring, audit | Gates enterprise-adjacent clients *and* L3 \u2014 **start the clock early** | X16 X21 | L |\n| L5 | Alert-ticket remediation | Skills triggered by RMM alerts rather than users | Possibly the most mechanisable queue segment [strategy/market_sizing.md](../strategy/market_sizing.md) row 8 | X14 | M |\n| L6 | Banded onboarding pricing | Fee scaled by client size | Fixes the flat-$1,500 structure the sizing shows fails at small clients | N14 | S |\n| L7 | Client-facing transparency portal | The MSP's client sees what is captured and what leaves | Shortens the recurring 6-week review | X21 | M |\n| L9 | Skill test generation | Auto-generate regression tests per skill | Drift caught before production | X12 | M |\n| L10 | Multi-engineer consensus | Reconcile conflicting procedures from different engineers | Resolves \"whose way is right\" at scale | X3 | M |\n| L11 | Escalation routing intelligence | Route by who authored the relevant skills | Ray gets fewer, better interruptions | X9 N13 | M |\n| L12 | Onboarding simulator | Replay a new environment against the library before going live | Quotes onboarding time before the contract | X17 | M |\n| L13 | Engineer contribution dashboard | Skills authored, reuse, hours saved by their work | `P8` made rewarding, not just visible | N13 | S |\n| L14 | Natural-language skill authoring | Write a skill without a recording | Covers the long tail recording misses | N7 | M |\n| L15 | Mobile approval | Approve gated actions from a phone | Removes the after-hours bottleneck | X6 | S |\n| L16 | Internal-IT deployment mode | Single-environment packaging | The expansion market, deliberately deferred | X17 | M |\n| L17 | Cost/usage analytics | Inference cost per skill and per resolved ticket | Protects gross margin as volume grows | X4 | S |\n| L18 | Skill deprecation workflow | Retire skills whose environment is gone | The library stays true rather than accumulating | X12 | S |\n| L19 | Multi-language capture | Non-English narration | International, post-US | N10 | M |\n| L20 | On-prem/air-gapped deployment | For clients permitting no outbound connectivity at all | Unlocks regulated MSP clients. **Note D6 already puts distillation inside the MSP tenant**, so this is the narrower case of blocking even envelope egress from the MSP tenant | N6 X16 | L |\n\n## What is deliberately not on this list\n\n- **Unattended autonomous execution.** Not deferred \u2014 excluded by the binding claim boundary (D1). It is not an L-tier item; it is a non-goal.\n- **A ticketing system of our own.** We integrate (X14/X15); we do not replace.\n- **EU deployment.** Blocked on legal analysis, not engineering (A12/D3).\n- **Model fine-tuning.** Skills are text; no customer data enters a training loop (`P6`, and it is the sayable security answer).\n\n**Recommended next 3:** (1) build N1\u2013N8 and nothing else \u2014 the evaluation harness (N8) is what turns opinion into evidence and it is the item most likely to be skipped for looking un-shippable; (2) put N12 in front of a principal engineer the week it works, because that demo converts the persona that can veto adoption; (3) start L4's SOC 2 clock while N-tier is still in progress \u2014 it gates the marketplace and cannot be compressed later.\n"}, "product/PRD.md": {"g": "Product", "t": "Product requirements \u2014 Understudy \u00b7 v0.1 \u00b7 2026-09-04", "md": "# Product requirements \u2014 Understudy \u00b7 v0.1 \u00b7 2026-09-04\n\n> **What this is** \u2014 the product definition: the closed core loop, the principles every feature must obey, the superset feature set organised by loop phase, and the metrics that say whether it works.\n> **Why it exists** \u2014 this product's failure mode is not missing features, it is building a recorder that produces plausible skills nobody trusts enough to run. The first-principles section (\u00a75) exists to make that failure structurally hard: a feature that maps to no principle gets cut, and the principles are drawn from why forty years of prior attempts failed rather than from what would be nice to have.\n> **How to read it** \u2014 \u00a75 then \u00a76; the principle tags in \u00a75 are the argument that this is engineering rather than a wish list. A skeptic should attack principle P5, which concedes the product cannot do the thing the category is excited about.\n> **Depends on / feeds** \u2014 inherits [BRIEF.md](../BRIEF.md) (incl. the binding claim boundary D1 and pricing D4), [research/survey.md](../research/survey.md), [research/capability_table.md](../research/capability_table.md), [strategy/personas.md](../strategy/personas.md); feeds [features_flagship.md](features_flagship.md), [features_prioritized.md](features_prioritized.md), [journeys/](journeys/), [ux_spec.md](ux_spec.md), `tech/`.\n\n## 1. Executive summary & vision\n\nUnderstudy learns an unfamiliar IT environment by watching engineers work in it, and then does the repetitive part of that work under supervision. It closes a loop the market has left open in two halves: discovery tools observe and emit documents, resolution tools execute but must be configured [research/landscape.md](../research/landscape.md).\n\n**The core loop, in this domain's own verbs:**\n\n```\n   WATCH \u2500\u2500\u2192 DISTIL \u2500\u2500\u2192 REHEARSE \u2500\u2500\u2192 GATE \u2500\u2500\u2192 ACT \u2500\u2500\u2192 VERIFY\n     \u2191                                                    \u2502\n     \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 LEARN \u2190\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\n| Phase | What happens | The unit that moves |\n|---|---|---|\n| **Watch** | Passive capture of an engineer's session: screen, actions, and optional spoken reasoning | a *session* |\n| **Distil** | Cluster sessions of the same procedure across engineers and environments; synthesize one readable `SKILL.md` with a goal, steps, and a **verification step** | a *skill* |\n| **Rehearse** | Run the skill in shadow against real tickets, in parallel with the human, comparing outcomes without acting | a *rehearsal* |\n| **Gate** | Approval policy per skill and per action class; destructive actions always gated | a *gate decision* |\n| **Act** | Execute under the agent's own identity, within the skill's declared envelope, escalating anything outside it | an *action* |\n| **Verify** | Check the declared success criterion; on failure, re-ground rather than halt, and record the deviation | a *verification* |\n| **Learn** | Every deviation, escalation and correction widens the skill's **variance envelope** | an *envelope update* |\n\n**Vision.** MSPs run many more clients per engineer because environment knowledge stops being something a person holds and becomes something the business owns \u2014 observed, readable, and executable.\n\n## 2. Goals\n\n1. Reduce engineer-hours to onboard a client environment, measurably, **against that client's own size band** \u2014 15\u201325 hours small, 25\u201340 median, 40\u201380 complex (D7; [strategy/market_sizing.md](../strategy/market_sizing.md)). A single book-average baseline overstates the gain on small clients and understates it on large ones.\n2. Produce skills a principal engineer will read and endorse \u2014 trust is the adoption gate, not accuracy alone.\n3. Make each environment onboard faster than the last (the variance envelope compounding, A8).\n4. Execute tier-1 repetitive work under supervision with a verified success criterion on every action.\n\n## 3. Target users \u2014 one system, no separate tracks\n\nFull cards in [strategy/personas.md](../strategy/personas.md); this section states them as **requirements**, because `tech/` builds from this file.\n\n| Seat | Role in the system | What the product must do for them | Spectrum position |\n|---|---|---|---|\n| **Priya** \u2014 tier-1 technician | Consumes skills | Surface *this client's* procedure and its deviations inline in the ticket; never present a generic runbook as if it were specific | **Edge-low** |\n| **Dana** \u2014 service delivery manager | Judges skills | Make most days require no action; make the exceptions unambiguous | **Beachhead core** |\n| **Ray** \u2014 principal engineer | Authors skills by working; can veto by not cooperating | Readable text he can inspect, correct and reject without justification | **Edge-high** |\n| **Marcus** \u2014 MSP owner | **Payer, not user** | One number, weekly, true including when it is bad | Buyer |\n| **Sonia** \u2014 client-side IT director | **Veto, one per client environment** | One boring export, twice a year, plus a structural answer to *what leaves my environment* | External gate |\n\n**Requirement \u2014 one adaptive system, no stigmatizing tiers.** There is no \"lite\" edition for Priya and no \"pro\" edition for Ray. The same skill library serves all three spectrum positions; what differs is **whether a person is consuming a skill, authoring one by working, or judging one**. Any design that forks the product by user sophistication violates this requirement.\n\n**Requirement \u2014 payer \u2260 user.** Marcus signs and barely uses it; Ray never signs and can kill it. The product must therefore be independently defensible to a buyer who sees a dashboard and to an expert who sees the internals, and those two surfaces must not contradict each other.\n\n## 4. Non-goals \u2014 real renunciations\n\n- **Not unattended autonomous resolution.** Binding claim boundary (D1). Long-horizon completion is 20.6% [S16]; supervision is not a stepping stone we remove, it is the architecture.\n- **Not a ticketing system.** We sit beside the PSA/ITSM, we do not replace it. Displacing the desk is a year-two fight [strategy/petal_diagram.md](../strategy/petal_diagram.md).\n- **Not a documentation product.** The library is executable or it is nothing; a skill that cannot run is a failed skill, not a document.\n- **Not browser-only.** The surface is RMM consoles, AD, terminals, MDM and native admin tools \u2014 this is precisely where Strawberry's approach stops [S25].\n- **Not model training.** Skills are text under an open format [S24]; no customer data enters a training loop, which is also what makes the security answer sayable.\n- **Not EU at launch.** Continuous screen recording faces disproportionality findings and works-council co-determination [S29] (A12/D3).\n\n## 5. First-principles grounding \u2014 non-negotiable\n\nEvery major feature must map to one or more of these. **A feature that maps to none gets cut, or the principle list was wrong.** Drawn from [research/survey.md](../research/survey.md).\n\n| # | Principle | Why it is true | Source |\n|---|---|---|---|\n| **P1** | **A demonstration underdetermines intent.** What was essential and what was incidental to that run cannot be recovered from actions alone | The failure that sank forty years of programming-by-demonstration | survey \u00a71 |\n| **P2** | **Happy paths are not procedures.** Recovery behaviour, aborted attempts and failure branches are exactly what a successful recording does not contain | survey \u00a77 | survey \u00a77 |\n| **P3** | **An assertion about the UI can detect a break; only a goal can re-ground against one.** RPA *does* offer success checks \u2014 UiPath's Verify/Check App State, Blue Prism's Wait stages with Application Modeller conditions \u2014 but they are optional per-step assertions about the interface, not a declaration of what the procedure is trying to achieve. So a broken selector either **halts loudly or proceeds wrongly**, and neither outcome can recover. A skill's criterion is a *goal state*, which a re-grounding search can aim at | Selector contracts break on application upgrades, unstable dynamic ids, timing, config drift, unhappy paths | survey \u00a71, \u00a76.3; D5 |\n| **P4** | **Environments drift continuously.** A skill library is a maintenance liability from the day it is written | RPA maintenance reaches 60% of total implementation cost | [S11] |\n| **P5** | **Long-horizon autonomy is not available.** Best frontier completion on long-horizon tasks is 20.6%, and agents at ~85% on standard benchmarks still fail ~80% of real workflows | Benchmarks are curated; client environments are not | [S15][S16] |\n| **P6** | **Trust must be calibrated, not maximised \u2014 which requires the system to be inspectable and its limits legible.** An engineer will not endorse what they cannot inspect and correct, and a system trusted beyond its capability fails worse than one distrusted | Lee & See: appropriate reliance comes from transparency about capability *and* limits. Parasuraman & Riley: **disuse** \u2014 rejection by the expert \u2014 is this product's likeliest failure mode | [S35][S36]; survey \u00a76b; [S24] |\n| **P7** | **The variance envelope is the asset.** The happy-path procedure is in vendor documentation; how it differs across real environments is not | Cross-environment transfer is survey \u00a78's first open question \u2014 the envelope is the pack's answer to it. *(Weakest-grounded of the nine: this is a hypothesis the literature has not settled, and `strategy/lean_canvas.md` treats it as assumption A8, not a finding.)* | survey \u00a78 Q1 |\n| **P8** | **Recording is a consent relationship, not a data pipeline.** The person being recorded must benefit, visibly, or capture quietly degrades | The champion and the edge-high persona are the data source | personas \u00a73, \u00a74 |\n| **P9** | **Destructive actions are irreversible; verification precedes action \u2014 and approval habituates.** IT operations delete mailboxes and disable accounts, and an approver who has cleared 200 correct proposals reads the 201st less carefully | Silent wrongness is worse than loud failure, and **automation bias makes a reliable system more dangerous at the margin, not less** | survey \u00a77, \u00a76b; [S35][S36] |\n\n## 6. Core feature set by loop phase\n\nEach feature tagged with the principles it serves.\n\n### Watch\n- **Multi-surface session capture** \u2014 screen, input events and window/application context across RMM consoles, AD, terminals, MDM and native admin UIs, not just the browser. `P1`\n- **Narration capture** \u2014 optional voice, prompted at decision points rather than continuously; the direct attack on P1's underdetermination. `P1 P8`\n- **Engineer-controlled capture** \u2014 visible indicator, pause, and post-session review before anything is distilled. `P8`\n- **Escalation and abort capture** \u2014 sessions that *failed* are retained deliberately, because they contain what successes do not. `P2`\n\n### Distil\n- **Cross-session clustering** \u2014 group recordings of the same procedure across engineers and environments; the company's core technical bet, with no benchmark to inherit [capability_table row 5]. `P1 P7`\n- **Skill synthesis to `SKILL.md`** \u2014 goal, preconditions, steps, **declared success criterion**, and escalation envelope. `P3 P6`\n- **Variance envelope extraction** \u2014 record how the same procedure differed across environments; this is the asset, not a by-product. `P7`\n- **Authorship attribution** \u2014 every skill names the engineers whose sessions produced it. `P8`\n\n### Rehearse\n- **Shadow mode** \u2014 the skill runs against live tickets without acting, and outcomes are compared with the human's. `P5 P9`\n- **Deviation report** \u2014 where the skill would have diverged, surfaced to the authoring engineer for correction. `P2 P6`\n\n### Gate\n- **Action-class policy** \u2014 read / reversible-write / destructive, with destructive always gated regardless of confidence. `P9`\n- **Envelope enforcement** \u2014 an action outside the skill's declared preconditions escalates rather than improvising. `P5`\n\n### Act\n- **Agent identity** \u2014 its own principal, so every action is attributable in the client's audit log. `P8 P9`\n- **Test-account self-exploration** \u2014 bounded discovery of the environment beyond what was recorded, read-only by default. `P1 P4`\n\n### Verify\n- **Success-criterion check** \u2014 every action ends by testing the declared criterion; this is what P3 says RPA lacks. `P3 P9`\n- **Re-grounding on failure** \u2014 a changed UI triggers a search against the intact goal, not a halt. `P3 P4`\n\n### Learn\n- **Envelope widening** \u2014 deviations, escalations and corrections update the skill's variance envelope. `P4 P7`\n- **Drift detection** \u2014 a skill whose verification starts failing flags before it acts wrongly. `P4 P9`\n\n## 7. Data and the learning flywheel\n\n**Three layers, not two:**\n\n| Layer | Lives | Holds | Crosses out |\n|---|---|---|---|\n| **Per environment** | MSP's node | skills specific to that client, their variance, their drift history \u2014 client names, domains, policy ids | never |\n| **Per MSP** | MSP's node | procedure shapes clustered across that MSP's 41 environments; this is what makes compounding work for the customer | never, in raw form |\n| **Global** | central | abstracted envelopes from many MSPs: `{procedure_shape, precondition_pattern, deviation_class, observation_count}` | \u2014 |\n\nThe middle layer is the one the first version omitted, and it is where the customer's own compounding actually happens.\n\n### Where distillation runs \u2014 the two-stage boundary (D6, corrected)\n\nThe first statement of D6 said clustering runs \"inside the client boundary\". **Critic review established that this is not implementable as written**, for three reasons that are worth recording because they shape the architecture:\n\n1. **Cross-environment clustering needs more than one environment's sessions co-located.** In-client execution guarantees exactly one. The two clauses were mutually exclusive.\n2. **Raw capture does not originate inside the client boundary.** It is recorded on an *MSP engineer's workstation* that covers 41 clients. Raw sessions would have to be shipped *into* each client perimeter to be kept from leaving it.\n3. **Most clients have no perimeter to host a node in.** For a 22-person dental practice on Okta and M365, the \"environment\" is a set of SaaS tenants the MSP administers \u2014 there is no network to place compute inside.\n\n**The corrected design preserves the founder's intent exactly \u2014 raw recordings never reach us \u2014 by putting stage 1 at the boundary where capture actually lives:**\n\n| Stage | Runs | Operates on | Crosses out |\n|---|---|---|---|\n| **1 \u00b7 Distil + abstract** | **Inside the MSP's own tenant** \u2014 one node per MSP, not one per client | That MSP's raw sessions across all its client environments. The MSP already administers all of them, so no new trust boundary is crossed | Nothing raw. Emits **abstracted envelopes only** |\n| **2 \u00b7 Global clustering** | Central | Abstracted envelopes from many MSPs | Procedure shapes and deviation patterns |\n\n**Consequences, all of them improvements:**\n\n- **Cross-environment clustering is legal and local.** An MSP's 41 environments cluster together inside that MSP's own boundary \u2014 which is what makes the beachhead's compounding possible at all. Only the *cross-MSP* layer is central, and it never sees raw anything.\n- **One node per MSP, not 41.** Three design partners means three nodes, not ~123. This is the difference between a fleet a solo founder can operate and one they cannot.\n- **The client-facing claim gets stronger, not weaker:** *your session recordings never leave your MSP's control, and nothing identifying your tenant ever reaches the vendor.*\n\n**The envelope schema, defined well enough to check.** An envelope entry is `{procedure_shape, precondition_pattern, deviation_class, observation_count}` \u2014 for example *\"MFA re-enrolment blocked by a network-zone-scoped authentication policy; observed in 6 tenants; resolved by time-boxed exclusion, not policy disablement.\"* It carries **no tenant name, no domain, no user, no policy id and no configuration values** \u2014 only that a pattern was seen, its shape, and how often.\n\n**What this means for the two examples the critique caught:** a record reading \"conditional-access bypass (Brightwater)\" is a **stage-1 artifact and stays in the MSP's tenant** \u2014 it is not envelope content. Likewise Ray's cross-environment query (\"which of my 41 environments show this pattern?\") resolves **entirely within his own MSP's node**; it is his data about his own clients, and it never touches the global layer.\n\n**It constrains the build from day one.** Stage-1 distillation is materially harder to retrofit than to assume, so it binds N6/N9 in [features_prioritized.md](features_prioritized.md) rather than sitting in a later tier \u2014 and it adds **N15 node fleet lifecycle**, because a distributed component inside customer tenants has to be deployed, patched, upgraded, rolled back and monitored by whoever operates this company.\n\n**Environment velocity is gated by two things, not one:** the client-side security review [strategy/sales_roadmap.md](../strategy/sales_roadmap.md), and node fleet operations. The second is new and is the one a solo founder feels first.\n\n**Edge inference is a unit-economics line.** The compute-heavy half of the loop runs on hardware we do not own; `financials/unit_economics.md` must model it, including the per-node hardware floor an MSP has to provide.\n\n## 8. Oversight, safety, privacy, compliance\n\n- **Capture consent surface** \u2014 engineers see what is captured, can pause, and review before distillation (P8).\n- **Client-side transparency** \u2014 the MSP's client can be shown what is recorded in their environment and what leaves it; this is Sonia's question and it is a product feature, not a sales document.\n- **Destructive-action gating** \u2014 always on, not configurable to off.\n- **Audit trail** \u2014 agent identity, skill version, verification result per action.\n- **Retention policy** \u2014 raw sessions expire; distilled skills persist. Raw admin-plane recording is the highest-sensitivity artifact in the system and should have the shortest life.\n- **Geography** \u2014 US-first; EU capture is constrained by disproportionality findings and works-council rights [S29].\n\n## 9. Success metrics\n\n**Outcome metrics first \u2014 the domain's real \"did it work\":**\n1. **Engineer-hours to onboard an environment**, against that client's size band (D7). The number the buyer feels \u2014 and it must be defined: it counts engineer time spent *reaching a maintained runbook and a working tier-1 floor*, which is not the same as time spent onboarding the client at all. See [journeys/beachhead.md](journeys/beachhead.md).\n2. **Time-to-first-verified-skill** in a new environment \u2014 the category yardstick nobody publishes [research/survey.md \u00a74].\n3. **Cross-environment skill reuse rate** \u2014 A8 made measurable, and the earliest read on whether the moat exists.\n4. **Verified-action accuracy** \u2014 actions whose success criterion passed *and* were correct on human review. Silent wrongness is the metric that matters, not throughput.\n\n**Engagement:** sessions captured per engineer per week; skills endorsed by their authoring engineer (P8 working or not); shadow-to-gated promotion rate.\n\n**Business:** environments onboarded per MSP (the expansion metric on which the revenue ramp depends); **resolved tickets per environment \u2014 where \"resolved\" needs a definition the customer has agreed, including the case where the agent acted, verification passed, and a human then intervened** (the 14:20 case in [journeys/day_in_life.md](journeys/day_in_life.md); `strategy/sales_roadmap.md` step 6b names this as where outcome pricing dies in month three); revenue per MSP against the ~$5,110 year-1 model (D9, D11) [strategy/market_sizing.md](../strategy/market_sizing.md).\n\n**Recommended next 3:** (1) build Watch and Distil only, and prove clustering on lab environments before any Act surface exists; (2) specify the envelope schema in `tech/architecture/` precisely enough to be audited \u2014 D6's claim is only as good as the guarantee that an envelope entry carries no tenant identity; (3) instrument reuse rate and variance-envelope growth from environment #2, since together they are the only early evidence for A8.\n"}, "product/ux_spec.md": {"g": "Product", "t": "UX specification \u2014 the thirteen screens that carry the product", "md": "# UX specification \u2014 the thirteen screens that carry the product\n\n> **What this is** \u2014 the key screens: purpose, primary action, information hierarchy, empty/loading/error states, and the micro-interactions that carry the product's feel. Text spec only; visual collages belong to `visuals/`.\n> **Why it exists** \u2014 this product asks people to be recorded, and asks a sceptical expert to endorse what was learned from them. Those are interface problems before they are model problems: S4 and S5 decide whether capture keeps flowing, and no amount of clustering quality compensates if they are wrong. The spec exists so the consent and inspection surfaces get designed rather than inherited from an admin template.\n> **How to read it** \u2014 S4 and S5 first; they are the adoption gates. A skeptic should attack the empty states, which is where a product that has learned nothing yet has to still be worth opening.\n> **Depends on / feeds** \u2014 inherits [PRD.md](PRD.md), [features_flagship.md](features_flagship.md), [journeys/](journeys/); feeds `visuals/` (UX collages), `tech/`, `startup-website`.\n\n**Cross-cutting rules.** Skills render as **text, never as flowcharts** (`P6`). Every number is monospaced and traceable to the session or action that produced it. Destructive actions are visually distinct everywhere they appear and can never be bulk-approved. Nothing in the product manufactures urgency: most days the correct action is none.\n\n---\n\n## S1 \u00b7 Environment dashboard \u2014 Dana's ten minutes\n\n**Purpose.** One client environment's state at a glance. **Primary action:** review what changed since yesterday.\n**Hierarchy:** skills live / in shadow / paused \u2192 deviations awaiting judgement \u2192 onboarding meter \u2192 recent actions.\n**States.** *Empty (week 1):* \"Capture running. 14 sessions recorded, no skills yet \u2014 distillation runs at the end of week 1.\" **This is the honest empty state the beachhead journey requires**, and it must say what happens next and when, not \"no data\". *Loading:* skeleton rows, never a spinner over the whole page. *Error:* if the in-boundary node is unreachable, say which node and since when \u2014 silence here reads as data loss.\n**Micro-interactions.** Paused skills sort to the top and stay until acknowledged. Counts animate only when they change during the session, so a changed number is noticed without the page feeling busy.\n\n## S2 \u00b7 Owner summary \u2014 Marcus's 90 seconds a week\n\n**Purpose.** Is the number still true? **Primary action:** none \u2014 this screen is read, not operated.\n**Hierarchy:** hours saved this month \u2192 environments onboarded \u2192 **the two worst-performing environments, shown before the best**.\n**States.** *Empty:* \"First environment onboards in ~3 weeks. This screen fills then.\" *Error:* never show a partial total; show nothing and say why.\n**Micro-interactions.** Every figure expands one level to the environments composing it, and no further \u2014 an owner who wants the third level should be talking to Dana.\n**Rule:** if a month is worse than baseline, this screen leads with it. A dashboard that only reports wins is distrusted permanently the first time a client reports a problem first.\n\n## S3 \u00b7 Ticket-side skill panel \u2014 Priya's ambient surface\n\n**Purpose.** Offer what is known about *this* client for *this* ticket. **Primary action:** read the procedure, then optionally *run with me*.\n**Hierarchy:** matched skill + confidence \u2192 **the deviations specific to this environment** \u2192 steps \u2192 run controls.\n**States.** *Empty:* \"No skill for this yet \u2014 your session will be captured and may become one.\" *Ambiguous match:* offer up to three, never auto-select. *Error:* fall back to showing nothing rather than a generic runbook; a wrong-client procedure is worse than none.\n**Micro-interactions.** The panel never steals focus or blocks the ticket. Deviations are the visually loudest element, because they are the part no runbook would have told her.\n\n## S4 \u00b7 Capture control and session review \u2014 the consent surface `P8`\n\n**Purpose.** The engineer sees, controls and reviews what was captured. **Primary action:** pause, or approve a session for distillation.\n**Hierarchy:** capture state \u2192 today's segmented sessions \u2192 what was redacted \u2192 pause.\n**States.** *Paused:* unmistakable, persistent, with no nagging to resume. *Redaction summary:* \"3 credential fields dropped at capture\" \u2014 shown routinely, because trust is built by visible refusals rather than by a policy page.\n**Micro-interactions.** One click to pause; **resuming is also one click and is never automatic**. A session can be deleted before distillation with no justification required and no notification to a manager.\n**This screen is load-bearing.** If it feels like surveillance, capture degrades quietly and the failure looks like slow adoption \u2014 the most likely way this product dies inside a paying customer [journeys/edge_high.md](journeys/edge_high.md).\n\n## S5 \u00b7 Skill viewer \u2014 the demo that converts Ray\n\n**Purpose.** Show exactly what the system believes it learned. **Primary action:** endorse, or correct.\n**Hierarchy:** goal \u2192 **success criterion** \u2192 preconditions \u2192 steps \u2192 variants observed \u2192 contributing sessions and authors.\n**States.** *Low-confidence skill:* labelled as a draft with the number of sessions behind it. *Single-session skill:* explicitly marked \u2014 one demonstration is an anecdote, not a procedure (`P2`).\n**Micro-interactions.** Every step links to the session moment it came from, playable. Narration appears as quoted text beside the branch it explains, attributed. **Nothing on this screen is a black box, and nothing renders as a flowchart** \u2014 text is the format an expert can argue with (`P6`).\n\n## S6 \u00b7 Skill correction \u2014 being told no\n\n**Purpose.** The authoring engineer changes what is wrong. **Primary action:** edit and commit, or reject the skill outright.\n**Hierarchy:** the edit \u2192 what it affects \u2192 who else authored this.\n**States.** *Conflicting edits:* both are shown to both engineers; the system does not adjudicate whose method is right (`L10` handles this at scale).\n**Micro-interactions.** **Rejection requires no justification.** A system
