stinguish three different companies \u2014 a $179M SAM, a $124M SAM, or a different revenue architecture \u2014 which no amount of modelling can.\n**Result.** \u2014 \u00b7 **Learning.** \u2014 \u00b7 **Decision.** \u2014 \u00b7 **Status: planned.**\n\n## E4 \u00b7 Channel admissibility\n\n**Hypothesis, restated against the rule rather than against admission.** \u22651 of 3 named groups' **stated terms permit** a non-MSP vendor founder to participate before selling.\n\n**Why the distinction matters.** The earlier version's threshold was written against *being admitted*, and `strategy/channel_plan.md` says approval takes **3\u20136 months**. At month 2 the realistic state is three applications in progress \u2014 which scored as \"zero admitted\" and fired a pivot that \"changes the raise\" **on absence of evidence rather than evidence of absence.**\n\n**Design.** Identify three specific groups. Establish membership rules, vendor terms, fees, and whether a vendor may join at all. That is discoverable in a fortnight; admission is not.\n**Threshold.** \u22651 group's terms permit it \u2192 the primary channel is real, and **admission becomes a separate, later criterion dated to the first committee cycle.** All three exclude vendors outright \u2192 the primary and best-economics channels are closed and the GTM reshapes around the marketplace at 18\u201324 months.\n**Cost: two weeks and three phone calls.** It is the cheapest company-shaping result available and it needs no product.\n**Result.** \u2014 \u00b7 **Learning.** \u2014 \u00b7 **Decision.** \u2014 \u00b7 **Status: planned.**\n\n## E5 \u00b7 Envelope re-identification (X25)\n\n**Hypothesis.** Given the full published envelope set from *m* MSPs, an attacker with knowledge of the stack **cannot identify a contributing MSP or tenant** above chance.\n**Design.** Generate a realistic envelope set from lab environments. Attack it ourselves: single-entry fingerprinting, and **compositional linkage across entries** \u2014 the failure minimum-support thresholds do not address.\n**Threshold, and what a null result does *not* license.** The earlier version fired only on success \u2014 on synthetic data we generate and attack ourselves \u2014 so the most plausible outcome (we didn't break it) passed by default. That fails the board's own test: a threshold no plausible outcome violates is decoration.\n\n**Declared attack budget:** methods (single-entry fingerprinting, compositional linkage across entries, auxiliary-data join against public tenant characteristics), **40 person-hours**, and **one external red-team pass**. Any successful identification \u2192 raise *m*, add a linkage budget, or adopt a noise floor **before the first security review**.\n\n**A null licenses exactly one sentence: \"no attack was found within budget B.\"** It does not license \"anonymised\". DD4 concedes the guarantee is **heuristic, not formal** \u2014 the shippable privacy claim needs l-diversity, t-closeness or differential privacy, none of which is implemented \u2014 and E5 cannot substitute for that.\n**Result.** \u2014 \u00b7 **Learning.** \u2014 \u00b7 **Decision.** \u2014 \u00b7 **Status: planned.**\n\n## E6 \u00b7 Do engineers actually cooperate with capture?\n\n**Hypothesis.** Across E1's capture window, engineers pause capture on **<10%** of sessions, provide narration when prompted **>60%** of the time, and delete **<5%** of sessions pre-distillation.\n**Split in two, because the population could not support the inference.** E1 runs **paid contractors on lab tenants**. Disuse [S36] is a reliance decision by an operator whose *role* is affected \u2014 a contractor has no employment exposure, no client-specific expertise being expropriated, no peer channel, and is **paid by the person measuring them**. That is a demand-characteristics setup that manufactures a cooperative result, and at n=3 one engineer pausing on 75% of sessions crosses the kill line alone.\n\n**E6a \u2014 instrumentation smoke test, inside E1.** Does N11 emit the events at all? **No thresholds, no inference about willingness.**\n\n**E6b \u2014 the real experiment, at a design partner.** \u22658\u201310 **employed** engineers capturing real client work, stratified by tenure, over a pre-declared window with a pre-declared baseline period. This is the persona the experiment exists for \u2014 the guide screens Ray as \"\u226510 years, holds environment knowledge for named clients\", and E1's contractors are by construction not Rays.\n**Threshold (E6b only).** Pause >25% or narration <30% \u2192 `P8` is failing and the capture programme needs product changes, not messaging. **P6's date moves to first-pilot + 90 days**, since that is the earliest this is measurable.\n**Why this matters more than it looks.** Disuse is invisible in every other metric [S36]. **This is the only instrument that sees it**, and it runs for free inside E1.\n**Result.** \u2014 \u00b7 **Learning.** \u2014 \u00b7 **Decision.** \u2014 \u00b7 **Status: planned.**\n\n## E7 \u00b7 Client-side security review duration\n\n**Split into two, because the earlier version was contradictory and unfalsifiable.** It said \"cold, through an MSP contact\" \u2014 those are opposites \u2014 and neither contact exists at month 3. Worse, the ask inverts the introducer's incentive: an owner would be introducing a product-less stranger to *his own client* so that client can be prompted to think about an AI with write access in their tenant, **before the owner has decided to buy.** That is the introduction an owner is least likely to make.\n\n**E7a \u00b7 Pre-customer \u2014 measures what is observable.**\n**Hypothesis.** A client-side IT director raises **\u22648 questions beyond the tenant-isolation document**, and none of them is a blocker the architecture cannot answer.\n**Design.** Source directors through security communities, vCISO networks, or **paid expert-network calls** \u2014 not a borrowed MSP relationship. Measure the count and category of questions, not elapsed time.\n**Threshold.** Any question the architecture cannot answer \u2192 a design gap, surfaced before a customer meets it.\n\n**E7b \u00b7 Cycle time \u2014 deferred to the design-partner phase.**\nElapsed time on a hypothetical review with no contract, no purchase and no deadline measures **how long a favour takes, not how long a review takes**, so R7's \">10 weeks\" threshold could not be falsified honestly. It moves to where `stage_gate.md` already needs it: the first real pilot.\n**Result.** \u2014 \u00b7 **Learning.** \u2014 \u00b7 **Decision.** \u2014 \u00b7 **Status: planned.**\n**Result.** \u2014 \u00b7 **Learning.** \u2014 \u00b7 **Decision.** \u2014 \u00b7 **Status: planned.**\n\n## E8 \u00b7 MSP ticket-category mix\n\n**Hypothesis.** Tier-1 repetitive plus RMM-alert remediation together account for **\u226525%** of an MSP's ticket volume.\n**Design, corrected. Target \u22658\u201310 exports, not 5** \u2014 at 5 convenience-recruited exports with a plausible between-MSP SD of ~10pp, the t-based half-width is ~12pp before selection bias, so the stage gate's \"\u00b110pp\" was unreachable by construction. A PSA export is the MSP's book of business \u2014 client count, volume, service mix, effectively their revenue shape. **No owner gives that to a stranger with no product, no NDA and no reference**, and the earlier version named no instrument that would change that.\n\n**What buys it:** an **anonymised cross-MSP category benchmark returned to every contributor** \u2014 the thing none of them can build alone and all of them want. Plus a **one-page mutual NDA** and a **scoped export spec** (category and count only; no client names, no revenue, no identifiers).\n\n**And the layer contradicted itself here.** `discovery_guide.md` Q10 asks owners to recall their top five categories from memory and calls it \"the pack's single highest-value unknown\", while `metrics_by_stage.md` files exactly that under **Ignore** \u2014 *\"owners systematically misremember mix\"*. Both cannot be right. **Resolution: memory estimates are a screening signal, exports are the evidence**, and the gate accepts a graded ladder rather than a binary.\n**Threshold, graded rather than binary.** The evidence ladder: **2 exports + 8 memory estimates + one PSA-vendor or community benchmark** clears it. <15% automatable \u2192 SAM falls roughly 40% and the per-ticket half is close to immaterial.\n**Result.** \u2014 \u00b7 **Learning.** \u2014 \u00b7 **Decision.** \u2014 \u00b7 **Status: planned.**\n\n## E9 \u00b7 Demonstrations per stable skill\n\n**Promoted from a dangling reference.** R9 cited \"E9 \u2014 included in E1\" and no such row existed; E1 as designed collects one demonstration count (3 per procedure), which is a single point on a curve.\n**Hypothesis.** A procedure reaches a stable skill \u2014 one whose synthesis no longer changes materially with additional demonstrations \u2014 within **\u22646 demonstrations**.\n**Design.** Synthesize at 1, 2, 3, 4, 6 and 8 demonstrations and measure edit distance between successive syntheses. **This sizes E1's contractor hours**, which the earlier version priced before knowing the answer.\n**Threshold.** >8 demonstrations \u2192 capture economics change materially and onboarding duration with them.\n**Result.** \u2014 \u00b7 **Learning.** \u2014 \u00b7 **Decision.** \u2014 \u00b7 **Status: planned.**\n\n## E10 \u00b7 On-node typing accuracy\n\n**Also promoted from a dangling reference** (R10). D6 forces action typing onto a quantised on-node model, and no published accuracy exists for RMM/AD/MDM surfaces.\n**Hypothesis.** On-node typing reaches **\u226590% of frontier-model accuracy** on 200 hand-labelled admin actions.\n**Threshold.** <80% \u2192 the D6 boundary costs more accuracy than assumed, and either the reference node's GPU grows or the boundary needs re-examining.\n**Result.** \u2014 \u00b7 **Learning.** \u2014 \u00b7 **Decision.** \u2014 \u00b7 **Status: planned.**\n---\n\n## Board discipline\n\n- **Every threshold above was written before any data exists.** That is the only property that makes this a board rather than a plan.\n- **No `(assumption)` figure from any layer may enter `financials/` until the experiment that tests it returns a number** \u2014 the standing rule adopted in `tech/whitepaper.md` \u00a72.\n- **Order is by cost, not by importance.** E3, E4 and E5 need no product and run first; E1 and E2 wait on the harness. A company that runs its expensive experiment first learns the same thing later and poorer.\n- **A negative result is published.** E1 in particular: forty years of literature has assumed procedure transfer works without measuring it, and a clean negative is the most useful thing this company could contribute if the positive does not arrive.\n\n**Recommended next 3:** (1) run E3, E4 and E5 in the first month \u2014 three phone calls, ten conversations and one afternoon of attacking our own schema; (2) run E3 as a *basis* test rather than a price test \u2014 it is the only experiment that can distinguish three different companies; (3) re-rank this board after the first five results, and record what changed in [pivot_log.md](pivot_log.md)."}, "validation/get_keep_grow.md": {"g": "Validation", "t": "Get / Keep / Grow", "md": "# Get / Keep / Grow\n\n> **What this is** \u2014 the funnel per segment: how a customer is acquired, what keeps them, and what makes them expand, with the metric and the lever at each stage.\n> **Why it exists** \u2014 this business's growth mechanism is unusual and easy to get wrong: expansion is per *environment*, and its throttle is a security review rather than a sales conversation. A conventional funnel would optimise the wrong stage.\n> **How to read it** \u2014 the Keep and Grow stages matter more here than Get, because the land is small and the expansion is where the revenue is. A skeptic should attack the Grow lever, which depends on an unproven assumption (A8).\n> **Depends on / feeds** \u2014 inherits [../strategy/gtm.md](../strategy/gtm.md), [../strategy/channel_plan.md](../strategy/channel_plan.md), [decision_making_unit.md](decision_making_unit.md); feeds [metrics_by_stage.md](metrics_by_stage.md), `financials/revenue_build.md`.\n\n## GET\n\n| Stage | Mechanism | Metric | Current / target | Lever |\n|---|---|---|---|---|\n| Reach | Open sources first (r/msp, MSP Slack/Discord, LinkedIn owner outreach, podcast audiences); peer and buying groups **once admissible** (E4) | Conversations booked/month | 0 / 8 | The hours ROI calculator as the opener, not a demo |\n| Qualify | Five earlyvangelist criteria [mvp_definition.md](mvp_definition.md) | % of prospects meeting all five | \u2014 / \u226530% | Criterion 4 (has a real workaround) is the discriminator |\n| Convert | Design-partner pilot \u2192 paid | Pilot \u2192 paid conversion | \u2014 / \u226550% | The published time-to-first-verified-skill number |\n\n**Activation moment: the first verified skill in the customer's own environment.** Not signup, not capture starting \u2014 the first time Dana sees a procedure the system learned from her own team and she agrees it is right.\n\n## KEEP\n\n| Stage | Mechanism | Metric | Target | Lever |\n|---|---|---|---|---|\n| Habit | Friday deviation review | Weekly active reviewers | \u22651 per MSP | Keep it to ~40 min/month; a queue that manufactures urgency gets muted |\n| Trust | Skills endorsed by their authoring engineer | Endorsement rate | \u226570% | Attribution and rejection-without-justification (`P8`) |\n| Value proof | Onboarding meter | Environments where hours beat the client's size band | \u226560% from environment 2 | Honest reporting of the environment-1 overrun (D8) |\n\n**The retention-predicting metric is endorsement rate, not usage.** A library nobody has endorsed is one the engineers do not trust, and that state precedes churn without showing up in logins. It is also the earliest visible signal of Ray's silent veto.\n\n## GROW\n\n| Stage | Mechanism | Metric | Target | Lever |\n|---|---|---|---|---|\n| Expand | Additional client environments onboarded | Environments per MSP per quarter | \u22652 | **Security review throughput, not sales** |\n| Compound | Skill reuse across environments | Cross-environment reuse rate | measurable from environment 2 | This is A8 made observable |\n| Refer | Owner-to-owner in peer groups | Referrals per customer per year | \u22650.5 | The published number, not a case study |\n\n**The growth loop, and where it can break:**\n\n```\n   environment onboarded \u2192 variance envelope thickens \u2192 next environment onboards faster\n            \u2193                                                      \u2193\n   security review passed                            a number worth repeating in a peer group\n            \u2193                                                      \u2193\n   throughput permits the next one  \u2190\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500  next MSP\n```\n\n**Two honest weaknesses in this loop.** It depends on A8 \u2014 if procedures do not transfer, \"onboards faster\" is false and the loop degrades to ordinary word of mouth. And its throttle is the security review, which no amount of sales effort accelerates. **The lever that actually raises expansion velocity is architectural** \u2014 shortening the review by making the boundary easier to reason about \u2014 which is why D6 was worth treating as a constraint rather than a preference.\n\n**Net revenue retention is below 100% after backfill completes** [../strategy/market_sizing.md](../strategy/market_sizing.md): an MSP that has onboarded all 41 environments drops from the backfill run-rate to ~$14,930/yr (D11). **Growth after that point depends on the customer's own client growth**, which is coherent \u2014 petal 2 says we help them win clients \u2014 but it must be said rather than assumed.\n\n**Recommended next 3:** (1) instrument endorsement rate from the first pilot, since it predicts churn earlier than any usage metric; (2) measure review cycle time as a first-class funnel stage, because it caps Grow and nothing else does; (3) do not build referral mechanics until the published number exists \u2014 the referral is the number, not a programme.\n"}, "validation/metrics_by_stage.md": {"g": "Validation", "t": "Metrics by stage \u2014 and the vanity metrics to ignore at each", "md": "# Metrics by stage \u2014 and the vanity metrics to ignore at each\n\n> **What this is** \u2014 the three to five metrics that matter at each stage, and \u2014 equally important \u2014 the ones that will look good and mean nothing at that stage.\n> **Why it exists** \u2014 the vanity metrics for this company are unusually seductive, because a capture product generates impressive-looking volume numbers from day one that are entirely uncorrelated with whether it works.\n> **How to read it** \u2014 read the Ignore column first. A skeptic should check that no metric in the left column can be improved without the product actually working.\n> **Depends on / feeds** \u2014 inherits [stage_gate.md](stage_gate.md), [get_keep_grow.md](get_keep_grow.md); feeds `financials/revenue_build.md`, `startup-website` (the quantified proof block).\n\n## Discovery \u2014 where we are\n\n| Track | Why | **Ignore, and why** |\n|---|---|---|\n| Unprompted problem mentions (\u00f710 interviews) | The gate-1 criterion, and the only unbiased read on whether the pain is top-three | **Number of interviews conducted.** Twenty flattering conversations beat none, and mean less than six unprompted mentions |\n| Onboarding hours quoted, by client size | Feeds `market_sizing` row 13 \u2014 the most load-bearing unknown | **Positive sentiment.** Everyone likes the idea; nobody's sentiment predicts a purchase |\n| Ticket-category mix from real exports | Moves SAM \u00b140% (E8) | **Estimated ticket volume from memory.** Owners systematically misremember mix |\n| Earlyvangelist criteria met, per prospect (of 5) | Predicts who will actually pilot | **Pipeline size.** A pipeline of interested parties failing criterion 4 is the most flattering and least predictive artifact a founder can build |\n\n## Validation \u2014 after the gate\n\n| Track | Why | **Ignore, and why** |\n|---|---|---|\n| **Cross-environment skill transfer rate** | The company, expressed as one number | **Sessions captured.** Grows automatically with headcount and tells you nothing |\n| **Skills endorsed by their authoring engineer** | Predicts retention and detects Ray's silent veto before churn does | **Skills generated.** A library can grow while getting worse \u2014 over-merging produces more skills, not fewer |\n| Engineer-hours per environment, vs that client's size band | The buyer's own number, honestly reported including overruns (D8) | **Aggregate hours saved.** Sums the environment-1 overrun into a positive figure and hides it |\n| Verified-action accuracy, human-reviewed sample | Catches silent wrongness, which verification alone cannot | **Actions executed.** Volume without correctness is the 14:20 failure at scale |\n| Security review cycle time | The throttle on expansion, and nothing else raises it | **Deals in security review.** A count that grows when reviews stall |\n\n## Creation\n\n| Track | Why | **Ignore, and why** |\n|---|---|---|\n| Environments per MSP per quarter | The expansion metric the revenue ramp depends on | **Logo count.** One MSP with 41 environments outweighs four with three |\n| Reuse rate across environments | A8 made observable \u2014 the moat or its absence | **Library size.** See above |\n| Net revenue retention post-backfill | Known to fall below 100%; the question is how far | **Gross revenue growth during backfill.** It is one-time revenue and reads like a trend |\n| Reversal rate (X23) | The only detector for verified-but-wrong actions | **Resolution rate.** Uncorrected, it counts the 14:20 case as a success |\n\n## Building\n\n| Track | Why | **Ignore, and why** |\n|---|---|---|\n| Distinct MSPs contributing to the global layer | The m\u22653 threshold is the cross-customer mechanism's precondition | **Envelope entries published.** Entries below threshold are not shared and count for nothing |\n| Global-layer contribution to a new customer's first environment | M5's claim, measured | **Total environments covered.** Impressive, and not the mechanism |\n| Time-to-first-verified-skill, published | The category yardstick, and the referral engine | **Internal benchmark scores.** A number nobody else can reproduce is marketing |\n\n## The two metrics that would be dangerous at every stage\n\n**1. Automation rate.** It rises when the envelope is widened carelessly and when gates are loosened \u2014 both of which make the product worse. It is the number the category advertises and the one most likely to be optimised against the customer's interest.\n\n**2. Capture volume.** It grows with the customer's headcount, is uncorrelated with whether clustering works, and \u2014 because it looks like traction \u2014 is the metric most likely to be reported to investors during the period when nothing is actually being learned.\n\n**Recommended next 3:** (1) instrument endorsement rate and reversal rate from the first pilot, since both detect failures no other metric sees; (2) never report aggregate hours saved without the environment-1 overrun beside it (D8); (3) publish time-to-first-verified-skill early \u2014 a metric nobody else reports becomes the category's yardstick by default, and a yardstick we defined and can meet is worth more than a benchmark we win.\n"}, "validation/mvp_definition.md": {"g": "Validation", "t": "MVP definition \u2014 two of them, kept distinct", "md": "# MVP definition \u2014 two of them, kept distinct\n\n> **What this is** \u2014 the low-fidelity MVP that tests whether the *problem* is real, the high-fidelity MVP that tests whether the *solution* is bought, and the earlyvangelist definition that says who counts as a real early customer.\n> **Why it exists** \u2014 conflating these two is how a pre-build company spends ten months building the wrong thing carefully. A PRD is neither of them: it describes the product, not the cheapest artifact that could falsify it.\n> **How to read it** \u2014 the low-fidelity MVP is not software, and that is deliberate. A skeptic should check that each MVP names what it *omits* as clearly as what it includes.\n> **Depends on / feeds** \u2014 inherits [experiment_board.md](experiment_board.md), [../product/features_prioritized.md](../product/features_prioritized.md); feeds [stage_gate.md](stage_gate.md), `financials/use_of_funds.md`.\n\n## Low-fidelity MVP \u2014 tests whether the problem is real\n\n**It is not software.** It is: **the engineer-hours ROI calculator, plus a two-page tenant-isolation document.**\n\n| | |\n|---|---|\n| **What it does** | Takes an MSP owner's own onboarding hours and client mix, and returns what the knowledge cycle costs them per year in their own numbers |\n| **What it deliberately omits** | Any product. Any demo. Any claim about what we would save them |\n| **The question it answers** | Does an MSP owner recognise onboarding cost as a top-three pain when shown their own arithmetic \u2014 *before* being shown a solution? |\n| **What would falsify it** | Fewer than 6 of 10 rank it top-three unprompted (E3's exit criterion). Or: owners cannot produce an hours figure at all, which would mean the cost is real but unmeasured, and the sale becomes a measurement sale first |\n| **Cost** | A spreadsheet and a document. Days |\n\n**Why the isolation document is part of the low-fidelity MVP.** It looks like a compliance artifact. It is actually the test of whether D6's architecture is *sayable* \u2014 whether a client-side director reads it and asks two questions or twenty (E7). That is a problem-space finding, and it costs nothing to run early.\n\n## High-fidelity MVP \u2014 tests whether the solution is bought\n\n**The thinnest thing that could earn money: capture \u2192 distil \u2192 a readable skill library, with no execution at all.**\n\n| | |\n|---|---|\n| **What it includes** | N1\u2013N4, N6, N7, N11, plus the skill viewer (N12) and the onboarding meter (N14) |\n| **What it deliberately omits** | **Execution.** No executor, no gating, no agent identity, no approval queue, no tenant isolation beyond the boundary itself |\n| **The question it answers** | Will an MSP pay for a **library that is true** \u2014 a runbook maintained by observation \u2014 before it does any work? |\n| **Why omitting execution is the right cut** | Execution is where the risk, the security review and most of the build sit. If the library alone is worth paying for, the company has revenue while it builds the executor. **If it is not, the executor was never going to rescue it** |\n| **What would falsify it** | Owners say \"so it's documentation\" and decline. That is a real possible outcome and it would mean the value is in execution after all \u2014 which is a longer, more expensive company |\n| **Cost** | The Now tier minus N0/N8/N15: roughly 20\u201326 weeks solo |\n\n**Note what this does to the schedule.** The high-fidelity MVP is *smaller* than the transfer test's requirements, because E1 needs the harness and an executor stub while a paying library does not. **Those are two different first products and the pack should not pretend they are one** \u2014 `strategy/gtm.md` builds toward E1 because the evidence question outranks the revenue question at this stage, but a founder who needed revenue sooner would build this instead.\n\n## Earlyvangelist definition \u2014 five things that must already be true\n\nA prospect counts as an earlyvangelist only if **all five** hold. Anything less is an interested party.\n\n1. **They have the problem** \u2014 they onboard client environments regularly, not once a year.\n2. **They know they have it** \u2014 they can name it without being prompted (the discovery guide's exit criterion).\n3. **They have been actively looking for a solution** \u2014 they have tried documentation platforms, scripting, a hiring push, or an internal process fix.\n4. **They have cobbled together an interim workaround** \u2014 a shared runbook, a shadowing ritual, an onboarding checklist someone maintains by hand. **This is the highest-signal criterion**: a workaround is proof the pain is worth spending time on.\n5. **They can commit budget** \u2014 the owner is in the room, or one step away.\n\n**The MSP-specific reading of criterion 4:** almost every MSP has an onboarding checklist. That is not a workaround; it is table stakes. The workaround that qualifies is one built *because the checklist failed* \u2014 a senior engineer assigned to shadow-document, a Slack channel that functions as the real runbook, a rule that one person must be on every new client.\n\n**Recommended next 3:** (1) run the low-fidelity MVP before writing any code \u2014 it is days of work and it gates everything; (2) hold the high-fidelity MVP's omission of execution deliberately, and be prepared to hear that the library alone is not enough; (3) score every discovery prospect against all five earlyvangelist criteria and record the count \u2014 a pipeline of interested parties who fail criterion 4 is the most flattering and least predictive thing a founder can accumulate.\n"}, "validation/pivot_log.md": {"g": "Validation", "t": "Pivot log \u2014 what has already been killed, and what would kill what remains", "md": "# Pivot log \u2014 what has already been killed, and what would kill what remains\n\n> **What this is** \u2014 the decision journal: options considered and rejected during this run with the reason, plus the standing pivot-or-persevere criteria in the form \"we pivot if X by date Y\".\n> **Why it exists** \u2014 a company that cannot say what it has already rejected has not made any decisions. This log also preserves *why* something was killed, which is the thing that gets lost first and re-litigated most.\n> **How to read it** \u2014 the rejections are more informative than the criteria. A skeptic should check that each rejection has a reason that would still hold if the founder changed their mind.\n> **Depends on / feeds** \u2014 inherits [../ASSUMPTIONS.md](../ASSUMPTIONS.md) D1\u2013D10 and the critic rounds; feeds [stage_gate.md](stage_gate.md), `narrative/vc_memo.md`.\n\n## Already killed \u2014 during the grill and the build of this pack\n\n| # | Option | Killed because | When |\n|---|---|---|---|\n| K1 | **Internal IT as the beachhead** | It is where every funded competitor is fighting, on resolution quality \u2014 the axis we cannot win. One internal-IT customer also contributes one environment where an MSP contributes ~41 | Grill, round 1 |\n| K2 | **Per-tenant-only skill library** | No cross-customer compounding; the moat becomes workflow lock-in only, which is weaker than the mechanism deserves | Grill, round 1 |\n| K3 | **Claiming unattended autonomy** | Long-horizon agent completion is 20.6% [S16]. A pack promising it fails its first technical diligence call | D1, phase 1 |\n| K4 | **Per-resolved-ticket pricing alone** | Yields ~$107M SAM and a year-1 customer worth ~$1,100, at which no acquisition channel is viable | D4, phase 2 |\n| K5 | **Flat $1,500 onboarding fee** | Approaches 100% of displaced cost at the small end of a book whose median client is 16 users | D7, phase 2 |\n| K6 | **Charging for environment 1** | It displaces *negative* hours \u2014 charging for it is charging for a loss, and a design partner's timesheet finds that in an afternoon | D9, phase 3 |\n| K7 | **Clustering inside the *client* boundary** | Not implementable: capture originates on MSP workstations, cross-environment clustering needs environments co-located, and SaaS-only clients have no perimeter | D6 correction, phase 3 |\n| K8 | **Hosted inference for action typing** | Frames of a client's admin console reaching a third party breaks D6's guarantee outright. Moved on-node at the cost of a GPU | Phase 4 critique |\n| K9 | **\"RPA has no success criterion\"** as the differentiation | Falsifiable in one sentence \u2014 UiPath Verify App State, Blue Prism Wait stages. Narrowed three times to the claim that survives | D5, then phase 4 critique |\n| K10 | **The 10\u00d7 maintenance multiplier** | Its baseline is hours the pack itself calls \"largely unperformed\", and the strategy layer had already refused to price against it | Phase 4 critique |\n| K11 | **k\u22653 counting client tenants** | Three observations could sit inside one MSP's book, identifying that MSP with certainty at its first security review. Now counts distinct MSPs | Phase 4 critique |\n| K12 | **Deleting process mining from the technique catalogue** | Reversed: DD1 must tolerate reordering, which order-preserving alignment cannot represent; partial-order methods are exactly those rows | Phase 4 critique |\n\n**Note what K8\u2013K12 have in common.** They were all killed by adversarial review *after* being written into the pack as settled. **Five load-bearing claims survived authorship and did not survive scrutiny** \u2014 which is the argument for the critic loop, and the reason the run's honest completion state matters more than its artifact count.\n\n## Standing pivot-or-persevere criteria\n\nEach states a date and a number. A criterion without both is an intention.\n\n| # | We pivot if\u2026 | By | To what |\n|---|---|---|---|\n| **P1** | Cross-environment transfer is **<50%** after three clustering approaches (E1) | Month 11 | **Stop and return remaining capital, unless E1's failure teaches something specific that makes K1 viable.** The earlier version pivoted to a single-environment product sold to internal IT \u2014 which is **K1, the option this same log killed** as \"where every funded competitor is fighting, on the axis we cannot win\". A pivot into a market you rejected, on a mechanism that just failed, is not a pivot. **This is the one criterion that stops the company, and the log previously had none** |\n| **P2** | Transfer lands **50\u201370%** | Month 11 | Persevere with a narrowed claim: assisted onboarding rather than automated, priced against the runbook rather than the hours |\n| **P3** | **Neither E3 arm reaches 3 of 5 signed LOIs** (branch 3) | Month 3 | The per-environment fee has no basis at any price. Move to the **D12 per-MSP platform fee** and accept the revenue-model change it forces. *(If Arm A fails but Arm B clears, that is branch 2 \u2014 rebuild on the ~$241 schedule at ~$124M SAM, not a platform-fee pivot. The earlier version conflated the two.)* |\n| **P4** | **Zero of three** peer/buying groups admit a vendor founder (E4) | Month 2 | The primary and best-economics channels are closed. Reshape around the RMM/PSA marketplace at 18\u201324 months, which changes the raise size and timing |\n| **P5** | Envelope re-identification **succeeds** (E5/X25) | Month 3 | Raise *m*, add a linkage budget or a noise floor \u2014 and if none suffices, **the global layer is abandoned** and the company is per-tenant only, which is K2 arriving by a different road |\n| **P6** | Capture pause rate **>25%** or narration **<30%** (**E6b**, at a design partner with employed engineers \u2014 not E1's contractors) | **First pilot + 90 days** | `P8` is failing. The product needs to change, not the messaging \u2014 and if it cannot, the input dries up and there is no company |\n| **P7** | Median client-side security review **>10 weeks** (E7) | Month 4 | Expansion velocity caps below the ramp. Re-time the revenue model and reconsider whether in-boundary distillation can be simplified further |\n\n## What we will not pivot on\n\n- **Supervised execution.** If the market demands unattended autonomy before the evidence supports it, we lose those deals. That is a cost we accept (D1).\n- **Publishing negative results.** Including E1. A quiet re-scope after a bad number is how a company keeps its story and loses its credibility.\n- **The environment-1 overrun staying visible** (D8).\n\n**Recommended next 3:** (1) date-stamp every row above at the start of the run, since criteria without dates get renegotiated; (2) review this log at each gate rather than at each setback \u2014 its value is in the rejections, and rejections get re-litigated when things are going badly; (3) add a row every time the critic loop kills a claim, because K8\u2013K12 are the most useful entries here and they exist only because someone wrote them down.\n"}, "validation/riskiest_assumptions.md": {"g": "Validation", "t": "Riskiest assumptions \u2014 the ranked board", "md": "# Riskiest assumptions \u2014 the ranked board\n\n> **What this is** \u2014 every load-bearing assumption in the pack, ranked, with current evidence, the cheapest decisive test, its cost, and its status.\n> **Why it exists** \u2014 a pack of sixty artifacts can make an unevidenced claim look settled simply by repeating it. This board is where each claim is stated once, with its evidence and its kill condition, so the run can be judged on what it actually knows.\n> **How to read it** \u2014 rows 1\u20133 are the company. A skeptic should check that every `kills-company` row has a test that costs less than the round being raised.\n> **Depends on / feeds** \u2014 inherits [../ASSUMPTIONS.md](../ASSUMPTIONS.md), [../strategy/lean_canvas.md](../strategy/lean_canvas.md) \u26a0, [../BRIEF.md](../BRIEF.md) \u00a7Riskiest assumption; feeds [experiment_board.md](experiment_board.md), [stage_gate.md](stage_gate.md), `financials/risk_matrix.md`.\n\n| # | Assumption | Kills company? | Current evidence | Cheapest decisive test | Cost | Time | Status |\n|---|---|---|---|---|---|---|---|\n| **R1** | Recorded sessions cluster into skills that **execute correctly in an environment they were not recorded in** | **Yes** | ALLOY [S22] demonstrates the adjacent claim at user-study scale. **Nothing demonstrates cross-environment transfer** [../research/capability_table.md](../research/capability_table.md) row 5 | **E1** \u2014 3 engineers \u00d7 5 procedures \u00d7 2 environments; synthesize from A, measure success in B | **~$435k \u2014 the funded build, not $1,600.** The contractor line is $6,000\u20138,500; the harness and pipeline it runs on are the round | ~40 wks | **untested** |\n| **R2** | A narrated skill **degrades more gracefully under interface change** than a selector-based automation with fallbacks enabled | **Yes** \u2014 it is the entire differentiation from RPA | Mechanism argued in [../tech/whitepaper.md](../tech/whitepaper.md) \u00a75; no measurement | **E2** \u2014 altered UI + version upgrade, against a Unified-Target-equivalent baseline with fallbacks **on** | ~2 wks on top of E1's harness | 2 wks | **untested** |\n| **R3** | MSP owners will pay a per-environment fee **materially above the hours it displaces** \u2014 i.e. they are buying the library, not the hours | **Yes** | **The fee is above displaced value at every band** (99\u2013466%) under one consistent method. An hours-defensible schedule is ~$241 blended vs the $1,005 charged. Basis has now failed arithmetic twice (D9, D11) | **E3, reframed as a basis test (D17)** \u2014 show 10 owners the hours gap honestly, then both schedules | E0 funnel + 2 wks | **partially invalidated** \u2014 the hours half is *already false* (99\u2013466%); only the library half is open | \n| **R4** | The founder is **admissible to MSP peer or buying groups as a vendor** | **Yes** \u2014 if not, the primary and best-economics channels are both closed | None. `strategy/channel_plan.md` flags it as the plan's most schedule-sensitive unknown | **E4** \u2014 name 3 groups, establish membership rules and vendor terms | ~0 | 2 wks | **untested** |\n| **R5** | Abstracted envelopes **cannot be used to re-identify a tenant or an MSP** | Yes \u2014 it is the D6 guarantee every deal rests on | Threshold corrected to m\u22653 MSPs; **compositional linkage unaddressed; no l-diversity, t-closeness or DP** [../tech/deep_dives.md](../tech/deep_dives.md) DD4 | **E5 (X25)** \u2014 adversarially attempt re-identification from our own published envelope set | ~2 wks | 2 wks | **untested** |\n| **R6** | Engineers will **cooperate with capture** rather than quietly degrade it | Yes, and invisibly \u2014 disuse is the documented failure mode [S36] | MSPs already record sessions for QA. No evidence for *this* capture | **E6** \u2014 run capture on 3 contract engineers during E1 and measure pause rate, narration rate and post-session deletions | included in E1 | \u2014 | **untested** |\n| **R7** | Client-side security review closes in **weeks, not months**, per environment | No, but it caps expansion velocity and therefore the ramp | The two-stage boundary (D6) converts it from a data-transfer to an egress assessment. Unmeasured | **E7** \u2014 put the tenant-isolation document to 3 client-side IT directors, cold | ~0 | 3 wks | **untested** |\n| **R8** | The **MSP ticket mix** contains ~25% tier-1 repetitive plus RMM-alert work | No, but it moves SAM \u00b140% | No sourced MSP ticket-category mix exists \u2014 `strategy/market_sizing.md` \u00a7Gap | **E8** \u2014 ticket-category export from 5 MSPs | ~0 | 2 wks | **untested** |\n| **R9** | Procedures require **few enough demonstrations** for capture to be economic | No, but it sets onboarding duration | Unknown; survey \u00a78 Q2. Profile-HMM emission estimation is under-determined without it | **E9** \u2014 its own board row now: synthesize at 1/2/3/4/6/8 demonstrations, measure edit distance between successive syntheses | included in E1's contractor line | \u2014 | **untested** |\n| **R10** | An **on-node quantised model** types actions accurately enough on admin UIs | No \u2014 falls back to hosted, but that breaks D6 | No published accuracy on RMM/AD/MDM surfaces [../research/capability_table.md](../research/capability_table.md) row 1 | **E10** \u2014 its own board row now: on-node vs frontier typing on 200 hand-labelled admin actions | ~1 wk | 1 wk | **untested** |\n\n## What this board says about the company\n\n**Every row was `untested` when this board was written; R3's hours half is now falsified.** `financials/pricing.md` \u00a74 shows the fee priced at 99\u2013466% of displaced hours under one consistent method, so R3 reads **partially invalidated** \u2014 only the library half remains open, and E3's split sample is what tests it. Everything else is the honest state of a pre-build company, and stating it in a single column is more useful than distributing the same fact across sixty artifacts.\n\n**Four rows kill the company and three of them cost under $2,000 to test.** R3, R4 and R5 need no product at all \u2014 a price conversation, three phone calls about membership rules, and an afternoon attacking our own envelope schema. **They should not be waiting behind a ten-week build**, and the fact that the 90-day motion in `strategy/gtm.md` runs E3 and E4 in its first thirty days is the plan working correctly.\n\n**R1 is the only expensive one, and its true price is the round \u2014 ~$435k, not the $1,600 contractor line.** It needs the harness, which needs the pipeline.\n\n**Note the ordering the table does not show.** This board ranks by *consequence*; resolution order is close to the inverse. **R3 and R4 gate ~79% of year-1 revenue and every channel respectively, cost roughly nothing, and return in month 2\u20133 \u2014 nine months before R1 returns anything.** A reader taking the rank order as a work order would build for a year before learning the price has no basis.\n\n**R2 is where the pack is most exposed to its own reasoning.** The RPA differentiation argument has been corrected three times under critique \u2014 coordinates, then interface-vs-goal absolutes, then the fallback question. Each correction narrowed it. **A claim that has needed three corrections before anyone measured it should be measured before it is sold**, which is why E2 is ranked second rather than filed under nice-to-have.\n\n**One structural note the earlier version missed.** E9 and E10 were cited here as tests and appeared on no board row \u2014 a dangling reference in the file whose entire job is to connect assumptions to the experiments that retire them. Both are now rows.\n\n**Recommended next 3:** (1) run E3, E4 and E5 immediately \u2014 they are cheap, they need no code, and any one coming back negative reshapes the company; (2) build the harness before the clusterer so E1 produces evidence rather than opinion; (3) re-rank this board after the first five results, since a board written before any data is a hypothesis about what matters.\n"}, "validation/stage_gate.md": {"g": "Validation", "t": "Stage gate \u2014 where the company sits, and what passing the next gate requires", "md": "# Stage gate \u2014 where the company sits, and what passing the next gate requires\n\n> **What this is** \u2014 placement in Blank's four steps (Discovery \u2192 Validation \u2192 Creation \u2192 Building), the evidence supporting that placement, and the numbered exit criteria for the next gate.\n> **Why it exists** \u2014 a founder under pressure describes the company one stage ahead of where it is, which causes money and hiring to be spent on the wrong stage. This file states the placement against evidence and makes the exit numeric.\n> **How to read it** \u2014 the placement is deliberately unflattering. A skeptic should check that no exit criterion below could be satisfied by an opinion.\n> **Depends on / feeds** \u2014 inherits [riskiest_assumptions.md](riskiest_assumptions.md), [experiment_board.md](experiment_board.md); feeds [metrics_by_stage.md](metrics_by_stage.md), `financials/use_of_funds.md`.\n\n## Placement: **Customer Discovery, early.** Not Validation.\n\n**Evidence for the placement, not against it:**\n\n- No customer has seen a price. No discovery interview has been conducted.\n- No code exists. `BRIEF.md` records stage as *design*.\n- Every row of [riskiest_assumptions.md](riskiest_assumptions.md) reads `untested`, including all four that kill the company.\n- The problem hypothesis is sourced [S21][S33] but **unvalidated with a single MSP owner**.\n\n**What the pack has that an early-Discovery company usually does not:** a sourced research layer, a falsifiable core hypothesis with a pre-declared threshold, and an architecture whose privacy claim is stated tightly enough to be attacked. **That is preparation, not traction**, and the distinction is the whole point of this file.\n\n## Exit criteria \u2014 Discovery \u2192 Validation\n\nAll seven must hold. Each is a number or a binary, none is a judgement.\n\n**Criterion 7 was added after critic review, which found the original six contained no commitment.** All of them could pass with nobody having agreed to anything \u2014 a weaker bar than `strategy/gtm.md` \u00a74 already sets for itself at months 9\u201310. **A gate the GTM plan outruns is not gating.**\n\n| # | Criterion | Threshold | Source |\n|---|---|---|---|\n| **1** | Problem confirmed **genuinely unprompted** | **\u22656 of 10** owners name onboarding cost in the answer to **Q0** \u2014 *\"the three biggest constraints on your delivery capacity last quarter\"* \u2014 asked before the topic is raised by either party | discovery_guide Q0 |\n| **2** | Ticket mix known | **Graded evidence ladder**: \u22652 PSA exports **+** 8 memory estimates **+** one PSA-vendor or community benchmark. (\u00b110pp was unreachable at 5 convenience exports \u2014 with a between-MSP SD near 10pp the half-width is ~12pp before selection bias) | E8 |\n| **3** | Channel is real | **\u22651 of 3** named peer or buying groups admits a pre-revenue vendor founder | E4 |\n| **4** | Price has a basis | **Arm A \u22653 of 5 sign an LOI at the banded price, with the hours gap disclosed** \u2014 split-sample per E3's branch table, not a verbal reaction | E3 |\n| **5** | Core mechanism supported | Cross-environment skill transfer **\u226570%** on the held-out set | E1 |\n| **6** | Differentiation supported | Skills retain **\u22652\u00d7** the post-change success rate of a fallback-enabled RPA baseline | E2 |\n| **7** | **Somebody has committed something** | **\u22653 signed design-partner LOIs** | `strategy/gtm.md` \u00a74 |\n\n**Criteria 1\u20134 need no product and cost under $2,000 in total.** Criteria 5\u20136 need the harness. **A company that passes 1\u20134 and fails 5 is not in Validation; it is in Discovery with a better-understood market and a dead mechanism** \u2014 and the honest response is to say so publicly rather than re-scope quietly.\n\n## What we do *not* do before this gate passes\n\n- **No hiring.** Not an engineer, not the MSP-side operator the founder story names as the first hire.\n- **No marketplace integration work.** It is 18\u201324 months out and gated on SOC 2 and references [../strategy/channel_plan.md](../strategy/channel_plan.md).\n- **No *seed* raise on the strength of the pack.** Stated honestly rather than as a technicality: criteria 5 and 6 are unreachable without the **pre-seed** `financials/use_of_funds.md` raises precisely to fund them. **The pre-seed is raised to fund the gate; the seed is raised on the gate having returned.** Claiming the gate before it returns is the thing prohibited here.\n- **No paid pilot before month 12**, which holds only if every build item lands at its optimistic bound.\n\n## The next two gates, stated so the current one is not mistaken for the finish\n\n**Validation \u2192 Creation** requires a repeatable sale: 3 paying MSPs acquired through the same channel motion, \u22652 environments each expanded without a sales conversation, and review cycle time measured at \u22646 weeks median (E7).\n\n**Creation \u2192 Building** requires the cross-customer mechanism to exist: **\u22653 distinct MSPs contributing to the global layer** (the m\u22653 threshold), with measured contribution to a new customer's first environment. That is a year-two milestone at the earliest, and the corrected threshold is the reason.\n\n**Recommended next 3:** (1) run criteria 1\u20134 in the first month; (2) do not describe the company as being in Validation until criterion 5 returns a number \u2014 the language leaks into hiring and fundraising decisions faster than the evidence does; (3) if criterion 5 fails, publish it, because a clean negative on a forty-year-old assumption is a real contribution and a quiet pivot is not.\n"}, "financials/comps_exits.md": {"g": "Financials", "t": "Comparables and exit landscape", "md": "# Comparables and exit landscape\n\n> **What this is** \u2014 sourced comparable companies and transactions, what the market rewarded and punished in each, realistic acquirer profiles with the reason each would pay, IPO-path conditions, and a closing assessment of whether this can be a standalone generational company.\n> **Why it exists** \u2014 the exit section is where a pack usually stops being honest, because the closing paragraph is expected to be bullish. This one runs the sober comps first and then answers the question the arithmetic actually supports, which is not the answer a founder would prefer.\n> **How to read it** \u2014 \u00a74 is the honest assessment. A skeptic should note that no revenue multiple appears in this file, because none was findable.\n> **Depends on / feeds** \u2014 inherits [../research/sources.md](../research/sources.md), [revenue_build.md](revenue_build.md), [../strategy/market_sizing.md](../strategy/market_sizing.md); feeds `narrative/vc_memo.md`, `narrative/pitch_deck.md`.\n\n## 1 \u00b7 Transactions and rounds in this space\n\n| Company | Event | Amount | What the market rewarded / punished |\n|---|---|---|---|\n| **Moveworks** | Acquired by ServiceNow, announced Mar 2025, closed Dec 2025 [S26] | **$2.85B** \u2014 ServiceNow's largest acquisition | **Rewarded:** enterprise distribution at scale (~5M employee users, ~250 mutual customers) and a front-end the incumbent lacked. The category's defining proof that AI service desks are strategically valuable |\n| **FortressIQ** | Acquired by Automation Anywhere, Dec 2021 [S5][S6] | Undisclosed | **Punished:** discovery without an executor. Claimed ~90% reduction in discovery time [S7] and still ended as a feature inside an RPA vendor, no longer independently visible. **The closest historical analogue to this company, and its cautionary case** |\n| **Aisera** | Raised $164.5M total [S13] | \u2014 | Rewarded: enterprise ESM breadth |\n| **Espressive** | Raised $53M total [S13] | \u2014 | \u2014 |\n| **Atomicwork** | Series A $25M, Jan 2025; $40.3M total [S12] | \u2014 | Rewarded: the anti-ServiceNow mid-market thesis, Khosla-backed |\n| **Ravenna** | Pre-seed + seed $15M, Apr 2025 [S2][S3] | \u2014 | Rewarded: Slack-native agentic ITSM, the same mid-market gap read |\n| **Strawberry** | $6M, Oct 2025 [S25] | \u2014 | Rewarded: agentic execution that learns from the user \u2014 browser-only |\n| **ServiceNow** | Public | ~$160B [S3] | The incumbent whose implementation revenue is 3\u20135\u00d7 licence [S20] |\n\n**Marked gap: no revenue multiples are stated in this file because none was findable.** Moveworks' $2.85B was disclosed without revenue; the private rounds disclose no ARR. **A pack that invented a multiple here would be fabricating the single number an investor most wants**, and `research/sources.md` records the absence rather than filling it.\n\n## 2 \u00b7 Realistic acquirer profiles\n\n| Acquirer | Why they would pay | Why they might not |\n|---|---|---|\n| **ConnectWise / Kaseya / N-able** \u2014 MSP platform vendors | **Shared buyer argues for distribution, not acquisition.** A common buyer is the case for a marketplace listing or an OEM revenue share \u2014 which `revenue_build.md` already makes the $10M motion. These vendors (Thoma Bravo, Insight) buy revenue-producing products with installed bases at revenue multiples: Datto, Perch, StratoZen, ID Agent, Adlumin | Consolidators price on revenue, not capability. The realistic shape is distribution first, then a low-multiple tuck-in, and the marketplace dependency caps the price rather than raising it | They own the PSA/RMM surface an MSP runs its day in, they have the distribution the channel plan says takes 18\u201324 months to reach, and self-onboarding is a capability they cannot build without a capture footprint | Consolidators buy on revenue multiples, not capability. At $179\u2013215M SAM they would price this as a feature acquisition |\n| **Automation Anywhere** | Already owns FortressIQ's capture footprint [S5] and the discovery-plus-execution thesis. We are the executor their discovery never had | They could build it. They have the input and the customers; what they lack is the MSP motion, which is a new market rather than an extension |\n| **ServiceNow** | Bought Moveworks for $2.85B; buys rather than builds in this category | **Structurally inhibited** \u2014 implementation at 3\u20135\u00d7 licence [S20] means self-onboarding cannibalises the larger half of its own deal. And its lead investor calls the platform inappropriate below enterprise [S3] |\n| **UiPath** | Owns discovery, and its executor is the one whose failure record stalled the category | Its buyer is the enterprise process team, not IT service delivery |\n| **MSP automation and lifecycle vendors** \u2014 Rewst, NinjaOne, ScalePad, Atera, Syncro, Kaseya-owned IT Glue | **The adjacency the earlier version omitted, and arguably the closest fit.** IT Glue's product *is* runbook maintenance \u2014 literally `pricing.md` \u00a74's option 2. These vendors sell automation into the same motion and would buy capability rather than distribution | Smaller balance sheets; several are themselves owned by the platform consolidators above |\n| **Ravenna / Atomicwork** | Adding recording-based discovery is a product decision for them, not a business-model conflict | At their stage they build rather than buy |\n\n**The strategic read, corrected:** the platform vendors are the likeliest *distribution* partner and, later, a **low-multiple tuck-in** \u2014 not a strategic acquirer paying for capability. They buy revenue-producing products with installed bases at revenue multiples, and the marketplace dependency **caps** the price rather than raising it: they observe traction, take their 15\u201325%, and can bundle. The genuinely capability-motivated buyers are the MSP automation and lifecycle vendors. That is a **workable** trade-sale profile and a **poor** independence profile.\n\n## 3 \u00b7 IPO-path conditions\n\nAn IPO requires roughly $100M+ ARR with durable growth. Against `revenue_build.md`: $50M ARR already needs ~23\u201328% of the entire serviceable MSP band, and $100M exceeds the band outright. **The IPO path therefore does not exist on the wedge.** It requires the internal-IT expansion \u2014 a market this pack explicitly declines to claim, on an axis (resolution quality) it has chosen not to compete on, against competitors funded at $164.5M and an incumbent that paid $2.85B for the category.\n\n**Stating the condition plainly:** an IPO story for this company is a story about winning internal IT, and nothing in this pack argues that we can.\n\n## 4 \u00b7 Can this be a standalone generational company?\n\n**On the MSP wedge alone: no, and the arithmetic says so rather than the mood.**\n\nSAM is ~$179M (D11; $215M under the superseded flat fee). A generational outcome requires either capturing a share of it no early-stage company should assume, or entering a market this pack has declined to claim. **The honest ceiling on the wedge is an excellent business \u2014 a durable **subscription** line of ~$8,900 per MSP (the ticket revenue; the ~$6,030 of turnover-driven onboarding fees is a function of the customer's own client churn and is argued separately \u2014 `revenue_build.md` \u00a74), a defensible mechanism, and a natural acquirer set \u2014 and not a generational one.**\n\n**What would change that answer**, in descending order of credibility:\n\n1. **Price capture \u2014 and the earlier version's arithmetic was wrong twice.** Doubling the ticket price ($6 \u2192 $11.25) doubles only the *ticket* half of a two-part tariff: $16,740 + $6,030 = **~$22,770 per MSP \u2192 SAM ~$273M, a 53% rise, not a double.** That is the exact error `market_sizing.md` congratulates the model for avoiding. **And the anchor it rested on is also wrong**: the $22.50 blend is internal-IT across the whole queue, while the tickets we address plausibly cost the MSP `(assumption: $2\u20136)` \u2014 so at $6 we may already be at or above their marginal cost, and \"capturing half the labour value\" may not be available at all [pricing.md](pricing.md) \u00a72. **Price capture improves the trade-sale case; it does not change the generational answer**, and E8 must establish the subset's real cost before it is offered as a path.\n2. **The variance envelope becoming an asset others pay for.** If procedure-variance data across thousands of environments is valuable to platform vendors or to the vendors whose products are being administered, that is a second business \u2014 speculative, and it depends entirely on A8.\n3. **Internal IT.** Real, large, and a fight on the wrong axis. Available if the MSP-proven library gives a genuine cold-start advantage, which is M5, which is a year-two mechanism at best.\n\n**The honest close, and it is the one this pack has earned:** this is a company whose realistic good outcome is a strong trade sale to an MSP platform vendor within five to seven years, whose upside case runs through pricing rather than through market expansion, and whose downside is a clean, publishable negative on a forty-year-old assumption. **A memo claiming a generational outcome from a $200M SAM would be the strongest evidence against everything else in this pack.**\n\n**Recommended next 3:** (1) test the per-client ticket **cap** in E3 rather than price capture \u2014 the $22.50 anchor is retired and the automatable subset costs an MSP roughly $2\u20136, so headroom is small and the cap is the live question; (2) open a relationship with one MSP platform vendor early, as an intelligence channel rather than a partnership; (3) do not present an IPO path in any investor material, since the arithmetic above makes it checkable in one division.\n"}, "financials/pricing.md": {"g": "Financials", "t": "Pricing \u2014 the banded schedule, and where its basis runs out", "md": "# Pricing \u2014 the banded schedule, and where its basis runs out\n\n> **What this is** \u2014 the value metric and why it was chosen, the anchor analysis, the competitor price table, the banded tier design D7 requires, willingness-to-pay logic per persona, and the pricing-power argument.\n> **Why it exists** \u2014 this pack's pricing has failed a critique once already: the fee was justified against onboarding hours the corrected journeys showed it did not displace. This file rebuilds it band by band and states, explicitly, the band where the justification still does not hold.\n> **How to read it** \u2014 \u00a74 is the uncomfortable section and the one that matters: it shows **what we charge ($1,005 blended) beside what the hours justify (~$241 blended)**, and names E3 as the test that resolves the gap (D16, D17). A skeptic should attack whether the library has value independent of hours at all.\n> **Depends on / feeds** \u2014 inherits [../strategy/market_sizing.md](../strategy/market_sizing.md) (D4, D7, D9), [../product/journeys/beachhead.md](../product/journeys/beachhead.md); feeds [revenue_build.md](revenue_build.md), [unit_economics.md](unit_economics.md), `startup-website` (pricing page).\n\n**Standing rule inherited from `tech/whitepaper.md` \u00a72, and it governs this entire layer:** no `(assumption)` figure may be treated as an input to a financial forecast until the experiment that tests it returns a number. **Everything below is a scenario conditional on E1, E2, E3 and E8**, not a forecast, and every table says which experiment it waits on.\n\n## 1 \u00b7 Value metric\n\n**Two parts, and they measure different things deliberately:**\n\n| Part | Metric | What it scales with | Founder decision |\n|---|---|---|---|\n| **Resolution** | ~$6 per resolved ticket | Work the system does | D4 |\n| **Onboarding** | Banded fee per environment, **from environment 2** | Environments the library covers | D4, banded D7, waiver D9 |\n\n**Why not per seat or per endpoint** \u2014 the two metrics MSPs are used to. Both scale with the *client's* size rather than with anything we do, which means we would be paid most where we help least (a large client onboarded once) and least where the compounding actually lands (many small environments). Per-environment tracks the mechanism.\n\n**Why environment 1 is free (D9).** It costs the customer *more* than doing nothing \u2014 31\u201346 engineer-hours against a 25\u201340 baseline, because the work is unchanged and review is added. Charging for it is charging for a loss, and a design partner's timesheet establishes that in one afternoon.\n\n## 1b \u00b7 Does an MSP accept a per-ticket line at all? (discharging A9)\n\n**A9 has been owed a check in this file since phase 0 and was never written.** \u00a71's \"why not per seat or per endpoint\" answers why per-seat is a poor value metric *for us* \u2014 it never asked whether the *buyer* accepts the axis. That is the load-bearing question, because **MSP per-user and per-device pricing exists precisely so cost is passthrough-able**: every tool in their stack is priced on that axis (RMM per endpoint, PSA and documentation per technician, backup per device), and an MSP quotes its client a fixed per-user rate. **A per-resolved-ticket cost is the one line an MSP cannot pass through, and it peaks in exactly the months its own margin is worst.**\n\n**The precedent that resolves it, and it is already in this channel.** White-label NOC and helpdesk outsourcing is bought **per incident** and priced into the MSP's per-user rate against a utilisation assumption. MSPs already buy variable per-ticket capacity and already know how to absorb it \u2014 so the axis is acceptable, **but only with the instrument that comes with it.**\n\n**The instrument: a per-client monthly cap, or an included-ticket allowance above which billing stops.** Without it we are asking an owner to take an uncapped variable cost against a fixed price he has already quoted, which is the objection D18's capacity framing makes *sharper* rather than softer. **`financials/revenue_build.md` should model the cap's revenue effect before E3, not after.**\n\n**A9 is resolved: the axis is acceptable with a cap; it is not acceptable uncapped.**\n\n## 2 \u00b7 Anchor analysis \u2014 corrected twice, and one anchor withdrawn\n\n| Anchor | Figure | Basis |\n|---|---|---|\n| MSP onboarding labour, **complex client** | 40\u201380 engineer-hours | **[S21] \u2014 this is what the source actually says** |\n| MSP onboarding labour, **median client** | 25\u201340 engineer-hours | `(assumption \u2014 no source)`. **The earlier version cited [S21] for this figure and [S21] does not contain it.** See below |\n| Loaded engineer rate | **$46\u201358/hr** | Derived from \u00a75's own $95\u2013120k loaded technician cost \u00f7 2,080 hrs. The earlier `$75/hr` implied $156k loaded \u2014 above the top of this file's own range |\n| **The budget displaced, median client** | **$322\u2013696** | 7\u201312 hours \u00d7 $46\u201358, matched-pair method (\u00a74) |\n| Buyer's blended cost per ticket | $22.50 | [S27] \u2014 **and it is the wrong anchor. See below** |\n| Agent labour as share of ticket cost | 70\u201380% | [S28] |\n\n**Two anchors were wrong, and both are the same error class this pack has now committed three times.**\n\n**The `[S21]` mis-citation.** The 25\u201340-hour median figure carried a source tag for a source that says 40\u201380. `strategy/market_sizing.md` states this correctly \u2014 *\"S21's 40\u201380 hours is the typical-to-complex band\"* \u2014 and this file cited it for the median anyway. **An unsourced assumption wearing a citation is worse than an untagged one**, because it defeats the check the tag exists to enable, and this number sits under roughly 40\u201360% of revenue. It is now marked as an assumption with no citation, which is what it always was.\n\n**The $22.50 blended anchor is the wrong population.** [S27] is a blended *internal IT help-desk* cost across the whole queue \u2014 including the expensive escalations this product explicitly does not touch. The tickets we address are the cheapest quartile by construction: password/MFA resets, mailbox permissions, provisioning, printer queues, and RMM-alert remediation with documented fixes. **A junior technician at $22\u201330/hr loaded clearing 6\u201310 of those an hour costs the MSP roughly `(assumption: $2\u20136 per ticket)`** \u2014 and a material share of the alert half is already scripted inside the RMM they pay for.\n\n**The consequence is uncomfortable and is stated rather than buried: at $6, our per-ticket price may sit at or above the MSP's own marginal cost for exactly the tickets we automate.** What we would actually be selling on that half is capacity rather than savings \u2014 the tech is at capacity and the alternative is a hire [S33]. That is a real argument, but it is not the arithmetic argument this file was making. **E8 must establish the cost of the automatable subset, not the blend**, and until it does, the per-ticket price has no verified basis either.\n\n## 3 \u00b7 Competitor price table\n\n| Vendor | Public price | Model |\n|---|---|---|\n| Ravenna | **Not public** \u2014 quote only | Per-seat, believed |\n| Atomicwork | Not public | Enterprise contract |\n| Moveworks / ServiceNow | Not public | Enterprise contract |\n| ServiceNow ITSM | $150\u2013300+/fulfiller/month, plus implementation at 3\u20135\u00d7 licence [S20] | Seat + services |\n| IT Glue / documentation class | ~$30\u201350/technician/month `(assumption)` | Per technician |\n\n**No AI-ITSM vendor publishes a price**, which `research/sources.md` records as a marked gap. That is why the anchor above is the buyer's own cost structure rather than a competitor's list price \u2014 the only honest anchor available.\n\n## 4 \u00b7 The banded schedule (D7/D11) \u2014 one method, and the fee fails at every band\n\n**The earlier version of this table computed \"hours displaced\" three different ways** \u2014 crossed extremes for the small and typical rows, matched pairs for complex. That inconsistency is not cosmetic: **it is what produced D11's entire cascade.** The complex row looked worst (167\u2013333%) only because it was the one row using the stricter convention.\n\n**Matched pairs is the correct method, and it is now used for all three rows.** A low-complexity client has a low baseline *and* a low post-Understudy figure; crossing the extremes compares one client's baseline against a different client's outcome, which is not a real client. \"With Understudy\" is baseline \u00d7 0.70, per M1's derivation that ~30% of an onboarding is environment discovery and ~70% is mechanical setup observation does not touch.\n\n| Band | Share `(assumption)` | Baseline hrs | With Understudy | **Displaced (matched)** | Value @ $46\u201358 | Fee | **Fee as % of value** |\n|---|---|---|---|---|---|---|---|\n| **Small** \u226410 users | ~45% | 15\u201325 | 10\u201318 | **5\u20137** | $230\u2013406 | $400 | **99%\u2013174%** |\n| **Typical** 10\u201330 | ~40% | 25\u201340 | 18\u201328 | **7\u201312** | $322\u2013696 | $1,500 | **216%\u2013466%** \u26a0\u26a0 |\n| **Complex** 30+ | ~15% | 40\u201380 | 28\u201356 | **12\u201324** | $552\u20131,392 | $1,500 | **108%\u2013272%** |\n| **Blended** | | | | | | **~$1,005** | |\n\n### What the consistent method changes\n\n**1. The fee fails at every band, at every point in every range.** The lowest ratio anywhere in the table is 99%. There is no point at which the banded schedule is priced below the hours it displaces.\n\n**2. D11 cut the wrong band.** Under the corrected method **typical (216\u2013466%) is the worst band and complex (108\u2013272%) is the best of the three** \u2014 the reverse of what D11 acted on. D11's *arithmetic* propagated correctly and every downstream figure in the pack is internally consistent with it; **its rationale was an artifact of the inconsistency it was correcting for.** That is recorded here rather than quietly fixed, because the cascade it triggered moved SAM by $36M and the CAC ceiling by $3,400.\n\n**3. An hours-defensible schedule would be roughly a quarter of this one.** At ~50% of midpoint displaced value: **~$159 small, ~$254 typical, ~$486 complex \u2014 blended ~$246.** That would put steady-state onboarding revenue at ~$1,446/yr per MSP instead of $6,030, revenue per MSP at ~$10,350, and **SAM at ~$124M**.\n\n**The schedule is held at $400/$1,500/$1,500 pending E3, on the founder's instruction** \u2014 a structure should not be abandoned on the strength of numbers that were computed three inconsistent ways. But the finding is now unambiguous: **the hours basis cannot support this fee at any band.** Either the fee is justified on something other than hours \u2014 the maintained runbook, the tier-1 floor, knowledge retention, none of which are hours-denominated \u2014 or it moves to the D12 per-MSP platform fee, or it drops by roughly 4\u00d7.\n\n**E3 is therefore no longer a price test. It is a *basis* test:** does an MSP owner pay for the library, or only for the hours? Ten conversations settle it, and no model can.\n\n## 4b \u00b7 The all-in cost the buyer actually sees \u2014 added after critic round 2\n\n**D14 moved the node cost off our P&L and onto the customer's, and no willingness-to-pay artifact reflected it.** That is a hole, not a detail: a hosted node at `(assumption: $150\u2013250/month)` is **$1,800\u20133,000/yr**, which is **+12\u201320% on our ~$14,930 steady-state revenue and +35\u201359% on year-1's ~$5,110.**\n\n| What the buyer pays, year 1 | Amount |\n|---|---|\n| Onboarding fees (4 chargeable environments at ~$1,005) | ~$4,020 |\n| Resolved tickets | ~$1,090 |\n| **Hosted node** | **$1,800\u20133,000** |\n| **All-in year 1** | **~$6,900\u20138,100** |\n\n**Two consequences the pack has to carry:**\n\n1. **Under the hours-defensible calibration the node opex alone exceeds the entire fee.** At ~$246 blended, six environments a year is ~$1,476 of fee against $1,800\u20133,000 of hosting. **If the value turns out to be hours-shaped, the hosted-node default is not viable and the MSP must own the hardware.**\n2. **E3 must show the all-in number in both arms.** Asking an owner to countersign an LOI at $1,005/environment for a product that also carries a mandatory hosting line they were never shown produces a signature that means nothing. E3 runs in month one and ten owners cannot be re-asked cheaply.\n\n**Open: is the node bundled or passed through?** Bundling it into the fee raises the headline price into territory \u00a74 already shows is indefensible on hours. Passing it through keeps our margin but adds a procurement conversation. **This is a founder decision and it is not made here.**\n\n## 5 \u00b7 Willingness to pay, by persona\n\n| Persona | Pays for | Ceiling `(assumption, untested until E3)` |\n|---|---|---|\n| **Marcus** (owner) | Taking a client he cannot staff | Anchored on a technician's loaded cost, ~$95\u2013120k \u2014 so a four-figure per-environment fee is small *if* the leverage story lands. **But the comparison he actually makes is all-in: ~$6,900\u20138,100 in year 1 including the node** (\u00a74b) |\n| **Dana** (delivery manager) | A runbook that stays true | Would not authorise a purchase; would block one |\n| **Ray** (principal) | Nothing. He is not a buyer | \u2014 |\n\n**The buyer's real comparison is not our fee against our value. It is our fee against a hire he cannot make** [S33]. That framing supports a much higher price than the compression arithmetic does \u2014 and it is exactly the framing `petal_diagram.md` warns is dangerous to say out loud, because it poisons the personas whose cooperation capture requires.\n\n## 6 \u00b7 Pricing power over time\n\nPrice should rise as the variance envelope thickens, because what the buyer receives at environment 20 is materially better than at environment 2. **But that argument is A8** \u2014 untested, and the whole pricing-power case collapses with it. There is no pricing-power claim in this pack that does not reduce to the transfer assumption.\n\n**Recommended next 3:** (1) run E3 before committing to any schedule \u2014 **the fee has now failed three arithmetic checks** and a tenth conversation is worth more than an eleventh model; (2) settle the per-client ticket cap (\u00a71b) and model its revenue effect, since an uncapped variable line is the objection an MSP owner raises first; (3) decide whether the hosted node is bundled or passed through (\u00a74b) \u2014 the buyer's all-in year-1 cost is ~$6,900\u20138,100, not the $5,110 the revenue model shows.\n"}, "financials/revenue_build.md": {"g": "Financials", "t": "Revenue build \u2014 $1M \u2192 $10M \u2192 $50M ARR, and what each jump requires", "md": "# Revenue build \u2014 $1M \u2192 $10M \u2192 $50M ARR, and what each jump requires\n\n> **What this is** \u2014 the bottom-up path to scale: units \u00d7 conversion \u00d7 price per stage, the expansion layers, the milestone each jump depends on, and which GTM motion carries it.\n> **Why it exists** \u2014 a revenue build is where a pack either inherits its own corrected numbers or quietly reverts to the flattering ones. **This file also carries a cascade the pricing work created: the banded schedule `pricing.md` recommends lowers the blended fee from $1,500 to ~$1,005, which moves SAM, the CAC ceiling and every channel verdict.** That is surfaced here, not absorbed.\n> **How to read it** \u2014 \u00a71 first: the decided banded basis, then the hours-defensible downside modelled beside it. A skeptic should note that every row waits on E1, and that the downside case closes every acquisition channel.\n> **Depends on / feeds** \u2014 inherits [pricing.md](pricing.md), [../strategy/market_sizing.md](../strategy/market_sizing.md), [../strategy/gtm.md](../strategy/gtm.md); feeds [unit_economics.md](unit_economics.md), [use_of_funds.md](use_of_funds.md), `narrative/pitch_deck.md`.\n\n**Conditional on E1.** If cross-environment transfer lands below ~70%, M1 collapses, the onboarding fee loses its compression basis entirely, and every figure below is void. Nothing here is a forecast.\n\n## 1 \u00b7 The pricing cascade \u2014 decided (D11), and what it moved\n\nThe banded schedule is **decided**, not undecided. The earlier version of this section carried two live columns and an escalation sentence after D11 had already settled it, and the superseded flat figures then leaked into `unit_economics.md`'s headline row \u2014 where an investor skimming the top line read $7,100 and $17,900, the two numbers D11 retired. **Banded is now the sole primary basis across this layer; flat survives only as the footnote below.**\n\n| Operative figure | Value |\n|---|---|\n| Blended fee per environment (45/40/15 at $400/$1,500/$1,500) | **~$1,005** |\n| **What the hours actually justify** `(D16 \u2014 kept visible deliberately)` | **~$241** |\n| Year-1 revenue per MSP (5 environments, first waived per D9) | **~$5,110** |\n| Steady-state revenue per MSP | **~$14,930** |\n| 3-year revenue per MSP | **~$40,000** |\n| Fully loaded gross margin over the 3-year ramp (built by driver, `unit_economics.md` \u00a73b) | **~77%**, range 68\u201380% |\n| 3-year gross profit | **~$30,600** (range $27,200\u201332,000) |\n| **CAC ceiling at 3:1** | **~$10,200**, range **$9,100\u201310,700** \u2014 and the top-end LTV:CAC straddles the 3:1 floor |\n| SAM (12,000 MSPs) | **~$179M** |\n\n### The second column that matters now \u2014 the hours-defensible case, modelled\n\n**D16 kept the ~$246 calibration visible; nobody had modelled it.** The layer deleted its old second column (flat vs banded) at exactly the moment a genuinely different second scenario became necessary. Here it is:\n\n| | **Charged (D11)** | **Hours-defensible** |\n|---|---|---|\n| Blended fee | $1,005 | **$246** |\n| Year 1 | $5,110 | **$2,074** |\n| 3-year revenue | $39,985 | **$17,974** |\n| 3-year gross profit (68\u201380%) | $27,190\u201331,988 | **$12,222\u201314,379** |\n| **CAC ceiling at 3:1** | $9,063\u201310,663 | **$4,074\u20134,793** |\n| Steady state / MSP | $14,930 | **$10,376** |\n| SAM | $179M | **$124M** |\n\n**At the hours-defensible ceiling of ~$4,100\u20134,800, the primary channel ($4,000\u20139,000) is at or above the ceiling across essentially its whole range, and no channel in `strategy/channel_plan.md` is viable.** Buying groups at $500\u20132,000 are the sole survivor, and they are the one channel whose access is gated rather than bought.\n\n**That is the pack's real downside case, it is one experiment away, and the fee it depends on is ~79% of year-1 revenue.** It also gives D12's platform-fee contingency a number rather than a name: at $10,376 of steady-state revenue with the onboarding half stripped out, a per-MSP subscription would have to clear roughly **$1,500/month** to reach the same place \u2014 which is a different sale to a different budget, and it should be priced before E3 rather than after.\n\n*Footnote \u2014 what the flat $1,500 schedule gave, for anyone reconciling against an earlier draft: $17,900 steady state, $7,100 year 1, $54,350 over three years, a $12,700 ceiling and a $215M SAM. D11 banded the complex tier down and the cascade moved every one of them.*\n\n**A correction that arrived after D11 and does not change these figures but does change their standing:** `pricing.md` \u00a74 now computes hours displaced by one consistent method across all three bands, and under it **the fee is priced above displaced value at every band** \u2014 with *typical* the worst offender, not complex. D11's arithmetic propagated correctly; its rationale was an artifact of an inconsistency. **The schedule stands pending E3 on the founder's instruction, and E3 is now a test of whether the fee has any hours basis at all.**\n\n## 2 \u00b7 The path\n\n| Stage | ARR | MSPs | Environments live | What has to be true | Motion |\n|---|---|---|---|---|---|\n| **First revenue** | **~$5k** | 1 | 5 | E1 \u226570%; E3 accepts the fee; one MSP admits us | Design partner converted |\n| **$100k** | $100k | **~20** | **~100** | Channel admissibility confirmed (E4); the published time-to-first-verified-skill number exists | Peer/buying groups |\n| **$1M** | $1M | **~67** at steady state | **~2,750** | Expansion works without a sales conversation; security review \u22646 weeks median (E7) | Groups + newsletters |\n| **$10M** | $10M | **~670** | **~27,000** | **Marketplace listing live** \u2014 requires SOC 2, a shipping integration and references; 18\u201324 months minimum | RMM/PSA marketplace |\n| **$50M** | $50M | **~3,350** | \u2014 | **Exceeds the MSP wedge.** 3,350 MSPs is ~28% of the serviceable band \u2014 a share no early-stage company should assume. Requires internal IT, which this pack does not claim | Undefined, honestly |\n\n**The $50M row is where the pack stops claiming.** `market_sizing.md` puts SAM at ~$179M; $50M ARR is ~28% of the entire serviceable market. **A build that runs to $100M without naming a new market is arithmetic laundering**, and this one names the wall instead.\n\n## 3 \u00b7 Expansion layers, in order of confidence\n\n| Layer | Mechanism | Confidence |\n|---|---|---|\n| **Environments per MSP** | Backfill the existing book, then ~6 new clients/yr | Highest \u2014 it is the mod
