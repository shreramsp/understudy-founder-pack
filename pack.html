 executor.\n\n## 3. Enabling technology (see [capability_table.md](capability_table.md))\n\nThree arrivals define the window: computer-use agents moving 12% \u2192 85% on OSWorld between April 2024 and June 2026 [S14][S15]; demonstration-to-workflow synthesis demonstrated in ALLOY [S22] and screen-video pretraining in VideoAgentTrek [S23]; and `SKILL.md` becoming an open, cross-vendor standard for procedural knowledge, Apache 2.0, adopted by 26+ platforms [S24]. Inference cost for fixed capability continues to fall roughly 10\u00d7 per year [S30], making bulk processing of recorded sessions economically trivial relative to the engineer-hours it replaces.\n\n## 4. Evaluation methods and benchmarks\n\n- **OSWorld / OSWorld-Verified** \u2014 the standard computer-use benchmark; leaderboard at 86.1% as of 2026-09-02 [S14].\n- **OSWorld 2.0** \u2014 long-horizon variant, median task 1.6 human-hours; best system 20.6% [S16]. The more honest proxy for a real IT ticket.\n- **No benchmark exists** for procedure clustering, for cross-environment skill transfer, or for autonomous IT ticket resolution. Every resolution-rate figure in this market is vendor-published [S1][S2]. **A company whose core claim has no benchmark should build one** \u2014 an internal, published evaluation harness is both a credibility asset and a genuine moat component.\n\n## 5. Evidence *for* the core mechanism\n\n1. **ALLOY** demonstrates the exact loop \u2014 demonstration in, reusable generalizable workflow out \u2014 and beat both prompt-based agents and manual workflow construction on intent capture and generalization [S22].\n2. **VideoAgentTrek** shows unlabeled screen recordings carry enough signal to improve computer-use capability without manual annotation [S23], supporting the economics of bulk capture.\n3. **Task mining's commercial history** proves the organizational half: enterprises do permit recording of employee work at scale, and FortressIQ's claimed ~90% reduction in discovery time [S7] indicates the observation step genuinely compresses.\n4. **The executor is real now.** 85% on OSWorld is not nothing, and the specific class of IT work Understudy starts with \u2014 repetitive tier-1 procedures on familiar consoles \u2014 sits at the easy end of that distribution.\n5. **A portable landing format exists** [S24], so a learned procedure is inspectable text an engineer can read, correct and own \u2014 which is also the answer to RPA's opacity problem.\n\n## 6. Evidence *against* \u2014 read this before believing \u00a75\n\n1. **Benchmark-to-reality gap.** Agents at 85% on OSWorld fail ~80% of real workflows [S15]. Benchmarks are curated; client environments are not.\n2. **Long-horizon collapse.** 20.6% on OSWorld 2.0 [S16]. Real tickets are long-horizon.\n3. **RPA's record is the base rate.** Automation derived from observed work has failed 30\u201350% of the time with maintenance at 60% of cost [S10][S11]. The burden is on Understudy to explain what is structurally different, and \"we use an LLM\" is not that explanation \u2014 brittleness came from environment drift, which LLMs mitigate but do not eliminate.\n4. **PbD's generalization problem is unsolved, not bypassed.** Fifty years of it.\n5. **No published evidence of cross-environment transfer** \u2014 the single most load-bearing commercial assumption (A8) has no support in the literature either way.\n6. **The historical analogue was absorbed.** FortressIQ's outcome was a $ \u200btrade sale into an RPA vendor and product invisibility [S5][S6], not an independent category win.\n\n## 6b. Human\u2013automation trust \u2014 the literature the adoption argument rests on\n\nThe product's adoption case (readable skills, correction rights, gated actions) is a **trust-calibration** argument, and that field has forty years of results the pack must not reinvent:\n\n- **Lee & See (2004), \"Trust in Automation: Designing for Appropriate Reliance.\"** The goal is not maximal trust but *calibrated* trust \u2014 reliance matched to actual capability. Both over-trust and under-trust are failures. Transparency about how a system works, and about its limits, is the primary calibration mechanism. [S35]\n- **Parasuraman & Riley (1997), \"Humans and Automation: Use, Misuse, Disuse, Abuse.\"** Names the failure modes directly: **misuse** (over-reliance on an unreliable system), **disuse** (rejecting a system that would have helped \u2014 which is what Ray does if beat 12 goes wrong), and **abuse** (deploying automation without regard to the human's resulting role). [S36]\n- **Automation bias and complacency.** Operators under-verify automated recommendations, especially when the system is usually right \u2014 which is precisely the condition a skill library with a high success rate creates. Verification that a human performs *because the system asked* degrades over time.\n\n**What this implies for the product, beyond what the pack already says:**\n\n1. **A high success rate is a hazard as well as an asset.** The 14:20-class error (verified action, wrong decision) is exactly where automation bias bites: an approver who has clicked through 200 correct proposals reads the 201st less carefully. Approval-surface design must fight the habituation it creates.\n2. **Disuse is the more likely failure here than misuse**, because the expert whose cooperation the capture programme needs is the one most equipped to reject it (`P8`).\n3. **Calibration, not confidence.** This is the research reason the product shows an envelope (\"seen in 6 tenants, 3 variants\") rather than a confidence score: a number invites reliance it cannot justify.\n\n## 7. Risks the science implies\n\n- **Happy-path capture.** A recording captures what one engineer did once; failure branches, aborted attempts and recovery behaviour are exactly what is *not* demonstrated, and exactly what production requires.\n- **Silent wrongness.** A skill that executes cleanly and does the wrong thing is worse than one that fails loudly. IT actions are frequently destructive and often irreversible. **Automation bias makes this worse over time**, not better: the more reliable the system, the less carefully each approval is read [S35][S36].\n- **Drift.** Client environments change continuously; a skill library is a maintenance liability from the day it is written \u2014 the precise mechanism that made RPA maintenance 60% of cost [S11].\n- **Regulatory.** Continuous screen recording of employees is treated as disproportionate under EU data-protection practice, consent is a weak legal basis given the employer\u2013employee power imbalance, and works councils hold co-determination rights in Germany, the Netherlands, Austria and Sweden [S29]. This constrains the capture step in the EU specifically and belongs in the risk matrix, not in a footnote.\n\n## 8. Open questions\n\n1. **Does a skill learned in environment A execute correctly in environment B?** No literature. The commercial crux (A8).\n2. **How many demonstrations does one reliable skill require?** Unknown; determines the cost and duration of onboarding, and therefore the entire unit-economics model.\n3. **Can failure branches be learned from happy-path recordings**, or must they be elicited separately?\n4. **What is the decay rate of a skill** as an environment drifts, and can drift be detected before an action goes wrong?\n5. **Is there a defensible evaluation of autonomous IT resolution** that a buyer would accept \u2014 and does building it constitute the moat?\n\n**Recommended next 3:** (1) resolve \u00a78 Q2 (demonstrations per reliable skill) inside E1 \u2014 it is a precondition of the chosen alignment method, not a curiosity; (2) add the automation-trust literature to the product's design reviews, not just to this file, since \u00a76b's findings bear directly on the approval surface; (3) publish \u00a76 as a standalone note \u2014 the evidence *against* the mechanism is more useful to the field than the pack's case for it, and publishing it early costs nothing and buys credibility.\n"}, "strategy/business_model_canvas.md": {"g": "Strategy", "t": "Business model canvas \u2014 Osterwalder nine blocks", "md": "# Business model canvas \u2014 Osterwalder nine blocks\n\n> **What this is** \u2014 Blank's Customer Discovery Phase 1 artifact: all nine blocks, each carrying **one falsifiable hypothesis and the cheapest test that would kill it**.\n> **Why it exists** \u2014 the Lean Canvas [lean_canvas.md](lean_canvas.md) is Maurya's variant and drops Key Partners, Key Activities and Customer Relationships \u2014 precisely the blocks Blank insists on testing, and precisely where a channel-dependent MSP business can quietly fail. Both are kept and cross-linked deliberately.\n> **How to read it** \u2014 read the Test column, not the Hypothesis column; the hypotheses are ordinary, and the discipline is that each has a kill condition. A skeptic should check that no test costs more than the learning is worth.\n> **Depends on / feeds** \u2014 cites [lean_canvas.md](lean_canvas.md), [market_sizing.md](market_sizing.md), [personas.md](personas.md); feeds `validation/experiment_board.md`, `validation/riskiest_assumptions.md`.\n\n| Block | Content | Falsifiable hypothesis | Cheapest killing test |\n|---|---|---|---|\n| **Customer segments** | US MSPs, 10\u2013100 employees, multi-client, no automation staff (~12,000 [S31]); expansion to internal IT | \u22656 of 10 MSP owners rank onboarding cost in their top 3 operational pains, unprompted | 10 discovery interviews, unprompted pain ranking. 1 week, ~$0 |\n| **Value propositions** | Learns each client environment by watching engineers; onboarding cost falls per client and compounds | \u22655 of 10 can restate the value prop accurately after one reading, and name onboarding (not resolution) as the differentiator | Read the positioning statement cold to 10 owners; ask them to explain it back. 1 week |\n| **Channels** | **Open sources first** (r/msp, MSP Discord/Slack, LinkedIn owner outreach, podcast audiences) \u2192 peer communities and buying groups once admitted \u2192 RMM/PSA marketplace at 18\u201324 months [channel_plan.md](channel_plan.md) | **Prior hypothesis first:** the founder is admissible to peer/buying groups as a vendor at all. Then: a peer introduction converts \u226520% to a booked call; open-source outreach converts \u22655% | Admissibility: name 3 groups, establish membership and vendor terms \u2014 2 weeks, ~$0, and it can close the primary channel before any spend. Then 30 intros vs 100 open-source approaches |\n| **Customer relationships** | High-touch pilot \u2192 expansion to further client environments, **gated by client-side security review, not by sales** | **Expansion velocity is set by review throughput:** an MSP can clear \u22652 client-side security reviews per quarter at ~6 weeks each [sales_roadmap.md](sales_roadmap.md). Removing the sales conversation does not remove the review, so the old hypothesis could pass while expansion still failed | Measure review cycle time on the first 5 environments, not sales touches. Kill condition: median review >10 weeks, which caps the ramp in [market_sizing.md](market_sizing.md) \u00a73 |\n| **Revenue streams** | **Two-part tariff (D4), environment 1 waived (D9):** ~$6/resolved ticket + a **banded fee from environment 2** ($400/$1,500/$1,500, blended ~$1,005 \u2014 D11), the fee being ~79% of year-1 revenue | **The hypothesis must test the half that carries the revenue, and it is now narrower:** an MSP owner will pay $1,500 for environment 2+ where onboarding falls from 25\u201340 hours to 18\u201328 \u2014 i.e. for 0\u201322 hours displaced. That is the same bet as A8: **if procedures do not transfer, the fee has no basis at any environment.** | Put the banded schedule in front of 10 owners against their own hour counts, framed as \"first one free\". Kill condition: fewer than 5 accept at the median band, or measured environment-2 compression comes back under 5 hours |\n| **Key resources** | The compounding global skill library (A8); clustering quality; the evaluation harness | A skill synthesized in environment A executes correctly in environment B \u226570% of the time | **The BRIEF's decisive test** \u2014 3 engineers \u00d7 5 procedures \u00d7 2 environments. Weeks, not months |\n| **Key activities** | Clustering/dedup research; skill evaluation; security architecture for tenant isolation | Clustering quality is improvable by engineering rather than bounded by model capability | Ablation: same recordings, three clustering approaches, measured on the same held-out environment |\n| **Key partners** | RMM/PSA vendors (distribution); IdP vendors (identity/attribution); MSP peer groups | At least one RMM/PSA vendor will list an AI service-desk integration without an exclusivity demand | Partner conversations with 3 vendors before building any integration |\n| **Cost structure** | Inference (falling ~10\u00d7/yr [S30]); engineering; **per-environment security review, recurring**; SOC 2 programme | Blended gross margin across both tariff parts exceeds 70% \u2014 including clustering inference amortised over the onboarding fee, which is the compute-heavy half | Model per-ticket *and* per-environment cost against real recorded sessions \u2014 owed to `financials/unit_economics.md` |\n\n## The three blocks the Lean Canvas would have hidden\n\n- **Key partners.** This business plausibly reaches scale through RMM/PSA marketplaces rather than direct sales, which makes a partner the channel and therefore a dependency, not a nicety. Untested here, and it is the block most likely to change the GTM shape.\n- **Key activities.** Naming *clustering quality* as the key activity \u2014 rather than \"building the product\" \u2014 is what keeps engineering pointed at the riskiest assumption instead of at surface area.\n- **Customer relationships.** The land-and-expand motion is per *environment*, not per seat, and its throttle is the client-side security review rather than sales capacity \u2014 a constraint that appears on no Lean Canvas and that directly caps the revenue ramp.\n\n**Recommended next 3 moves:** (1) run the 10 discovery interviews once \u2014 four blocks are tested by the same conversation; (2) run the key-resources test before any GTM spend, since a negative result reshapes the company; (3) open partner conversations early, because channel economics take months to learn and cannot be compressed later.\n"}, "strategy/channel_plan.md": {"g": "Strategy", "t": "Channel plan and channel economics", "md": "# Channel plan and channel economics\n\n> **What this is** \u2014 the channel map by segment **with the economics computed**: the discount and margin stack from list price to net, cost to acquire through each channel, time to first revenue, and a viability verdict at our price point.\n> **Why it exists** \u2014 a GTM narrative that names channels without computing its margins is asserting distribution rather than planning it. At ~$5,110 year-1 revenue per customer, **two of the six channels below are impossible, three carry warnings, and none has slack** \u2014 and the one that looks most attractive is 18\u201324 months away. Better to know now.\n> **How to read it** \u2014 the Verdict column. A skeptic should attack the marketplace revenue-share assumption, which is a placeholder until partner conversations happen.\n> **Depends on / feeds** \u2014 cites [gtm.md](gtm.md), [market_sizing.md](market_sizing.md); feeds `financials/unit_economics.md`, `financials/revenue_build.md`, [sales_roadmap.md](sales_roadmap.md).\n\n**Reference figures (corrected after critic round 1):** list $6/resolved ticket + $1,500/environment onboarded from environment 2 (first waived, D9) \u00b7 banded fee $400/$1,500/$1,500 (D11) \u00b7 **year-1 revenue per MSP ~$5,110** \u00b7 3-year gross profit ~$30,600 (range $27,200\u201332,000) \u00b7 **CAC ceiling ~$10,200 at 3:1 \u2014 range $9,100\u201310,700, and the primary channel's top end straddles the floor inside it** \u00b7 target \u2264$5,000 [gtm.md](gtm.md).\n\nThe first version judged these channels against a $21,000 ceiling derived from full-book penetration. Two verdicts change below, and the primary channel's costing was wrong in a way that mattered.\n\n| Channel | Margin stack (list \u2192 net) | CAC | Time to first revenue | Viable at this price? |\n|---|---|---|---|---|\n| **MSP peer communities** | No intermediary \u2014 **100% net** | **$4,000\u20139,000** `(assumption: entry cost + participation, amortised \u2014 see \u00a7Entry cost below \u2014 plus 15\u201325 hrs per close at ~$100/hr founder time)` | **6\u20139 months to first close** (membership approval, then participation before any pitch) | \u26a0\ufe0f **Primary, and now genuinely tight.** At the top of its range ($9,000) it sits inside the **~$10,200 ceiling** at 3.4:1 \u2014 **but the ceiling is a range ($9,100\u201310,700), and at its low end $9,000 returns exactly 3.0:1, the floor itself.** A customer acquired at that cost clears the bar only in the favourable half of the margin range. The target of \u2264$5,000 is no longer a stretch goal; it is the viability line |\n| **Newsletters / podcasts (MSP-focused)** | Sponsorship is a fixed cost, not a cut \u2014 **100% net** | $4,000\u20138,000 `(assumption: $3\u20138k placements, 1\u20132 customers each)` | 30\u201390 days | \u26a0\ufe0f **Secondary, and marginal.** At $8,000 it consumes 75\u201388% of the ceiling depending where in the $9,100\u201310,700 range the margin lands. Viable only with the hours ROI calculator attached; brand advertising is not affordable at this ACV |\n| **RMM/PSA marketplace** | **15\u201325% revenue share** `(assumption: typical marketplace band; unverified \u2014 no partner conversation has happened)` \u2192 net ~$11,200\u201312,700/yr steady state | $1,000\u20133,000 `(assumption: marketplace demand, low touch)` | **18\u201324 months** \u2014 listing requires a shipping integration, SOC 2 and reference customers, none of which exist at a design-stage company | \u26a0\ufe0f **Still the only path to 100 customers, and further away than the first version implied.** The rev-share is survivable; the timeline is the real cost and it puts first-100 in year two |\n| **MSP franchise / buying groups** | **10\u201320% referral fee** `(assumption: unverified)`, often plus a member discount \u2192 net ~$11,900\u201313,400/yr | $500\u20132,000 `(assumption)` | 3\u20136 months to get approved | \u2705 **Best economics available.** Access is the constraint, not the margin \u2014 apply now, since approval time is the binding cost |\n| **VAR / channel resellers** | **30\u201340% reseller margin** `(assumption: unverified)` \u2192 net ~$9,000\u201310,500/yr | Low direct, high enablement cost | 9\u201318 months | \u274c **Not viable.** A 35% cut on a $14,930 steady-state ACV leaves too little to fund support, and resellers will not carry a pre-revenue product without enablement we cannot staff |\n| **Direct outbound / field sales** | 100% net | $15,000\u201340,000 `(assumption: 2 touches + pilot + AE time at loaded cost)` | 60\u2013180 days | \u274c **Arithmetically impossible.** Exceeds the entire ceiling before the pilot starts, at any point in its range. Run once as a 100-email floor test [gtm.md](gtm.md), never as a motion |\n\n## Entry cost \u2014 what the first version omitted\n\nPeer communities in this segment are membership organisations, not open forums: they charge fees, several restrict membership to MSP owners, and vendor participation is usually a separate sponsorship tier priced like a conference booth \u2014 which [gtm.md](gtm.md) \u00a71 rules out on CAC grounds. **A technical founder with no MSP relationships may not be admissible as a peer at all.** The channel therefore carries an entry cost of both money and months before a single conversation, and that is why CAC above is 2\u00d7 the first version's estimate and time-to-first-close is 6\u20139 months rather than 60\u2013120 days.\n\n**This is the plan's most schedule-sensitive unknown**, and it is answerable in a fortnight: name three specific groups, establish membership rules and vendor terms, and confirm admissibility. If a vendor cannot join as a peer, the primary channel is not viable and the whole plan reshapes toward buying groups and the marketplace \u2014 better discovered in week two than month nine.\n\n**And the hours-defensible downside closes every channel.** If E3 shows the value is hours-shaped, `financials/revenue_build.md` puts the ceiling at **~$4,100\u20134,800** \u2014 at which the primary channel is at or above it across essentially its whole range, and **only buying groups survive.** That is the one channel whose access is gated rather than bought, which makes E4 the experiment that decides whether the downside case has any distribution at all.\n\n## The three conclusions\n\n1. **Buying groups now have the best economics; peer communities are primary but neither cheap nor fast.** Both are relationship-gated rather than spend-gated, so the channel cannot be bought with the seed round \u2014 it has to be earned, with a lead time of 3\u20139 months. **Under the corrected ceiling the comfortable margin is gone: the primary channel at its top end ($9,000) sits just inside the $10,100 ceiling, at 3.4:1.** There is no channel with slack in it.\n2. **The marketplace is the only route to 100 customers, it costs 15\u201325% plus a dependency, and it is 18\u201324 months out.** Listing requires a shipping integration, SOC 2 and references. The sequencing is fixed by those prerequisites rather than chosen: prove the motion in communities, then list. Month-2 partner contact is an *intelligence call to price the rev-share*, not an application \u2014 [gtm.md](gtm.md) \u00a74 now states both events separately.\n3. **Anything requiring a reseller margin or a field sales team is off the table, and the corrected numbers make pricing the binding constraint on distribution.** At per-ticket pricing alone a year-1 customer is worth ~$1,100 and **every channel in this table fails, including the primary one.** The two-part tariff is what makes any distribution viable. Channel viability and pricing are not two questions \u2014 they are one.\n\n**Recommended next 3 moves:** (1) replace the marketplace revenue-share assumption with a real number from three partner conversations before any integration work; (2) apply to two MSP buying groups now, since approval takes 3\u20136 months and the economics are the best available; (3) re-run this table after the two-part tariff test \u2014 several verdicts flip if ACV rises.\n"}, "strategy/gtm.md": {"g": "Strategy", "t": "Go-to-market", "md": "# Go-to-market\n\n> **What this is** \u2014 the channel strategy by segment, the acquisition loop meant to compound, a CAC hypothesis per channel with payback logic, and the twelve-month motion from first conversation to first paid customer.\n> **Why it exists** \u2014 at ~$5,110 year-1 revenue per MSP and ~$14,930 at steady state [market_sizing.md](market_sizing.md), most enterprise go-to-market motions are arithmetically impossible: a $40k acquisition cost never pays back, and even the primary channel has no slack. This file exists to make that constraint explicit before the seed round is spent discovering it.\n> **How to read it** \u2014 the CAC ceiling in \u00a72 is the governing constraint; every channel below is judged against it. A skeptic should attack the assumption that MSP peer communities convert at the rate claimed.\n> **Depends on / feeds** \u2014 cites [market_sizing.md](market_sizing.md), [petal_diagram.md](petal_diagram.md), [personas.md](personas.md); feeds [channel_plan.md](channel_plan.md), [sales_roadmap.md](sales_roadmap.md), `financials/unit_economics.md`, `validation/get_keep_grow.md`.\n\n## 1. The governing arithmetic\n\n| Quantity | Value | Source |\n|---|---|---|\n| **Year-1** revenue per MSP (5 environments live, **first waived per D9**) | **~$5,110** | [market_sizing.md](market_sizing.md) \u00a73 ramp |\n| 3-year revenue per MSP | ~$40,000 | ramp, years 1\u20133, banded (D11) |\n| Fully loaded gross margin | **76%** | derived with its cost stack in `financials/unit_economics.md` \u00a73b \u2014 the 70% assumption is discharged |\n| **3-year gross profit per MSP** | **~$30,600** | built by driver, `financials/unit_economics.md` \u00a73b; range $27,200\u201332,000 |\n| **CAC ceiling at 3:1 LTV:CAC** | **~$10,200** | range $9,100\u201310,700 (D11, D15) |\n| **CAC target for a healthy seed-stage motion** | **\u2264$5,000** | `(assumption: 3:1 is the floor, not the goal; year-1 revenue of $5,110 means anything above ~$5k has a payback longer than the first renewal decision \u2014 the target and the year-1 revenue are now essentially the same number)` |\n\n**Corrected after critic round 1.** The first version computed revenue across an MSP's entire client book and then added expansion on top, producing a $21,000 ceiling that flattered every channel. Revenue arrives one environment at a time, and the first is now waived (D9); the ceiling is **~$10,200** after the D11 banding and the driver-built margin, with a $9,100\u201310,700 range the top-end channel verdict flips inside, and the year-1 constraint is tighter still \u2014 **no channel now has a comfortable margin.**\n\n**What this rules out immediately:** field sales, enterprise-style multi-threaded pursuit, conference booths as a primary channel, and any motion requiring more than roughly two sales touches plus a pilot. **What it demands:** channels where trust is inherited rather than purchased.\n\n**And it makes the onboarding fee load-bearing for distribution, not just for revenue.** Year-1 value is ~$5,110 and roughly 79% of it is the per-environment fee [market_sizing.md](market_sizing.md) \u00a73. A pure per-ticket model yields a year-1 customer worth ~$1,100, at which point no channel in [channel_plan.md](channel_plan.md) is viable \u2014 including the primary one.\n\n## 2. Channel strategy by segment\n\n**Beachhead \u2014 US MSPs, 10\u2013100 employees.**\n\n1. **MSP peer communities and mastermind groups** *(primary)*. MSP owners buy what other MSP owners run, and these groups exist specifically to exchange that. Trust is inherited, so the sales cycle collapses once you are inside. **CAC, entry cost and time-to-first-close are computed in [channel_plan.md](channel_plan.md) and are not restated here** \u2014 the two files drifted apart once already. Summary: not cheap ($4,000\u20139,000) and not fast (6\u20139 months to first close, including membership approval).\n2. **MSP-focused newsletters and podcasts** *(secondary)*. Narrow, cheap, and read by exactly Marcus. Works only with a concrete artifact \u2014 the engineer-hours ROI calculator, not a brand ad. CAC **$4,000\u20138,000** `(assumption)`.\n3. **RMM/PSA marketplace listing** *(scale channel, year 2)*. Where MSPs already shop. Requires a partner relationship and carries a margin stack \u2014 see [channel_plan.md](channel_plan.md).\n4. **Direct outbound** *(disqualifying test, not a channel)*. Run 100 cold emails once to measure the floor. If it converts below 5% to a call, it is confirmation the trust-inherited channels are the only viable ones, which is itself worth knowing cheaply.\n\n**Expansion \u2014 internal IT.** Deliberately deferred. It is where every funded competitor is fighting [research/competitors.md], and entering it before the skill library compounds means competing on resolution quality, the one axis [positioning.md](positioning.md) commits to avoiding.\n\n## 3. The compounding acquisition loop\n\n```\n   MSP onboards client environment\n              \u2193\n   Global skill layer gets denser (A8)\n              \u2193\n   Next MSP's first environment onboards measurably faster\n              \u2193\n   \"Time to first skill\" becomes a number worth repeating\n              \u2193\n   Owner tells peer group  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2192  next MSP\n```\n\n**This loop is the company's only real distribution advantage**, and it is the same asset as the moat: the product literally gets faster to deploy with each customer, which is a referenceable claim rather than a marketing one. It compounds only if skill reuse across environments is real (A8, \u26a0 in [lean_canvas.md](lean_canvas.md)). **If A8 fails, this loop degrades to ordinary word of mouth and the CAC assumptions above are optimistic.**\n\n## 4. The motion \u2014 the first year, not ninety days\n\n**Engineering precondition, stated because the first version omitted it.** BRIEF.md records stage as *design \u2014 nothing implemented*. Multi-surface capture, clustering, skill synthesis, a governed executor and tenant isolation do not exist. The schedule below is therefore an **evidence motion, not a deployment motion**: no step requires running in a customer's production environment, and the paid pilot sits at month 12 behind a stated build milestone. A plan that puts a live client onboarding at day 31 is a plan written as if engineering capacity were free.\n\n**Access precondition, stated because the engineering one was not enough.** [channel_plan.md](channel_plan.md) \u00a7Entry cost establishes that peer communities take 3\u20139 months to enter and may not admit a vendor at all. **The first ten conversations therefore cannot come from that channel** \u2014 it is the channel being built, not the one being used. Day-1 sources are open ones: r/msp and the MSP Discord/Slack communities, LinkedIn outreach to owners of 10\u2013100-person MSPs, MSP-podcast host audiences, and warm paths through any RMM/PSA vendor contact. Lower trust, higher volume, available immediately.\n\n**Days 1\u201330 \u2014 ten conversations, no product pitch, plus the access test in parallel.** Script, screening criteria and the synthesis template are in [../validation/discovery_guide.md](../validation/discovery_guide.md) \u2014 including the questions we deliberately refuse to ask. Marcus-profile owners from the open sources above. Ask what onboarding costs in hours; do not describe the product until the pain is stated unprompted. **Run channel_plan.md's fortnight admissibility test alongside it:** name three specific peer/buying groups, establish membership rules, vendor terms and whether the founder can join at all. **Exit:** \u22656 of 10 rank onboarding in their top 3 pains, *and* a yes/no on admissibility to three named groups.\n\n**Months 2\u20138 \u2014 build the minimum pipeline; months 8\u20139 \u2014 the A8 transfer test.** Correcting the first revision, which said the lab test needed \"no product\". It does not need security review, a pilot agreement or tenant isolation; it *does* need capture, clustering, skill synthesis, an executor and an evaluation harness \u2014 the core loop minus governance. **The window is now taken from the product layer's own effort estimates rather than asserted here:** [product/features_prioritized.md](../product/features_prioritized.md) prices the Now tier at a **34-week floor**, midpoints past 50, for a solo founder \u2014 N1\u2192N2\u2192N3\u2192N4\u2192N6\u2192N7\u2192N0\u2192N8 plus N15's node lifecycle, strictly sequential. The first version of this file allocated 30 days to that chain; the two files now agree because this one moved, not because the estimate shrank.\n\nThe test itself \u2014 three engineers \u00d7 five procedures \u00d7 two environments, per BRIEF's decisive test \u2014 also needs **three engineers who can perform real Okta/M365/AD procedures competently**, which a solo founder does not have on hand. Sources, in order of preference: a design partner lending two engineers for a day, paid contract MSP technicians `(assumption: ~$100/hr, ~16 hours total, ~$1,600)`, or moonlighting tier-2 techs. **The honest schedule is months 2\u20139, not days 31\u201360**, and it now agrees with `strategy/market_type.md`'s \"~12 months runway to first revenue\" instead of contradicting it. **Exit:** a measured cross-environment skill success rate.\n\n**Months 9\u201310 \u2014 recorded walkthrough to three design partners, and publish the *method*.** Show a synthesized skill executing against a lab environment; secure design-partner commitments contingent on a build milestone. Publish the evaluation method and the first data point \u2014 not a yardstick claim, which needs \u22653 environments across \u22652 MSPs before it means anything. **Exit:** three signed design-partner LOIs and one published method.\n\n**Month 12 \u2014 first paid pilot**, gated on a shipping capture-and-execute path and the tenant-isolation document Sonia's review opens with.\n\n**First 10 customers by type** `(assumption: reached ~month 20, given a first paid pilot at month 12 and 6\u20139 month channel entry)`**:** 3 design partners (converted), 4 from the peer group of those 3, 2 from newsletter/podcast attribution, 1 inbound from the published number. **First 100:** requires the marketplace channel. Two distinct partner events, conflated in the first version: an **intelligence call in month 2** to price the revenue share, and a **listing application** gated on a shipping integration, SOC 2 and reference customers \u2014 realistically month 18\u201324. First-100 is a two-year horizon, not a year-one one, and no artifact should imply otherwise.\n\n## 5. What would falsify this GTM\n\n- The founder is not admissible to peer or buying groups as a vendor \u2192 the primary and best-economics channels are both closed, and the plan reshapes around the marketplace at 18\u201324 months. **This is the fastest and cheapest thing to find out, and it is now a day 1\u201330 exit criterion.**\n- Peer-community introductions convert below 20% to a booked call \u2192 trust is not inheritable here, and CAC assumptions collapse.\n- Design partners will not permit even **anonymised** publication (\"a 34-person Midwest MSP\") \u2192 the compounding loop has no fuel and this becomes a conventional, more expensive motion. Note the pilot agreement no longer asks for named-client numbers [sales_roadmap.md](sales_roadmap.md) step 6.\n- Environment #2 at the same MSP requires a sales conversation \u2192 land-and-expand is false, and revenue per MSP is capped at the single-environment figure.\n\n**Recommended next 3 moves:** (1) join two MSP peer communities as a participant before selling anything \u2014 the channel is the relationship; (2) build the engineer-hours ROI calculator as the first marketing artifact, per [petal_diagram.md](petal_diagram.md); (3) run the 100-email cold test once, early, to price the floor honestly.\n"}, "strategy/lean_canvas.md": {"g": "Strategy", "t": "Lean canvas", "md": "# Lean canvas\n\n> **What this is** \u2014 Maurya's lean canvas for Understudy, one table, each cell at most three bullets, with the riskiest cell marked \u26a0.\n> **Why it exists** \u2014 the canvas forces the whole business onto one page so inconsistencies become visible: a channel that cannot reach the customer segment, or a revenue stream that does not match the cost structure. It is the compression test the longer strategy artifacts must survive.\n> **How to read it** \u2014 read the \u26a0 cell first, then Unfair Advantage, which is the cell most businesses fake. A skeptic should attack whether the unfair advantage is genuinely non-copyable in a quarter.\n> **Depends on / feeds** \u2014 cites [positioning.md](positioning.md), [market_sizing.md](market_sizing.md), [personas.md](personas.md); feeds [business_model_canvas.md](business_model_canvas.md) (Blank's 9-block variant, deliberately kept alongside this one), `validation/riskiest_assumptions.md`.\n\n| Block | Content |\n|---|---|\n| **Problem** | 1. Onboarding a client environment costs an MSP 25\u201340 engineer-hours for a median client, 40\u201380 for a complex one, before a ticket is billed [S21]<br>2. Environment knowledge lives in 3 engineers' heads and leaves when they do<br>3. 26% of MSPs cannot staff the clients they could win [S33] |\n| **Customer segments** | 1. **Beachhead:** US MSPs, 10\u2013100 employees, multi-client, no automation staff (~12,000 [S31])<br>2. **Expansion:** internal IT at mid-market companies (the segment every competitor already fights over)<br>3. User \u2260 payer: engineers use, owner/COO signs |\n| **Unique value proposition** | **The service desk that learns each client environment by watching your engineers work \u2014 so client three onboards faster than client one.**<br>Mechanism: a recorded session becomes an executable skill, not a diagram someone still has to implement |\n| **Solution** | 1. Passive capture of engineer sessions (screen, actions, optional narration)<br>2. Clustering into a readable `SKILL.md` library \u2014 global stack layer + private tenant layer<br>3. Governed execution with approval gates and human escalation (never unattended \u2014 D1) |\n| **Key metrics** | 1. **Time-to-first-autonomously-resolved-ticket in a new environment** \u2014 the category yardstick nobody publishes<br>2. Skill reuse rate across environments (**the A8 moat, measured**)<br>3. Engineer-hours per client onboarded, before vs. after |\n| \u26a0 **Unfair advantage** | 1. **The variance envelope, not the procedure.** The happy-path skill for Okta or M365 is authorable from vendor documentation \u2014 that half is copyable. What is not: the observed *distribution* of how the same procedure differs across 41 real environments, the failure branches seen in escalations, the verification steps engineers actually use, and the mapping from how a client phrases a ticket to which procedure it is. That accrues only from deployments<br>2. Time to parity, derived rather than asserted \u2014 see below<br>3. MSP-specific motion nobody else is running<br>4. *Not* the idea \u2014 ALLOY published it [S22] |\n| **Channels** | 1. MSP peer communities and mastermind groups (owner-to-owner)<br>2. MSP-focused podcasts/newsletters and the two big conferences<br>3. RMM/PSA marketplace integration as the eventual scale channel \u2014 see [channel_plan.md](channel_plan.md) for the economics |\n| **Cost structure** | 1. Inference for clustering and execution (falling ~10\u00d7/yr for fixed capability [S30])<br>2. Engineering: clustering quality is the product, not a feature<br>3. Security review and compliance work per enterprise-adjacent client (Sonia's gate) |\n| **Revenue streams** | 1. **Per resolved ticket** at ~$6, against a buyer cost of $22.50 blended / $45 agent-handled [S27][S28]<br>2. **Banded fee from environment 2** \u2014 $400/$1,500/$1,500, blended ~$1,005 (D11); environment 1 waived (D9) because it displaces negative hours; ~79% of year-1 revenue; banding by client size owed to `financials/pricing.md` (D7)<br>3. Expansion: additional client environments per MSP, which is the natural land-and-expand |\n\n## Why \u26a0 moved to Unfair advantage\n\nThe first version marked Key metrics as riskiest, which put the warning on the thermometer rather than the fever. **The cell that can be empty is Unfair advantage**, and critic round 1 was right that the original claim cancelled itself: a global layer covering Okta, M365, Active Directory and Jira describes the four most publicly documented admin surfaces in IT. A competitor can author those happy-path skills from vendor docs without a single deployment. If that were the whole moat, the answer to \"why won't Ravenna do this in a quarter?\" would be *they can*.\n\n**The defensible claim is narrower and survives that attack:** what compounds is not the procedure but the **variance envelope around it** \u2014 how the same operation differs across dozens of real environments, what it looks like when it fails, and how it is verified. None of that is in a vendor's documentation, because vendors document the intended path, not the forty ways a real tenant deviates from it. It accrues only from observed deployments, which is why time-to-parity is measured in deployment coverage rather than engineering quarters.\n\n### Time to parity, derived \u2014 and what it concedes\n\n`(assumption: parity \u2248 variance coverage across ~200 environments for the common stacks)`. The structural advantage is **per-customer environment density: one MSP customer contributes ~41 environments; one internal-IT customer contributes one.** At 5 MSP customers we hold ~200 environments; on the corrected schedule (first paid pilot month 12, ~10 customers by month 20 per [gtm.md](gtm.md) \u00a74) that is **quarters 8\u201310** \u2014 which is where the estimate comes from.\n\n**The concession critic round 2 forced, and it is a real one:** a funded incumbent with live customers is *not* at zero. Every workflow authored in Ravenna's builder encodes how that tenant deviates from the vendor-documented path \u2014 described variance is still variance data. Two things separate it from ours and neither is total: described variance records what an admin *believes* happens (principle P1's underdetermination again) rather than what was observed, and an internal-IT customer yields one environment where an MSP customer yields forty. **On the pack's own corrected timeline the incumbent is ahead on raw environment count today and we overtake on density, not on speed.** That is a narrower and more honest claim than \"not copyable in a quarter\", and it is still an assumption (A8), not a finding \u2014 `research/capability_table.md` row 4 records no published evidence of cross-environment transfer either way. **Skill reuse rate across environments** is how it becomes measurable, from the second environment onward, and it is the primary gate in `validation/riskiest_assumptions.md`.\n\n**Recommended next:** instrument skill reuse rate and the variance-envelope claim together \u2014 reuse rate alone could be satisfied by copyable happy-path skills and would tell you nothing about defensibility.\n"}, "strategy/market_sizing.md": {"g": "Strategy", "t": "Market sizing \u2014 bottom-up", "md": "# Market sizing \u2014 bottom-up\n\n> **What this is** \u2014 TAM, SAM and SOM built from users \u00d7 frequency \u00d7 price, with the endpoint\u2192user conversion made explicit, penetration modelled as a ramp rather than assumed complete, and every factor sourced or flagged.\n> **Why it exists** \u2014 assumption A5 flagged market size as one of three claims that could kill this pack. The first version of this file got the arithmetic wrong in the direction that flattered the story (see \u00a7Corrections). This version is the honest one, and its answer reshapes the pricing model: **at per-ticket pricing alone the MSP market is roughly $107M, which is not a business \u2014 the onboarding fee is not an optional second tariff, it is where the revenue is.**\n> **How to read it** \u2014 \u00a72 is the build, \u00a73 the ramp, \u00a75 the conclusion that matters. A skeptic should attack the 0.8 tickets/user/month and the 25% automatable share; both are flagged, both are unsourced for MSPs specifically, and \u00a74 shows what happens across their plausible range.\n> **Depends on / feeds** \u2014 cites [research/sources.md](../research/sources.md); feeds [gtm.md](gtm.md), [channel_plan.md](channel_plan.md), [petal_diagram.md](petal_diagram.md), `financials/pricing.md`, `financials/revenue_build.md`.\n\n## 1. Corrections applied after critic round 1\n\nThree errors in the first version, all found independently and all in the same flattering direction. Recorded rather than quietly fixed, because the corrected numbers are the argument now:\n\n| Error | Was | Now |\n|---|---|---|\n| **Normaliser re-based.** MetricNet's tickets-per-user-per-month is per served *human* [S34]; it was applied to a managed-*endpoint* count. Endpoints include servers, network gear and second devices | 1,247 endpoints \u00d7 0.9 = 1,122 tickets/mo | 1,247 endpoints \u00f7 2.0 = **~620 users** \u00d7 0.8 = **~496 tickets/mo**, which reconciles with S34's independent \"~492 tickets/month\" |\n| **Penetration double-counted.** Revenue per MSP was computed across the MSP's entire client book, then an expansion assumption was added on top | $28,300/yr per MSP, treated as year-1 | Full-book figure stated separately from a **year-by-year environment ramp** (\u00a73) |\n| **Automatable share imported from the wrong population.** Ravenna's 35\u201360% is internal-IT Slack deflection [S1]; an MSP queue carries break-fix, RMM alert tickets, hardware and on-site work | 35%, \"conservative floor\" | **25%** `(assumption)` derived from ticket-category mix, with Ravenna cited only as an upper bound |\n\n## 2. Bottom-up build \u2014 revenue per MSP at full book penetration\n\n| # | Factor | Value | Basis |\n|---|---|---|---|\n| 1 | US MSPs | 45,000 | [S31] \u2014 no universal registry; estimates 40\u201350k |\n| 2 | Serviceable band (10\u2013100 employees) | ~12,000 | `(assumption: 70% of US MSPs have <50 employees [S31]; this band has multiple clients and no automation staff)` |\n| 3 | Endpoints per MSP | 1,247 | [S18] |\n| 4 | **Endpoint : user ratio** | **2.0** | `(assumption: endpoints include servers, network devices and second devices; practitioner range 1.5\u20132.5. No sourced figure found)` |\n| 5 | Served users per MSP | ~620 | 3 \u00f7 4 |\n| 6 | Tickets per user per month | 0.8 | `(assumption: MetricNet defines the metric [S34] but publishes no free benchmark value)` \u2014 **consistency check: 620 \u00d7 0.8 = 496/mo against S34's ~492/mo. This is a *fit, not a validation* \u2014 two unsourced free parameters (row 4's ratio, this rate) whose product lands on the anchor; any pair on ratio \u00d7 rate \u2248 0.4 does the same, and S34's own population (a support team of unstated size) is itself an assumed match. It rules out an order-of-magnitude error and nothing more** |\n| 7 | Tickets per MSP per month | ~496 | 5 \u00d7 6 |\n| 8 | Automatable share within the claim boundary (D1: governed, supervised, tier-1 repetitive) | **25%** | `(assumption)` \u2014 two sub-populations, not one: **(a) user-initiated tier-1 procedures** (password/MFA, mailbox and permissions, provisioning, printer/queue) and **(b) RMM-generated alert remediation** (patch failure, agent offline, disk space, backup job failed, certificate expiry). (b) was originally cited as a reason MSP rates differ from internal IT \u2014 but alert tickets have deterministic triggers, documented remediation and no end user to interview, which makes them among the *most* mechanisable items in the queue. They belong in the numerator, not the excuse. **25% may therefore be conservative in an unexamined way rather than a well-chosen floor.** No sourced MSP ticket-mix data exists; see \u00a7Gap. Ravenna's 35\u201360% [S1] is internal-IT deflection, treated as an upper bound only |\n| 9 | Resolved tickets per MSP per month | ~124 | 7 \u00d7 8 |\n| 10 | Price per resolved ticket | $6 | Below buyer's blended cost of $22.50 [S27]; far below $45 agent-handled [S28] |\n| 11 | **Ticket revenue per MSP per year, whole book** | **~$8,900** | 9 \u00d7 10 \u00d7 12 |\n| 12 | Environments (clients) per MSP | ~41 | `(assumption)` \u2014 consistent with [personas.md](personas.md): a 34-person, **$2.9M** MSP whose 41 clients average ~16 users. Cross-check: 620 users \u00d7 $185/user/mo [S19] \u2248 $1.4M of managed-services revenue, with the balance in projects, hardware and licence resale \u2014 a normal MSP revenue mix |\n| 13 | **Onboarding fee, environments 2+** | **Banded (D11): $400 / $1,500 / $1,500 \u00b7 blended ~$1,005** \u00b7 environment 1 waived (D9) | `(assumption)` \u2014 environment 1 displaces *negative* hours, so it is not charged. Environments 2+ displace 0\u201322 hours `(assumption: $0\u20131,650 at $75/hr)`, against which $1,500 sits at the upper end and is defensible only where transfer is real \u2014 which is the same bet as A8. Banding by client size still owed to `financials/pricing.md` (D7) |\n| 14 | New/replaced clients per MSP per year | ~6 | `(assumption: ~15% annual client turnover + growth)` |\n| 15 | **Steady-state onboarding revenue per MSP per year** | **~$6,030** | 13 \u00d7 14 at the blended $1,005 (D11) |\n| 16 | **Blended annual revenue per MSP, steady state** | **~$14,930** | 11 + 15 |\n\n### Onboarding hours by client size \u2014 the correction that matters most\n\nS21's \"40\u201380 hours\" is the typical-to-complex band (\"2\u20133 weeks small, 8\u201312 weeks complex\"), and the 60-hour case in [personas.md](personas.md) is an 80-seat client that the same file calls large for this book. Pricing the fee against that client while the ramp counts 16-user clients repeats round 1's error class in the half that now carries the revenue.\n\n| Client size | Share of a typical book `(assumption)` | Onboarding hours `(assumption)` | Cost displaced at $75/hr |\n|---|---|---|---|\n| Small (\u226410 users) | ~45% | 15\u201325 | $1,125\u20131,875 |\n| **Typical (10\u201330 users) \u2014 the median** | ~40% | **25\u201340** | **$1,875\u20133,000** |\n| Complex (30+ users, multi-site, compliance) | ~15% | 40\u201380 [S21] | $3,000\u20136,000 |\n\n**Pricing headroom.** At $1,500 flat, the fee is 57\u201380% of the median client's displaced cost and **at or above 100% for the smallest clients** \u2014 where an MSP would rationally decline it. Two consequences the pack must carry: the fee should almost certainly be **banded by client size rather than flat**, and the flat-$1,500 model used throughout this build is therefore conservative for large clients and optimistic for small ones. **The blended figure survives; the flat structure does not.** `financials/pricing.md` owes the banded schedule.\n\n**The onboarding fee is not a second tariff bolted on \u2014 it is half the revenue and the half that arrives first.** Ticket revenue accrues only after an environment is live; the onboarding fee is billed at the moment of the work the buyer already pays 25\u201340 hours for on a median client.\n\n## 3. The ramp \u2014 what a customer is actually worth in year 1\n\nAn MSP does not onboard 41 environments on signature. Modelling the ramp is what the first version missed:\n\n| Year | Environments live | Onboarding fee \u2014 **one-time backfill** | Onboarding fee \u2014 **recurring** (new clients) | Ticket revenue \u2014 **recurring** | **Total** |\n|---|---|---|---|---|---|\n| 1 | 5 (backfill; **environment 1 waived, D9**) | $4,020 | \u2014 | ~$1,090 | **~$5,110** |\n| 2 | 15 cumulative | $10,050 | \u2014 | ~$3,250 | **~$13,300** |\n| 3 | 30 cumulative | $15,075 | \u2014 | ~$6,500 | **~$21,575** |\n| 4 | 41 (backfill complete) | $11,055 | ~$6,030 | ~$8,900 | **~$25,985** |\n| **Steady state** | 41 + turnover | \u2014 | ~$6,030 | ~$8,900 | **~$14,930/yr** |\n\n*At the banded blended fee of ~$1,005 (D11).*\n\n**3-year revenue per MSP \u2248 $40,000; at the fully loaded 76% gross margin derived in [../financials/unit_economics.md](../financials/unit_economics.md) \u00a73b (D15), 3-year gross profit \u2248 $30,400** \u2014 the number [gtm.md](gtm.md) derives its CAC ceiling from. *The 70% assumption this file previously carried is discharged.*\n\n### Revenue quality \u2014 say this before a diligence call computes it\n\n**Roughly 73% of three-year revenue ($29,145 of $40,000) is one-time backfill onboarding**, billed once per existing client and never again. Two consequences a sophisticated reader will price, so the pack states them first:\n\n1. **This is implementation-shaped revenue during the land phase**, which earns a services multiple, not a SaaS one. It is the same revenue quality this pack criticises ServiceNow for [market_type.md](market_type.md); the difference is that ours *decays by design* as backfill completes, rather than being the permanent business model.\n2. **Net revenue retention falls below 100% after backfill.** An MSP goes from ~$25,985 in year 4 to ~$14,930 at steady state \u2014 a 43% step down \u2014 unless its own client base grows. **Expansion revenue therefore depends on the MSP winning clients, which is exactly what [petal_diagram.md](petal_diagram.md) petal 2 says we help them do.** That is a coherent story, but it must be told: the growth case rests on customers' growth, not on seat expansion.\n\nThe durable recurring line is **~$14,930/yr per MSP**, and that \u2014 not the year-3 peak \u2014 is what a valuation should be built on.\n\n## Pricing basis \u2014 how the failure was found and resolved (D9)\n\n**The honest hours correction broke the fee's justification, and the two facts cannot both stand.**\n\nThe fee was priced as 57\u201380% of the onboarding hours it displaces. Against the corrected journey figures:\n\n| Environment | Baseline | With Understudy | Hours displaced | Value at $75/hr | Fee | Verdict |\n|---|---|---|---|---|---|---|\n| **1** | 25\u201340 | **31\u201346** | **negative** | **< $0** | $1,500 | **Indefensible.** We charge $1,500 for making the job take longer |\n| **2+** (same stack) | 25\u201340 | 18\u201328 | 0\u201322 | **$0\u20131,650** | $1,500 | Defensible only at the top of the range; at the bottom the fee exceeds the value by a wide margin |\n\n**This is not a rounding problem.** Year 1 is exactly five backfill environments, and ~87% of year-1 revenue is this fee. **The stated pricing basis fails across the whole of year 1 for every customer**, and a design partner comparing an invoice to a timesheet finds it in one afternoon \u2014 which is precisely the scenario D8 exists to prevent.\n\n**Three options were put to the founder. Option 1 was chosen (D9).**\n\n1. **Waive or discount environment 1, charge from environment 2.** Matches the compounding story exactly \u2014 the first environment is the customer's investment, subsequent ones are the harvest \u2014 and it is the version that survives the timesheet conversation. Cost: year-1 revenue per MSP falls from ~$8,600 to **~$7,100**. **Steady-state SAM is unaffected** \u2014 the waiver is one-time per customer, so it is an acquisition cost expressed as forgone revenue, not a price cut.\n2. **Re-base the fee on the maintenance line rather than on onboarding hours.** The runbook argument is genuinely strong (~8 hrs/month forever \u2192 ~40 min/month) but it is an *MSP-level* saving, not a per-environment one \u2014 spread across 41 environments it is roughly 12 minutes per environment per month, which does not carry a $1,500 unit price. **This option requires the fee to become a per-MSP subscription rather than a per-environment charge**, which changes the revenue model in [gtm.md](gtm.md) and [channel_plan.md](channel_plan.md).\n3. **Keep the per-environment fee and justify it on retained knowledge and the tier-1 floor** \u2014 real value, but not denominated in hours, which means abandoning the engineer-hours ROI calculator that [petal_diagram.md](petal_diagram.md) identifies as the instrument that creates the budget line in the first place.\n\n**Chosen: option 1 (D9).** It preserves the ROI calculator, tells the compounding story honestly, and costs ~$1,500 of year-1 revenue per customer \u2014 the cheapest of the three, and the only one a design partner's timesheet confirms rather than contradicts.\n\n**What it changed at the time, and what it did not.** Year-1 revenue per MSP fell to ~$7,100; 3-year revenue to ~$54,350 and gross profit to ~$38,000, lowering the CAC ceiling to ~$12,700. **Steady-state revenue and SAM were unchanged** \u2014 the waiver is one-time per customer, not recurring, so it is an acquisition cost expressed as forgone revenue rather than a permanent price cut. **All four of those figures were superseded the same day by D11's banding** \u2014 current values are ~$5,110 / ~$40,000 / ~$30,600 / ~$10,200, and the ramp in \u00a73 is the operative one.\n\n## 4. Market size and sensitivity\n\n| Measure | Value | Build |\n|---|---|---|\n| **SAM** \u2014 US, 10\u2013100 employee band, steady state | **~$179M/yr** | 12,000 \u00d7 $14,930 (D11) |\n| **SAM at per-ticket pricing alone** | **~$107M/yr** | 12,000 \u00d7 $8,900 \u2014 *the business without the onboarding fee, and the D12 contingency's floor* |\n| **TAM** \u2014 all 45,000 US MSPs | **~$670M/yr** | 45,000 \u00d7 $14,930 |\n| **SOM** \u2014 3 years, 2% of SAM | **~$3.6M ARR** | 240 MSPs |\n\nSAM in $M/yr across the two softest assumptions:\n\n| Tickets/user/mo \u2192 | 0.5 | **0.8** | 1.2 |\n|---|---|---|---|\n| **15% automatable** | $144 | $154 | $167 |\n| **25% automatable** | $161 | **$179** | $203 |\n| **35% automatable** | $178 | $204 | $239 |\n\nThe band is **$144M\u2013$239M**, and it is narrow because the onboarding fee \u2014 the larger half \u2014 does not vary with ticket volume at all. That is a structural argument for the two-part tariff independent of its size: it makes revenue robust to the assumption we are least sure of.\n\n**Top-down check.** US MSP revenue is $120\u2013140B [S31]. A $179M SAM is ~0.13% of it \u2014 comfortably conservative for a tool automating a slice of service-delivery labour, and built bottom-up rather than reasoned down from a headline.\n\n## 5. What this means \u2014 the uncomfortable part, kept\n\n**The MSP market is not, by itself, venture-scale, and each successive correction has made that clearer.** A $179M SAM supports a real company; it does not support a generational one. Three responses; the pack takes the first two and names the third as unproven:\n\n1. **The MSP is the wedge, not the market.** It is where onboarding pain is recurring rather than one-time, and where the global skill layer reaches density fastest because one customer brings 41 environments. It is how the product gets good.\n2. **Price the environment, not only the ticket.** Founder-confirmed pricing was per-resolved-ticket; the corrected arithmetic says that alone yields ~$107M and a year-1 customer worth ~$1,100. **This is a change to a founder decision and is flagged as such** \u2014 see the open decision in the checkpoint.\n3. **The internal-IT expansion market \u2014 an option, not a number in the headline.** `(assumption: ~200,000 US firms of 100\u20132,000 employees; 20% addressable = 40,000)` \u00d7 `(assumption: ~500 users each)` \u00d7 0.8 \u00d7 25% \u00d7 $6 \u00d7 12 \u2248 **$7,200/yr each \u2192 ~$288M**. Three reasons it is **not added to SAM**: entering means competing on resolution quality, the axis [positioning.md](positioning.md) explicitly commits to avoiding, against competitors funded at $164.5M [S13] and an incumbent that paid $2.85B [S26]; an internal-IT customer has **one** environment, so the onboarding fee is a single event and the shape reverts to the ~$107M per-ticket-only model this file already calls insufficient; and the estimate rests on three stacked assumptions with no source. It is an option worth naming and not a market this pack claims.\n\n**The honest summary a VC should be handed: a defended ~$179M SAM** (D11; ~$215M under the superseded flat fee), with a per-customer recurring line of ~$17,900 and a front-loaded backfill phase. The path beyond it runs through capturing more of the labour cost displaced \u2014 agent labour is 70\u201380% of the $22.50 blended cost per ticket [S28] and $6 captures roughly a quarter of it \u2014 and, optionally, through internal IT on terms this pack has not defended. **Summing the two into a $500M headline is the move a skeptical reader is looking for; it is not made here.**\n\n## Gap \u2014 stated, not guessed\n\n**No sourced MSP ticket-category mix exists.** Row 8 is the second-most load-bearing number in the pack and it rests on a category argument, not data. Every free source found describes internal IT desks, whose mix excludes RMM-generated alert tickets, hardware and on-site work. **Two questions, both cheap to ask and both moving the SAM: the ticket-category mix, and specifically the RMM-alert share of volume. These are the single highest-value questions in the first ten discovery interviews**, and until it is answered the SAM carries a \u00b140% honest uncertainty that no sensitivity table can remove.\n\n**Recommended next 3 moves:** (1) get real ticket-category mix and per-client ticket volume from the first 5 MSP interviews \u2014 rows 6 and 8 are worth more than any other research; (2) test the banded onboarding fee against real per-client-size hour counts in the same conversations \u2014 the flat $1,500 is known not to survive at the small end; (3) size internal IT properly before the seed raise rather than carrying \u00a75.3's assumption chain into a deck.\n"}, "strategy/market_type.md": {"g": "Strategy", "t": "Market type", "md": "# Market type\n\n> **What this is** \u2014 Steve Blank's market-type declaration for Understudy: existing, re-segmented, new, or clone \u2014 chosen once, with evidence, because every other strategic decision inherits it.\n> **Why it exists** \u2014 market type determines sales cycle, capital needs, positioning approach and the dominant risk, and teams that skip it default to *existing-market* behaviour (feature comparison, competitive displacement) in markets that do not reward it. Choosing wrong here misallocates the entire seed round.\n> **How to read it** \u2014 the declaration is one line; the evidence and the consequences table are the argument. A skeptic should attack whether this is genuinely re-segmentation rather than a feature of the existing AI-ITSM market.\n> **Depends on / feeds** \u2014 cites [research/competitors.md](../research/competitors.md), [research/landscape.md](../research/landscape.md); feeds [positioning.md](positioning.md), [gtm.md](gtm.md), [market_sizing.md](market_sizing.md), `validation/stage_gate.md`.\n\n## Declaration\n\n**Hybrid: re-segmented by buyer, new-market by budget.**\n\nRe-segmentation of IT service management by buyer (MSPs) and by capability (self-onboarding) \u2014 but the budget it is paid from does not exist as a line item, which is Blank's diagnostic for a **new market**. Both halves are true and the pack must carry both consequences rather than picking the more comfortable one. [petal_diagram.md](petal_diagram.md) shows why: the primary budget is unbilled engineer time, not a software spend, so the first sale *creates* a budget code rather than switching one.\n\n## Evidence\n\n**It is not a new market *for service-desk software*.** MSPs already buy it, already run ticket queues, and already have a budget line for it. **It is a new market for onboarding automation**, which has no budget line at all \u2014 that distinction is what makes the declaration a hybrid rather than a hedge. Nobody has to be convinced that AI ticket resolution is a category: Moveworks sold for $2.85B [S26], Aisera has raised $164.5M [S13], and ServiceNow is a ~$160B company [S3]. Demand exists and is funded.\n\n**It is not a straight existing-market play either.** Winning an existing market means beating incumbents on the axis they already compete on \u2014 resolution quality \u2014 against companies with $164.5M and a $2.85B exit behind them. That is a losing fight for a pre-seed company, and it is not where the evidence says the pain is.\n\n**The re-segmentation is on two axes at once:**\n\n1. **By buyer.** The AI-ITSM field is aimed at internal IT: Ravenna and Atomicwork both pitch mid-market internal teams [S2][S12], and ServiceNow's own lead investor says the platform is \"completely inappropriate\" below enterprise [S3]. **MSPs are structurally different customers** \u2014 they onboard a new environment every few weeks rather than once, so deployment cost is recurring cost of goods rather than a one-time project. No AI-ITSM vendor is running an MSP-specific motion.\n2. **By capability.** Every competitor acquires environment knowledge by human configuration. Understudy acquires it by observation [research/competitors.md]. That is a different product category \u2014 discovery \u2014 grafted onto the service-desk category.\n\n**Corroborating signal that the segment feels the pain:** 26% of MSPs report lacking enough staff to service more clients and 22% cannot find skilled technicians [S33]. The constraint on MSP growth is engineer-hours, which is exactly what onboarding consumes at 25\u201340 hours for a median client, 40\u201380 for a complex one [S21].\n\n## Strategic consequences of the hybrid\n\n| Dimension | Consequence for Understudy |\n|---|---|\n| **Positioning approach** | Must make the *segment* the story, not the feature. \"The service desk for MSPs that learns each client environment\" beats \"better AI resolution\". The buyer must recognise themselves in the first sentence |\n| **Sales cycle** | **Two very different numbers, and the pack should quote the first.** Through a *cold* channel: **6\u20139 months to first close**, dominated by peer-community entry [channel_plan.md](channel_plan.md), with the first paid pilot at day 180\u2013240 [gtm.md](gtm.md). Through an *established* relationship: 30\u201390 days. Add a **recurring ~6-week client-side security review per environment** [sales_roadmap.md](sales_roadmap.md). Still far shorter than the 6\u201312 month enterprise ITSM cycle [S20], but not the fast SMB motion the first version implied |\n| **Capital needs** | **Higher than the first version claimed, and driven by clocks rather than by spend.** The new-market half *does* require market-creation spend: buyer education on a cost nobody currently measures, with the engineer-hours ROI calculator as its instrument. On top of that sit **two non-compressible clocks that money does not shorten** \u2014 SOC 2 at 6\u201312 months (gating enterprise-adjacent clients and the marketplace) and channel entry at 3\u20139 months. **Runway to first revenue is ~12 months**, and the seed must fund the evidence burden *and* both clocks |\n| **Dominant risk** | **Market risk, in two forms.** (a) *Re-segmentation risk:* buyers reject the new segment boundary and default to comparing us with the category leader on the category's existing axis \u2014 resolution rate \u2014 where we lose. (b) *New-market risk:* the sale has to create a budget line that does not exist, which is slower and costlier than a switch. **Technical risk (clustering, A8) is real but lives in `validation/riskiest_assumptions.md`, not in this cell** \u2014 the first version wrote execution risk here and thereby hid the market risk this declaration exists to surface |\n| **What the new-market half costs** | Buyer education on a cost they do not currently measure. The engineer-hours ROI calculator is not a marketing nicety \u2014 it is the instrument that turns an unmeasured leak into a number, and without it there is no budget to move |\n| **Competitive response** | Incumbents can add discovery as a feature. ServiceNow is structurally inhibited (implementation is 3\u20135\u00d7 licence revenue [S20]); Ravenna and Atomicwork are not. Speed to a defensible skill library matters more than speed to first customer |\n| **Metric that matters** | Time-to-first-autonomously-resolved-ticket in a *new* environment. It is the segment's own pain expressed as a number, and no competitor publishes it |\n\n## The decision\n\n**Play re-segmentation, not displacement.** Understudy does not enter conversations by comparing resolution rates with Ravenna. It enters by asking an MSP owner what onboarding a new client costs them in engineer-hours \u2014 a question no incumbent's positioning invites \u2014 and answers it with discovery. Resolution quality must be *sufficient*, not superior; onboarding cost must be *transformed*.\n\n**Recommended next 3 moves:** (1) validate the *positioning*, not only the pain \u2014 ask five owners to place us against Ravenna unprompted; if they compare on resolution rate, the re-segmentation has not landed and the messaging, not the product, is the problem; (2) instrument the onboarding-hours claim with the same five interviews, since the new-market half needs a measured number to create a budget; (3) hold resolution-rate claims to the evidence in `research/capability_table.md` and never compete on that axis in year one.\n"}, "strategy/personas.md": {"g": "Strategy", "t": "Personas", "md": "# Personas\n\n> **What this is** \u2014 five persona cards spanning the full user spectrum plus the economic buyer, each with the pain moment, the current workaround, the switch trigger, the language they would actually use, and the objection that must be overcome.\n> **Why it exists** \u2014 a pack that says \"MSPs\" as its customer will produce copy nobody recognises themselves in. These cards are what `product/journeys/`, `narrative/`, the sales roadmap and the website's \"who it's for\" section all draw from, so a vague card here becomes vague everything.\n> **How to read it** \u2014 Marcus is the payer and Dana is the champion; those two decide whether this company exists. Priya is the edge-low case the product must serve with dignity, and Ray is the objection with a keyboard. A skeptic should attack whether Ray's objection is actually surmountable.\n> **Depends on / feeds** \u2014 cites [market_type.md](market_type.md), [research/sources.md](../research/sources.md); feeds `product/journeys/`, [value_prop_canvas.md](value_prop_canvas.md), [sales_roadmap.md](sales_roadmap.md), `validation/decision_making_unit.md`.\n\n---\n\n## 1. Marcus Whelan \u2014 MSP owner / COO \u00b7 **the payer** \u00b7 34-person MSP, 41 clients\n\n**Context.** Runs a **$2.9M-revenue** MSP in the US Midwest: 34 people, of whom **20 are billable technicians** (the rest are sales, dispatch, admin and a part-time vCIO). Revenue per technician is **$145k, below the healthy $150\u2013200k band**, and revenue per employee is **$85k against a $142k average** [S32] \u2014 he is not a top-quartile operator, which is the whole reason he is a buyer. He has turned down two clients this quarter because he could not staff them: he is in the 26% [S33].\n**Pain moment.** An 80-seat manufacturer signs on Monday \u2014 a large client by his book's standards, where the 41 clients average ~16 users each. Onboarding is 60 engineer-hours [S21] pulled from billable work, and the client expects SLA coverage from day one. He is paying twice: once in unbilled hours, once in the tickets his team fumbles because nobody knows the environment yet.\n**Current workaround.** Assign his best engineer to shadow-document the environment for three weeks, and eat the margin.\n**Trigger to switch.** A client win he cannot staff. Not a demo \u2014 a signed contract he is afraid of.\n**Language he'd actually use.** *\"I can't hire my way out of this. Every new logo costs me a month of my best guy before it makes a dollar.\"*\n**Objection to overcome.** *\"So I record my engineers, and in two years you sell what they know back to me \u2014 or to the MSP down the road.\"* Answer must be architectural (tenant isolation, A8), not reassuring.\n\n---\n\n## 2. Dana Ortiz \u2014 Service delivery manager \u00b7 **the champion** \u00b7 owns the queue and the onboarding runbook\n\n**Context.** 20 technicians, **~500 tickets/month across the whole book** \u2014 consistent with S34's independently reported ~492/month and with the users-based build in [market_sizing.md](market_sizing.md) \u00a72. Owns SLAs and the onboarding checklist nobody keeps current.\n**Pain moment.** Third time this month an engineer escalates a ticket that a colleague solved last week at a different client \u2014 the procedure existed, in someone's head, and never reached her runbook.\n**Current workaround.** IT Glue documentation she nags people to update, plus Slack archaeology.\n**Trigger to switch.** Losing a senior engineer. Two weeks' notice, and eleven years of environment knowledge walking out with them.\n**Language she'd actually use.** *\"Our documentation is a museum. It describes an environment we stopped having a year ago.\"*\n**Objection to overcome.** *\"My engineers will tell me they don't have time to narrate what they're doing.\"* Answer: capture must be passive by default, narration optional and rewarded.\n\n---\n\n## 3. Priya Raman \u2014 Tier-1 technician \u00b7 **edge-low** \u00b7 14 months' experience\n\n**Context.** Runs the same twenty procedures all day: password resets, mailbox permissions, MFA re-enrolment, printer queues. First line for 41 clients, each slightly different.\n**Pain moment.** A ticket for a client she has never touched. The runbook is generic; the client's Okta is configured unlike the others; she burns 25 minutes and escalates, which counts against her.\n**Current workaround.** Ask in the team Slack channel and wait.\n**Trigger to switch.** The first time the agent hands her a client-specific procedure instead of a generic one \u2014 she stops feeling like the newest person in the room.\n**Language she'd actually use.** *\"I don't need it to do my job. I need it to tell me how this client does this thing.\"*\n**Objection to overcome.** *\"Am I training my replacement?\"* This is the honest one. Answer: her queue is the repetitive twenty; what the agent absorbs is the part she does not want, and the escalation path is where her career is. **If this answer is not true in the product, the recording programme fails from the inside.**\n\n---\n\n## 4. Ray Kowalczyk \u2014 Principal escalation engineer \u00b7 **edge-high** \u00b7 19 years, the person everything ends up with\n\n**Context.** Handles what tier 1 and 2 cannot. Holds the environment knowledge for the 8 most complex clients. Deeply sceptical of automation, with earned reason: he has cleaned up after two RPA projects.\n**Pain moment.** Interrupted 14 times a day for things he has explained before. He is the bottleneck and he knows it, and the interruptions are why the genuinely hard work slips.\n**Current workaround.** Answers in Slack, occasionally writes it down.\n**Trigger to switch.** Seeing a skill derived from *his* session, in text he can read and correct, and finding it right. Not a demo \u2014 his own work, played back accurately.\n**Language he'd actually use.** *\"Show me the thing it thinks it learned. If it's a black box, we're done.\"*\n**Objection to overcome.** *\"This is RPA with a chatbot on it, and I've watched that fail twice.\"* This is D2's argument, and it must be delivered as mechanism plus the E2 altered-UI experiment, not as reassurance. **Ray is the single most important persona in this pack: he can veto adoption from below without ever attending a meeting.**\n\n---\n\n## 5. Sonia Achebe \u2014 Client-side IT director \u00b7 **the veto** \u00b7 at the MSP's customer\n\n**Context.** Signs off on what the MSP may deploy inside her environment. Not the buyer; entirely able to stop the deal.\n**Pain moment.** Her MSP proposes software that records administrative sessions inside her network. Her security review has one question: what leaves my environment?\n**Current workaround.** Blanket refusal, or a 6-week review.\n**Trigger to approve.** A tenant-isolation architecture she can read, plus a clear statement that the compounding global library carries no client data (A8).\n**Language she'd actually use.** *\"I'm not approving a recorder in my admin plane without knowing exactly what it keeps and where it goes.\"*\n**Objection to overcome.** All of it. **She is why the hybrid library architecture is a security document before it is a moat.**\n\n---\n\n## Spectrum coverage \u2014 one system, no separate tiers\n\n| Edge | Persona | Served by the same system how |\n|---|---|---|\n| Low support | Priya | Receives client-specific procedures instead of generic runbooks; the agent's library is her onboarding |\n| Beachhead core | Dana | The library *is* the runbook of record, maintained by observation instead of by nagging |\n| High / power | Ray | His sessions become the highest-value skills; he reviews and corrects them as readable text, and is interrupted less |\n\nNo \"lite\" fork and no separate product tier: the same skill library serves all three, differing only in whether a person is consuming a skill or authoring one by working.\n\n**Recommended next 3 moves:** (1) validate Priya's and Ray's objections in discovery interviews before writing a line of product copy \u2014 both are adoption-fatal and neither is a buyer objection; (2) build Sonia's tenant-isolation architecture document before the first pilot \u2014 and note it *opens* her review rather than ending it, per [sales_roadmap.md](sales_roadmap.md); the full evidence pack behind it is a 6\u201312 month programme; (3) make Ray's \"show me what it learned\" the core demo, since it converts the hardest persona.\n"}, "strategy/petal_diagram.md": {"g": "Strategy", "t": "Petal diagram \u2014 the adjacent markets we draw customers from", "md": "# Petal diagram \u2014 the adjacent markets we draw customers from\n\n> **What this is** \u2014 Blank's petal diagram: Understudy at the centre, and the six adjacent budget pools whose budgets and habits it displaces, with the incumbents in each petal and what customers currently spend there.\n> **Why it exists** \u2014 a 2\u00d72 asks where rivals sit; the petal asks a harder and more useful question \u2014 **which existing budget does this get paid out of?** For a company selling a category that does not yet have a line item, that question decides whether the sale is a swap or a net-new ask, and net-new asks stall.\n> **How to read it** \u2014 the \"what they spend today\" column is the point. A skeptic should attack whether these budgets are genuinely reachable or merely adjacent.\n> **Depends on / feeds** \u2014 cites [research/competitors.md](../research/competitors.md), [market_sizing.md](market_sizing.md); feeds [gtm.md](gtm.md), [channel_plan.md](channel_plan.md), `financials/pricing.md`.\n\n```\n                    Service desk / ITSM software\n                    (Ravenna, Atomicwork, ConnectWise)\n                              $  per seat/mo\n                                   |\n   Documentation & IT              |              Onboarding as\n   knowledge mgmt                  |              billable project work\n   (IT Glue, Hudu)          \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2510       (own engineers)\n   $ per tech/mo    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524 UNDERSTUDY  \u251c\u2500\u2500\u2500\u2500\u2500\u2500 $ 25\u201340 hrs (median)\n                            \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n   Process discovery /             |              Headcount\n   task mining                     |              (hire another technician)\n   (UiPath, Celonis)               |              $ ~$95\u2013120k loaded\n   $ enterprise licence     Automation tooling\n                            (RPA, RMM scripting)\n```\n\n| Petal | Incumbents | What the customer spends there today | Why that budget moves to us | Difficulty |\n|---|---|---|---|---|\n| **1. Onboarding as project work** *(displaced internal cost, not a vendor market)* | The MSP's own engineers \u2014 **no incumbent vendor** | **25\u201340 engineer-hours for the median client** (S21's 40\u201380 is the typical-to-complex band; see the size distribution in [market_sizing.md](market_sizing.md)) at `(assumption: $75/hr loaded)` = $1,875\u20133,000 per client; at ~6 new clients/yr that is **~$11\u201318k/yr per MSP, ~$135\u2013216M across the band** | The budget we are actually taking. Easiest sale because it is already being spent and already resented. Not a line item \u2014 a leak | **Lowest** |\n| **2. Headcount** *(displaced internal cost, not a vendor market)* | The labour market \u2014 **no incumbent vendor** | `(assumption: a technician at ~$95\u2013120k loaded)`; revenue/tech benchmark $150\u2013200k [S32] | 26% of MSPs cannot staff clients they could win [S33]; we are a partial substitute for the hire they cannot make | Low \u2014 but framing ma
