that argues with the expert it learned from will not be fed honestly next time \u2014 and the rejection is recorded as a finding, not as an error.\n\n## S7 \u00b7 Approval prompt \u2014 the gated action\n\n**Purpose.** A human decides on a mutating action. **Primary action:** approve or decline.\n**Hierarchy:** **one line of plain-language effect** \u2192 reversibility \u2192 scope \u2192 the skill and its version.\n**States.** *Destructive:* distinct treatment, never batchable, never remembered as a default. *Timeout:* expires rather than proceeding.\n**Micro-interactions.** The effect line names the actual object \u2014 *\"removes forwarding from j.okafor@ to an external address\"* \u2014 not the operation class. **The 14:20 incident in [journeys/day_in_life.md](journeys/day_in_life.md) turned on whether a human could evaluate that sentence in two seconds.** No \"approve all\".\n\n## S8 \u00b7 Deviation review \u2014 where the library learns\n\n**Purpose.** Turn disagreements into corrections. **Primary action:** answer the question.\n**Hierarchy:** what the skill would have done vs. what the human did \u2192 the ticket \u2192 *which is right?*\n**States.** *Empty:* \"No disagreements this week\" \u2014 a legitimately good outcome, not a barren screen.\n**Micro-interactions.** Framed as a question to the engineer, never as an accuracy score against them. Three outcomes, all first-class: the skill was wrong, the human was wrong, or both were valid and the envelope widens.\n\n## S9 \u00b7 Onboarding progress \u2014 what the fee is charged for\n\n**Purpose.** Track a new environment from capture to live skills. **Primary action:** none; it reports.\n**Honesty requirement:** environment 1 costs *more* engineer-hours than baseline [journeys/beachhead.md](journeys/beachhead.md). This screen must show that as an overrun rather than suppressing it \u2014 the compression begins at environment 2, and a meter that hides the first-environment cost gets caught by the first design partner's timesheet.\n**Hierarchy:** engineer-hours consumed \u2192 time-to-first-verified-skill \u2192 skills by stage \u2192 **hours against this client's size band** (D7).\n**States.** *Week 1:* explicitly \"watching \u2014 no skills yet by design\", so silence is not read as failure.\n**Micro-interactions.** The baseline comparison uses *this client's size band*, not the book average \u2014 the pricing correction that critic round 2 forced applies to the UI too.\n\n## S10 \u00b7 Boundary and egress attestation \u2014 Sonia's screen\n\n**Purpose.** Show what leaves the environment. **Primary action:** export.\n**Hierarchy \u2014 the title question now has two answers, and both are shown:**\n1. **What leaves your environment \u2192 your MSP's node.** Session recordings of your admins, captured on your MSP's engineer workstations, stored in your MSP's tenant. Retention and controls stated here.\n2. **What leaves your MSP \u2192 an abstracted envelope only.** Procedure shapes and deviation patterns carrying no tenant name, domain, user, policy id or configuration value, and only once a pattern has been seen in **\u22653 distinct MSPs** \u2014 a tenant threshold is re-identifiable inside one customer's book.\n3. What actually crossed, itemised \u2192 retention state.\n\n**The wording matters and the first version got it wrong.** Under the two-stage boundary (D6), saying \"raw recordings never leave\" *to the client* is false \u2014 they leave her environment for her MSP's node. The true and stronger claim is the two-part one: her MSP retains custody, and the vendor is structurally excluded. A director who was told \"never leaves my environment\" and later finds recordings of her admins in her MSP's tenant is a lost contract and a burned reference.\n**States.** *Error:* if egress filtering is degraded, the system stops distillation rather than continuing and reporting later.\n**Micro-interactions.** One export, complete, no configuration. She needs one file, twice a year, and for it to be boring [journeys/day_in_life.md](journeys/day_in_life.md).\n\n## S11 \u00b7 Promotion ladder \u2014 adoption at the customer's pace\n\n**Purpose.** Move a skill shadow \u2192 gated \u2192 supervised, on declared evidence. **Primary action:** promote, or leave it.\n**Hierarchy:** current rung \u2192 evidence for the next \u2192 what promotion changes in practice.\n**Micro-interactions.** Thresholds are declared before results exist and are visible. **A skill can sit at gated forever with no nagging** \u2014 the product does not lobby for its own autonomy.\n\n## S12 \u00b7 Drift alert \u2014 the trust-building interruption\n\n**Purpose.** Surface a skill whose verification is degrading, before it acts wrongly. **Primary action:** review and pause, or accept the change.\n**Hierarchy:** what changed \u2192 since when \u2192 which environments \u2192 what has been paused already.\n**Micro-interactions.** The system pauses first and asks second. **This is the screen that converts a sceptic into a user** \u2014 it told Ray about a production change before a user did [journeys/edge_high.md](journeys/edge_high.md) \u2014 so it must never fire spuriously; a false drift alert costs more trust than a missed one.\n\n## S13 \u00b7 Node fleet health \u2014 the screen we operate, not the customer\n\n**Purpose.** One view of every stage-1 distillation node across every MSP tenant. **Primary action:** intervene before an MSP notices.\n**Hierarchy:** nodes unreachable \u2192 nodes on stale versions \u2192 nodes whose distillation queue is backing up \u2192 capacity.\n**States.** *Degraded egress filtering:* the loudest state in the product \u2014 distillation halts rather than continuing, because a filter that is not working turns D6's guarantee into a claim.\n**Micro-interactions.** Each node shows its MSP, its version, and time since last successful distillation. Upgrades are staged and reversible; an MSP's own patching window is respected rather than overridden.\n**This screen exists because D6 has an operational cost that no customer-facing surface shows.** One node per MSP is tractable; the same architecture at one node per *client* would have been ~123 nodes for three design partners, and this screen is where that would have become visible far too late.\n\n---\n\n## Screens deliberately not built\n\n- **A chat interface.** The product's surface is the ticket and the skill, not a conversation. A chat box invites the unbounded requests `P5` says we cannot serve.\n- **A confidence score on every action.** A number implies calibration we cannot demonstrate; the envelope either covers the situation or it does not (`X9`).\n- **An autonomy toggle.** Excluded by the claim boundary (D1) \u2014 not a setting we have chosen to withhold.\n- **A leaderboard of engineer contributions.** `P8` requires attribution, not competition; ranking the people being recorded is the fastest route to gamed capture.\n\n**Recommended next 3:** (1) prototype S5 and S6 before any dashboard \u2014 they are the adoption gates and they can be tested on lab-generated skills with no customer; (2) write S7's effect-line generator as a first-class component, since the 14:20 incident turns on one sentence being readable in two seconds; (3) design the S1 and S9 empty states properly \u2014 the product spends its entire first week having produced nothing, and that week is when the buyer decides whether they were sold something real.\n"}, "product/journeys/beachhead.md": {"g": "Journeys", "t": "Journey \u2014 beachhead: Dana onboards Brightwater Dental, first session to habitual use", "md": "# Journey \u2014 beachhead: Dana onboards Brightwater Dental, first session to habitual use\n\n> **What this is** \u2014 the core paying use case end to end: a service delivery manager taking a brand-new client environment from signed contract to a working skill library, then to habit, with the component and durable record named at each beat.\n> **Why it exists** \u2014 this is the journey the entire go-to-market is priced against. The onboarding fee (D4/D7) is charged for exactly this sequence, and the number it produces \u2014 engineer-hours consumed \u2014 is the claim every marketing artifact makes.\n> **How to read it** \u2014 the timeline is the argument; the baseline column is what the buyer is comparing against. A skeptic should attack week 1, where the product still needs a human to do the work it is learning from.\n> **Depends on / feeds** \u2014 inherits [PRD.md](../PRD.md), personas \u00a72; feeds `strategy/gtm.md`, `financials/pricing.md`, `narrative/one_pager.md`, [ux_spec.md](../ux_spec.md).\n\n**Persona.** Dana Ortiz, service delivery manager, 20 technicians, 41 client environments.\n**Session goal.** Onboard Brightwater Dental (22 users) to full SLA coverage.\n**Baseline today.** 25\u201340 engineer-hours for a client this size \u2014 the median band, not the 40\u201380 complex band [S21] \u2014 spread over 3\u20134 weeks, producing documentation that is stale within a month.\n\n**All operating figures in this journey are `(illustrative: targets, not measured \u2014 no pilot exists)`.** They are what the product must achieve to be worth its fee, and they belong in `validation/experiment_board.md` as declared thresholds, not in marketing copy.\n\n---\n\n## Week 0 \u2014 the boundary, before any recording\n\n**Monday.** Contract signed. Brightwater is added as an environment on the MSP's **existing** stage-1 node \u2014 the node lives in the MSP's own tenant and was provisioned once, when the MSP onboarded, not per client (D6 corrected). The three engineers covering Brightwater already run the capture agent.\n\u2192 *Component:* **N1 capture**, **N6 stage-1 distillation** on the MSP node, **N15 node lifecycle**.\n\u2192 *Record:* environment `brightwater` registered; envelope egress filter confirmed active.\n**This is why the corrected boundary matters operationally:** onboarding a client is a registration, not a deployment. Under the original per-client framing this beat would have been a distributed-node install inside a 22-person dental practice that has no perimeter to host one.\n\n**Monday \u2014 the review opens, and it does not close this week.** Brightwater's IT contact receives the tenant-isolation document. Her question \u2014 *what leaves my environment?* \u2014 has a structural answer: **raw recordings never leave the MSP's control, and nothing identifying her tenant reaches the vendor.**\n\u2192 *Component:* **N9 + egress filter**, **X21 audit export**.\n\u2192 *Record:* boundary attestation, retained for her review file.\n**But the document opens a ~6-week review, it does not end one** [strategy/sales_roadmap.md](../../strategy/sales_roadmap.md) \u2014 and there is one of her per client environment. Capture may proceed under the MSP's existing administrative agreement; **gated execution in her tenant waits for her sign-off.** The first version of this journey had her clear it in the same hour, which contradicted the file it cited.\n\n## Week 1 \u2014 watch, and do the work anyway\n\n**The honest part of this journey.** In week 1 Understudy produces nothing. Engineers onboard Brightwater the way they always have \u2014 mapping the tenant, setting up monitoring, fixing what they find \u2014 while capture runs.\n\u2192 *Component:* **N1**, **N2 session segmentation**, **N4 sensitive-value redaction** (credentials dropped at capture, before storage), **N10 decision-point narration** prompting ~10 seconds of voice at branch points, **N11 engineer capture controls** (indicator, pause).\n\u2192 *Record:* ~30 segmented sessions; zero skills.\n**A skeptic should attack here, and the answer is that the fee is not charged for week 1.** The buyer pays for the outcome at week 3, and the first environment is the one that pays back least \u2014 the compounding is across environments, not within one.\n\n**Thursday.** An engineer hits a printer-mapping problem, tries two approaches, abandons the first. The system keeps both.\n\u2192 *Component:* **N5 failure/abort labelling** (`P2`).\n\u2192 *Record:* a labelled failure session \u2014 the kind successful runs never contain.\n\n## Week 2 \u2014 distil, and let the engineers judge it\n\n**Monday.** Stage-1 distillation runs on the MSP's node. ~30 sessions collapse into ~11 candidate skills `(illustrative)`.\n\u2192 *Component:* **N3 action extraction**, **N6 clustering**, **N7 skill synthesis** (goal, preconditions, steps, **success criterion**, escalation envelope).\n\u2192 *Record:* 11 skills v1, each naming its contributing sessions and authors (**N13**).\n\n**Monday afternoon \u2014 the beat that decides adoption.** Each engineer sees the skills built from their own sessions and is asked to confirm or correct, not informed.\n\u2192 *Component:* **N12 skill viewer**, **X19 skill correction UI** (`P6 P8`).\n\u2192 *Record:* 8 endorsed as-is, 2 corrected, 1 rejected as \"that was a one-off, don't generalise it\".\n**The rejection matters more than the endorsements.** A system that cannot be told *no* by the person it learned from will not be fed honestly next time.\n\n**Wednesday.** Skills go to shadow. They run against live Brightwater tickets without acting, and their intended actions are compared with what the engineer actually did.\n\u2192 *Component:* **X2 shadow mode** (`P5`).\n\u2192 *Record:* per-skill agreement rate.\n\n**Friday.** Dana's first weekly digest: *would have matched you on 27 of 34 tickets `(illustrative)`. Here are the 7 disagreements, most interesting first.*\n\u2192 *Component:* **X3 deviation report**.\n\u2192 *Record:* 7 deviations routed to authoring engineers as questions, not metrics. Four produce corrections; three reveal the engineer was inconsistent, which Dana finds more useful than the four.\n\n## Week 3 \u2014 promote, and count\n\n**Tuesday.** Six skills clear their thresholds and promote from shadow to gated. Destructive actions stay gated permanently \u2014 not configurable.\n\u2192 *Component:* **X10 promotion ladder**, **X5 action-class policy** (`P9`).\n\u2192 *Record:* promotion events with the evidence that justified each.\n\n**Thursday.** The onboarding meter closes the environment: **38 engineer-hours consumed against a 25\u201340 median-band baseline, 9 skills live, time-to-first-verified-skill 8 days.** The meter reports the overrun rather than hiding it \u2014 the first environment costs more, and a buyer who discovers that themselves stops believing every other number.\n\u2192 *Component:* **N14 onboarding meter**, **X20 environment dashboard**.\n\u2192 *Record:* the number the go-to-market is built on [strategy/gtm.md](../../strategy/gtm.md) \u2014 against a 25\u201340-hour baseline for a client this size.\n\n## Week 6 \u2014 habit, and the thing Dana actually bought\n\n**The runbook stopped being a document.** Dana no longer maintains Brightwater's documentation; she reviews deviations for ten minutes on Friday. When a tech asks how Brightwater does something, the answer is in the desk rather than in Ray's head.\n\u2192 *Component:* **X20**, **X3**, **X13 envelope widening**.\n\n**Week 9 \u2014 the compounding shows up, partially.** Dana onboards the next client, a 30-person accountancy on the same M365/Entra stack. Onboarding takes **21 engineer-hours against a 25\u201340 baseline** \u2014 the mechanical setup is unchanged, but the *figure out how this client differs* portion is largely pre-solved because the procedure shapes transferred even though Brightwater's data did not. A second ~6-week client-side review runs in parallel; it gates gated execution, not capture.\n\u2192 *Component:* **X17 global stack layer** fed by **N9**'s abstracted envelopes (D6).\n\u2192 *Record:* environment 2 onboarded; reuse rate \u2014 the A8 measurement \u2014 recorded for the first time.\n**This is the beat the moat lives or dies on**, and it is the first point in the whole journey where evidence for A8 exists.\n\n---\n\n## Timeline against baseline \u2014 stated so it survives a timesheet\n\nThe first version of this table claimed environment 1 took **11 hours against a 25\u201340 baseline**. That was wrong, and wrong in the direction that flattered us: week 1 *is* a normal onboarding \u2014 the engineers map the tenant, set up monitoring and fix what they find exactly as before \u2014 so the product removed none of it. It then *added* review and endorsement work.\n\n| | Today | With Understudy | |\n|---|---|---|---|\n| **Hours to onboard environment 1** | 25\u201340 [S21] | **31\u201346** | **worse** \u2014 baseline unchanged, plus ~6 hrs of skill review, deviation answers and promotion decisions |\n| **Hours to onboard environment 2** (same stack) | 25\u201340 | **18\u201328** | the *knowledge* portion shrinks; the mechanical setup does not |\n| **Hours to a maintained runbook** | ~8 hrs/month, forever, and it is stale anyway | **~40 min/month** of deviation review | the thing Dana actually bought |\n| **Tier-1 floor at an unfamiliar client** | none | client-specific procedures from day one | not measurable in hours; it is why escalations fall |\n| Knowledge on attrition | leaves with the engineer | stays as endorsed skills | |\n\n`(illustrative: targets, not measured)`\n\n**What the fee is charged for, restated honestly.** Not hours saved on the first environment \u2014 there are none. It is charged for **a maintained runbook the MSP never has to write, a tier-1 floor at clients nobody knows, and compression that begins at environment 2.** An ROI calculator built on the first-environment number would be falsified by the first design partner's timesheet [strategy/gtm.md](../../strategy/gtm.md).\n\n## What Dana bought, stated honestly\n\nNot ticket deflection \u2014 six gated skills do not empty her queue. **She bought the end of maintaining a runbook nobody kept current, and a floor under her tier-1 team at clients they do not know.** The deflection comes later and is smaller than the category advertises; the onboarding compression begins at environment 2, not environment 1, and the fee is charged against the runbook and the tier-1 floor rather than against first-environment hours.\n\n**Recommended next:** instrument the week-9 beat before anything else in the product \u2014 reuse rate on environment 2 is the earliest real evidence for A8, and it arrives roughly two months into a customer relationship rather than at the end of one.\n"}, "product/journeys/day_in_life.md": {"g": "Journeys", "t": "Journey \u2014 one ordinary Tuesday across every touchpoint", "md": "# Journey \u2014 one ordinary Tuesday across every touchpoint\n\n> **What this is** \u2014 a single day at one MSP seen from all four seats: the tier-1 technician, the delivery manager, the principal engineer, and the owner who signs the invoice \u2014 plus the client-side IT director who can stop everything.\n> **Why it exists** \u2014 the other three journeys each follow one person through an arc. This one tests whether the product coheres when four people touch it in the same eight hours with different goals, and whether the payer ever sees anything at all. A product the buyer never opens is a renewal risk regardless of how well it works.\n> **How to read it** \u2014 watch what each seat sees at the same moment. A skeptic should attack 14:20, where the system's mistake reaches a real client.\n> **Depends on / feeds** \u2014 inherits [PRD.md](../PRD.md), all three sibling journeys, personas \u00a71\u2013\u00a75; feeds `visuals/`, `narrative/pitch_deck.md`, [ux_spec.md](../ux_spec.md).\n\n**Setting.** Tuesday \u2014 per [S34] the week's heaviest ticket day. 20 staff, 41 environments.\n\n**Ticket volume, derived rather than asserted.** ~620 served users across the book \u00d7 0.8 tickets/user/month \u2248 **~496 tickets/month** [strategy/market_sizing.md](../../strategy/market_sizing.md). Of 20 staff, ~8 are on the ticket queue full-time (the rest are projects, dispatch, vCIO, admin), so **~62 tickets/technician/month, ~3/day**, with Tuesday running roughly double. The first version had Priya alone closing 11 in a morning \u2014 ~400/month, or 80% of the whole book from one of twenty people.\n\n---\n\n## 07:50 \u2014 Marcus (owner, the payer) \u00b7 90 seconds, once a week\n\nHe opens one screen before his first meeting: **Client 38 onboarded \u2014 22 engineer-hours against a 25\u201340 median-band baseline.** `(illustrative: target, not measured)` Below it, the month: 4 environments onboarded, ~46 engineer-hours saved `(illustrative)`, and the two clients where the number was **worse** than baseline \u2014 including the one where it always is, the first.\n\u2192 *Component:* **N14 onboarding meter**, **X20 environment dashboard**.\n**The two bad ones are shown first, deliberately.** A dashboard that only reports wins gets distrusted the first time the owner hears about a problem from a client instead.\n\u2192 *This is the payer's entire product surface.* He is not a user; he is a buyer who needs the number to still be true, and 90 seconds a week is the right amount of his attention to ask for.\n\n## 08:41 \u2014 Priya (tier-1) \u00b7 the ticket from [edge_low.md](edge_low.md)\n\nMFA re-enrolment at a client she has never touched. Skill matched, variance surfaced, one gated approval, one system-initiated escalation when the situation left the envelope.\n\u2192 *Component:* **X14 \u2192 X17 \u2192 N12 \u2192 X6 \u2192 X9**.\n\u2192 *Record:* resolved with assistance; the escalation is not counted against her.\n\n## 09:15 \u2014 Dana (delivery manager) \u00b7 triage, ten minutes\n\nHer queue view shows four skills in shadow at two clients, one skill paused by drift, and three deviations waiting for engineer judgement.\n\u2192 *Component:* **X20**, **X12 drift detection**, **X3 deviation report**.\nShe promotes nothing today. Two of the shadow skills are one clean week away; she leaves them.\n**The product's job here is to be ignorable.** Most days the correct action is none, and a queue that manufactures urgency to seem valuable will be muted within a month.\n\n## 11:30 \u2014 Ray (principal) \u00b7 a cross-environment question\n\n*Which of my environments have this conditional-access pattern?* Six, three of which he did not expect.\n\u2192 *Component:* **X17** + **N9 variance envelope**, queried across his own 41 environments **entirely inside his MSP's node** \u2014 his data about his own clients, which never reaches the vendor (D6).\n\n## 13:05 \u2014 Priya \u00b7 the unglamorous majority\n\nSix tickets between 09:00 and 13:00 \u2014 a heavy Tuesday morning against her ~3/day average. **Three** matched a skill and ran gated; **two** were novel and she did them by hand while capture ran; **one** was the kind of request no automation should touch \u2014 a user wanting a policy exception \u2014 and she just talked to the person.\n\u2192 *Component:* **N1 capture** on the two novel ones; nothing at all on the human one.\n**The one the system stayed out of matters.** A product that tries to intermediate a conversation about a policy exception makes the day worse, and `P9` plus envelope enforcement are what keep it out.\n\n## 14:20 \u2014 The mistake \u00b7 and how far it gets\n\nA gated skill proposes disabling a mailbox forwarding rule at a 60-person client. The approval line says *removes forwarding from j.okafor@ to an external address*. The technician approves it. It was legitimate \u2014 an executive's deliberate forward to a personal account, set up by Ray eight months ago and documented nowhere.\n\n**What contained it:**\n\u2192 **X4 success-criterion verification** confirmed the action did what it said \u2014 the action was executed correctly. **The system was not wrong about what it did; it was wrong about whether to do it.** No verification step catches that.\n\u2192 **X8 reversible-write execution** had recorded the undo path before acting. Restored in 40 seconds once the executive called.\n\u2192 **X7 agent identity** meant the client's audit log showed exactly which principal made the change, at what time, under whose approval \u2014 so the post-mortem took four minutes rather than an afternoon.\n\u2192 **X3 deviation report** routed it to Ray, who added the exception to the skill's envelope. **N9/X13** widened it.\n\n**What genuinely failed:** the skill's preconditions did not encode \"check for documented exceptions\", because no captured session had ever encountered one. **This is `P2` \u2014 happy paths are not procedures \u2014 arriving in production.** The library learns the exception only by meeting it, and the first meeting is a live client.\n\n**14:45 \u2014 somebody has to tell the client, and it is not the product.** Dana calls Sonia before Sonia hears it from the executive. The MSP discloses: what the agent did, under which principal, that it was reverted in 40 seconds, and what changed in the skill so it cannot recur. **The pack assigns this to Dana explicitly**, because a veto-holder who learns about an agent's mistake secondhand reopens a review that took six weeks to close [strategy/sales_roadmap.md](../../strategy/sales_roadmap.md) \u2014 and there is one of her per environment.\n\u2192 *Component:* **X21 audit export**, run same-day rather than quarterly.\n\u2192 *The product's job here is narrow and real:* make the disclosure take four minutes and be complete. It cannot make the call.\n\n**And somebody has to decide whether this ticket is billable.** The agent acted, **X4** verification passed, and a human then undid the work. Under per-resolved-ticket pricing (D4), is that a resolution?\n**The pack's answer, owed to the pilot agreement:** no. **A resolution is billable when the declared success criterion passed *and* no human reversed the action within the ticket's life.** Reversal within the ticket voids the charge. This is the clause `strategy/sales_roadmap.md` step 6b names as where outcome pricing dies in month three, and it is settled here rather than discovered in an invoice dispute.\n\u2192 *Component:* **X4** result plus reversal state feed the billing record \u2014 a **Next-tier requirement**, not an afterthought.\n**A skeptic should attack exactly here, and the honest answer is that this class of error is not eliminable, only survivable.** Reversibility, attribution and gating are what make it a 40-second incident instead of a lost client. **A product that promised this could not happen would be lying, and the pack does not claim it** [BRIEF.md](../../BRIEF.md) claim boundary.\n\n## 16:00 \u2014 Sonia (client-side IT director) \u00b7 the quarterly review\n\nShe exports the action log for her environment: every action, its skill version, its verification result, the approving human, under the agent's named principal. She also confirms what she was told at onboarding \u2014 **raw recordings never leave her MSP's control, and nothing identifying her tenant reaches the vendor.**\n\n*The precise wording matters and the first version got it wrong. Sessions are recorded on MSP engineer workstations and live on the MSP's node; they were never inside Brightwater's boundary, so \"no raw recording left your boundary\" attests to nothing and implies custody she does not have. The true and stronger claim is about the MSP's control and the vendor's exclusion.*\n\u2192 *Component:* **X21 audit export**, egress attestation (D6).\n\u2192 She is not a user either. **She needs one file, twice a year, and for it to be boring.**\n\n## 17:30 \u2014 Dana \u00b7 Friday's work, started early\n\nThree deviations resolved, one skill promoted, one rejected outright \u2014 a technician's idiosyncratic shortcut that should not become the house method.\n\u2192 *Component:* **X19 skill correction UI**, **X10 promotion ladder**.\n\u2192 *Record:* the rejection, with its reason, which is as valuable as the promotion.\n\n---\n\n## The day, by seat\n\n| Seat | Time in product | What they need it to be |\n|---|---|---|\n| **Marcus** (payer) | ~90 seconds/week | A number that is still true, including when it is bad |\n| **Dana** (champion) | ~20 minutes/day | Ignorable most days; unambiguous when it is not |\n| **Priya** (edge-low) | continuous, ambient | A colleague who knows this client, not a supervisor |\n| **Ray** (edge-high) | ~15 minutes/day | Inspectable, correctable, and occasionally an instrument |\n| **Sonia** (veto) | one file, twice a year \u2014 **plus a same-day call when something goes wrong** | Boring, and never surprised |\n| **Dana** (again) | owns the disclosure conversation | Fast, complete, and not defensive |\n\n**One system, four relationships, no separate tiers.** Nobody was served by a \"lite\" version and nobody hit a wall meant for someone else \u2014 the difference between the seats is whether a person is consuming a skill, authoring one by working, judging one, or auditing one.\n\n**Recommended next:** design the 14:20 path before the 08:41 path. **The incident journey is the one that decides whether a customer keeps the product**, and reversibility, attribution and a fast post-mortem are the features that make an inevitable error survivable rather than terminal.\n"}, "product/journeys/edge_high.md": {"g": "Journeys", "t": "Journey \u2014 edge-high: Ray is convinced, then genuinely stretched", "md": "# Journey \u2014 edge-high: Ray is convinced, then genuinely stretched\n\n> **What this is** \u2014 the elite user's journey: a 19-year principal engineer who has cleaned up after two failed RPA programmes, moving from active scepticism to authorship, and then to work he could not do before.\n> **Why it exists** \u2014 Ray can veto adoption without attending a single meeting, by quietly not cooperating with capture [strategy/sales_roadmap.md](../../strategy/sales_roadmap.md). He is also the source of the highest-value skills in the library. A product that bores or threatens him fails twice: no data in, and a credible internal voice saying it is RPA again.\n> **How to read it** \u2014 beats 1\u20134 are conversion, 5\u20138 are the stretch. A skeptic should attack beat 3, where a single wrong skill would have ended the deployment.\n> **Depends on / feeds** \u2014 inherits [PRD.md](../PRD.md) `P3 P6 P7 P8`, personas \u00a74, the D5 contract-vs-goal argument; feeds `tech/whitepaper.md`, `narrative/vc_memo.md`.\n\n**Persona.** Ray Kowalczyk, 19 years, principal escalation engineer. Holds environment knowledge for the 8 most complex clients. Interrupted ~14 times a day.\n**Session goal (his, not ours).** Establish whether this system is going to make production worse.\n\n---\n\n## Conversion\n\n**Day 1 \u2014 he does not attend the kickoff.** He reads the capture agent's docs instead, and checks two things: whether it captures keystrokes into password fields (it does not \u2014 **N4 sensitive-value redaction** drops them at capture, before storage) and whether he can stop it (he can \u2014 **N11**, indicator and pause).\n\u2192 *Record:* nothing. **That is the point: he verified before contributing.**\n\n**Day 3 \u2014 the narration prompt earns its place.** Mid-session he picks the second of two AD groups. A prompt: *why that one?* He says: *\"Because the first one syncs to their billing system and finance owns that.\"* Nine seconds.\n\u2192 *Component:* **N10 decision-point narration** (`P1`).\n\u2192 *Record:* the rationale attached to that branch \u2014 **the piece of information no amount of screen capture would have recovered.**\n\n**Day 12 \u2014 the beat that converts him.** He opens a skill built from his own session. Not a flowchart: text, with a goal, a success test, and his reasoning quoted where the branch happens. He finds one thing wrong \u2014 a precondition too broad \u2014 and fixes it in place.\n\u2192 *Component:* **N12 skill viewer**, **X19 skill correction UI**, **N13 authorship attribution** (`P6 P8`).\n\u2192 *Record:* skill v2, edit credited to Ray.\n**A skeptic should attack here.** If that first skill had been subtly wrong in a way he could not see, or presented as a black box he could not edit, this deployment ends on day 12 and no later feature recovers it. **`P6` is not a UI preference; it is the adoption gate.**\n\n**Day 20 \u2014 the RPA objection, answered by mechanism.** He asks the question he has been saving: *\"What happens when Okta redesigns their admin console? Because that's what killed the last two.\"*\nThe answer he is shown is not a promise. It is the E2 result: skills executed against a deliberately altered UI \u2014 moved, renamed, re-ordered elements plus a version upgrade that changed selectors \u2014 beside a **selector-based** RPA baseline on the identical alteration.\n\u2192 *Component:* **N8 evaluation harness**, **X11 re-grounding on change** (`P3 P4`, D5).\n\u2192 *The mechanism, stated as he would state it:* RPA does have success checks \u2014 Verify App State, Wait stages \u2014 but they assert things about **the interface**, so when a selector breaks they can tell you something is wrong and cannot tell you what you were trying to achieve. The run halts loudly or proceeds wrongly, and neither recovers. A skill's criterion is a **goal state**, which a re-grounding search can aim at. *(He knows about Verify App State. Claiming RPA has no success criterion at all would have lost the room.)*\n**He is not convinced by the argument. He is convinced that the argument is testable, and that the baseline was not rigged.**\n\n## The stretch\n\n**Week 5 \u2014 interruptions fall, and the ones remaining are better.** Tier-1 stops asking him things the library now answers. What reaches him is genuinely novel.\n\u2192 *Component:* **X17 global stack layer**, **L11 escalation routing** (routes by who authored the relevant skills).\n\u2192 *Record:* his interruption count and its composition \u2014 the metric he judges the product on.\n\n**Week 7 \u2014 he starts using it as an instrument.** A client's intermittent authentication failure. Ray asks the library a question it was not designed for: *which of my 41 environments have this conditional-access pattern?*\n\u2192 *Component:* **X17** + **N9 variance envelope**, queried across his own 41 environments **entirely inside his MSP's node** \u2014 this is his data about his own clients, and it never touches the global layer (D6).\n\u2192 *Record:* a cross-environment query. **This is Ray using the variance envelope as a diagnostic, which is not a feature anyone specified.** It is what having the distribution rather than the modal path makes possible (`P7`).\n\n**Week 9 \u2014 he authors deliberately.** He works a **broken AD-to-Entra Connect group sync** \u2014 a failure he has diagnosed at eleven different clients, each time slightly differently \u2014 *knowing* it will be captured, and narrates as he goes. He is no longer a subject; he is writing the manual by doing his job.\n\n*The first version used an Exchange hybrid migration here. That was the wrong choice on two counts a practitioner would catch: a hybrid migration is a multi-week project rather than a session, and it happens once per client, so there is nothing for cross-session clustering to operate on. A sync break is genuinely gnarly, recurs across the book, and varies per tenant \u2014 which is what makes it clusterable and what makes its variance envelope worth having.*\n\u2192 *Component:* **N1**, **N10**, **N6**, **N13**.\n\u2192 *Record:* the most valuable skill in the library, attributed to him.\n**`P8` has flipped.** Capture stopped being surveillance and became authorship, and the mechanism was attribution plus the ability to correct \u2014 not messaging.\n\n**Week 14 \u2014 drift catches something he would have missed.** A skill's verification rate degrades over three days. The system pauses it and flags a change in a client's tenant that nobody had announced.\n\u2192 *Component:* **X12 drift detection**, **X4 success-criterion verification** (`P4 P9`).\n\u2192 *Record:* paused skill, drift signal, the tenant change identified.\n**This is the beat where he stops testing it and starts relying on it:** it told him about a production change before a user did.\n\n---\n\n## What Ray got, and what the company got\n\n| | Ray | The company |\n|---|---|---|\n| Day 1 | verified it could not harm him | nothing \u2014 correctly |\n| Day 3 | his reasoning captured in 9-second increments | the rationale screen capture cannot recover (`P1`) |\n| Day 12 | a skill he corrected and owns | the endorsement that makes capture sustainable (`P8`) |\n| Day 20 | an evidence-backed answer to his RPA objection | the argument that survives diligence (D5) |\n| Week 5\u201314 | fewer, better interruptions; a cross-environment diagnostic | the highest-value skills in the library, and the variance envelope proven useful to a human |\n\n## The failure mode this journey exists to prevent\n\nReverse beats 3 and 4 \u2014 show him a black box, answer his RPA question with a slogan \u2014 and Ray tells the team channel it is RPA with a chatbot on it. He would be listened to, because he cleaned up the last two. **Capture then degrades quietly: sessions get paused, narration stops, and the library learns only the easy procedures.** No dashboard shows this failure; it looks like slow adoption. It is the single most likely way this product dies inside a customer that has already paid.\n\n**Recommended next:** run beat 4 before the first pilot, not during it. The E2 result and a selector-based baseline are cheap to produce on lab environments and they are the artifact that converts this persona \u2014 [strategy/sales_roadmap.md](../../strategy/sales_roadmap.md) step 4 already gates the deal on it.\n"}, "product/journeys/edge_low.md": {"g": "Journeys", "t": "Journey \u2014 edge-low: Priya's first ticket at a client she has never touched", "md": "# Journey \u2014 edge-low: Priya's first ticket at a client she has never touched\n\n> **What this is** \u2014 the least-supported user on the spectrum succeeding at work she could not do unaided, narrated beat by beat with the component acting and the durable record written at each step.\n> **Why it exists** \u2014 the edge-low case is where a product either serves the whole spectrum or quietly serves only the confident. It is also where this product's adoption risk concentrates: Priya is the person most plausibly threatened by it, and if her journey reads as replacement rather than support, the capture programme fails from inside [strategy/personas.md](../../strategy/personas.md) \u00a73.\n> **How to read it** \u2014 the component column is the test. A skeptic should be able to list which components fired in what order without reading the prose. Attack beat 7, where the system declines to act.\n> **Depends on / feeds** \u2014 inherits [PRD.md](../PRD.md), [features_flagship.md](../features_flagship.md), personas \u00a73; feeds `visuals/`, `narrative/vc_memo.md`, [ux_spec.md](../ux_spec.md).\n\n**Persona.** Priya Raman, 14 months' experience, tier-1 technician. Handles first-line for 41 client environments, each configured slightly differently.\n**Session goal.** Resolve an MFA re-enrolment for a user at Brightwater Dental \u2014 a 22-person client on Microsoft Entra ID that Priya has never worked in \u2014 without escalating.\n\n*Vocabulary note: this journey is Entra/M365 throughout. The first version mixed Okta and Entra terms in the same scenario, which is the kind of error a practitioner spots immediately.*\n**Baseline today.** She reads a generic runbook, finds Brightwater's Entra tenant configured unlike the others, burns 25 minutes, escalates to Ray. The escalation counts against her.\n\n---\n\n**08:41 \u00b7 Ticket lands.** \"Can't get into email on my new phone.\" Priya opens it in the PSA.\n\u2192 *Component:* **X14 ticket-system integration (read)** pulls ticket context and the client identity.\n\u2192 *Record:* ticket bound to environment `brightwater`.\n\n**08:41 \u00b7 The desk offers what it knows.** Alongside the ticket, a panel: *MFA re-enrolment \u2014 Brightwater Dental. 3 skills available. This client differs from your other Entra tenants in 2 ways.*\n\u2192 *Component:* **X17 global stack layer** matched the ticket to a known procedure shape; **N9 variance envelope** supplied the two deviations specific to this tenant.\n\u2192 *Record:* a skill-match event, and which envelope variant was selected.\n\n**08:42 \u00b7 She reads before she acts.** The skill opens with its goal and its success test \u2014 *Succeeds when: the user completes an MFA challenge from the new device* \u2014 then the steps, then a flagged line: *Brightwater's Conditional Access requires MFA for the **\"Register security information\"** user action \u2014 so a user who has lost their only factor cannot register a new one. The MFA-bootstrap deadlock. Two engineers hit this; both resolved it with a **Temporary Access Pass**, not by weakening the policy.*\n\u2192 *Component:* **F6 skill synthesis** (goal + success criterion), **N9** (the deviation), **N13 authorship attribution** \u2014 the note carries Ray's and a colleague's names.\n\u2192 *Record:* skill view, by whom, which version.\n**This beat is the product.** Nobody told Priya about Brightwater's conditional access. Two engineers hit it months apart, and the system kept what they did.\n\n**08:44 \u00b7 She chooses supervised execution.** Priya clicks *run with me* rather than doing it by hand. The agent proposes step 1 \u2014 verify the user's identity against the ticket's originating address \u2014 and waits.\n\u2192 *Component:* **X10 promotion ladder** has this skill at *gated* for this environment; **X6 approval queue** surfaces each action inline.\n\u2192 *Record:* run started, mode `gated`, operator Priya.\n\n**08:45 \u00b7 Read steps proceed; she watches.** The agent reads the user's enrolment state and reports it. No approval needed \u2014 reads are unrestricted.\n\u2192 *Component:* **X5 action-class policy** classified these as read; **X1 read-only executor** ran them.\n\u2192 *Record:* two read actions, attributed to the **agent's own principal** (**X7**), visible in Brightwater's audit log as a named non-human identity.\n\n**08:47 \u00b7 The first mutating step stops for her.** *Issue a Temporary Access Pass for j.mbeki@ \u2014 single-use, valid 60 minutes. Approve?* With one line of effect: *this user only; expires on its own; does not alter any policy.*\n\n*A TAP is a real Entra primitive built for exactly this case \u2014 time-boxed, per-user, and it leaves the policy untouched.*\n\n*This paragraph has been corrected twice. The first version invented an \"auto-expiring conditional-access bypass\", which exists in neither Entra nor Okta. The second paired a TAP against a **device-compliance** grant \u2014 but **a TAP is an authentication method and carries no device state, so it cannot satisfy \"require device to be marked as compliant\"**; the user authenticates and is still blocked, especially on the unenrolled personal phone this journey names. TAP is the right primitive for the MFA-bootstrap block, which is what the scenario now describes.*\n\u2192 *Component:* **X5** classified it reversible-write; **X6** requires human approval at this ladder rung; **X8 reversible-write execution** has the undo path recorded before the action runs.\n\u2192 *Record:* approval by Priya, undo path stored.\n\n**08:48 \u00b7 The system declines to guess.** The user's device shows an enrolment already in progress from an unrecognised location. The skill's preconditions do not cover it. The agent stops: *This doesn't match what I've seen in 14 environments. Routing to Ray with what I found.*\n\u2192 *Component:* **X9 envelope enforcement** \u2014 outside the declared envelope, escalate rather than improvise (`P5`).\n\u2192 *Record:* escalation with the full action trace attached.\n**This is the beat a skeptic should attack, and it is the one that makes the product safe.** A system that improvised here might have cancelled a legitimate enrolment or approved a hostile one. Priya's queue metric is unharmed: an escalation the system initiated is not an escalation she failed.\n\n**08:52 \u00b7 Ray resolves it in four minutes**, because the trace told him what had already been checked. His session is captured.\n\u2192 *Component:* **N1 capture**, **N5 failure/abort labelling** marks this as an escalation-resolution session \u2014 the kind that contains what successful runs never do (`P2`).\n\u2192 *Record:* a labelled session against `brightwater`, queued for distillation.\n\n**09:20 \u00b7 A variant is *proposed*, not shipped.** Stage-1 distillation runs on the MSP's node (D6). The unrecognised-registration branch becomes a **candidate** third variant, queued for Ray's endorsement \u2014 the same governance the beachhead journey applies, because a library that self-modifies without the authoring engineer's sign-off breaks `P8` and the first version of this journey quietly did exactly that.\n\u2192 *Component:* **N6 stage-1 distillation**, **N9 + egress filter**, **X19 skill correction**, **X13 envelope widening** (pending).\n\u2192 *Record:* candidate variant awaiting endorsement.\n\n**Next morning.** Ray endorses it with one edit. Skill v4, variants 3, contributors now including him.\n\u2192 *Record:* endorsed variant; the abstracted pattern \u2014 *\"registration blocked by compliant-device policy; resolved by time-boxed pass\"* \u2014 becomes eligible for the global layer. **Brightwater's name, domain and policy id do not travel with it.**\n\n**Next week.** The same situation arises at a different client. Priya sees the branch, follows it, and does not escalate.\n\u2192 *Component:* **X17 global stack layer** \u2014 the *pattern* transferred; Brightwater's data did not.\n\n---\n\n## What the durable record holds after this session\n\n| Artifact | Content |\n|---|---|\n| Skill `okta-mfa-reenrolment` | v4 \u00b7 3 variants \u00b7 success criterion \u00b7 contributors: Ray, 2 others |\n| Stage-1 record (**stays in the MSP's tenant**) | compliant-device policy blocks registration (Brightwater); registration-in-progress-from-unknown-location |\n| Envelope entry (**eligible to cross**) | `{registration blocked by device-compliance precondition; resolved by time-boxed pass; observed in 6 tenants}` \u2014 no tenant name, domain, user or policy id |\n| Action log (client-visible) | 2 reads, 1 approved reversible write, 1 escalation \u2014 all under the agent's named principal |\n| Session store (in-boundary) | Ray's escalation session, labelled, expiring per retention policy (**X22**) |\n| Priya's record | one ticket resolved with assistance, one system-initiated escalation \u2014 **not** counted as her failure |\n\n## Why this is dignity rather than replacement\n\nPriya did not become a button-pusher: she read the procedure, approved the consequential step, and learned Brightwater's conditional-access quirk in the process. The system absorbed the part she found demoralising \u2014 not knowing what she could not have known \u2014 and left her the judgement. **Had beat 8 improvised instead of escalating, or had beat 3 shown her a black box instead of readable text, this journey would read as replacement and `P8` would fail.** The design choices that prevent that are `P6` (readable) and `P9` (verification before action), not the copy.\n\n**Recommended next:** validate beat 3 in discovery \u2014 ask five tier-1 technicians whether \"here is how *this client* does it\" is what they actually want, or whether they want the ticket simply gone. If it is the latter, this journey is the wrong shape and the edge-low proposition needs rethinking.\n"}, "tech/deep_dives.md": {"g": "Tech", "t": "Deep dives \u2014 the six systems that have to work", "md": "# Deep dives \u2014 the six systems that have to work\n\n> **What this is** \u2014 the tier-1 algorithmic problems behind the mechanisms, each stated as the one question it answers, the real methods that answer it, its inputs and outputs, the design choice that matters, and how it fails.\n> **Why it exists** \u2014 the whitepaper argues that mechanisms remove frictions; this file is where those mechanisms stop being nouns. It is also where the pack is most exposed: **DD1 is the company's core bet and has no benchmark, no named prior system, and no literature to inherit** [../research/capability_table.md](../research/capability_table.md) row 5.\n> **How to read it** \u2014 DD1 first; everything downstream is conditional on it. A skeptic should attack DD1's evaluation strategy, since a system with no benchmark can grade its own homework.\n> **Depends on / feeds** \u2014 inherits [whitepaper.md](whitepaper.md), [../research/capability_table.md](../research/capability_table.md), [../product/PRD.md](../product/PRD.md); feeds [architecture/00_INDEX.md](architecture/00_INDEX.md), [not_vaporware.md](not_vaporware.md), `narrative/vc_memo.md`.\n\n---\n\n## DD1 \u00b7 Cross-session procedure clustering\n\n**The one question:** given many recordings of engineers doing work, which of them are the *same procedure*, and what is invariant across them?\n\n**Approach.** Three stages, none novel individually; the combination is the bet.\n1. **Episode representation.** Each session segment becomes a typed action sequence \u2014 `(app, ui_role, action_kind, value_class)` \u2014 deliberately *not* raw pixels or coordinates. Value classes (`email_address`, `group_name`, `guid`) rather than values, so that redaction (N4) and abstraction are the same operation rather than two.\n2. **Alignment.** Sequence alignment adapted from bioinformatics (Needleman\u2013Wunsch / profile HMMs) over action types, tolerant of insertions, deletions and reordering \u2014 because two engineers doing the same job take different routes through the same UI.\n3. **Consensus + variance.** The aligned set yields a modal path (the procedure) and a **distribution over deviations** (the variance envelope, `P7`). The envelope is not a by-product; it is the asset.\n\n**Inputs:** typed action streams + optional narration transcripts. **Outputs:** procedure clusters with per-step variance and per-cluster support counts.\n\n**Key design choice and why.** *Cluster on action semantics, not on UI trajectory.* Trajectory clustering makes two engineers reaching the same end by different routes look like two procedures, which is precisely the failure that makes the library grow without getting better. The cost is that semantic typing must be inferred, which is DD2's problem.\n\n**Failure modes.** Over-merging (two genuinely different procedures collapse into one skill with an incoherent envelope \u2014 the dangerous one, because it produces a confident wrong skill). Under-merging (the library grows without generalising). Narration-absent branches, where the *why* was never spoken and the alignment cannot tell essential from incidental (`P1`).\n**Fallback:** under-merge by default. A library with duplicate skills is inefficient; a library with over-merged skills is unsafe.\n\n---\n\n## DD2 \u00b7 Semantic action typing from screen capture\n\n**The one question:** what did this click *mean*?\n\n**Approach.** Multimodal frame understanding plus accessibility-tree extraction where available, producing `ui_role` (the control's function, not its label) and `action_kind`. Prefer structured signal over pixels: on Windows admin tooling UIA gives roles directly, and browser admin consoles expose the DOM. Vision is the fallback for terminals and native tools that expose nothing. VideoAgentTrek [S23] establishes that unlabelled screen video carries enough signal to be useful without manual annotation.\n\n**Inputs:** frames, input events, accessibility tree / DOM where present. **Outputs:** typed actions with confidence.\n\n**Key design choice.** *Structured-first, vision-fallback* \u2014 the inverse of the demo-friendly choice. Vision-first looks more impressive and degrades badly on exactly the dense admin UIs this product lives in.\n\n**Failure modes.** Custom-drawn UIs exposing no tree; terminal work where semantics live in text rather than controls; confidently wrong typing, which is worse than abstention. **Fallback:** abstain and mark the step opaque; an opaque step blocks promotion of the whole skill rather than being guessed.\n\n---\n\n## DD3 \u00b7 Skill synthesis with a declared success criterion\n\n**The one question:** what is this procedure *for*, and how would we know it worked?\n\n**Approach.** From a cluster and its narration, generate `SKILL.md`: goal, preconditions, steps, **success criterion**, escalation envelope. The criterion is the hard part and the whole point (`P3`) \u2014 it must be a **goal-state predicate that is checkable independently of the steps that produced it**. \"The user can complete an MFA challenge from a new device\" is checkable; \"the TAP was issued\" merely restates step 4.\n\n**Key design choice.** *Reject the skill if no independently checkable criterion can be derived.* An unverifiable skill is not a weak skill \u2014 it is the RPA failure mode with better prose, and admitting it would collapse the \u00a75 argument the whole pack rests on.\n\n**Failure modes.** Circular criteria (restating the last step). Criteria that are expensive or intrusive to check. Criteria that pass while the outcome is wrong \u2014 the 14:20 class [../product/journeys/day_in_life.md](../product/journeys/day_in_life.md), which no verification design eliminates.\n\n---\n\n## DD4 \u00b7 Envelope abstraction and egress filtering\n\n**The one question:** what can cross the MSP boundary without carrying tenant identity? (D6)\n\n**Approach.** A whitelist-shaped transform, not a redaction pass. An envelope entry emits only `{procedure_shape, precondition_pattern, deviation_class, observation_count}` \u2014 constructed from a closed vocabulary rather than by removing identifiers from free text. **Anything not expressible in that vocabulary does not leave.**\n\n**Key design choice.** *Whitelist construction over blacklist scrubbing.* Scrubbing fails open \u2014 one unanticipated identifier format and tenant data crosses. Whitelisting fails closed: an unrepresentable pattern is simply not shared, and the cost is a less complete global layer rather than a breach.\n\n**Failure modes.** Vocabulary too narrow (the global layer starves and A8's compounding never materialises). Vocabulary too broad (a `deviation_class` that is effectively a fingerprint \u2014 e.g. a policy pattern unique enough to identify one tenant). **Mitigation, corrected after critic round 1 \u2014 the first version was decorative on three counts:**\n\n1. **It is not k-anonymity.** Sweeney's k-anonymity is a property of equivalence classes over quasi-identifiers in a released table. This is a **minimum-support threshold on a released pattern** (k-map-shaped). A privacy reviewer will make that distinction immediately, so the pack makes it first.\n2. **The threshold was counting the wrong thing.** It counted distinct *client tenants*. One MSP brings ~41 of them \u2014 so at cold start all three observations can sit inside a single design partner's book, and the envelope **identifies that MSP with certainty at exactly the moment of its first security review.** The threshold now counts **distinct MSPs** `(assumption: m\u22653 MSPs, and \u22653 tenants within each)`. This lengthens the cold start considerably and is the correct trade.\n3. **The attack is compositional, and per-entry thresholds do not address it.** A set of `deviation_class` values each cleared individually can jointly identify one tenant \u2014 the standard sparse-high-dimensional linkage result (Narayanan & Shmatikov 2008). Nothing in the released set is currently budgeted across entries.\n\n**Honest status:** the guarantee is **heuristic, not formal.** l-diversity (Machanavajjhala 2007), t-closeness (Li 2007) and differential privacy all exist precisely because minimum-support alone is insufficient, and none is implemented here. **D6's promise is contingent on X25 \u2014 adversarial re-identification testing \u2014 which wave 2 concedes is unbuilt.** Until X25 runs, the correct statement to a security reviewer is \"threshold plus adversarial testing\", not \"anonymised\".\n\n---\n\n## DD5 \u00b7 Goal-directed re-grounding\n\n**The one question:** the interface changed \u2014 where is the thing I need now?\n\n**Approach.** On precondition failure, search the current UI for a state satisfying the skill's goal predicate, using the semantic role that was recorded rather than the identifier that broke. Bounded: a fixed search budget, read-only probing, and escalation on exhaustion. **This is the D5 mechanism made operational** \u2014 it works only because DD3 guaranteed a goal exists to aim at.\n\n**Key design choice.** *Read-only during re-grounding, always.* A search that mutates while exploring is how a re-grounding attempt becomes an incident.\n\n**Failure modes.** Re-grounding onto a *similar but wrong* control \u2014 the highest-severity failure in the system, since it produces a confident wrong action. **Mitigation:** re-grounded steps demote the run to gated regardless of the skill's rung, so a human sees the first execution after any drift.\n\n---\n\n## DD7 \u00b7 Blast-radius classification\n\n**The one question:** is this synthesized step destructive?\n\n**Why it is a deep dive and not a config table.** The entire safety ordering in [techniques/decision_tree.md](techniques/decision_tree.md) fires on this label, and the first version of this layer never said how a step acquires it. Wave 1 lists \"action-class policy enforcement \u00b7 standard privileged-access practice \u00b7 borrowed\" \u2014 but PAM classification is a **curated policy over named operations**, not a label inferred over arbitrary observed UI actions on admin surfaces. That gap *is* the adaptation, and it was unwritten.\n\n**Approach.** A mapping from `(app, ui_role, action_kind)` to a blast-radius class, built from three sources: an explicit operation catalogue for the common stacks (Entra, M365, AD, Jira), the semantics available from the accessibility tree, and the engineer's own classification during skill endorsement.\n\n**Key design choice \u2014 default-destructive on anything unmapped.** An operation the catalogue does not recognise is treated as destructive, and **an unmapped step blocks promotion of the whole skill** rather than being guessed. This is DD2's discipline (abstain rather than assert) applied to safety instead of semantics, and it is deliberately the annoying default: it produces friction proportional to coverage gaps, which is exactly where friction belongs.\n\n**Failure modes.** Misclassifying a destructive operation as reversible \u2014 the highest-severity failure in the system, since it routes past rule 1 of the decision tree. A catalogue that drifts as vendors add operations. Engineers over-classifying to avoid gates, or under-classifying to reduce approvals.\n\n**Note the second failure this exposes.** \"Read\" is not a single class. A mailbox export, a full directory enumeration and an MFA-state dump are all reads with real consequence, and the decision tree's original rule 7 said reads have \"no blast radius\" and execute freely. **That is the line a founder widens the week before a demo**, and the taxonomy is corrected accordingly.\n\n## DD6 \u00b7 Drift detection\n\n**The one question:** is this skill still true?\n\n**Approach.** Monitor per-skill verification pass rates and re-grounding frequency; a CUSUM-style change detector flags degradation before it becomes failure. Pause on threshold breach (`P4 P9`).\n\n**Key design choice.** *Pause first, ask second \u2014 but tune for specificity.* The two asymmetries genuinely point opposite ways and the first version stated both without resolving them. Resolution: **pause is cheap, alerting is not.** A skill pauses on a low threshold (a missed drift can cause a client incident), but the *human-facing alert* fires on a high one \u2014 a spurious alert costs more trust than a silent pause, because a paused skill degrades throughput while a false alarm degrades belief. `(assumption: pause at a 2-sigma shift, alert at 3-sigma or on a second consecutive pause; both owed to the first pilot's data)`.\n\n**Failure modes.** Slow drift under the detector's threshold. Seasonal patterns misread as drift. Too few executions to establish a baseline \u2014 which is the normal case for a rare skill, and is why drift detection cannot be the only safety mechanism.\n\n---\n\n## What this list concedes\n\n**Six of seven are engineering.** DD2\u2013DD7 are hard, but they are recombinations of known methods with known failure modes, and a competent team ships them.\n\n**DD1 is research with a product schedule attached.** It has no benchmark to beat, no prior system to compare against, and the honest position is that a negative result is possible. The mitigation is not confidence \u2014 it is **DD1's evaluation harness (N8) existing before DD1 is optimised**, so the answer arrives as evidence rather than as an opinion held by the person who built it.\n\n**Recommended next 3:** (1) build N8's harness against a hand-labelled procedure set before tuning DD1, or the system grades its own homework; (2) settle DD4's k-anonymity threshold early \u2014 it is the guarantee D6's security story rests on and it constrains DD1's output format; (3) treat DD1 over-merging as the priority failure mode, since it is the one that produces confident wrong skills rather than merely inefficient ones.\n"}, "tech/not_vaporware.md": {"g": "Tech", "t": "Not vaporware \u2014 what is buildable this quarter, what is research risk", "md": "# Not vaporware \u2014 what is buildable this quarter, what is research risk\n\n> **What this is** \u2014 the concrete engineering position: stack choices, how quality is measured continuously, the cost model at current prices, and an honest split between what a competent team ships this quarter and what is genuinely research.\n> **Why it exists** \u2014 every claim in this pack is conditional on a system that does not exist yet. This file states what building it actually requires, so a technical evaluator can judge the schedule rather than the ambition \u2014 and so the one genuinely uncertain component is named rather than hidden inside a roadmap.\n> **How to read it** \u2014 \u00a74 is the honest part. A skeptic should attack the cost model in \u00a73, whose volume assumptions are unmeasured.\n> **Depends on / feeds** \u2014 inherits [deep_dives.md](deep_dives.md), [architecture/00_INDEX.md](architecture/00_INDEX.md), [../product/features_prioritized.md](../product/features_prioritized.md); feeds `financials/unit_economics.md`, `narrative/vc_memo.md`, `validation/experiment_board.md`.\n\n## 1 \u00b7 Stack\n\n| Layer | Choice | Why |\n|---|---|---|\n| Capture agent | Native Windows (C#/Rust) using UI Automation; macOS secondary | MSP engineer workstations are overwhelmingly Windows; UIA gives structured control roles that vision has to infer |\n| Transport | mTLS to the MSP's own stage-1 node, never to us | D6: the vendor is not on the raw-data path at all |\n| Stage-1 node | Containerised, deployable to an MSP's existing virtualisation or a small cloud tenant they own | It must live where the MSP already operates, not where we would prefer |\n| Action typing | **On-node multimodal model \u2014 not a hosted API** | **This is forced by D6, and the first version got it wrong.** A hosted model on the frame path means screenshots of a client's Entra and AD consoles leave the MSP tenant for an unnamed third party, which contradicts D6's guarantee and is the first question in any MSP security review. Typing runs on the node or the guarantee is not true |\n| Clustering | Classical sequence alignment + profile HMMs over typed actions \u2014 **not** an LLM | Deterministic, inspectable, debuggable. An LLM here would make the core bet unfalsifiable |\n| Skill synthesis | Frontier model, low volume | Quality matters more than cost; runs once per cluster |\n| Executor | Deterministic step runner + frontier model only for re-grounding | Most execution should not involve a model at all |\n| Skill format | `SKILL.md`, Apache-2.0 open standard [S24] | Readable by the engineer it came from (`P6`); no lock-in from the format, which is a feature not a concession |\n| Evaluation harness | Standalone, built **before** clustering is tuned | Otherwise the system grades its own homework |\n\n**The deliberate non-choice:** no model fine-tuning anywhere. Skills are text. This keeps customer data out of a training loop, which is what makes the security answer sayable, and it means improvement comes from better clustering rather than from accumulating a weights advantage nobody can audit.\n\n## 2 \u00b7 How quality is measured continuously\n\n| Metric | Method | Where it runs |\n|---|---|---|\n| Clustering correctness | Held-out environment scoring against a hand-labelled procedure set (4.1, 4.4) | Offline harness (N8) |\n| Skill robustness | **E2**: altered-UI perturbation vs a selector-based RPA baseline (4.2, 4.3) | Offline harness |\n| Verified-action accuracy | Criterion pass rate, plus human review of a sample of passes | Production |\n| Silent-wrongness rate | Reversals within ticket life (X23) \u2014 the only detector for the 14:20 class | Production |\n| Envelope safety | Adversarial re-identification attempts (X25) | Offline, pre-review |\n| Drift | CUSUM on per-skill verification (6.1) | Production |\n\n**No public benchmark exists for any of this** [../research/survey.md](../research/survey.md) \u00a74. That is a credibility problem and an opportunity: the harness is a moat component as well as an engineering necessity, and publishing its method \u2014 not just its numbers \u2014 is what would make the category's first yardstick ours.\n\n## 2b \u00b7 The inference boundary \u2014 corrected\n\n**The first version of this file put a hosted multimodal model on the frame path and no diagram showed the hop.** That is not a costing detail; it breaks D6. If typed actions are derived by sending frames to an inference provider, then raw client-console screenshots leave the MSP tenant, and D06's claim that \"raw sessions exist in exactly one place\" is false.\n\n**Two ways to resolve it, and the pack takes the first:**\n\n1. **Typing runs on the node.** A quantised open-weights multimodal model, sized for batch throughput rather than latency. Costs a GPU in the reference node (\u00a73b) and some accuracy against a frontier model. **Preserves D6 exactly as stated, which is the point \u2014 it is an architecture constraint, not a preference.**\n2. *(Rejected)* Hosted inference on redacted crops under a zero-retention DPA. Cheaper, more accurate, and it weakens the claim from *nothing leaves* to *we have contractual assurances about what leaves*. A security reviewer will notice the difference, and the compounding-half-is-defensible-by-construction argument becomes a policy argument instead.\n\n**Skill synthesis is the exception and it is a narrow one.** Synthesis operates on the *already-abstracted* cluster \u2014 procedure shapes and typed action sequences, no frames, no values \u2014 so a frontier API call there carries no client data by construction. **That is the only outbound inference call in the system, and it is drawn in D05.**\n\n## 3 \u00b7 Cost model at current prices\n\n**Corrected after critic round 1.** The first version priced revenue at \"~$216/month per environment\" against costs stated per environment per month. **$216 is the *annual* figure** \u2014 row 9 of [../strategy/market_sizing.md](../strategy/market_sizing.md) gives ~124 resolved tickets per MSP per month across 41 environments, i.e. ~3 tickets/environment/month at $6 \u2248 **$18/environment/month, ~$216/year**. Compared against a monthly cost line that was a 12\u00d7 error in the flattering direction, and it falsified by one division.\n\n**It is also the wrong granularity.** Clustering and synthesis operate across an MSP's environments, not within one, so the costs do not decompose per environment. The model belongs at the MSP level:\n\nPer **MSP**, per month `(all volumes assumption-based; no pilot exists)`:\n\n| Line | Volume assumption | Cost basis | Monthly |\n|---|---|---|---|\n| Action typing | ~1,600 session-minutes across the book | **On-node (\u00a72b) \u2014 no API cost** | **$0 marginal** |\n| Clustering + alignment | classical, CPU, off-peak | On-node | $0 marginal |\n| Skill synthesis | ~20\u201340 new or revised skills/month, frontier, on abstracted clusters only | the sole outbound inference call | `(assumption: $10\u201330)` |\n| Execution | ~124 resolved tickets, mostly deterministic; model only on re-grounding | mid-tier, rare | `(assumption: $5\u201315)` |\n| **Total marginal API** | | | **`(assumption: $15\u201345)`** |\n\n**Revenue per MSP per month:** ~$744 in ticket revenue (124 \u00d7 $6) plus ~$503 of amortised onboarding fees at the banded blended fee (D11) \u2248 **~$1,247/month, ~$14,930/yr** \u2014 which reconciles with the steady-state figure the strategy layer carries.\n\n**Marginal gross margin is therefore ~97%**, and that is not the interesting number. Falling inference prices [S30] make the API line nearly irrelevant here. **The cost that decides this business is the node**, which D6 moved onto hardware we do not own \u2014 so it leaves our P&L and arrives in the customer's procurement conversation instead.\n\n### 3b \u00b7 The reference node \u2014 the number an MSP owner asks for in the first call\n\nThe dominant cost is not in the table above, so the table's margin conclusion cannot be stated before this is:\n\n| Resource | Reference spec `(assumption)` | Driver |\n|---|---|---|\n| GPU | 1 \u00d7 24GB (e.g. L4-class or a consumer 3090/4090) | On-node typing (\u00a72b option 1) at batch throughput |\n| vCPU / RAM | 8 vCPU / 32GB | Alignment and clustering are CPU-bound and run off-peak |\n| Disk | ~2TB | Raw sessions for ~41 environments at the stated capture volumes, held to the retention window. **X22's retention engine is Next tier, so until it ships this number only grows** \u2014 which makes retention a capacity requirement, not just a privacy one |\n| Network | Outbound to the vendor only: envelopes and health | No inbound requirement |\n\n**Commercial fallback, because \"provide a GPU box\" loses deals:** offer a hardware credit against the onboarding fee, or a hosted node the vendor operates *inside a tenant the MSP owns* \u2014 which preserves the boundary while removing the procurement conversation. `financials/unit_economics.md` owes both sides, but the reference spec is ours to state and it is stated here.\n\n**Only now the margin claim:** at ~$1,247/month per MSP against $15\u201345 of marginal API, gross margin clears the 70% the strategy assumes with wide room \u2014 **provided the node sits with the MSP or is credited against the onboarding fee.** If the vendor absorbs the hardware, roughly $2,000\u20134,000 of amortised capital lands per customer and the margin conclusion does not survive. `financials/unit_economics.md` must model both cases; this file states the reference spec so it can.\n\n## 4 \u00b7 Buildable this quarter vs research risk\n\n**Buildable by a competent engineer, low uncertainty:**\ncapture agent (F1) \u00b7 redaction (N4) \u00b7 session segmentation (N2) \u00b7 skill viewer and correction UI (N12, X19) \u00b7 action-class policy and approval flow (X5, X6) \u00b7 agent identity (X7) \u00b7 audit export (X21) \u00b7 onboarding meter (N14) \u00b7 drift detection (6.1) \u00b7 \u2014 **but not node lifecycle.** N15 is moved out of this bucket: the product layer calls it \"the item most likely to be underestimated\", it is rated L, and D09 now carries the on-call obligation, buffering thresholds and schema-version rule that make it an operational commitment rather than a build task. It belongs with the hard-engineering group below.\n\n**Hard engineering, meaningful uncertainty, still engineering:**\n**node lifecycle (N15)** \u2014 distributed components inside customer infrastructure, with version skew that corrupts the m\u22653 count if unmanaged, and a paging obligation from the first deployment \u00b7 semantic action typing (DD2) \u2014 degrades on custom-drawn UIs and terminals \u00b7 goal-directed re-grounding (DD5) \u2014 the failure mode is subtle and the mitigation (demote to gated) is known \u00b7 envelope abstraction with k-anonymity (DD4) \u2014 the design is settled, the threshold is not.\n\n**Genuine research risk \u2014 one item:**\n**DD1, cross-session procedure clustering.** No benchmark, no named prior system, no literature to inherit [../research/capability_table.md](../research/capability_table.md) row 5. ALLOY [S22] demonstrates the adjacent claim at user-study scale; nothing demonstrates it across environments, which is A8.\n\n**The honest position, corrected.** The first version said \"one research bet wrapped in about nine months of ordinary engineering\" \u2014 which was roughly the *Now-tier floor alone*, applied to a list about twice that size, and which excluded every governance item the month-12 pilot is gated on. The product layer's own key prices the buildable list above at **~24 weeks at every optimistic bound and ~43 at midpoints**, and the Now tier at **~40 weeks floor, midpoints past 55** [../product/features_prioritized.md](../product/features_prioritized.md). This file inherits those numbers rather than publishing a third set.\n\n**\"Buildable by a competent engineer\" and \"shippable by this founder by month N\" are not the same sentence**, and the first version wrote them as one. The first is defensible; the second is what the schedule actually depends on.\n\n**DD1 gets its own line, because absorbing a research bet into an engineering estimate is the accounting move that makes it look like a sprint:**\n\n| | |\n|---|---|\n| **Time-box** | 10 weeks from the harness being ready |\n| **Iteration budget** | 3 substantive approaches (representation, alignment method, merge criterion) |\n| **Kill criterion** | held-out cross-environment success below ~70% after the third approach |\n| **On kill** | M1 collapses; the maintenance and risk-reduction claims survive; the company is materially smaller and the pack says so rather than re-scoping quietly |\n\nThat is a *concentrated* risk with a date attached, and there is no partial credit. If DD1 clusters into skills that do not transfer, M2's maintenance multiplier survives and M1 does not, and the company is materially smaller.\n\n**What would falsify the whole thing, stated plainly:** skills synthesized from environment A execute correctly in environment B less often than a competent engineer would accept \u2014 call it below 70% on the held-out set. That number is measurable in the harness, before a customer, and it is the first thing the build should produce.\n\n**Recommended next 3:** (1) build the harness before the clusterer, so the answer arrives as evidence; (2) implement clustering classically and resist making it a model call \u2014 an unfalsifiable core bet is worse than a negative result; (3) publish the evaluation method early, since no yardstick exists and the first credible one becomes the category's.\n"}, "tech/whitepaper.md": {"g": "Tech", "t": "Whitepaper \u2014 where the leverage actually is", "md": "# Whitepaper \u2014 where the leverage actually is\n\n> **What this is** \u2014 the mechanism argument: which frictions consume an MSP's engineering capacity, which mechanisms remove each, what multiplier each produces, and \u2014 stated first because it is what a skeptic checks \u2014 **which friction this system does not touch.**\n> **Why it exists** \u2014 every \"10x\" claim in this category is asserted on a total, and falls apart when a customer measures the total. This paper locates the leverage precisely: it is on **knowledge maintenance and reuse**, not on first-environment onboarding, where the system is measurably *worse* than doing nothing. A paper that claimed the headline number would be falsified by the first design partner's timesheet (D8).\n> **How to read it** \u2014 \u00a71 then \u00a74. A skeptic should attack \u00a72's multiplier bands, all of which are targets rather than measurements, and \u00a73's honest ceiling.\n> **Depends on / feeds** \u2014 inherits [../research/survey.md](../research/survey.md), [../research/capability_table.md](../research/capability_table.md), [../product/PRD.md](../product/PRD.md), the claim boundary D1 and the ROI-honesty directive D8; feeds [deep_dives.md](deep_dives.md), [architecture/00_INDEX.md](architecture/00_INDEX.md), `narrative/vc_memo.md`.\n\n## Executive summary\n\nAn MSP's engineering capacity is consumed by a knowledge cycle, not by a knowledge cost: environment knowledge is **acquired** per client, **decays** continuously, is **lost** on attrition, and is then **re-acquired**. The cycle repeats 41 times per MSP and never terminates.\n\nUnderstudy does not make acquisition cheaper. **It makes acquisition happen once.**\n\n**There is no 10\u00d7, and the first version of this paper claimed one it could not support.** It located the multiplier on documentation-maintenance hours \u2014 against a baseline this paper's own \u00a71 describes as \"largely unperformed\". An 8\u00d7 on hours nobody spends displaces no cost, and the strategy layer had already rejected charging for that line on precisely those grounds. The claim is withdrawn.\n\nWhat survives is smaller, measurable, and stated as four separate things because they do not combine into one:\n\n| | Effect | **Absolute, per MSP per year** | Kind |\n|---|---|---|---|\n| **M1** repeat-environment onboarding | **~1.4\u00d7** (25\u201340 hrs \u2192 18\u201328) | **~42\u201372 hrs saved** (6 new clients/yr) | a real hours multiplier, derived below |\n| **M2** documentation that is *true* rather than cheaper | risk reduction | **unquantified until measured** | re-baselined; see \u00a72 |\n| **M3** knowledge survives attrition | structural | unquantified, bounded by capture coverage | not a multiplier |\n| **M4** tier-1 repetitive execution | ~25% of ticket volume, supervised | ~124 tickets/month addressed | a capacity shift, not hours |\n| **M5** global layer | ~10\u201312% of a *new customer's* first onboarding | **year-two mechanism**, see \u00a72 | cross-customer, and the only one |\n\n**Every ratio in this paper is shown beside its absolute magnitude**, because the first version's headline multiplier was large only because its base was tiny \u2014 and that is the specific way a mechanism paper misleads without stating anything false.\n\nAnd first-environment onboarding gets *worse* by about 20%. That is why this paper is credible: the system's cost falls exactly where the category's marketing puts its gains.\n\n## \u00a71 The current inefficiency \u2014 four frictions that compound\n\n| # | Friction | Magnitude | Source |\n|---|---|---|---|\n| **F1** | **Acquisition.** Every new client environment is re-derived from scratch: mapping the tenant, discovering its deviations, writing it down | **25\u201340 engineer-hours** for a median (\u224816-user) client; 40\u201380 for a complex one | [S21], banded per D7 |\n| **F2** | **Decay.** Documentation is stale on arrival and needs continuous upkeep that nobody does | `(assumption: ~8 hrs/month per MSP of nominal upkeep, largely unperformed)` \u2014 the honest figure is that most MSPs pay this in *wrong* documentation rather than in hours | \u2014 |\n| **F3** | **Loss.** Environment knowledge lives in individuals; attrition removes it entirely | A departing senior engineer takes years of tenant-specific knowledge. 22% of MSPs cannot find replacement technical talent | [S33] |\n| **F4** | **
